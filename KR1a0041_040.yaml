body:
  text: 大易粹言卷四十宋方聞一編坎下震上伊川先生曰解序卦蹇者難也物不可以終難故受之以解物無終難之理難極則必散解者散也所以次蹇也為卦震上坎下震動也坎險也動於險外出乎險也故為患難解散之象又震為雷坎為雨雷雨之作蓋隂陽交感和暢而緩散故為解解者天下患難解散之時也易傳解利西南無所往其來復吉有攸往夙吉伊川先生曰西南坤方坤之體廣大平易當天下之難方解人始離艱苦不可復以煩苛嚴急治之當濟以寬大簡易乃其冝也如是則人心懷而安之故利如西南也湯除桀之虐而以寬治武王誅紂之暴而反商政皆從寬易也無所往其來復吉有攸往夙吉無所往謂天下之難已解散無所為也有攸往謂尚有所當解之事也夫天下國家必紀綱法度廢亂而後禍患生聖人既解其難而安平無事矣是無所往也則當修復治道正紀綱明法度進復先代明王之治是來復也謂反正理也天下之吉也其發語辭自古聖王救難定亂其始未暇遽為也既安定則為可久可繼之治自漢以下亂既除則不復有為姑隨時維持而已故不能成善治蓋不知來復之義也有攸往夙吉謂尚有當解之事則早為之乃吉也當解而未盡者不早去則將復盛事之復生者不早為則將漸大故夙則吉也易傳橫渠先生曰難免人患散則得衆者吉往而不返則生它變有所往而不速將後于時也故無所往則靜吉有所往則速吉易説白雲郭氏曰解者難之解也故動乎險中為屯動乎險外為解解與屯為內外亦與蹇為反復故蹇利西南而解亦利西南雖止與動不同其險難則相接迹矣復者來之漸也難解之時無所往而復於道難作之際速於往而緩難各盡其冝是以皆吉也先言無所往而後言有攸往者安不忘危之義也亦猶先泰後否先既濟後未濟也易説彖曰解險以動動而免乎險解解利西南往得衆也其來復吉乃得中也有攸往夙吉往有功也天地解而雷雨作雷雨作而百果草木皆甲拆解之時大矣哉伊川先生曰坎險震動險以動也不險則非難不動則不能出難動而出於險外是免乎險難也故為解解難之道利在廣大平易以寬易而往濟解則得衆心之歸也不云無所往省文爾救亂除難一時之事未能成治道也必待難解無所往然後來復先王之治乃得中道謂合冝也有所為則夙吉也早則往而有功緩則惡滋而害深矣既明處解之道復言天地之解以見解時之大天地之氣開散交感而和暢則成雷雨雷雨作則萬物皆生發甲拆天地之功由解而成故贊解之時大矣哉王者法天道行寬宥施恩惠養育兆民至於昆蟲草木乃順解之時與天地合德也並易傳龜山楊氏曰動而免乎險卦之所以為解也免乎險而以順動則衆斯得矣此解之所以利西南也居解之時難方解矣故無所往則冝復有攸往則冝夙所謂冝復何也蓋天下方出於屯難則還定安集之時也作之則人弗堪矣故來復吉漢為畫一之法而天丅歌之來復之謂也所謂冝夙者何也蓋解之初與民惟新之時也人方厭亂而餘風遺俗亂政弊法有不可因者則革之冝夙也天下已定而人安於故常方且圖之則擾矣尚能有功哉武王克商反商政有未及下車而行者夙之謂也觀天地解而雷雨作則解之不可不夙亦天地之理也易説白雲郭氏曰遇險而止者才之不足也遇險而動者才之有餘也以有餘之才故能動而免乎險所以為解也解利西南往得衆者西南得朋之地也得朋而動乃能濟險故蹇之大蹇朋來與解之朋至斯孚皆一道也其來復吉乃得中者險難既解而來復不為太過乃得中道所謂獲三狐而得黃矢者也有攸往夙吉往有功者以有餘之才故往則有功如射隼于髙墉之上者也夫有難則有解解終復於難故解緩乏時復存夙吉之義亦休否其亡苞桑之道也解之道雖天地亦如之天地之解以雷雨故百果草木皆甲坼然則豈止人難解散而已乎故曰解之時大矣哉王輔嗣曰難解之時非治難時故不言用體盡於解之名無有幽隱故不曰義易説象曰雷雨作解君子以赦過宥罪伊川先生曰天地解散而成雷雨故雷雨作而為解也與明兩而作離語不同赦釋之宥寬之過失則赦之可也罪惡而赦之則非義也故寬之而已君子觀雷雨作解之象體其發育則施恩仁體其解散則行寬釋也易傳龜山楊氏曰屯難方解民未知教不赦過不宥罪則民將無所措手足矣非新民之道也易説白雲郭氏曰雷雨之作無間於大小美惡皆解其難此天地之所以為大也聖人法天以解大難亦無所不及雖過失罪戻之人亦有赦宥以緩之是所以能盡解時之大非私己自謀而已也古者罪有寬宥而無赦赦而釋之者惟過失耳此過罪之不同也故康誥言人有小罪非眚而曰乃不可不殺謂罪也乃有大罪非終而曰時乃不可殺謂過也觀解之象與康誥之言可見先王用刑之意赦過宥罪亦解之一耳語盡解之大則未也易説初六無咎象曰剛柔之際義無咎也伊川先生曰六居解初患難既解之時以柔居剛以隂應陽柔而能剛之義既無患難而自處得剛柔之冝一有也字患難既解安寧無事唯自處得冝則為無咎矣方解之初冝安靜以休息之爻之辭寡所以示意初四相應是剛柔相際接也剛柔相際為得其冝難既解而處之剛柔得冝其義無咎也並易傳橫渠先生曰險難方解未獲所安近比於二非其咎也易説龜山楊氏曰動而免乎險則居險而不為難難生經綸之時也難解則無事矣而有應乎上其義無咎而已易説白雲郭氏曰處解之初以柔居剛以隂應陽得無所往其來復吉之義故無咎也其為無咎蓋於剛柔之際盡其所處之道理必無過矣易説九二田獲三狐得黃矢貞吉象曰九二貞吉得中道也伊川先生曰九二以陽剛得中之才上應六五之君用於時者也天下小人常衆剛明之君在上則明足以照之威足以懼之剛足以斷之故小人不敢用其情然猶常存警戒慮其有間而害正一作政也六五以隂柔居尊位其明易蔽其威易犯其斷不果而易惑小人一近之則移其心矣況難方解而治之初其變尚易二既當用必須能去小人則可以正君心而行其剛中之道田者去害之事狐者邪媚之獸三狐指卦之三隂時之小人也獲謂能變化除去之如田之獲狐也獲之則得中直之道乃貞正而吉也黃中色矢直物黃矢謂中直也羣邪不去君心一入則中直之道無由行矣桓敬之不去武三思是也所謂貞吉者得其中道也除去邪惡使其一無其字中直之道得行乃正而吉也並易傳橫渠先生曰險亂方解不正自疑之隂皆自歸附而順聽也故曰田獲三狐不以三狐自纍止合于五則得黃矢之象也易説龜山楊氏曰田者動而以時也往斯得衆矣故獲三狐古者燕居服狐裘狐疑而止解緩之象也得黃矢正者有攸往而夙也時惟剛中為足以與此易説白雲郭氏曰狐疑之害不足與有成況解難之時乎九二以剛陽之才田而獲之以去其害然後中直之道可得而守貞吉矣狐隂類也解有三隂故云三狐易説六三負且乘致寇至貞吝象曰負且乘亦可醜也自我致戎又誰咎也伊川先生曰六三隂柔居下之上處非其位猶小人冝在下以負荷而且乘車非其據也必致寇奪之至雖使所為得正亦可鄙吝也小人而竊盛位雖勉為正事而氣質卑下本非在上之物終可吝也若能大正則如何曰大正非隂柔所能也若能之則是化為君子矣三隂柔小人冝在下而反處下之上猶小人冝負而反乘當致寇奪也難解之時而小人竊位復致寇矣負荷之人而且乘載為可醜惡也處非其據德不稱一作勝其器則寇戎之致乃已招取將誰咎乎聖人又於繫辭明其致寇之道謂作易者其知盜乎盜者乘釁而至苟無釁隙則盜安能犯負者小人之事乘者君子之器以小人而乘君子之器非其所能安也故盜乘釁而奪之小人而居君子之位非其所能堪也故滿假而陵慢其上侵暴其下盜則乘其過惡而伐之矣伐者聲其罪也盜橫暴而至者也貨財而輕慢其藏是教語乎盜使取之也女子而夭冶其容是教語淫者使暴之也小人而乘君子之器是招盜使奪之也皆自取之之謂也並易傳橫渠先生曰不正而近比二剛不能致一故有小人負乘之象貪以致寇也易説龜山楊氏曰方解之時德不足以有其位慢藏之象曰其致寇自我又誰咎乎易説白雲郭氏曰陽為君子隂為小人小人六也負之事也君子三也乘之器也居非其位以負而乘致寇之至不亦冝乎幸而固守亦可鄙也凡來寇己者皆曰寇不必小人也易説九四解而拇朋至斯孚象曰解而拇未當位也伊川先生曰九四以陽剛之才居上位承六五之君大臣也而下與初六之隂為應拇在下而微者謂初也居上位而親小人則賢人正士逺退矣斥去小人則君子之黨進而誠相得也四能解去初六之隂柔則陽剛君子之朋來至而誠合矣不解去小人則已之誠未至安能得人之孚也初六其應故謂逺之為解四雖陽剛然居隂於正疑不足若復親比小人則其失正必矣故戒必解其拇然後能來君子以其處未當位也解者本合而離之也必解拇而後朋孚蓋君子之交而小人容於其間是與君子之誠未至也並易傳橫渠先生曰位不當則所履者邪故失位之隂因得駢附險亂即解解之則朋信當一作正易説龜山楊氏曰剛不當位未能無不孚也故解而拇拇以執取為事然不執非其有也故朋至斯孚而已易説白雲郭氏曰輔嗣以三為拇伊川以初為拇九四拘於應初不知朋至斯孚之大故必解而拇而後朋可至此難之所以解也易説六五君子維有解吉有孚于小人象曰君子有解小人退也伊川先生曰六五居尊位為解之主人君之解也以君子通言之君子所親比者必君子也所解去者必小人也故君子維有解則吉也小人去則君子進矣吉孰大焉有孚者世云見驗也可驗之於小人小人之黨去則是君子能有解也小人去則君子自進正道自行天下不足治也君子之所解者謂退去小人也小人去則君子之道行是以吉也並易傳橫渠先生曰君子道亨則邪類之退必矣易説龜山楊氏曰柔順得中而覆尊位能維有解者也故能有孚于小人若董卓之誅卒至於京城流血蕭俯議消兵而朱克融等客長安餓且死不得一官皆不知維有解之道也易説白雲郭氏曰六五之君以柔居中下應中直之臣無所不緩故曰維有解吉不言所事解之大者也其解之至有孚于小人者不私己以解難如天地雷雨無間於草木之微是以小人亦信之而退安其分也易説上六公用射隼于髙墉之上獲之無不利象曰公用射隼以解悖也伊川先生曰上六尊髙之地而非君位故曰公但據解終而言也隼鷙害之物象為害之小人墉墻內外之限也害若在內則是未解之時也若出墉外則是無害矣復何所解故在墉上離乎內而未去也云髙見防限之嚴而未去者上解之極也解極之時而獨有未解者乃害之堅強者也上居解極解道已至器已成也故能射而獲之既獲之則天下之患解已盡矣何所不利夫子於繫辭復伸其義曰隼者禽也弓矢者器也射之者人也君子藏器於身待時而動何不利之有動而不括是以出而有獲語成器而動者也鷙害之物在墉上苟無其器與不待時而發則安能獲之所以解之之道器也事之當解與已解之之道至者時也如是而動故無括結發而無不利矣括結謂阻礙聖人於此發明藏器待時之義夫行一身至於天下之事苟無其器與不以時而動小則括塞大則喪敗自古喜有為而無成功或顛覆者皆由是也至解終而未解者悖亂之大者也射之所以解之也解則天下平矣並易傳橫渠先生曰忘義而貪故以喻隼易説龜山楊氏曰隼鷙害之物為害小人之象負且乘者也非上六其孰能去之上六居解之極有其位而又有其時以是解悖何不利之有蓋大臣之任也易説白雲郭氏曰六三負且乘悖亂之道隼之象也髙墉三之位也乘非負之所當乘墉非隼之所當處在三致戎猶負乘在上能獲猶射隼也夫以上六解悖之道以獲六三負乘之醜是以無不利也孔子曰君子藏器於身待時而動解悖有道所謂器也髙墉之上則其時也易説大易粹言卷四十
