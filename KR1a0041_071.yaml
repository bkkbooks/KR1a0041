body:
  text: 大易粹言卷七十一宋方聞一編説卦昔者聖人之作易也幽贊於神明而生蓍參天兩地而倚數觀變於隂陽而立卦發揮於剛柔而生爻和順於道德而理於義窮理盡性以至於命明道先生曰幽贊於神明而生蓍用蓍以求卦非謂有蓍而後畫卦朱公掞問學拾遺和順於道德而理於義體用也劉絢師訓窮理盡性以至於命三事一時並了元無次序不可將窮理作知之事若實窮得理即性命亦可了吕與叔東見録伊川先生曰理也性也命也三者未嘗有異窮理則盡性盡性則知天命矣天命猶天道也以用而言之則謂之命命者造化之謂也附張繹師説問行狀云盡性至命必本於孝弟不識孝弟何以能盡性至命也曰後人便將性命别作一般事説了性命孝弟只是一統底事就孝弟中便可盡性至命至如灑掃應對與盡性至命亦是一統底事無有本末無有精粗却被後來人言性命者别作一般髙逺説故舉孝弟是於人切近者言之然今時非無孝弟之人而不能盡性至命者由之而不知也凡一物上有一理須是窮致其理窮理亦多端或讀書講明義理或論古今人物别其是非或應接事物而處其當皆窮理也並劉元承手編窮理盡性矣曰以至於命則全無著力處如成於樂樂則生矣之意劉絢所録窮理盡性以至於命以序言之不得不然其實只能窮理便盡性至命也附唐棣雜録所務於窮理者非道須盡窮了天下萬物之理又不道是窮得一理便到只是要積纍多後自然見去理則須窮性則須盡命則不可言窮與盡只是至於命也橫渠昔常譬命是源窮理與盡性如穿渠引源然則渠與源是兩物後來此議必改並吕與叔東見録窮理盡性至命一事也才窮理便盡性盡性便至命因指柱曰此木可以為柱理也其曲直者性也其所以曲直者命也理性命一而已時氏拾遺或問格物是外物是性分中物先生曰不拘凡眼前無非是物物物皆有理如火之所以熱水之所以寒至於君臣父子間皆是理又問人窮一物還便見得諸理否曰須是遍求雖顏子亦只能聞一知十若到後來達理了雖億萬亦可通格物窮理非是盡要窮天下之物但於一事上窮盡其他可以類推至如言孝其所以為孝者如何窮理如一事上窮不得且别窮一事或先其易者或先其難者各隨人深淺如千蹊萬徑皆可適國但得一道入得便可所以能窮者只為萬物皆是一理至如一物事雖小皆有是理物理須是要窮若言天地之所以髙深鬼神之所以幽顯若只言天只是髙地只是深只是已辭更有甚並入關語録致知在格物格至也窮理而至於物則物理盡李籲師説橫渠先生曰方其將有謀也將有問也命於蓍此所謂生蓍非謂在野而生蓍也事在未來之前吉凶在書䇿上蓍在手中卒歸三處一時合豈非幽贊於神明而得爾也起其用也地所以兩分剛柔男女而效之法也天所以參一太極兩儀而象之性也一物兩體氣也一故神兩在故不測兩故化推行於一此天之所以參也兩不立則一不可見一不可見則兩之用息兩體者虛實也動靜也聚散也清濁也其究一而已有兩則有一是太極也若一則有兩亦在無兩亦一在然無兩則安用一不以太極空虛而已非天參也理義即是天道也易言理於義一也求是即為理義言理義不如且言求是易曉求是之心俄頃不可忘理於義此理云者猶人言語之間常所謂理者非同窮理之理凡觀書不可以相類而泥其義不爾則字字相梗觀其文勢上下如充實之美與詩之言美輕重不同性盡其道則命至其源也一作至於原也致與至為道殊逺盡性然後至於命不可謂一不窮理盡性即是戕賊不可至於命者止能保全天所稟賦本分者且不可以有加也既言窮理盡性則不容有不知天道即性也故思知人不可不知天能知天斯知人矣知人與窮理盡性以至於命同意釋氏無天用故不取理彼以性為無吾儒以參為性故先窮理而後盡性凡人剛柔緩急趨識無有同者此乾道變化各正性命也及盡性則皆忘之窮理亦當有漸見物多窮理多從此就約盡人之性盡物之性天下之理無窮立天理乃各有區處窮盡性言性已是近人言也既窮理又盡性然後能至於命命則又就已而言之也並易説二程解窮理盡性以至於命只窮理便是至於命豫謂亦是失於太快此義儘有次序須是窮理便能盡得己之性則推類又盡人之性既盡得人之性須是并萬物之性一齊盡得如此然後至於天道也其間煞有事豈有當下理會了學者須是窮理為先如此則方有學今言知命與至於命儘有近逺豈可以知便謂之至也蘇眪所録盡其性能盡人物之性至於命者亦能至人物之命莫不性諸道命諸天我體物未嘗遺物體我知其不遺也至於命然後能成已成物不失其道德不勝氣性命於氣德勝其氣性命於德窮理盡性則性天德命天理氣之不可變者獨死生修夭而已故論死生則曰有命以言其氣也語富貴則曰在天以言其理也此大德所以必受命易簡理得而成位乎天地之中也所謂天理也者能恱諸心能通天下之志之理也能使天下恱且通則天下必歸焉不歸焉者所乘所遇之不同如仲尼與繼世之君也舜禹有天下而不與焉者正謂天理馴致非氣稟當然非志意所與也必曰舜禹云者餘非乘勢則求焉者也利者為神滯者為物是故風雷有象不速於心心禦見聞不𢎞於性不誠不莊可謂之盡性窮理乎性之德也未嘗偽且慢故知不免乎偽慢者未嘗知其性也性其總合兩也命其受有則也不極總之要則不至受之分盡性窮理而不可變乃吾則也天所自不能已者謂命不能無感者謂性雖然聖人猶不以所可憂而同其無憂者有相之道存乎我也性通乎氣之外命行乎氣之內氣無內外假有形而言爾故思知人不可不知天盡其性然後能至於命盡性然後知生無所得則死無所喪太虛無形氣之本體其聚其散變化之客形爾至靜無感性之淵源有識有知物交之客感爾客感客形與無感無形惟盡性者一之自明誠由窮理而盡性也自誠明由盡性而窮理也釋氏妄意天性而不知範圍天用反以六根之微因緣天地明不能盡則誣天地日月為幻妄蔽其用於一身之小溺其志於虛空之大此所以語大語小流遁失中其過也塵芥六合其蔽於小也夢幻人世謂之窮理可乎不知窮理而謂之盡性可乎謂之無不知可乎塵芥六合謂天地為有窮也夢幻人世明不能究所從也並正蒙須知自誠而明者先盡性以至於窮理也謂先自其性理會來以至行理自明誠者先窮理以至於盡性也謂先從學問理以推達於天性也語録龜山楊氏曰問乾坤用九六荆公曰進君子退小人固非自然之理而正叔云觀河圖數可見何也曰此多有議論少有分明繫辭分明説云參天兩地而倚數九參天六兩地也六經不言無心惟佛氏言之亦不言修性惟揚雄言之心不可無性不假修故易止言洗心盡性記言正心尊德性孟子言存心養性佛氏和順於道德之意蓋有之理於義則未也並語録白雲郭氏曰説卦論説八卦之道而此極重卦而言者明八卦六十四終始一道耳或者言聖人謂包犧也然以八卦六十四卦言之則非獨包犧矣聖人以道幽贊神明故生用蓍求卦之法猶繫辭言是興神物以前民用蓋是道本於神明聖人能生之是為幽贊之道矣故有神明之道有幽贊之道有生蓍之道以道合道故能生是道也此言變化之始也自蓍道生而後數可倚數可倚而後卦可立卦可立而後爻可生作易之道終矣易成而後道德理義有所寓聖人窮易之理盡萬物之性復於天道故曰以至於命此章自幽贊之始至以至於命蓋明以此道始復以此道終有無循環實由一道非聖人有私意以作也微顯闡幽而已天地者數所由生隂陽者變所由生剛柔者萬類所從生故參兩觀變發揮之也易於道德無違也和順之而已於義無作也明辨之而已蓋言象辭之間其道德與義本諸自然聖人因之而作易特載以明之而已故聖人於玩易之際復用此道以窮理盡性至於命也窮理者窮天之理也盡性者盡天之性也然後不失其所謂天之命矣是知聖人由道以生易由易以復於道非聖人則無生無復謂之聖人作易可也然異乎衆人之所謂作者矣易説大衍之數聖人幽贊神明之道也參天之一三五而為九兩地之二四而為六聖人倚數之道也盡三十六二十四二十八三十二之變以分陰陽老少聖人觀變立卦之道也自九六而發揮為剛為柔聖人發揮生爻之道也繫辭焉而命之所以和順於道德而理於義也極深研幾以崇德廣業所以窮理盡性至於命也聖人作易之道如是而已觀九六之數蓋聖人參天兩地而得之至於七八則有名而無象如是則陰陽老少之辨夫何疑焉或者謂陽數極於九而其次極於七又疑老陰當十少陰當八老陰當八少陰當六者亦未之思也並著卦辨疑昔者聖人之作易也將以順性命之理是以立天之道曰陰與陽立地之道曰柔與剛立人之道曰仁與義兼三才而兩之故易六畫而成卦分陰分陽迭用柔剛故易六位而成章明道先生曰立天之道曰陰與陽立地之道曰柔與剛立人之道曰仁與義兼三才一之也而兩之不兩則無用劉絢師訓孟子言堯舜性之舜由仁義行豈不是尋常説話至於易只道箇立人之道曰仁與義則和性字由字也不消道自已分明陰陽剛柔仁義只是此一箇道理李籲師説伊川先生曰昔者聖人立人之道曰仁曰義孟子曰仁者人也親親為大義者宜也尊賢為大唯能親親故老吾老以及人之老幼吾幼以及人之幼唯能尊賢故賢者在位能者在職唯仁與義盡人之道盡人之道則謂之聖人暢潛道録仲尼言仁未嘗兼義獨於易曰立人之道曰仁與義而孟子言仁必以義配蓋仁者體也義者用也知藏之為用而不外焉者可與語道矣世之所論於義者多外之不然則混而無别非知仁義之説者也遊定夫所録立人之道曰仁與義據今日合人道廢則是今尚不廢者猶只是有那些秉彛卒殄滅不得以此思之天壤間可謂孤立其將誰告耶吕與叔東見録橫渠先生曰陰陽柔剛仁義所謂性命之理易一物而三才備陰陽氣也而謂之天剛柔質也而謂之地仁義德也而謂之人一物而兩體其太極之謂歟陰陽天道象之成也剛柔地道法之效也仁義人道性之立也三才兩之莫不有乾坤之道也易一物而合三才天人一陰陽其氣剛柔其形仁義其性並易説隂陽之精互藏其宅則各得其所安故日月之形萬古不變若陰陽之氣則循環迭至聚散相蕩升降相求絪緼相揉蓋相兼相制欲一之而不能此其所以屈伸無方運行不息莫或使之不曰性命之理謂之何哉屈伸相感而利生感以誠也情偽相感而利害生雜之偽也至誠則順理而利偽則不循理而害順性命之理則所謂吉凶莫非正也逆理則凶為自取吉其險幸也陰陽剛柔仁義之本立而後知趨時應變故乾坤毁則無以見易六爻者盡利而動所以順陰陽剛柔仁義性命之理也並正蒙廣平遊氏曰立天之道曰陰與陽立地之道曰柔與剛立人之道曰仁與義夫道一而已其立於天下則有兩端故君子有剛克焉執其義之端也有柔克焉執其仁之端也執其兩端而用之以時中此九德所以有常而三德所以用義也中庸解龜山楊氏曰荆公云天使我有是之謂命命之在我之謂性是未知性命之理其曰使我正所謂使然也使然者可以為命乎以命在我為性則命自一物若中庸言天命之謂性性即天命也又豈二物哉如云在天為命在人為性此語似無病然亦不須如此説性命初無二理第所由之者異耳率性之謂道如所謂聖人之作易將以順性命之理是也語録白雲郭氏曰前章自作易生蓍終於性命而止此章復因性命之説而詳言之以見易之為書所以能至於命者以本乎性命之理故也性命之理即天地人之道也性命本一故中庸言天命之謂性孟子言君子不謂性命因天地人而言之則天道之謂命人道之謂性於是乎有别矣是以陰陽柔剛仁義各異其名也陰陽者天之二道也柔剛者地之二道也仁義者人之二道也天地人之道各二所謂三才兩之也易能兼三才則皆兼其兩之之道此易之畫所以六而後成卦也然則文王之重不得不作矣蓋出於三才自然非文王之私意也自六畫成卦而後三才陰陽之位具於是乎迭用柔剛之爻以居之則變化見矣故曰六位而成章也章者變化之道明見之謂也分陰分陽非謂立天之道陰陽也言三才二道皆一為陰一為陽也迭用柔剛非謂立地之道柔剛也言三才陰陽分為六畫迭以九六柔剛居之也故三才二道不兼九六言之則曰六畫兼明九六柔剛而後謂之六位是以六畫成卦特有其象而已至六位成章而後道大明也方包犧未分三才陰陽故卦止三畫文王重之以備三才陰陽故六畫具由此言之則三畫之道不為不足六畫之道不為有餘孔子言立天立地立人言包犧之道也言陰陽柔剛仁義言文王之道也包犧立其始文王成其終孔子明其終始三聖人實出於一心是為同道道同故其書同一聖人不作則斯道不明後世不復有聞矣易説天地定位山澤通氣雷風相薄水火不相射八卦相錯數往者順知來者逆是故易逆數也伊川先生曰易八卦之位元不曾有説先儒以謂乾位西北坤位西南言乾坤任六子而自處於無為之地此大故無義理風雷山澤之類便是天地之用豈天地外别有六子如人生六子則有各任以事而父母自間風雷之類於天地間如人身之有耳目手足便是人之用也豈可謂手足耳目皆用而身無為乎附劉元承手編橫渠先生曰數往者順知來者逆是故易逆數也如孟子曰苟求其故則千歲之日至可坐而致也易説龜山楊氏曰謂揚子雲作太元只據他立名便不是既定却三方九州二十七部八十一家不知如何相錯得八卦所以可變而為六十四者只為可相錯故可變耳惟相錯則其變出於自然也語録白雲郭氏曰天地之位定然後山澤雷風水火相與為用或異體而交通或同氣而相薄或不相入而為用此八卦所以必相錯之道也八卦不相錯則道雖立而不及於用是以聖人重之重而後可以數往知來人之道數往者順而易知來者逆而難易之逆數未見其難者非止卜筮之用蓋由其道之始必知其道之終也是亦原始可以要終知微知彰之義故孔子以知幾為神衆人獨知卜筮而已易説雷以動之風以散之雨以潤之日以烜之艮以止之兊以説之乾以君之坤以藏之伊川先生曰古言乾坤退處不用之地而用六子若人則便分君道無為臣道有為若天則誰與它安排它如是須有道理故知八卦之義須要玩索吕與叔東見録白雲郭氏曰天地雷風功用與八卦同故或言象或言卦其實一也動止説又其性也散潤烜又其功也君其道也藏其德也互言之知其互備也易説帝出乎震齊乎巽相見乎離致役乎坤説言乎兊戰乎乾勞乎坎成言乎艮萬物出乎震震東方也齊乎巽巽東南也齊也者言萬物之潔齊也離也者明也萬物皆相見南方之卦也聖人南面而聽天下嚮明而治蓋取諸此也坤也者地也萬物皆致養焉故曰致役乎坤兊正秋也萬物之所説也故曰説言乎兊戰乎乾乾西北之卦也言陰陽相薄也坎者水也正北方之卦也勞卦也萬物之所歸也故曰勞乎坎艮東北之卦也萬物之所成終而所成始也故曰成言乎艮伊川先生曰天者理也神者妙萬物而為言者也帝者主宰事而名劉絢師訓問劉牧以坎離得正性艮巽得偏性如何曰非也它據方位如此説如居中位便言得中氣其餘豈不得中氣也附劉元承手編南北之位豈可不定下所以定南北者在坎離也坎離又不是人安排得來莫非自然也李籲師説橫渠先生曰造化之功發乎動畢達于順形諸明養諸容載遂乎恱潤勝乎健不匱乎勞始終乎止乾不居正位是天理自然惟人推之使然邪並易説中央在季夏之末者且以易言之八卦之作坤在西南西南致養之地在離兊之間離兊即金火也是以在季夏之末語録龜山楊氏曰艮止也止其所也故繫辭曰止萬物者莫善乎艮又曰成言乎艮艮者萬物之所成終而成始也止於此矣復出乎震不終止也故艮卦曰時止則止時行則行語録白雲郭氏曰天道始於震萬物從之皆出而有生生而齊齊畢出也至離而明明則可見至坤而養養而後物成物成則説乾以純陽居陰地故陰陽相薄而戰自出至戰久勞於外必歸而有以休息之故勞乎坎息之而後終終則有始此雖萬物之情實天之道也故言平以先之自天地定位之後皆論八卦此章獨巽復有重釋之辭蓋上論八卦之位未明言其所故下復明言之曰震東方也巽東南也如是則無嫌於重釋之也惟潔齊之義難通求其意則齊一而已易説神也者妙萬物而為言者也明道先生曰神也者妙萬物而為言若上竿㺯瓶至於斫輪誠至則不可得而知上竿初習數尺而後至於百尺習化其髙矧聖人誠至之事豈可得而知河南語録伊川先生曰神是極妙之語謝顯道記平日語橫渠先生曰全備天理則其體孰大於此是謂大人以其道變通無窮故謂之聖聖人心術之運固有不疾而速不行而至默而識之處故謂之神易説白雲郭氏曰道則道也易則書也聖人則人也獨神為無方而三者皆有之故道亦有神易亦有神聖人亦有神神非别一物唯以其道之見於用而妙萬物者名為神也易與聖人之神皆一也因妙萬物而言之為神故曰妙萬物而為言也觀易則知神之為貴究神之為言則知道以用為大此孔子所以言中庸其至矣乎易説動萬物者莫疾乎雷撓萬物者莫疾乎風燥萬物者莫熯乎火説萬物者莫説乎澤潤萬物者莫潤乎水終萬物始萬物者莫盛乎艮故水火相逮雷風不相悖山澤通氣然後能變化既成萬物也明道先生曰冬至一陽生而每遇至後則倍寒何也陰陽消長之際無截然斷絶之理故相攙掩過如天將曉復至陰黑亦是理也大抵終始萬物莫盛乎艮此儘神妙須儘研窮此理吕與叔東見録息止也生也止則便生不止則不生艮終始萬物遊定夫所録白雲郭氏曰此章論象其序與前八方之卦同獨不言乾坤者乾坤妙萬物之神在六子而已莫疾乎雷莫疾乎風其神也萬物無以加之也故易皆取神物以為八卦之象至乾坤之神又不得而見之矣撓散也澤上為天澤下為藪澤故莫説乎澤也天地之間山之養物為多故能終始萬物上言雷風則艮與山同功矣下言艮則雷風震巽同功矣其義互見非艮獨異也六子之象雖有動撓燥潤之功而或各專其用獨動獨撓不能變化亦不能成物必水火相須雷風相從山澤相通於是乎變化而畢成萬物况易之於卦坎離震巽豈能獨用也哉此聖人所以重卦之義也重之故變變則通通則久是以自天祐之吉無不利易説乾健也坤順也震動也巽入也坎陷也離麗也艮止也兊説也伊川先生曰乾健坤順人亦不曾果然體認得乾坤毁則無以見易易須是以意明之河南語録橫渠先生曰健動陷止剛之象順麗入説柔之體易説一陷溺而不得出為坎一附麗而不能去為離艮一陽為主於兩陰之上各得其位而其勢止也易言光明者多艮之象著則明之義也正蒙兼山郭氏曰坎陷也離麗也剛則有體陷乎陰中所以為坎柔則無質麗於陽中所以為離易説白雲郭氏曰此章言乾坤之德與六子之性情所以釋八卦之名也八卦之名出於包犧氏上古之言止此八者而已文王能明之而不訓其義孔子訓之故後世可以學易非健順八字則易不能復讀矣故乾坤八字盡三才之道健順八字盡八卦六十四之道然則文王不載之簡編孔子何由而得之夫是之謂聖人易説乾為馬坤為牛震為龍巽為雞坎為豕離為雉艮為狗兊為羊橫渠先生曰飛遷躁動不能致逺雞之象易説白雲郭氏曰逺取諸物皆此類也説者或以巽主號令雞能知時義猶近之其言豕處汙濕狗善禁止鄙矣易説乾為首坤為腹震為足巽為股坎為耳離為目艮為手兊為口白雲郭氏曰乾元首之象也坤之含𢎞腹也陽動於下足也順於下而動於上股也坎幽利聽離明利視艮具動靜而下垂兊為口舌而上向也易説乾天也故稱乎父坤地也故稱乎母震一索而得男故謂之長男巽一索而得女故謂之長女坎再索而得男故謂之中男離再索而得女故謂之中女艮三索而得男故謂之少男兊三索而得女故謂之少女伊川先生曰或問劉牧謂上經是天地生萬物下經是男女生萬物曰天地中只是一箇生人之生於男女即是天地之生安得為異曰牧又謂乾坤與坎離男女同生曰非也譬如父母生男女豈男女與父母同生既有乾坤方三索而得六子若曰乾坤生時六子生理同有則有此理乾坤坎離同生豈有此事既是同生則何言六子耶附劉元承手編白雲郭氏曰乾坤天地父母皆一道也此論父母男女之象故乾坤主父母而言六子之變自下為先震自坤變而得陽畫於初巽自乾變而得陰畫於初故皆曰一索而為長男長女也坎自坤變而得陽畫於中離自乾變而得陰畫於中故皆曰再索而為中男中女也艮自坤變而得陽畫於上兊自乾變而得陰畫於上故皆曰三索而為少男少女也一二三之義取於三畫之初中上也王氏云索求也自坤而求陽皆男也自乾而求陰皆女也卦變之義蓋始於此文王之重亦無以異也故説卦首章曰觀變於陰陽而立卦易説乾為天為圜為君為父為玉為金為寒為冰為大赤為良馬為老馬為瘠馬為駁馬為木果伊川先生曰説卦於乾雖言為天又言為金為玉以至為駁馬良馬為木果之類豈盡言天若此者所謂類萬物之情也故孔子推明之曰此卦於天文地理則為某物於鳥獸草木則為某物於身於物則為某物各以例舉不盡言也學者觸類而求之則思過半矣不然説卦所敘何所用之龜山語録橫渠先生曰乾為大赤其正色也為冰健極而寒甚也自此而下皆所以明萬物之情明一作類並易説白雲郭氏曰繫辭言包犧氏始作八卦以通神明之德以類萬物之情此皆所謂類萬物之情也乾之於八卦天之於三才君之於臣父之於子金玉之於土石皆一道也是之謂類也乾之道天之形人之首皆圜也寒冰西北之位也大赤乾剛之色也馬行健也良則善於其道也老則久於其道也瘠馬駁馬未詳其旨先儒或以瘠為柴益非也孔氏又謂駁馬有牙如鋸能食虎豹誤矣未有蹄物能摶虎豹者也或言有獸名駁食虎豹事非經見亦非馬類疑無其字借用駁耳非駁馬也又言果實著木如星之著天如是則果為星象非天象也乾元為萬物之始居羣物之上萬物之所資焉而果者木之始也木以果為始亦猶物以乾為始也然聖人言此使學者知其道無乎不在也此亦舉其大槩耳安能盡言天下萬物之象哉觸類而長之斯可矣自人言之則千夫長百夫長夫之於妻長之於幼亦皆乾也自物言之宮室之覆車蓋之象亦皆乾也麒麟之於走獸鳯凰之於飛鳥泰山之於丘垤河海之於行潦亦皆乾也山河雖坎艮之象方其於丘垤於行潦則乾也至於虎狼有父子之仁螻蟻有君臣之義孰謂乾之道又有在於虎狼螻蟻之間者乎故知其道無乎不在特知而用之者鮮矣八卦之象皆然易説坤為地為母為布為釡為吝嗇為均為子母牛為大輿為文為衆為柄其於地也為黑橫渠先生曰坤為文衆色也為衆容載廣也易説白雲郭氏曰布均皆猶地之德釡猶地之化吝嗇陰性也子母牛蕃生也大輿厚載也物雜則生文數偶則衆柄為化權純陰之色黑大赤之反也八卦之義最難通故聖人詳其所象亦立象盡意之謂也詳其一卦所為之象然後可通一卦之義不然則乾坤八卦非親質之三聖人終莫知其為義矣唯八卦有象如此其詳故雖百世之下亦可聞而知之也聖人反覆言八卦於前又列其卦言之於後得無深旨邪易説震為雷為龍為玄黃為敷為大塗為長子為決躁為蒼筤竹為萑葦其於馬也為善鳴為馵足為作足為的顙其於稼也為反生其究為健為蕃鮮橫渠先生曰震為萑葦為蒼筤竹為敷皆蕃鮮也易説白雲郭氏曰乾為純陽坤為純陰自乾坤相索一索而得震故震為陰陽交變之始其去乾坤未逺也是以震備乾坤之象為具體而微者錯而言之則其色玄黃玄黃天地之色也别而言之則龍乾畜也決躁乾剛也敷與大塗坤之道也其於馬者因乾而言也其於稼者因坤而言也其究為健乾也為蕃鮮坤也蒼筤萑葦反生皆盛生之物雖為陽卦陰道盛也善鳴動而有聲也馵足作足陽動於下也卦以白為陰的顙陰在上也此亞乾之四馬也易説巽為木為風為長女為繩直為工為白為長為髙為進退為不果為臭其於人也為寡髮為廣顙為多白眼為近利市三倍其究為躁卦橫渠先生曰巽為木萌於下滋於上也為繩直順以達也為工巧且順也為白因所遇而從也為長為髙木之性也為臭風也入也於人為寡髮廣顙躁人之象也易説白雲郭氏曰木為曲直曲直為工白陰也長髙木象也進退風性也臭以風而傳物以進退而不果陰卦多陽是以其究為躁寡髮剛上也廣顙重剛也為多白眼近利市三倍未詳其象易説坎為水為溝瀆為隱伏為矯輮為弓輪其於人也為加憂為心病為耳痛為血卦為赤其於馬也為美脊為亟心為下首為薄蹄為曳其於輿也為多眚為通為月為盜其於木也為堅多心橫渠先生曰坎為血卦周流而勞血之象也為赤其色也易説白雲郭氏曰江河溪澗皆水也溝瀆人所為者也隱伏水性也矯輮弓輪方圓曲直之易也加憂心病耳痛血卦陽陷於中也坎再索以中為主中得乾之剛故為赤震坎皆有馬象者得乾德之餘也美脊亟心陽在中也下首陰居上也薄蹄下亦陰也流物故為通流不能止故多眚離日而坎月也盜小人之隱伏也木堅多心剛中也於輿之義疑當作其於輿也為曵易曰見輿曵又曰曵其輪故輿有曵而馬無曵也乾震之馬四而坎之言馬五亦知曵為輿矣屯以坎為雲解以坎為雨而於此不言者於以見八卦之象不能盡言者多矣易説離為火為日為電為中女為甲胄為戈兵其於人也為大腹為乾卦為鱉為蟹為螺為蚌為龜其於木也為科上稿橫渠先生曰離為乾卦於木為科上稿附其燥也一作且躁也易説白雲郭氏曰離麗也火日電皆麗物而明者也坎陽為水而離陰為火者陽卦多陰陰卦多陽故也坎艮不言中男少男離兊言中女少女者互見也甲胄戈兵剛在外也甲胄自衛戈兵以外向也於人為大腹虛中之陰也乾卦燥也鱉蟹螺蚌龜介物也介物甲胄類也孔氏云科空也科木上稿陰中而無實也與堅多心之義反矣易説艮為山為徑路為小石為門闕為果蓏為閽寺為指為狗為鼠為黔喙之屬其於木也為堅多節橫渠先生曰艮為小石堅難入也為徑路通或寡也一或作且易説白雲郭氏曰震自坤變故為大塗艮其小者則為徑路艮大為山其小亦為石山與小石如坎水溝瀆之義門闕閽寺性之止也果蓏亦乾之餘陽也指亦手也陽過而在上無中下之剛是以陽卦之中獨艮不言馬其剛在上所用益小故於獸畜之類無行健之功徒有噬齧之象狗鼠黔喙之屬皆是也震之剛動於下故言足坎之剛動於中故言心艮之剛動於上故言喙皆因所索而言也且坎之為隱伏也在賢者為隱在小人為盜艮之為利則為狗為害斯為鼠皆一義而二象也堅多節者剛不中也中則為心不中則為節心則利用節不利於用二卦之辨也易説兊為澤為少女為巫為口舌為毁折為附決其於地也為剛鹵為妾為羊橫渠先生曰兊為附決內實則外附必決也為毁折物成則止柔者必折也易説白雲郭氏曰兊藪澤之象亦為天澤雨有澤潤之功故雨亦名澤别而言之雨其物也澤其功也故坎與兊義不同也唯言其功故凡可以澤物者皆為兊又不止雨之為澤而已八卦之中三索而成者皆動於上也以陽動者艮也以陰動者兊也陽動則有口之義而未見其象陰動則卦具口象於上故直言其為口舌也巫之通神以口舌而致精誠也古之巫與今之巫異古之巫誠人也今之巫妄人也誠故可用以通神妄非聖人之所用也口舌之用非辨論是非毀譽而已或附或決或用以毁折也附猶誓命使天下之比附決猶號令之決小人毁折猶噬嗑之用獄除間以去天下之害則口舌之用大矣非小人之所謂口舌頰舌之間而已是以天下説之也陽在下為剛陰在上為鹵蓋亦藪澤之象妾為女道之下者也兊雖二剛在下而卦以上之一陰為主故無良馬行健之功而有羝羊羸角之患也附決之意與詩之疏附同易説大易粹言卷七十一
