body:
  text: 大易粹言卷五十一宋方聞一編震下震上伊川先生曰震序卦主器者莫若長子故受之以震鼎者器也震為長男故取主器之義而繼鼎之後長子傳國家繼位號者也故為主器之主序卦取其一義之大者為相繼之義震之為卦一陽生於二隂之下動而上者也故為震震動也不曰動者震有動而奮發震驚之義乾坤之交一索而成震生物之長也故為長男其象則為雷其義則為動雷有震奮之象動為驚懼之義易傳震亨震來虩虩笑言啞啞震驚百里不喪匕鬯伊川先生曰陽生於下而上進有亨之義又震為動為恐懼為有主震而奮發動而進懼而修有主而保大皆可以致亨故震則有亨當震動之來則恐懼不敢自寧旋顧周慮一作周旋顧慮虩虩然也虩虩顧慮不安之貌蠅虎謂之虩者以其周環顧慮不自寧也處震如是則能保其安裕故笑言啞啞啞啞言笑和適之貌震驚百里不喪匕鬯言震動之大而處之之道動之大者莫若雷震為雷故以雷言雷之震動驚及百里之逺人無不懼而自失雷聲所及百里也唯宗廟祭祀執匕鬯者則不致於喪失人之致其誠敬莫如祭祀匕以載鼎實升之於爼鬯以灌地而一無而字降神方其酌祼以求神薦牲而祈饗盡其誠敬之心則雖雷震一作霆之威不能使之懼而失守故臨大震懼能安而不自失者唯誠敬而已此處震之道也卦才無取故但言處震之道並易傳白雲郭氏曰震一索而得男故謂之長男自乾坤而來變之始者莫先於震故為動之始然乾坤震動之始其來方興莫測是以有震驚之象曰亨者天下之理不動則不亨故天地萬物待震而後亨也自震來虩虩皆主人事而言虩虩恐懼之貌啞啞和樂之意因震動而恐懼則長慮却顧終無危亡之失是以後獲笑言和樂之吉也震驚百里不喪匕鬯者雖有大震恐不失主祭之道蓋知恐懼修省而已主祭長子之事也然則文武始於憂勤終於逸樂其亦震來虩虩笑言啞啞之義乎易說彖曰震亨震來虩虩恐致福也笑言啞啞後有則也震驚百里驚逺而懼邇也出可以守宗廟社稷以為祭主也伊川先生曰震自有亨之一無之字義非由卦才震來而能恐懼自修自慎則可反致福吉也笑言啞啞言自若也一作啞啞笑言自若也由能恐懼而後自處有法則也有則則安而不懼矣處震之道也雷之震及於百里逺者驚邇者懼言其威逺大也彖文脫不喪匕鬯一句卦辭云不喪匕鬯本謂誠敬之至威懼不能使之自失彖以長子宜如是因一有以字承上文用長子之義通解之謂其誠敬能不喪匕鬯則君出而可以守宗廟社稷為祭主也長子如是而後可以守世祀承國家也並易傳橫渠先生曰此卦純以君出子在而言則震之體全而用顯故曰出可以守宗廟社稷不雜言君父共國之時也易說白雲郭氏曰震來虩虩因恐懼而致福笑言啞啞和樂而未嘗失則驚逺懼邇言震之大逺邇皆及之也震之為卦內外重震故有逺邇大震之象逺邇大震而能不喪匕鬯此其所以可守宗廟社稷為祭主也匕者撓鼎之器所以載鼎實而致之爼鬯香酒所以灌地降神皆主祭之事也易說象曰洊雷震君子以恐懼修省伊川先生曰洊重襲也上下皆震故為洊雷雷重仍則威益盛君子觀洊雷威震之象以恐懼自修飭循省也君子畏天之威則修正其身思省其過咎而改之不唯雷震凡遇驚懼之事皆當如是易傳白雲郭氏曰洊重也上下皆震威益盛也當是時也知恐懼畏天修德省身故可以無過而不至於危亡苟不知恐懼修省之戒則危亡必矣易說初九震來虩虩後笑言啞啞吉象曰震來虩虩恐致福也笑言啞啞後有則也伊川先生曰初九成震之主致震者也在卦之下處震之初也知震之來當震之始若能以為恐懼而周旋顧慮虩虩然不敢寧止則終必保其安吉故一作然後笑言啞啞也震來而能懼周顧則無患矣是能因恐懼而反致福也因恐懼而自修省不敢違於法度是由震而後有法則故能保其安吉而笑言啞啞也並易傳白雲郭氏曰恐懼修省於前則必獲和樂笑言之吉於後理之必然也初九震動之初恐懼修省不可緩也過此則危矣故於初言之易說六二震來厲億喪貝躋于九陵勿逐七日得象曰震來厲乘剛也伊川先生曰六二居中得正善處震者也而乘初九之剛九震之主震剛動而上奮孰能禦之厲猛也危也彼來既猛則己處危矣億度也貝所有之資也躋升也九陵陵之髙也逐往追也以震來之厲度不能當而必喪其所有則升至髙以避之也九言其重岡陵之重髙之至也九重之多也如九天九地也勿逐七日得二之所貴者中正也遇震懼之來雖量勢巽避當守其中正無自失也億知必喪也故逺避以自守過則復其常矣是勿逐而自得也逐即物也以已即物失其守矣故戒勿逐避逺自守處震之大方也如二者當危懼而善處者也卦位有六七乃更始事既終時既易也不失其守雖一時不能禦其來然時過事已則復其常故云七日得當震而乘剛是以彼厲而已危震剛之來其可禦乎並易傳橫渠先生曰初動而之上故曰躋于九陵億必也易說白雲郭氏曰震之動自下而上在震之初猶欲恐懼修省況二之乘剛乎故震來得危厲而喪失隨之也躋于九陵避其來也不知修省而避非其道也故不待逐而七日可得言不可避也七日一卦之復復則自來矣易說六三震蘇蘇震行無眚象曰震蘇蘇位不當也伊川先生曰蘇蘇神氣緩散自失之狀三以隂居陽不正處不正於平時且不能安況處震乎故其震懼而蘇蘇然若因震懼而能行去不正而就正則可以無過眚過也三行則至四正也動以就正為善故二勿逐則自得三能行則無眚以不一有中字正而處震懼有眚可知其恐懼自失蘇蘇然由其所處不當故也不中不正其能安乎並易傳橫渠先生曰蘇蘇亦索索之義處非其地故危困不一能懼而改行則無眚矣易說白雲郭氏曰震自初動六三逺於動者而能蘇蘇然畏懼不自安是以行而無過眚也不敢自安者知位之不當亦所謂知懼者也易說九四震遂泥象曰震遂泥未光也伊川先生曰九四居震動之時不中不正處柔失剛健之道居四無中正之德陷溺於重隂之間不能自震奮者也故云遂泥泥滯溺也以不正之陽而上下重隂安能免於泥乎遂無反之意處震懼則莫能守也欲震動則莫能奮也震道亡矣豈復能光亨也陽者剛物震者動義以剛處動本有光亨之道乃失其剛正而陷於重隂以致遂泥豈能光也云未光見陽剛本能震也以失德故泥耳並易傳橫渠先生曰處衆隂之中為衆附比剛陽之德而以位隂故泥而未光也易說白雲郭氏曰九四處多懼之地陷於重隂之間無中正之德以自將故不能有行而遂泥也滯溺不自振又安有光亨之道乎易說六五震往來厲億無喪有事象曰震往來厲危行也其事在中大無喪也伊川先生曰六五雖以隂居陽不當位為不正然以柔居剛又得中乃有中德者也不失中則不違於正矣所以中為貴也諸卦二五雖不當位多以中為美三四雖當位或以不中為過中常重於正也蓋中則不違於正正不必中也天下之理莫善於中於六二六五可見五之動上往則柔不可居動之極下來則犯剛是往來皆危也當君位為動之主隨宜應變在中而已故當億度無喪失其所有之事而已所有之事謂中德苟不失中雖有危一有終字不至於凶也億度謂圖慮求不失中也五所以危由非剛陽而無助若以剛陽有助為動之主則能亨矣往來皆危時則甚難一作艱但期於不失中則可自守以柔主動固不能致亨濟也往來皆厲行則有危也動皆有危唯在無喪其事而已其事謂中也能不失其中則可自守也大無喪以無喪為大也並易傳橫渠先生曰懼往亦厲懼來亦厲能行已以危則富貴可保故曰無喪有事猶云不失其所有也以其乘剛故危以其在中故無喪禍至與不至皆懼則無喪有事一有云懼隂之中易說白雲郭氏曰二以來厲而喪則五之往來皆厲宜其大有喪也得無喪有事亦幸矣有事者其事也謂六五之君事也象言危行者往來皆厲行則危也六五往而上則即柔來而下則乘剛皆喪有事之道是以知其危也六五位雖不正而用中焉其事既不失中道雖涉危行可以大無喪矣以無喪為大則知喪之亦大也億者恐懼驚嘆之辭說者或為辭或為萬億或為億度其義頗不能通為辭近之易說上六震索索視矍矍征凶震不于其躬于其鄰無咎婚媾有言象曰震索索中未得也雖凶無咎畏鄰戒也伊川先生曰索索消索不存之狀謂其志氣如是六以隂柔居震動之極其驚懼之甚志氣殫索也矍矍不安定貌志氣索索則視瞻徊徨以隂柔不中正之質而處震動之極故征則凶也震之及身乃于其躬也不于其躬謂未及身也鄰者近於身者也能震懼於未及身之前則不至於極矣故得無咎苟未至於極尚有可改之道震終當變柔不固守故有畏一作見鄰戒而能變之義聖人於震終示人知懼能改之義為勸深矣㛰媾所親也謂同動者有言有怨咎之言也六居震之上始為衆一作震動之首今乃畏鄰戒而不敢進與諸處震者異矣故婚媾有言也所以恐懼自失如此以未得於中道也謂過中也使之得中則不至於索索矣極而復征則凶也若能見鄰戒而知懼變於未極之前則無咎也上六動之極震極則一作之終有變義也並易傳橫渠先生曰危以動懼以語無交而求則民弗與也故以征則凶能以鄰為懼則可免咎鄰謂五也五既附四已或與焉則招悔而有言矣能以鄰為戒不待及身而戒則無咎易說白雲郭氏曰居震之極無中以自守內積驚懼失所處之道是以志氣索索然而其瞻視亦矍矍然不安也能止而守不過驚懼而已以征則凶也震驚之來未及其身方及其鄰能畏懼而戒之如此則無咎矣蓋先時而懼未至於極故也昏媾所親也有言失之小也處震之極得無大咎足矣小有言蓋不可得而免也象言中未得者以失中道故索索然也震卦言虩虩啞啞蘇蘇索索矍矍與二五之言億諸卦皆無其意雖多恐懼之貌亦於爻義各有辨也易說大易粹言卷五十一
