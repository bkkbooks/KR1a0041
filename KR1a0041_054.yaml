body:
  text: 大易粹言卷五十四宋方聞一編兊下震上伊川先生曰歸妹序卦漸者進也進必有所歸故受之以歸妹進則必有所至故漸有歸義歸妹所以繼漸也歸妹者女之歸也妹少女之稱為卦震上兊下以少女從長男也男動而女說又以說而動皆男說女女從男之義卦有男女配合之義者四咸恒漸歸妹也咸男女之相感也男下女二氣感應止而說男女之情相感之象恒常也男上女下巽順而動隂陽皆相應是男女居室夫婦倡隨之常道漸女歸之得其正也男下女而各得正位止静而巽順其進有漸男女配合得其道也歸妹女之嫁歸也男上女下女一无女字從男也而有說少之義以說而動動以一作而說則不得其正矣故位皆不當初與上雖當隂陽之位而陽在下隂在上亦不當位也與漸正相對咸恒夫婦之道漸歸妹女歸之義咸與歸妹男女之情也咸止而說歸妹動於說皆以說也恒與漸夫婦之義也恒巽而動漸止而巽皆以巽順也男女之道夫婦之義備於是矣歸妹為卦澤上有雷雷震而澤動從之象也物之隨動莫如水男動于上而女從之嫁歸從男之象震長男兊少女少女從長男以說而動動而相說也人之所說者少女故云妹為女歸之象又有長男說少女之義故為歸妹也易傳歸妹征凶无攸利伊川先生曰以說而動動而不當故凶不當位不當也征凶動則凶也如卦之義不獨女歸无所徃而利也易傳横渠先生曰歸妹與革均是澤為大卦義不相干故革具四徳而歸妹初不言徳也易說白雲郭氏曰歸者女子之嫁也妹言少女也少女從長男非正之道樂於自進則凶也何所利哉卦辭言征凶者獨歸妹一卦然而非樂於自進亦无凶矣王輔嗣以歸妹為娣媵故其言曰雖與長男交嫁而係娣是以說也孔氏因之曰以妹從娣而嫁謂之歸妹誤矣娣媵謂之媵非歸也孔子言天地之大義謂夫婦也娣媵豈能具此義哉諸爻言娣義自不同輔嗣以初九有歸妹以娣之辭故誤以妹為娣媵耳六五曰其君之袂不如其娣之袂良孔子象曰帝乙歸妹不如其娣之袂良以見妹稱君而娣為媵矣易說彖曰歸妹天地之大義也天地不交而萬物不興歸妹人之終始也說以動所歸妹也征凶位不當也无攸利柔乘剛也伊川先生曰一隂一陽之謂道隂陽交感男女配合天地之常理也歸妹女歸於男也故云天地之大義也男在女上隂從陽動故為女歸之象天地不交則萬物何從而生女之歸男乃生生相續之道男女交而後有生息有生息而後其終不窮前者有終而後者有始相續不窮是人之終始也說以動以二體釋歸妹之義男女相感說而動者少女之事故以說而動所歸者妹也所以征則凶者以諸爻皆不當位也所處皆不正何動而不凶大率以說而動安有不失正者柔乘剛不惟位不當也又有乘剛之過三五皆乘剛男女有尊卑之序夫婦有倡隨之禮此一无此字常理也如恒是也苟不由常正之道徇情肆欲唯說是動則夫婦瀆亂男牽欲而失其剛婦狃說而忘其順如歸妹之乘剛是也所以凶无所徃而利也夫隂陽之配合男女之交媾理之常也然從欲而流放不由義理則滛邪无所不至傷身敗徳豈人理哉歸妹之所以一有征字凶也並易傳横渠先生曰泰之九二進而在四六四降而在三故曰天地之大義也然泰道將終征將為否故曰凶妹者是少女之稱也對長男而言之故言少女先儒為姪娣之義於卦不見於爻辭則有君與娣之稱長男而與長女是人之常也少女而與少男是人之感也說以動須是歸妹聖人直是盡人情三五皆剛必退反乃吉並易說白雲郭氏曰有乾坤則有六子有天地則有男女夫婦天地夫婦之義一也繫辭曰天地絪緼萬物化醇男女搆精萬物化生故彖以歸妹為天地之大義蓋主夫婦生化之道而言也歸妹人之終始者夫婦生化之道終則有始猶天地之无窮也說以動所歸妹者孔子先言女嫁皆曰歸妹至此論歸妹之卦所以征凶无攸利也闗睢之義樂得淑女蓋以徳為主而此長男以所歸者妹遂說以動則不以徳矣彼既不以徳而說此又不以徳而進是以征凶位不當者卦爻皆不當位是以有不以徳進者矣以少女而歸長男非以柔乘剛而何宜其无攸利也或謂少女說而動如此則去滛奔不逺矣孔子曰說以動所歸妹也觀此則說動者男也易說象曰澤上有雷歸妹君子以永終知敝伊川先生曰雷震於上澤隨而動陽動於上隂說而從女從男之象也故為歸妹君子觀男女配合生息相續之象而以永其終知有敝也永終謂生息嗣續永久其傳也知敝謂知物有敝壊而為相繼之道也女歸則有生息故有永終之義又夫婦之道當常永有終必知其有敝壊之理而戒慎之敝壊謂離隙歸妹說以動者也異乎恒之巽而動漸之止而巽也少女之說情之感動動則失正非夫婦正而可常之道久必敝壊知其必敝則當思永其終也天下之反目者皆不能永終者也不獨夫婦之道天下之事莫不有終有敝莫不有可繼可久之道觀歸妹則當思永終之戒也易傳横渠先生曰永常禮之終知人情之敝易說白雲郭氏曰衞人作氓詩蓋言男女無别遂相奔誘華落色衰復相棄背此所謂男女不終之敝也歸妹之義雖非奔誘然以長說少志在容色失夫婦之大義其去奔誘不逺矣是以君子於此欲思永終偕老之道而戒不終之敝也禮曰壹與之齊終身不改故夫死不嫁所謂永終者如此易說初九歸妹以娣跛能履征吉象曰歸妹以娣以恒也跛能履吉相承也伊川先生曰女之歸居下而无正應娣之象也剛陽在婦人為賢一作堅貞之徳而處卑順娣之賢正者也處說居下為順義娣之卑下雖賢何所能為不過自善其身以承助其君而已如跛之能履言不能及逺也然在其分為善故以是而行則吉也歸妹之義以說而動非夫婦能常之道九乃剛陽有賢一作堅貞之徳雖娣之微乃能以常者也雖在下不能有所為如跛者之能履然征而吉者以其能一无能字相承助也能助其君娣之吉也並易傳横渠先生曰陽處於上不可不隨故征吉以兊應震合卦之義常道也爻為陽故能履非匹故跛易說白雲郭氏曰初在下賤者之位也上无正應无所歸焉娣之象也自无所歸因人之歸而為娣媵故言歸妹以娣也跛能履者娣雖非正亦足以有行猶跛者之能履也故進而佐其君則吉恒者可久之道也娣媵古之道非妄為也故可久吉相承者言娣以進而承君為吉也易說九二眇能視利幽人之貞象曰利幽人之貞未變常也伊川先生曰九二陽剛一作剛陽而得中女之賢正者也上有正應而反隂柔之質動於說者也乃女賢而配不良故二雖一作之賢不能自遂以成其内助之功適可善其身而小施之如眇者之能視而已言不能及逺也男女之際當以正禮五雖不正二自守其幽静貞正乃所利也二有剛正之徳幽静之人也二之才如是而言利貞者一无此五字利言宜於如是之貞一无之貞字非不足而為之戒也守其幽貞未失夫婦常正之道也世人以媟狎為常故以貞静為變常不知乃常久之道也並易傳横渠先生曰震動乎上雖匹而不至所以眇陽中故能視不援上幽人之正也易說白雲郭氏曰九二剛中賢女也長男說少艾而動則夫之非賢可知矣女從男者也夫之不賢女不能制也一賢一否眇之象也眇而能視以見九二之獨賢也然夫之不賢豈可變常而從之哉安其幽獨之操不為不賢之人奪其志可謂女子之貞者矣斯其所以為利也故曰利幽人之貞九二蓋能獲其利者非才不足而戒之也易說六三歸妹以須反歸以娣象曰歸妹以須未當也伊川先生曰三居下之上本非賤者以失徳而无正應故為欲有歸而未得其歸須待也待者未有所適也六居三不當位徳不正也柔而尚一作上剛行不順也為說之主以說求歸動非禮也上无應无受之者也无所適故須也女子之處如是人誰取之不可以為人配矣當反歸而求為娣媵則可也以不正而失其所也未當者其處其徳其求歸之道皆不當故无取之者所以須也並易傳横渠先生曰三隂本彚征在上今六三反下而為兊故曰歸妹以須反歸以娣女當待年于家今待年夫家而反歸故曰未當易說白雲郭氏曰六三之女不正也不正之女人之所棄故難其歸而有待也雖有待而終難其歸固不若反歸妹之義而從娣媵之事也未當者居位未當是以不能有所歸而待也下卦唯九二得中有歸妹之象初居下位三失正徳故為娣媵義殊不同而謂一卦皆為娣媵之象則非也娣媵非天地大義安足以盡歸妹之象易說九四歸妹愆期遲歸有時象曰愆期之志有待而行也伊川先生曰九以陽居四四上體地之髙也陽剛在女子為正徳賢明者也无正應未得其歸也過時未歸故云愆期女子居貴髙之地有賢明之資人情所願娶故其愆期乃為有時蓋自有待非不售也待得佳配而後行也九居四雖不當位而處柔乃婦人之道一有也字以无應一作悔故為愆期之義而聖人推理以一无以字女賢而愆期蓋有待也女所以愆期者由己而不由彼賢女人所願娶所以愆期乃其志欲有所待待得佳配而後行也並易傳横渠先生曰九四當速交而為泰今獨後者三有所待也故曰愆期易說白雲郭氏曰三之與四其不當相似而辭有不同何哉蓋六三以柔用剛又為過中而九四以剛用柔有未中之義是其所以不同也以其不當无應亦不免愆期有待而已其歸終有時故无反歸之事象言有待而行者行如詩言女子有行是也又以見所以愆期者在我有所待非人不求之也以是知過中與未中用剛與用柔其不同如此所以繫辭言三多凶也易說六五帝乙歸妹其君之𬒮不如其娣之𬒮良月幾望吉象曰帝乙歸妹不如其娣之𬒮良也其位在中以貴行也伊川先生曰六五居尊位妹之貴髙者也下應於二為下嫁之象王姬下嫁自古而然至帝乙而後正婚姻之禮明男女之分雖至貴之女不得失柔巽之道有貴驕之志故易中隂尊而謙降者則曰帝乙歸妹泰六五是也貴女之歸唯謙降以從禮乃尊髙之徳也不事容飾以說於人也娣媵者以容飾為事者也衣袂所以為容飾也六五尊貴之女尚禮而不尚飾故其袂不及其娣之袂良也良美好也月望隂之盈也盈則敵陽矣幾望未至於盈也五之貴髙常不至於盈極則不亢其夫乃為吉也女之處尊貴之道也以帝乙歸妹之道言其袂不如其娣之袂良尚禮而不尚飾也五以柔中在尊髙之位以尊貴而行中道也柔順降屈尚禮而不尚飾乃中道也並易傳横渠先生曰歸妹交泰之事備矣與泰六五同又於此見為之戒也以其貴行故戒其滿以幾望一作又於此見新故之戒也易說白雲郭氏曰六五以柔居尊得謙下之道故為帝乙歸妹與泰之六五同意此王姬下嫁之象帝而稱乙亦言其謙柔也其君之袂不如其娣之袂良者君謂妹也妹以徳自飾不以服飾為事故不如其娣之袂良也詩序言王姬車服不繫其夫下王后一等猶執婦道以成肅雝之徳則詩人所美者係乎肅雝之徳不獨取於車服也月幾望者不自滿假之意也其娣袂良猶能謙下而无嫉妬之心蓋樛木逮下之義也帝乙歸妹下於其夫也月幾望下於其娣也夫如是吉孰大焉故樛木之詩每章必以福履終之是亦月幾望而繼以吉之義也月隂類也小畜上九曰婦貞厲月幾望則月為女子之象矣其位在中以貴行者天下未有不得中而能謙下於人者六五之位在中也以尊歸卑是為以貴行也惟在中故能不失貴行之義聖人之意尚徳而已易說上六女承筐无實士刲羊无血无攸利象曰上六无實承虚筐也伊川先生曰上六女歸之終而无應女歸之无終者也婦者所以承先祖奉祭祀不能奉祭祀則不可以為婦矣筐篚之實婦職所供也古者房中之俎葅歜一作醢之類后夫人職之諸侯之祭親割牲卿士大夫皆然割取血以祭禮云血祭盛氣也女當承事筐篚而无實无實則无以祭謂不能奉祭祀也夫婦共承宗廟婦不能奉祭祀乃夫不能承祭祀也故刲羊而无血亦无以祭也謂不可以承祭祀也婦不能奉祭祀則當離絶矣矣无字是夫婦之无終者也何所徃而利哉筐无實是空筐也空筐可以祭乎言不可以奉祭祀也女不可以承祭祀則離絶而已是女歸之无終者也並易傳横渠先生曰上六與三皆隂故士女无實易說白雲郭氏曰上六居一卦之極失謙下之義无以奉祭祀則非夫婦之道矣故稱女士焉未嫁曰女未娶曰士筐所以載實也承筐无實失婦道也禮云血祭盛氣也親割牲而无血失夫道也夫不夫婦不婦何所利哉是以夫婦之道有不能永終者以此聖人貴其知敝故夫夫婦婦而家道正矣言无實无血无攸利於上六之爻皆不能永終知敝也易說大易粹言卷五十四
