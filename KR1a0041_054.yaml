body:
  text: 大易粹言卷五十四宋方聞一編兊下震上伊川先生曰歸妹序卦漸者進也進必有所歸故受之以歸妹進則必有所至故漸有歸義歸妹所以繼漸也歸妹者女之歸也妹少女之稱為卦震上兊下以少女從長男也男動而女説又以説而動皆男説女女從男之義卦有男女配合之義者四咸恆漸歸妹也咸男女之相感也男下女二氣感應止而説男女之情相感之象恆常也男上女下巽順而動隂陽皆相應是男女居室夫婦倡隨之常道漸女歸之得其正也男下女而各得正位止靜而巽順其進有漸男女配合得其道也歸妹女之嫁歸也男上女下女一無女字從男也而有説少之義以説而動動以一作而説則不得其正矣故位皆不當初與上雖當隂陽之位而陽在下隂在上亦不當位也與漸正相對咸恆夫婦之道漸歸妹女歸之義咸與歸妹男女之情也咸止而説歸妹動於説皆以説也恆與漸夫婦之義也恆巽而動漸止而巽皆以巽順也男女之道夫婦之義備於是矣歸妹為卦澤上有雷雷震而澤動從之象也物之隨動莫如水男動于上而女從之嫁歸從男之象震長男兊少女少女從長男以説而動動而相説也人之所説者少女故云妹為女歸之象又有長男説少女之義故為歸妹也易傳歸妹征凶無攸利伊川先生曰以説而動動而不當故凶不當位不當也征凶動則凶也如卦之義不獨女歸無所往而利也易傳橫渠先生曰歸妹與革均是澤為大卦義不相干故革具四德而歸妹初不言德也易説白雲郭氏曰歸者女子之嫁也妹言少女也少女從長男非正之道樂於自進則凶也何所利哉卦辭言征凶者獨歸妹一卦然而非樂於自進亦無凶矣王輔嗣以歸妹為娣媵故其言曰雖與長男交嫁而係娣是以説也孔氏因之曰以妹從娣而嫁謂之歸妹誤矣娣媵謂之媵非歸也孔子言天地之大義謂夫婦也娣媵豈能具此義哉諸爻言娣義自不同輔嗣以初九有歸妹以娣之辭故誤以妹為娣媵耳六五曰其君之袂不如其娣之袂良孔子象曰帝乙歸妹不如其娣之袂良以見妹稱君而娣為媵矣易説彖曰歸妹天地之大義也天地不交而萬物不興歸妹人之終始也説以動所歸妹也征凶位不當也無攸利柔乘剛也伊川先生曰一隂一陽之謂道隂陽交感男女配合天地之常理也歸妹女歸於男也故云天地之大義也男在女上隂從陽動故為女歸之象天地不交則萬物何從而生女之歸男乃生生相續之道男女交而後有生息有生息而後其終不窮前者有終而後者有始相續不窮是人之終始也説以動以二體釋歸妹之義男女相感説而動者少女之事故以説而動所歸者妹也所以征則凶者以諸爻皆不當位也所處皆不正何動而不凶大率以説而動安有不失正者柔乘剛不惟位不當也又有乘剛之過三五皆乘剛男女有尊卑之序夫婦有倡隨之禮此一無此字常理也如恆是也苟不由常正之道徇情肆欲唯説是動則夫婦瀆亂男牽欲而失其剛婦狃説而忘其順如歸妹之乘剛是也所以凶無所往而利也夫隂陽之配合男女之交媾理之常也然從欲而流放不由義理則淫邪無所不至傷身敗德豈人理哉歸妹之所以一有征字凶也並易傳橫渠先生曰泰之九二進而在四六四降而在三故曰天地之大義也然泰道將終征將為否故曰凶妹者是少女之稱也對長男而言之故言少女先儒為姪娣之義於卦不見於爻辭則有君與娣之稱長男而與長女是人之常也少女而與少男是人之感也説以動須是歸妹聖人直是盡人情三五皆剛必退反乃吉並易説白雲郭氏曰有乾坤則有六子有天地則有男女夫婦天地夫婦之義一也繫辭曰天地絪緼萬物化醇男女搆精萬物化生故彖以歸妹為天地之大義蓋主夫婦生化之道而言也歸妹人之終始者夫婦生化之道終則有始猶天地之無窮也説以動所歸妹者孔子先言女嫁皆曰歸妹至此論歸妹之卦所以征凶無攸利也關睢之義樂得淑女蓋以德為主而此長男以所歸者妹遂説以動則不以德矣彼既不以德而説此又不以德而進是以征凶位不當者卦爻皆不當位是以有不以德進者矣以少女而歸長男非以柔乘剛而何宜其無攸利也或謂少女説而動如此則去淫奔不逺矣孔子曰説以動所歸妹也觀此則説動者男也易説象曰澤上有雷歸妹君子以永終知敝伊川先生曰雷震於上澤隨而動陽動於上隂説而從女從男之象也故為歸妹君子觀男女配合生息相續之象而以永其終知有敝也永終謂生息嗣續永久其傳也知敝謂知物有敝壞而為相繼之道也女歸則有生息故有永終之義又夫婦之道當常永有終必知其有敝壞之理而戒慎之敝壞謂離隙歸妹説以動者也異乎恆之巽而動漸之止而巽也少女之説情之感動動則失正非夫婦正而可常之道久必敝壞知其必敝則當思永其終也天下之反目者皆不能永終者也不獨夫婦之道天下之事莫不有終有敝莫不有可繼可久之道觀歸妹則當思永終之戒也易傳橫渠先生曰永常禮之終知人情之敝易説白雲郭氏曰衛人作氓詩蓋言男女無别遂相奔誘華落色衰復相棄背此所謂男女不終之敝也歸妹之義雖非奔誘然以長説少志在容色失夫婦之大義其去奔誘不逺矣是以君子於此欲思永終偕老之道而戒不終之敝也禮曰一與之齊終身不改故夫死不嫁所謂永終者如此易説初九歸妹以娣跛能履征吉象曰歸妹以娣以恆也跛能履吉相承也伊川先生曰女之歸居下而無正應娣之象也剛陽在婦人為賢一作堅貞之德而處卑順娣之賢正者也處説居下為順義娣之卑下雖賢何所能為不過自善其身以承助其君而已如跛之能履言不能及逺也然在其分為善故以是而行則吉也歸妹之義以説而動非夫婦能常之道九乃剛陽有賢一作堅貞之德雖娣之微乃能以常者也雖在下不能有所為如跛者之能履然征而吉者以其能一無能字相承助也能助其君娣之吉也並易傳橫渠先生曰陽處於上不可不隨故征吉以兊應震合卦之義常道也爻為陽故能履非匹故跛易説白雲郭氏曰初在下賤者之位也上無正應無所歸焉娣之象也自無所歸因人之歸而為娣媵故言歸妹以娣也跛能履者娣雖非正亦足以有行猶跛者之能履也故進而佐其君則吉恆者可久之道也娣媵古之道非妄為也故可久吉相承者言娣以進而承君為吉也易説九二眇能視利幽人之貞象曰利幽人之貞未變常也伊川先生曰九二陽剛一作剛陽而得中女之賢正者也上有正應而反隂柔之質動於説者也乃女賢而配不良故二雖一作之賢不能自遂以成其內助之功適可善其身而小施之如眇者之能視而已言不能及逺也男女之際當以正禮五雖不正二自守其幽靜貞正乃所利也二有剛正之德幽靜之人也二之才如是而言利貞者一無此五字利言宜於如是之貞一無之貞字非不足而為之戒也守其幽貞未失夫婦常正之道也世人以媟狎為常故以貞靜為變常不知乃常久之道也並易傳橫渠先生曰震動乎上雖匹而不至所以眇陽中故能視不援上幽人之正也易説白雲郭氏曰九二剛中賢女也長男説少艾而動則夫之非賢可知矣女從男者也夫之不賢女不能制也一賢一否眇之象也眇而能視以見九二之獨賢也然夫之不賢豈可變常而從之哉安其幽獨之操不為不賢之人奪其志可謂女子之貞者矣斯其所以為利也故曰利幽人之貞九二蓋能獲其利者非才不足而戒之也易説六三歸妹以須反歸以娣象曰歸妹以須未當也伊川先生曰三居下之上本非賤者以失德而無正應故為欲有歸而未得其歸須待也待者未有所適也六居三不當位德不正也柔而尚一作上剛行不順也為説之主以説求歸動非禮也上無應無受之者也無所適故須也女子之處如是人誰取之不可以為人配矣當反歸而求為娣媵則可也以不正而失其所也未當者其處其德其求歸之道皆不當故無取之者所以須也並易傳橫渠先生曰三隂本彚征在上今六三反下而為兊故曰歸妹以須反歸以娣女當待年于家今待年夫家而反歸故曰未當易説白雲郭氏曰六三之女不正也不正之女人之所棄故難其歸而有待也雖有待而終難其歸固不若反歸妹之義而從娣媵之事也未當者居位未當是以不能有所歸而待也下卦唯九二得中有歸妹之象初居下位三失正德故為娣媵義殊不同而謂一卦皆為娣媵之象則非也娣媵非天地大義安足以盡歸妹之象易説九四歸妹愆期遲歸有時象曰愆期之志有待而行也伊川先生曰九以陽居四四上體地之髙也陽剛在女子為正德賢明者也無正應未得其歸也過時未歸故云愆期女子居貴髙之地有賢明之資人情所願娶故其愆期乃為有時蓋自有待非不售也待得佳配而後行也九居四雖不當位而處柔乃婦人之道一有也字以無應一作悔故為愆期之義而聖人推理以一無以字女賢而愆期蓋有待也女所以愆期者由己而不由彼賢女人所願娶所以愆期乃其志欲有所待待得佳配而後行也並易傳橫渠先生曰九四當速交而為泰今獨後者三有所待也故曰愆期易説白雲郭氏曰三之與四其不當相似而辭有不同何哉蓋六三以柔用剛又為過中而九四以剛用柔有未中之義是其所以不同也以其不當無應亦不免愆期有待而已其歸終有時故無反歸之事象言有待而行者行如詩言女子有行是也又以見所以愆期者在我有所待非人不求之也以是知過中與未中用剛與用柔其不同如此所以繫辭言三多凶也易説六五帝乙歸妹其君之𬒮不如其娣之𬒮良月幾望吉象曰帝乙歸妹不如其娣之𬒮良也其位在中以貴行也伊川先生曰六五居尊位妹之貴髙者也下應於二為下嫁之象王姬下嫁自古而然至帝乙而後正婚姻之禮明男女之分雖至貴之女不得失柔巽之道有貴驕之志故易中隂尊而謙降者則曰帝乙歸妹泰六五是也貴女之歸唯謙降以從禮乃尊髙之德也不事容飾以説於人也娣媵者以容飾為事者也衣袂所以為容飾也六五尊貴之女尚禮而不尚飾故其袂不及其娣之袂良也良美好也月望隂之盈也盈則敵陽矣幾望未至於盈也五之貴髙常不至於盈極則不亢其夫乃為吉也女之處尊貴之道也以帝乙歸妹之道言其袂不如其娣之袂良尚禮而不尚飾也五以柔中在尊髙之位以尊貴而行中道也柔順降屈尚禮而不尚飾乃中道也並易傳橫渠先生曰歸妹交泰之事備矣與泰六五同又於此見為之戒也以其貴行故戒其滿以幾望一作又於此見新故之戒也易説白雲郭氏曰六五以柔居尊得謙下之道故為帝乙歸妹與泰之六五同意此王姬下嫁之象帝而稱乙亦言其謙柔也其君之袂不如其娣之袂良者君謂妹也妹以德自飾不以服飾為事故不如其娣之袂良也詩序言王姬車服不繫其夫下王后一等猶執婦道以成肅雍之德則詩人所美者係乎肅雍之德不獨取於車服也月幾望者不自滿假之意也其娣袂良猶能謙下而無嫉妬之心蓋樛木逮下之義也帝乙歸妹下於其夫也月幾望下於其娣也夫如是吉孰大焉故樛木之詩每章必以福履終之是亦月幾望而繼以吉之義也月隂類也小畜上九曰婦貞厲月幾望則月為女子之象矣其位在中以貴行者天下未有不得中而能謙下於人者六五之位在中也以尊歸卑是為以貴行也惟在中故能不失貴行之義聖人之意尚德而已易説上六女承筐無實士刲羊無血無攸利象曰上六無實承虛筐也伊川先生曰上六女歸之終而無應女歸之無終者也婦者所以承先祖奉祭祀不能奉祭祀則不可以為婦矣筐篚之實婦職所供也古者房中之俎葅歜一作醢之類后夫人職之諸侯之祭親割牲卿士大夫皆然割取血以祭禮云血祭盛氣也女當承事筐篚而無實無實則無以祭謂不能奉祭祀也夫婦共承宗廟婦不能奉祭祀乃夫不能承祭祀也故刲羊而無血亦無以祭也謂不可以承祭祀也婦不能奉祭祀則當離絶矣矣無字是夫婦之無終者也何所往而利哉筐無實是空筐也空筐可以祭乎言不可以奉祭祀也女不可以承祭祀則離絶而已是女歸之無終者也並易傳橫渠先生曰上六與三皆隂故士女無實易説白雲郭氏曰上六居一卦之極失謙下之義無以奉祭祀則非夫婦之道矣故稱女士焉未嫁曰女未娶曰士筐所以載實也承筐無實失婦道也禮云血祭盛氣也親割牲而無血失夫道也夫不夫婦不婦何所利哉是以夫婦之道有不能永終者以此聖人貴其知敝故夫夫婦婦而家道正矣言無實無血無攸利於上六之爻皆不能永終知敝也易説大易粹言卷五十四
