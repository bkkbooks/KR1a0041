body:
  text: 大易粹言卷四十四宋方聞一編巽下乾上伊川先生曰姤序卦夬決也決必有遇故受之以姤姤遇也決判也物之決判則有遇合本合則何遇姤所以次夬也為卦乾上巽下以二體言之風行天下天之下者萬物也風之行無不經觸乃遇之象又一隂始生於下隂與陽遇也故為姤易傳姤女壯勿用取女伊川先生曰一隂始生自是而長漸以盛矣是女之將長壯也隂長則陽消女壯則男弱故戒勿用取如是之女取女者欲其柔和順從以成家道姤乃方進之隂漸壯而敵陽者是以不可取也女漸壯則失男女之正家道敗矣姤雖一隂甚微然有漸壯之道所以戒也易傳廣平遊氏曰姤女壯巽一無巽字為長女也女壯則乘陽其極將至於為剝故勿用取女而初六有蹢躅之戒也以其為巽體也故為女壯以其隂之初生一作出也故為羸豕易説白雲郭氏曰夬之一隂將消之隂也姤之一隂方長之隂也其隂雖同所以為隂則異故夬姤卦象反對其義正相反夬以五剛為義姤以一柔為義也隂之方長女壯之象也自以一隂方長而陽道向消無畏五剛之志欲獨以一柔遇之用壯之甚也是以不可取也觀一陽之復猶曰朋來無咎而姤以一隂之遇不待得朋是以知其壯也陽至四五而後言壯姤一隂方長即為壯者亦見君子小人之情不同也是以陽為君子而隂為小人易説彖曰姤遇也柔遇剛也勿用取女不可與長也天地相遇品物咸章也剛遇中正天下大行也姤之時義大矣哉伊川先生曰姤之義遇也卦之為姤以柔遇剛也一隂方生始與陽相遇也一隂既生漸長而盛隂盛則陽衰矣取女者欲長久而成家也此漸盛之隂將消勝於陽不可與之長久也凡女子小人夷狄勢苟漸盛何可與久也故戒勿用取如是之女隂始生於下與陽相遇天地相遇也隂陽不相交遇則萬物不生天地相遇則化育庶類品物咸章萬物章明也剛遇中正以卦才言也五與二皆以陽剛居中與正以中正相遇也君得剛中之臣臣遇中正之君君臣以剛陽遇中正其道可以大行於天下矣贊姤之時與姤之義至大也天地不相遇則萬物不生君臣不相遇則政治不興聖賢不相遇則道德不亨事物不相遇則功用不成姤之時與義皆甚大也並易傳橫渠先生曰非中爻不能備卦德故曰剛遇中正易説白雲郭氏曰以柔遇剛謂之姤遇之為事天地萬物不能無也無則萬物不生教化不成故地之遇天臣之遇君主於一則可而以一遇五則不可也遇不主於一豈長久之道哉故貞女不從二夫忠臣不事二君是以姤之女壯勿用取也卦辭止於女壯勿用取女而已聖人懼學者止以女子之道而言姤故極天地明教化而言其義之大也天地不相遇則萬物不章剛中之臣非得中正之君則教化不能盛行姤之時義其大如此易説象曰天下有風姤后以施命誥四方伊川先生曰風行天下無所不周為君后者觀其周遍之象以施其命令周誥四方也風行地上與天下有風皆為周遍庶物之象而行於地上遍觸萬物則為觀經歷觀省之象也行於天下周遍四方則為姤施發命令之象也諸象或稱先王或稱后或稱君子大人稱先王者先王所以立法制建國作樂省方勑法閉關育物享帝皆是也稱后者后王之所為也財成天地之道施命誥四方是也君子則上下之通稱大人者王公之通稱易傳橫渠先生曰上所以用柔於下者誥令莫大焉易説白雲郭氏曰天下風行無物不遇后王法之可以施命誥四方夫姤之道最為難用聖人用於施命誥四方之際所謂善用易之道者矣非聖人明之則姤道廢矣伊川曰象稱先王者先王所以立法制若建國作樂省方勑法閉關育物享帝皆是也稱后者后王所為也財成天地之道施命誥四方是也君子則上下之通稱大人則王公之通稱雍竊謂先王王者之事后則凡有君道者皆同之君子大人通上下有德之稱大人則又德之大者耳故雖匹夫亦可為君子大人顔淵柳下惠是也易説初六繫于金柅貞吉有攸往見凶羸豕孚蹢躅象曰繫于金柅柔道牽也伊川先生曰姤隂始生而將長之卦一隂生則長而漸盛隂長則陽消小人道長也制之當於其微而未盛之時柅止車之物金為之堅強之至也止之以金柅而又繫之止之固也固止使不得進則陽剛貞正之道吉也使之進往則漸盛而害於陽是見凶也羸豕孚蹢躅聖人重為之戒言隂雖甚微不可忽也豕隂躁之物故以為況羸弱之豕雖未能強猛然其中心在乎蹢躅蹢躅跳躑也隂微而在下可謂羸矣然其中心常在乎一無乎字消陽也君子小人異道小人雖微弱之時未嘗無害君子之心防於微則無能為矣牽者引而進也隂始生而漸進柔道方牽也繫之于金柅所以止其進也不使進則不能消正道乃貞吉也並易傳橫渠先生曰金柅二物也處姤之時不牽於近則所往皆凶孚信也豕方羸時力未能動然至誠在於蹢躅得申則申矣如李德裕處置閹官徒知其怗息威伏而忽於志不忘逞照察少不至則失其幾也易説龜山楊氏曰論及陽城事謂永叔不取純夫取之其言曰陽城蓋有待而為者也後世猶責之無已其不成人之美亦甚哉此論似厚曰陽城固可取然以為法則不可裴延齡之欲相其來非一朝一夕何不救之於漸乎至於陸贄之貶然後論延齡之姦佞無益矣觀古人退小人之道不然易之姤卦曰女壯勿用取女夫姤一隂生未壯也而曰壯者生而不已固有壯之理也取女則引而與之齊也引而與之齊則難制矣隂者小人之象也小人固當制之於漸也故當隂之生則知其有壯之理其有壯之理則勿取女可也是以姤之初爻曰繫于金柅貞吉有攸往見凶金柅止車之行也隂之初動必有以柅之其制之於漸乎蓋小人之惡制之於未成則易制之於已成則難延齡之用事權傾宰相雖不正名其為相其惡自若也何更云待其為相然後取自麻壞之邪然城之所為當時所難能也取之亦是但不可以為法耳語録白雲郭氏曰隂之始生雖有方長之漸而柔弱未可有行故利在堅固自制擊而不動以待其時斯可矣柅止車之物也能以固止為貞則吉有攸往則見凶也苟不能堅固自制以待時譬如羸豕躁動信能蹢躅而已安能有為有行哉動而不能有為有行徙有見凶之患所謂非徒無益而又害之者是以必繫于金柅不動可也柔道不能獨立初六之繫蓋為柔道所牽耳夫遇有必動之理而初居不可動之勢以見遇之初猶將有待也易説九二包有魚無咎不利賔象曰包有魚義不及賔也伊川先生曰姤遇也二與初密比相遇者也在它卦則初正應於四在一無在字姤則以遇為重相遇之道主於專一二之剛中遇固以誠然初之隂柔羣陽在上而又有所應者其志所求也隂柔之質鮮克貞固二之於初難得其誠心矣所遇不得其誠心遇道之乖也包者苴褁也魚隂物之美者陽之於隂其所説美故取魚象二於初若能固畜之如包苴之有魚則於遇為無咎矣賔外來者也不利賔包苴之魚豈能及賔謂不可更及外人也遇道當專一二則雜矣二之遇初不可使有二於外當如包苴之有魚包苴之魚義不及於賔客也並易傳白雲郭氏曰初六以隂居下魚之象也九二包而有之得相遇之道故無咎初當應四疑九二之包有魚為非蓋姤遇之時遇為先也是以言包有魚無咎也賔者外來之隂也初六之隂二能包之二隂以來不能包也故九二不利賔之來也不利其來者以義不能包及二隂故也且初六柔道方長必有繼來之隂三四尚逺二當先遇故言不利賔也惟其不能包有二隂故賔之繼來則九二退而成遁時運已化姤遇之道息矣易説九三臀無膚其行次且厲無大咎象曰其行次且行未牽也伊川先生曰二與初既相遇三説初而密比於二非所安也又為二所忌惡其居不安若臀之無膚也處既不安則當去之而居姤之時志求乎遇一隂在下是所欲也故處雖不安而其行則又次且也次且進難之狀謂不能遽舍也然三剛正而處巽有不終迷之義若知其不正而懷危懼不敢妄動則可以無大咎也非義求遇固已有咎矣知危而止則不至於大一有咎字也其始志在求遇於初故其行遲遲未牽不促其行也既知危而改之故未至於大咎也並易傳橫渠先生曰行而無所與遇故曰行未牽也進退無所係也易説白雲郭氏曰九三不能安其位者也當遇之時無位之遇可以止矣當止不止是以至於臀無膚其行次且也至是則危矣且初六得遇之位以柔道不能獨立苟不能自制以有待亦有羸豕蹢躅之患況九三非遇之位其危宜矣二之遇四之應為有其事也無事而行九三也無膚次且之厲本非九三所有蓋未嘗牽勉而妄行焉是以至此然無大咎者三居二四之間雖行不能越二剛終無妄遇之事故亦無大咎夬之九四辭相類者夬姤三四反對之爻也與損益二五同易説九四包無魚起凶象曰無魚之凶逺民也伊川先生曰包者所褁畜也魚所美也四與初為正應當相遇者也而初已遇於二矣失其所遇猶包之無魚亡其所有也四當姤遇之時居上位而失其下下之離由己之失德也四之失者不中正也以不中正而失其民所以凶也曰初之從二以比近也豈四之罪乎曰在四而言義當有咎不能保其下由失道也豈有上一無上字不失道而下離者乎遇之道君臣民主夫婦朋友皆在焉四以下睽故主民而言為上而下離必有凶變起者將生之謂民心既離難將作矣下之離由己致之逺民者已逺之也為上者有以使之離也並易傳白雲郭氏曰四與初應為有魚也當姤遇之時初六見九二而先遇焉是九四失其正應故言無魚也夫得道者多助失道者寡助寡助之至親戚畔之此無魚所以起凶蓋言凶之起自無魚始矣魚民也為君而不得其民能無凶乎四之與初非逺也而曰逺民者視二為逺耳它卦正應有間多為終吉獨姤之時以遇為急故也易説九五以杞包瓜含章有隕自天象曰九五含章中正也有隕自天志不舍命也伊川先生曰九五下亦無應非有遇也然得遇之有之字道故終必有遇夫上下之遇由相求也杞髙木而葉大處髙體大而可以包物者杞也美實之在下者瓜也美而居下者側微之賢之象也九五尊居君位而下求賢才以至髙而求至下猶以杞葉而包瓜能自降屈如此又其內藴中正之德充實章美人君如是則無有不遇所求者也雖屈己求賢若其德不正賢者不屑也故必含畜章美內積至誠則有隕自天矣猶云自天而降言必得之也自古人君至誠降屈以中正之道求天下之賢未有不遇者也髙宗感於夢寐文王遇於漁釣皆由是道也所謂含章謂其含藴一無藴字中正之德也德充實則成章而有一無有字輝光命天理也舍逹也至誠中正屈己求賢存志合於天理所以有隕自天必得之矣並易傳髙宗好賢之意與易姤卦同九五以杞包瓜含章有隕自天杞生於最髙處瓜美物生低處以杞包瓜則至尊逮下之意也既能如此自然有賢者出故有隕自天也後人遂有天祐生賢佐之説師説橫渠先生曰杞之為物根固於下瓜之為實潰必自內九五以中正剛健含章宅尊而遇隂柔浸長之時厚下安宅潰亂是防盡其人謀而聽天命者也以杞包瓜文王事紂之道厚下以防中潰盡人謀而聽天命者歟易説廣平遊氏曰以杞包瓜者以九二之剛中包初六之柔脆用賢得民之象也用賢得民則我無為也中心守至正而已故曰含章若是者天實臨之降之百祥將不旋踵矣故曰有隕自天蓋明君之於天下安危利害不惑一作二字其心居中守正強為善以俟之所以作元命也故曰志不舍命易説白雲郭氏曰九五尊位中正為道甚大其為遇也宜異夫在下包茅之微故言以杞包爪也杞大木也君人之象也瓜綿綿相繼之實也民象也髙其木大其隂綿綿之屬託其本而有生焉是其為包也大矣含章九五之德也有隕自天志惟天命之遇也志不舍命循天之理也以杞包瓜則盡養民之道有隕自天則無妄遇之災是其所以為含章之美也含章非含而不發也內有含章之美故見於外者如此易説上九姤其角吝無咎象曰姤其角上窮吝也伊川先生曰至剛而在最上者角也九以剛居上故以角為象人之相遇由降屈以相從和順以相接故能合也上九髙亢而剛極人誰與之以此求遇固可吝也已則如是人之逺之非它人之罪也由己致之故無所歸咎既處窮上剛亦極矣是上窮而致吝也以剛極居髙而求遇不亦難乎並易傳橫渠先生曰窮不知變吝之道也易説白雲郭氏曰居姤之終不知道之變道既上窮猶欲遇焉是其所以吝也無咎者姤以妄遇則有凶上九既不遇於君又進則無所遇非能得無咎之道幸而居無咎之位耳與九三無大咎同義易説大易粹言卷四十四
