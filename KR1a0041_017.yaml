body:
  text: 大易粹言卷十七宋方聞一編震下兊上伊川先生曰隨序卦豫必有隨故受之以隨夫説豫之道物所隨也隨所以次豫也為卦兊上震下兊為説震為動説而動動而説皆隨之義女隨人者也以少女從長男隨之義也又震為雷兊為澤雷震於澤中澤隨而動隨之象也又以卦變言之乾之上來居坤之下坤之初往居乾之上陽來下於隂也以陽下隂隂必説隨為隨之義凡成卦既取二體之義又有取爻義者復有更取卦變之義者如隨之取義尤為詳備易傳隨元亨利貞無咎伊川先生曰隨之道可以致大亨也君子之道為衆所隨與己隨於人及臨事擇所隨皆隨也隨得其道則可以致大亨也凡人君之從善臣下之奉命學者之徙義臨事而從長皆隨也隨之道利在於貞正隨得其正然後能大亨而無咎失其正則有咎矣豈能亨乎易傳龜山楊氏曰隨無故也有亨之道焉然隨非其正雖道通而志行君子不與也故利貞乃無咎易説白雲郭氏曰隨有隨之主有隨之者有隨於內有隨於外者隨之主大矣而隨之則小也隨於內小矣而隨於外則大也以隨之成卦言之剛來隨於內而柔上隨於外二三得剛而隨以動四五得柔而隨以説此隨之義也六爻無不隨者矣然謙卦一謙而得四益為吉隨卦一隨具四德而無咎非無咎不足於吉也蓋謙之得失在人事人事以吉為善隨之得失在道道以無咎則不失不可一槩論也易説彖曰隨剛來而下柔動而説隨大亨貞無咎而天下隨時隨時之義大矣哉伊川先生曰卦所以為隨以剛來而下柔動而説也謂乾之上九來居坤之下坤之初六往居乾之上以陽剛來下於隂柔是以上下下以貴下賤能如是物之所説隨也又下動而上説動而可説也所以隨也如是則可一有以字大亨而得正能大亨而得正則為無咎不能亨不得正則非可隨之道豈能使天下隨之乎天下所隨者時也故云天下隨時君子之道隨時而動從冝適變不可為典要非造道之深知幾能權者不能與於此也故贊之曰隨時之義大矣哉凡贊之者欲人知其義之大玩而識之也此贊隨時之義大與豫等諸卦不同諸卦時與義是兩事一作與豫卦以下諸卦不同時義是兩事一作與豫等諸卦不同時與義是兩事並易傳禮孰為大時為大亦須隨時當隨則隨當治則治當其時作其事便是能隨時隨時之義大矣哉尋常人言隨時為且和同只是流徇耳不可謂和和則己是和於義故學者患在不能識時時出之亦須有溥博淵泉方能出之自畫卦垂衣裳至周文方遍只為時也若不是隨時即一聖人出百事皆做了後來者沒事又非聖人智慮所不及只有時不可也只歸之自然則無觀更無玩頥並入關語録龜山楊氏曰一陽在下剛來而下柔也動而説合二體言之也剛不下柔則元動而不説則括夫如是人孰隨之故剛來而下柔動而説所以為隨也隨而大亨貞則為隨之主而天下隨之以為時矣若泰之時君子以其彚征是也夫趨變無常而各當其可非夫可與權者其孰能之其義豈不大矣哉易説兼山郭氏曰剛自上來而成震柔自下往而成兊故震動而兊説不止於人道而言凡受命賦形於天地之間者無不為隨也蓋震東方之卦也萬物隨之以生兊西方之卦也萬物隨之以成其出也其入也孰不隨之故春生之夏長之秋成之冬藏之隨也聖人東作西成亦隨也五載一巡守亦隨也隨之大豈一端而已耶易説白雲郭氏曰先人曰隨不止於人道而言震東方之卦也萬物隨之以生兊西方之卦也萬物隨之以成其出入也孰不隨之故春生之夏長之秋成之冬藏之隨也聖人東作西成亦隨也五載一巡守亦隨也隨之大豈一端而已耶伊川曰凡人君之從善臣下之奉命學者之徙義衆人之隨己巳之隨人與臨事而擇所隨皆隨也雍曰隨之成卦以初九上六來往成震兊動説而有隨王輔嗣以震為剛而兊為柔是剛下柔如咸卦男下女之説不言初九上六之義若如王氏言則剛來下柔之卦居易之半矣何獨於隨言之也且天下之理不動則無所隨不説則不能隨所以致動而説者初九上六之力也聖人論上下卦則言男女隂陽及論爻則言剛柔隨蠱二卦不以初上之變論之則剛來下柔與剛上柔下之義終不可明也然隨之道大而天地小而人民細而蟲魚草木無不有隨不能以言盡要其歸則隨時而已至如堯舜隨於揖遜湯武隨於征伐伊周隨於致君孔孟隨於設教以聖人之隨其不同已如此況天地萬物之隨乎蓋道與時會則聖人隨之易地皆然也是以聖人所任者道而不能違者時故曰隨時之義大矣哉易説象曰澤中有雷隨君子以嚮晦入宴息伊川先生曰雷震於澤中澤隨震而動為隨之象君子觀象以隨時而動隨時之冝萬事皆然取其最明且近者言之君子以嚮晦入宴息君子晝則自強不息及嚮昏晦則入居於內宴息以安其身起居隨時適其冝也禮君子晝不居內夜不居外隨時之道也易傳凡易卦有就卦才而得其義者亦有舉兩體便得其義者隨剛來而下柔動而説隨比是就卦才而得隨之義澤中有雷隨此是就象上得隨之義也周行已録隨卦言君子嚮晦入宴息解者多作遵飬時晦之晦或問作甚晦字曰此只是隨時之大者嚮晦則宴息也更别有甚義劉元承手編橫渠先生曰人到向道後俄頃不捨豈暇安寢然君子嚮晦入燕處君子隨物而止故入燕處然其仁義功業之心未嘗忘但以其物之皆息吾兀然而坐無以為接無以為功業須亦入息經學理窟龜山楊氏曰雷在澤中其動息矣故君子以是嚮晦入宴息夫日出而作晦而息人之所同然者君子則知隨時之義者也衆人則由之而不知耳處隨之義至於晦明動息而不違況出處之大致乎易説白雲郭氏曰伊川曰禮晝不居內夜不居外亦隨時也雍曰夫君子一動一靜至於宴息猶有隨焉大者可知也此蓋因其小者足以見隨之大不然君子之道宴息而已乎易説初九官有渝貞吉出門交有功象曰官有渝從正吉也出門交有功不失也伊川先生曰九居隨時而震體且動之主有所隨者也官主守也既有所隨是其所主守有變易也故曰官有渝貞吉所隨得正則吉也有渝而不得正乃過動也出門交有功人心所從多所親愛者也常人之情愛之則見其是惡之則見其非故妻孥之言雖失而多從所憎之言雖善為惡也苟以親愛而隨之則是私情所與豈合正理故出門而交則有功也出門謂非私昵交不以私故其隨當而有功既有隨而變必所從得正則吉也所從不正則有悔吝出門而交非牽於私其交必正矣正則無失而有功並易傳橫渠先生曰言凡所治務能變而任正不膠柱也處隨之初為動之主心無私係故能動必擇義善與人同者也易説龜山楊氏曰居隨之初以時為大冝有渝者也知守而不知變則失時矣初九陽剛而震體能有渝者也然而渝不以正咎孰大焉故正乃吉也夫體隨時之義而蔽於昵己之私則所失多矣故出門交而後有功不失也易説白雲郭氏曰剛來隨於內者也在內之隨主於初九夫以乾剛之性豈能變其所守哉能變而從動雖未至隨之大已為動之主矣易曰變則通此隨之成卦所以有取於初之變也能變其所守是以得貞而吉二三得剛而後動剛亦得二三而後動剛柔相須以動故出門交而有功也出門交兊然後隨道成而不失隨之大也蓋初雖為主於內持動之主未為隨耳伊尹幡然而改是為出門交有功也易説六二係小子失丈夫象曰係小子弗兼與也伊川先生曰二應五而比初隨先於近柔不能固守故為之戒云若係小子則失丈夫也初陽在下小子也五正應在一作居上丈夫也二若志係於初則失九五之正應是失丈夫也一無也字係小子而失丈夫捨正應而從不正其咎大矣二有中正之德非必至如是也在隨之時當為之戒也人之所隨得正則逺邪從非則失是無兩從之理二苟係初則失五矣弗能兼與也所以戒人從正當專一也並易傳龜山楊氏曰徇昵己之私忘天下之公故偏係而不能兼與也六三隂柔小子也易説白雲郭氏曰六二初不能動今居動之中者得初九而後動也故捨應從初非得已也亦隨之小者耳是以有係小子失丈夫之象方其未動之時雖欲應五豈可得哉然終無絶五之志以急於託初之動未能兼與故也與夫愚而好自用賤而好自專者異矣是以所係雖小而無凶咎也易説六三係丈夫失小子隨有求得利居貞象曰係丈夫志舍下也伊川先生曰丈夫九四也小子初也陽之在上者丈夫也居下者小子也三雖與初同體而切近於四故係於四也大抵隂柔不能自立常親係於所近者上係於四故下失於初舍初從上得隨之冝也上隨則善也如昏之隨明事之從善上隨也背是從非舍明逐暗下隨也四亦無應無隨之者也近得三之隨必與之親善故三之隨四有求必得也人之隨於上而上與之是得所求也又凡所求者可得也雖然固不可非理枉道以隨於上苟取愛説以遂所求如此乃小人邪諂趨利之為也故云利居貞自處於正則所謂有求而必一無必字得者乃正事君子之隨也既隨於上則是其志舍下而不從也舍下從上舍卑而從髙也於隨為善矣並易傳橫渠先生曰舍小隨大所求可得必守正不邪乃吉易説龜山楊氏曰陽剛丈夫隂柔小子也不係二而係四係丈夫也雖有所係而所隨者上與夫失丈夫者異矣蓋親仁尚賢隨之上也合汙世同流俗隨之下也三雖未足以與權而志舍矣亦君子所與也故有求斯得然隨而有求求在外者也君子之求求在我而已故雖有得不若居正之為利易説白雲郭氏曰六二隨於內者也六三隨於外者也隨之道貴知變知變故能隨時非六三之智優於六二也時之不同耳方其不能動之時則不得不隨於初及其居動之極則不得不隨於説此六三係丈夫失小子之義蓋盡初九出門交有功之説也雖小有失於內而其於隨之大者蓋有得也故曰隨有求得有得則利居正以守之故利居貞然初自守而變而三自變而守易地觀之皆一道也志舍下者六三於斯時志在於隨而不在於動故也易説九四隨有獲貞凶有孚在道以明何咎象曰隨有獲其義凶也有孚在道明功也伊川先生曰九四以陽剛之才處臣位之極若於隨有獲則雖正亦凶有獲謂得天下之心隨於己為臣之道當使恩威一出於上衆心皆隨於君若人心從己危疑之道也故凶居此地者奈何唯孚誠積於中動為合於道以明哲處之則又何咎古之人有行之者伊尹周公孔明是也皆德及於一無於字民而氏隨之其得民之隨所以成其君之功致其國之安其至誠存乎中是有孚也其所施為無不中道在道也唯其明哲故能如是以明也復何過咎之有是以下信而上不疑位極而無逼上之嫌勢重而無專強一作權之過非聖人大賢則不能也其次如唐之郭子儀威震主而主不疑亦由中有誠孚而處無甚失也非明哲能如是乎居近君之位而有獲其義固凶能有孚而在道則無咎蓋明哲之功也並易傳橫渠先生曰以陽居隂利於比三則凶也處隨之世為衆所附苟利其獲凶之道也能以信存道則功業可明無所咎矣易説龜山楊氏曰九四震兊之交動而説也動而説而天下隨之隨有獲也履近君之位任大臣之責危疑所集也雖有獲其義凶矣非有孚在道而明足以與權其能無咎乎故孔子曰明功也昔周公東征而罪人斯得以至東人欲其留西人欲其歸可謂隨有獲而天下隨之矣然公孫碩膚赤舄几几夫何咎之有非有孚在道以明寧有是夫易説白雲郭氏曰九四居尊近之位有剛健之才天下之所説隨亦足以致人之隨者也故為隨之有獲者六三隨有求得蓋隨人而有得者九四隨有獲蓋以得人之隨為獲也夫尊近之臣勢疑於君又獲天下之隨守此為貞則凶矣是必有至誠之道大明於天下足以使天地人鬼萬世無疑焉斯無咎矣文王之時三分天下有其二可謂有獲矣方且以服事殷不識不知順帝之則而已是以萬邦作孚而天下萬世稱其德焉非有孚任道者乎其義凶者非九四誠有是凶也若貞固守之其義有得凶之理也明功者有孚在道明隨之功也易説九五孚于嘉吉象曰孚于嘉吉位正中也伊川先生曰九五居尊得正而中實是其中誠在於隨善其吉可知嘉善也自人君至于庶人隨道之吉唯在隨善而已下應二之正中為隨善之義處正中之位由止中之道孚誠所隨者正中也所謂嘉也其吉可知所孚之嘉謂六二也隨以得中為善隨之所防者過也蓋心所説隨則不知其過矣並易傳橫渠先生曰處隨之世而剛正宅尊善為衆信故吉或曰孚於二則吉易説龜山楊氏曰二五皆正中也孚于正中善之至也吉孰加焉故曰孚于嘉吉易説白雲郭氏曰九五之於隨所謂信以成之者也亦所謂安而行之者也故能無事於隨不優不迫居中履正孚于嘉而已嘉美德也美德孚于天下無外內之限豈堯所謂欽明文思允恭克讓光被四表之德哉豈舜所謂濬哲文明溫恭允塞之德哉位正中者天下之人莫知其有為之迹所可見者位正中而已孔子言堯無能名舜恭己南面之意也或謂孚于六二則與屯其膏同人號咷無以異安足以見隨時之大哉易説上六拘係之乃從維之王用亨于西山象曰拘係之上窮也明道先生曰隨之上六才與位皆隂柔隨之極也故曰拘係之乃從維之又從而維之王用亨于歧山唯太王之事民心固結而不可解者其他皆不可如是之固也劉絢師訓伊川先生曰上六以柔順而居隨之極極乎隨者也拘係之謂隨之極如拘持縻係之乃從維之又從而維係之也謂隨之固結如此王用亨于西山隨之極如是昔者太王用此道亨王業于西山太王避狄之難去豳來岐豳人老稚扶擕以隨之如歸市蓋其人心之隨固結如此用此故能亨盛其王業於西山西山岐山也周之王業蓋興於此上居隨極固為太過然在得民一有心字之隨與隨善之固如此乃為善也施於它則過矣隨之固如拘係一無係字維持一無持字隨道之窮極也並易傳龜山楊氏曰居隨之極在一卦之外而不應於內非知隨者也故拘係之乃從文王三分天下有其二冝無不從者其伐崇也至於執訊連連所謂拘係之乃從也其卒也是致是附四方以無侮所謂維之也此文王所以亨于西山也易説兼山郭氏曰上六舍己從人不咈人以從己之欲隨民之道也隨民之極則民之隨也亦如是而已方文王之三分天下有其二固有不隨者也至於其化自北而南皆有德以維其心中心恱而誠服者此亨于西山之道也故詩曰自西自東自南自北無思不服方是時民歸之若自拘係之又從而維之見其歸之固如是也必也有以拘係有以維縶豈文王之道哉而上六所言乃上窮之民將從文王之維無孑遺者也大哉隨乎舍己從人隨也達則兼善天下亦隨也不當時命而獨善其身亦隨也故始之言父子夫婦朋友之隨而終之以文王之成王道皆隨時之義也易説白雲郭氏曰先人曰舍己從人不咈人以從己之欲隨民之道也隨民之極則民之隨也亦如是而已方文王之三分天下有其二固有不隨者也至於其化自北而南皆有德以維其心此亨于西山之道也故詩曰自西自東自南自北無思不服方是時民歸之若自拘係乃從而維之也必也有以拘係有以維縶豈文王之道哉而上六所言乃上窮之民將從文王之維無子遺者也大哉隨乎舍己從人隨也達則兼善天下亦隨也不當時命而獨善其身亦隨也故始之言父子夫婦朋友之隨而終之以文王之成王道皆隨時之義也雍曰上六隨道之成盡動而説隨之義故如水之就下獸之走壙各從其類拘係而來莫之能禦也為之主者乃從而以道維之而已觀二老之歸文王孟子曰天下之父歸之其子焉往夫其歸也如父子相拘而來豈非拘係之謂乎至於虞芮之訟亦非文王有以係之也然文王發政施仁必先於鰥寡孤獨視之如傷使無凍餒是為維之之道蓋非文王有心於其間隨時之義當然耳孟子言朝覲獄訟謳歌之歸舜禹亦由是也説者謂有不從者必拘係之乃從此冝齊威晉文之所不為而謂文王為之乎易説大易粹言卷十七
