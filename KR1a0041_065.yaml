body:
  text: 大易粹言卷六十五宋方聞一編繫辭上一天尊地卑乾坤定矣卑髙以陳貴賤位矣動靜有常剛柔斷矣伊川先生曰天尊地卑尊卑之位定而乾坤之義明矣髙卑既别貴賤之位分矣陽動隂靜各有其常則剛柔判矣經說問明則有禮樂幽則有鬼神何也曰鬼神只是一箇造化天尊地卑乾坤定矣鼓之以雷霆潤之以風雨是也語録橫渠先生曰先分天地之位乾坤立則方見易故其事無非易也所以先言天地乾坤易之門户也不言髙卑而曰卑髙者亦有義髙以下為基亦是人先見卑處然後見髙也動靜隂陽性也剛柔其體未必形靜專動直不為物纍則其動靜有常不牽制於物也然則乾為剛果斷然不疑矣天地動靜之理天圓則須動地方則須安靜並易說龜山楊氏曰天尊地卑乾坤定矣乾坤夲無體天地之位定則乾坤斯定不有天地乾坤何辨語録兼山郭氏曰孔子曰動靜有常剛柔斷矣方其動以動為常靜以靜為常則動靜之機或幾乎息也是故動存乎靜靜存乎動動靜不窮是其所謂常也中庸解白雲郭氏曰繫辭首一章之義當先辨天地非乾坤乾坤非天地及明道之乾坤易之乾坤三才之天地卦中之天地然後其義可明若直以天地尊卑便為乾坤孰不知天地尊卑之理如此則於道於易於卦皆無意義若非聖人之言也聖人之言豈苟然哉此章蓋明作易聖人首畫乾坤二卦之義此謂易之乾坤卦中天地之象也且無形者道有形者物乾坤道也天地物也故道有乾坤而無天地物有天地而無乾坤及乎觸類而長之然後乾為天坤為地非夲無分也此乾坤天地之辨也無象則道也有象則卦也道之乾坤無象也有其道而未見於書也易之乾坤有象也畫而為卦見之於書者也三才之天地天地也卦中之天地上下二卦又三才之象也孔子繫辭繫周易也周易以乾坤六畫為首故首言天尊地卑乾坤定矣蓋言文王重卦得天尊地卑之象而後乾坤之卦定也若論乾坤之道則乾坤定而後天尊地卑其義不同故包犧之畫在上為天尊道也文王之重在下為地卑道也尊包犧而自卑之是為得天尊地卑之道矣天尊地卑然後卦象形六位著剛柔分其始則乾坤二卦先定故曰乾坤其易之門邪卑髙以陳卑地也髙天也天地髙卑以陳則人位乎兩間而人道著矣貴賤人道也天地純一故一髙一卑人道不齊則或貴或賤而位有分焉此六位之所由以立也有六位而後剛柔生焉故位為一定之體而剛柔則變矣動靜有常乾陽也陽為動坤隂也隂為靜爻之變夲乎動靜觀動靜常理則六爻剛柔斷然可知動以變為常靜以不變為常易稱剛柔皆謂九六也上言乾坤定者由上下二卦也貴賤位者六位也此言剛柔斷者六爻也並易說方以類聚物以羣分吉凶生矣在天成象在地成形變化見矣伊川先生曰事則有類形則有羣善惡分而吉凶生矣象見於天形成於地變化之跡見矣經說橫渠先生曰隂之性常順然而地體重濁不能隨則不能順則有變矣有則有象如乾健坤順有此氣則有此象可得而言若無則直無而已謂之何而可是無可得名故形而上者得詞斯得象但於不形中得以措詞者已是得象可狀也今雷風有動之象須謂天為健雖未嘗見然而成象故以天道言及其發則是效也著則是成形成形則是道也若以耳目所及求理則安得盡如言寂然湛然亦須有此象有氣方有象雖未形不害象在其中有形有象然後知變化之驗並易說廣平游氏曰在天成象則鳥與火虛與昴四時迭見者天道之變也在地成形則作而長斂而藏四時異形者地道之變也至於成象者莫測其進退之機成形者莫見其生成之迹則天地之化也體化而裁之則無駭於變矣此變化之辨也中庸解龜山楊氏曰或問天地則輕清重濁之氣升降否曰然天地乾坤亦是異名同體其夲一物變生則名立在天成象在地成形亦此物也但因變化出來故千態萬變各自陳露故曰在天成象在地成形變化見矣變化神之所為也其所以變化孰從而見之因其成象於天成形於地然後變化可得而見焉因云舊常解此義云無象無形則神之所為隱矣有象有形變化於是乎著語録白雲郭氏曰乾坤畫卦之始夲無吉凶因人而生也方所也物以方而聚言其大致也復以羣而分言乎其微也類聚羣分皆在物也物動則有吉凶而其幾則見於易故易之吉凶因物之類聚羣分而生初未之有也易之所有者卦與爻位而已前三者是也因三才而生見者吉凶變化也論乾坤卦位六爻吉凶變化如此則諸卦可知此章論乾坤先言卦位生爻以盡設卦之道繼言吉凶生變化見以見乾坤之致用變化之道至微難見因在天成象以見乾之變化因在地成形以見坤之變化故曰變化見矣並易說是故剛柔相摩八卦相蕩鼓之以雷霆潤之以風雨日月運行一寒一暑乾道成男坤道成女伊川先生曰隂陽之交相摩軋八方之氣相推蕩雷霆以動之風雨以潤之日月運行寒暑相推而成造化之功得乾者成男得坤者成女經說橫渠先生曰以人言之喘息是剛柔相摩氣一出一入上下相摩錯也於鼻息見之人自鼻息相摩以蕩於腹中物既消爍氣復升騰易說白雲郭氏曰變化之見在易則見於剛柔八卦在天地之間則見於雷霆風雨日月寒暑在人則見於男女皆乾坤變化之道也剛柔者六爻之九六也乾坤九六剛柔相摩而變故八卦因之相蕩而六十四卦生焉此見於易者也雷霆風雨之鼓潤日月寒暑之運行皆八卦變化之象見於天地之間者也雷霆風雨鼓潤萬物者也日月運行寒暑者也乾道成男在易則震坎艮是也在人則男也坤道成女在易則巽離兊是也在人則女也易說乾知大始坤作成物乾以易知坤以簡能易則易知簡則易從易知則有親易從則有功有親則可久有功則可大可久則賢人之德可大則賢人之業易簡而天下之理得矣天下之理得而成位乎其中矣明道先生曰坤作成物是積學處乾知大始是成德處李籲所録伊川先生曰乾當始物坤為成物乾坤之道易簡而已乾始物之道易坤成物之能簡平易故人易知簡直故人易從易知則可親就而奉順易從則可取法而成功親合則可以常久成事則可以廣大聖賢德業久大得易簡之道也天下之理易簡而已有理而後有象成位乎其中也經說橫渠先生曰天地雖一物理須從分别大始者語物之始乾全體之而不遺故無不知也知之先者蓋莫如乾成物者物既形矣故言作已入於形氣也初未未嘗有地而乾漸形不謂知作謂之何㦲然而乾以不求知而知故其知也速坤以不為而為故其成也廣易則易知簡則易從易知則有親易從則有功有親則可久有功則可大可久則賢人之德可大則賢人之業易簡而天下之理得矣天下之理得而成位乎其中矣此皆言人體天地之德然也可久者以久逺推行可大者其得體也大凡語道理之徒道逹不已竟亦何所求推行及民故以賢人措諸事業而言易簡理得而成乎天地之中蓋盡人道並立乎天地以成三才則是與天地參矣但盡人道理自當耳不必受命仲尼之道豈不可以參天地坤至柔而動也剛積大勢成而然爾乾至健無體為感速故易知坤至順不煩其施普故簡能言知者知而已言能者涉於形氣能能成物也易則易知易知則有親今夫虎豹之為物豢之雖馴人亦不敢遂以親狎為其難測惟其平易則易知易信信則人任焉以其可信人斯委任故易以有功矣道體至廣所以有言易有言小有言大無乎不在志大則才大事業大故曰可大又曰冨有志久則氣久德性久故曰可久又曰日新德業不可久不可大不足謂之賢况可謂之聖乎易簡理得則知幾知幾然後經可正天下逹道五其生民之大經乎經正則道前定事豫立不疑其所行利用安身之要莫先焉成位乎其中與天地合其德並易說易簡然後能知險阻易簡理得然後一以貫天下之道正蒙天資美不足為功惟矯惡為善矯惰為勤方是為功人必不能便無是心須使思慮但使常游心於義理之間立夲處以易簡為是接物處以時中為是易簡而天下之理得時中則要博學素備語録龜山楊氏曰解經大抵須得理㑹而語簡舊常解易簡而天下之理得云行其所無事不亦易乎一以貫之不亦簡乎如是則天下之理得矣又言行其所無事一以貫之只是一箇自然之理語録白雲郭氏曰自天尊地卑言乾坤之設卦卑髙以陳言乾坤之六位動靜有常言乾坤六爻之剛柔繼言因方物而吉凶生因象形而變化見則乾坤之義略備矣繼又明變化之見有見於易者有見於天地之間及人道者雖各不同而其象一也自乾知太始坤作成物之下大明乾坤之德而終之以聖人法乾坤之道則乾坤之義畢矣繫易之義莫大於此莫先於此故以是首章也且自易言之則易始於乾坤而乾又為坤之始是為太始也自物言之則萬物始於坤坤始於乾是為太始也太始以氣言乾為天天知始物而已非生也坤為地地成形則生而作成之也此地道之代終也然乾之太始以易而知知始而已亦非生也坤之成物以簡而能能則作成之義也非易則不知非簡則不能乾坤之道不過於此况人乎是以聖人之道無它焉法乾坤易簡而已乾道易故人亦易知坤道簡故人亦易從人能法乾坤之易簡者以易知易從而已以易知之道接物故物輔而相親以易從之道有為故人歸而有功有親樂其易也易則可久之道也有功成於簡也簡則可大之道也且乾以無不覆為易坤以無不載為簡人思無不覆之道則天下萬物不能外其親此其所以可久也思無不載之道則天下萬物不能外其功此其所以可大也法乾坤之易簡至於可久可大則賢人之德業至矣原始要終雖天下之理不同皆以易簡而得之此所謂知其所夲者也天下之理得則與天地合德是以成位乎其中而參天地且乾以易知天亦易也坤以簡能地亦簡也聖賢之德業以易簡而成天下之理以易簡而得天地與人其德一歸之易簡非合德參天地而何此章前言設卦之道而後言賢人可久可大之德業則知易不徒設也將以其道用於天下耳昧者未之知故務為艱險以去其易務為繁苛以去其簡苟目前之利而不顧方來之弊則德於是乎不可久作聰明窮奢欲矜權術滋法令則業於是乎不可大天下之理既不能得於是上下乖離而天下始亂矣漢唐之弊是也安能知成位乎其中夲於至簡至易之道哉聖人憂患後世不知君人之有道此文王之易所以作而孔子復繫辭以明之之意也然乾坤易簡與人道易簡夲非二道故孔子論易簡自乾坤終以人道相馴而致無少間也此章始自天尊地卑終於易簡乾坤之義畢矣並易說聖人設卦觀象繫辭焉而明吉凶剛柔相推而生變化是故吉凶者失得之象也悔吝者憂虞之象也變化者進退之象也剛柔者晝夜之象也六爻之動三極之道也伊川先生曰聖人既設卦而繫之以辭明其吉凶之理以剛柔相推而知變化之道吉凶之生由失得也悔吝者可憂虞也進退消長所以成變化也剛柔相易而成晝夜觀晝夜則知剛柔之道矣三極上中下也極中也皆其時中也三才以物言也三極以位言也經說橫渠先生曰吉凶者失得之著也變化者進退之著也設卦繫辭所以示其著也吉凶變化悔吝剛柔易之四象歟悔吝由羸不足而生亦兩而已變化進退之象云者進退之動也微必驗之於變化之著故察進退之理為難察變化之象為易六爻盡利而動所以順隂陽剛柔仁義性命之理也故曰六爻之動三極之道也並易說白雲郭氏曰此章明聖人設卦之道卦所以觀天下之象象在彼者也聖人像之於卦故觀于此而可得也有畫而無辭則吉凶不可得而知繫之以辭所以明吉凶也剛柔不相推則止於乾坤而已變化無自而生變化不生則六十四卦不能成也然吉凶變化雖各有所主究其實亦皆象也易以象為主而象為難明故復詳言之彼有失得則卦以吉凶象之彼有憂虞則卦以悔吝象之彼有進退則卦以變化象之彼有晝夜則卦以剛柔象之彼所有之象聖人莫不觀而象之於此此作易之道也六爻之動動則變所以象三極變化之道也既象進退又象三極者進退特人事耳由卦全體而言天地人之道皆具豈獨人事而已哉曰明吉凶則悔吝可知然剛柔變化自為易之二道相因而生故各有象獨辭無象故不言也剛之極則柔晝之極則夜所以剛柔象晝夜也易說是故君子所居而安者易之序也所樂而玩者爻之辭也是故君子居則觀其象而玩其辭動則觀其變而玩其占是以自天祐之吉無不利伊川先生曰六爻之動以位為義乃其序也得其序則安矣辭所以明義玩其辭義則知其可樂也觀象玩辭而能通意觀變玩占而能順其時動不違於天矣經說得於辭不達其意者有矣未有不得於辭而能通其意者也易傳序橫渠先生曰序猶言分也易之中有貴有賤有吉有凶皆其自然之分也所居皆安之君子安分也所樂而玩者爻之辭言君子未嘗須臾學不在易玩玩習也每讀則每有益所以可樂占非卜筮之謂但事在外可以占驗也觀乎事變斯可以占矣蓋居則觀其象而玩其辭此所以動則觀其變而玩其占也並易說白雲郭氏曰上言聖人謂作易之聖人也此言君子謂玩易之君子也有聖人作易如彼故君子玩之如此非獨明作易之道亦所以垂玩易之法又以見非聖人不能作易而君子之成德玩易之所致也然玩易有二道一則所居而安者易之序所樂而玩者爻之辭是也一則居則觀其象而玩其辭動則觀其變而玩其占是也易之序者卦之序也序有時在其中故君子居其時而安之者得其序也如居否之時則儉德辟難居既濟之時則思患豫防之是以安也爻之辭所以明道也道非樂玩其辭則不可得而見故因介于石而有得於知幾之神因鳴鶴在隂而有得於樞機之慎舉爻辭尚樂而玩則卦辭為可知矣此其一也其二則聖人又明居處動作之有異不可以一塗盡其道方居之時無所營為故觀易之象以明時玩易之辭以探道及動之後悔吝攸生故觀其變以知善惡玩其占以明吉凶是以君子常吉而天祐之者蓋於所居所樂一動一靜之際莫非以易道自處非天私君子而祐之實自致也占不獨蓍龜也凡極數知來皆占也謂占於易之道也前章終於天下之理得而成位乎其中謂在上尊位之聖人也不曰聖人而曰賢人謂能法乾坤易簡非獨聖人可得天下之理賢者亦可修而得也此章終於君子玩易蓋兼上下窮通之君子其玩易皆一也稱君子兼聖賢言之易說彖者言乎象者也爻者言乎變者也吉凶者言乎其失得也悔吝者言乎其小疵也無咎者善補過也伊川先生曰彖言卦之象爻隨時之變因失得而有吉凶能如是則得無咎謂補過也經說橫渠先生曰象謂一卦之質易說白雲郭氏曰前章言卦之象備矣此章又明其辭也彖之辭所以言一卦之象也象非為天為地而已八卦之義變動不居皆其象也爻之辭所以言一卦之變也卦由爻以變爻之辭又明其變之所以也吉凶言其失得之大悔吝言其所失之小無咎稱其善補過此五者皆易辭之道也君子樂玩在此而已易說是故列貴賤者存乎位齊小大者存乎卦辨吉凶者存乎辭憂悔吝者存乎介震無咎者存乎悔伊川先生曰位有貴賤之分卦兼小大之義吉凶之道於辭可見以悔吝為防則存意於微小震懼而得無咎者以能悔也經說橫渠先生曰齊小大者存乎卦卦有稱名至小而與諸卦均齊者各著其義也蓋稱名小而取類大也辨吉凶者存乎辭欲見小疵者必存乎辭憂悔吝者存乎介欲觀易象之小疵冝存志靜知一作志所動之幾微也悔吝吉凶之萌惟介于石者能見幾而作震無咎者存乎悔凡言無咎者必求其始皆有悔今能改之也有咎而免者善震而補也並易說白雲郭氏曰上而貴下而賤係乎六爻故曰存乎位乾坤之大井鼎之小皆卦也故言齊小大繫辭焉而明吉凶是存乎辭也憂悔吝者方悔吝未至之時先明於幾微則無疵故存乎介亦由思患而豫防之也知畏過咎常自震悔則可補過故存乎悔亦由恐懼修省者也人有貴賤而位列之人小大不齊而卦齊之介雖所以憂悔吝而悔又以震無咎也能知辭之所言如彼又知理之所存如此樂而玩之是其所以為君子也易說是故卦有小大辭有險易辭也者各指其所之伊川先生曰卦有小大於時之中有小大也有小大則辭之險易殊矣辭各隨其事也經說橫渠先生曰辭各指其所之聖人之情也指之所趨時盡利順性命之理臻三極之道也能從之則不陷於凶悔矣正蒙白雲郭氏曰觀卦之象而卦有小大之異君子所居不可同玩卦之辭而辭有險易之辨君子所樂不能一各指其所之者之於常則其辭易之於變則其辭險是非辭無以示其所之也易說易與天地凖故能彌綸天地之道伊川先生曰聖人作易以凖則天地之道易之義天地之道也故能彌綸天地之道彌遍也綸理也在事為倫治絲為綸彌綸遍理也經說橫渠先生曰易與天地凖此言易之書也易行乎其中造化之謂也言彌綸範圍此語必夫子所造彌者彌縫補綴之義綸者往來經營之義易之為書與天地凖易即天道獨入于爻位繫之以辭者此則歸於人事蓋卦夲天道三隂三陽一升一降而變成八卦錯綜為六十四分而有三百八十四爻也因爻有吉凶動靜故繫之以辭存乎教誡使人動則觀其變而玩其占其出入以度內外使知懼又明於憂患與故無有師保如臨父母聖人與人撰出一法律之書使人知所向避易之義也易說廣平游氏曰彌之使不虧其體則覆燾者統元氣持載者統元形陽敷而能生隂肅而能成夫是之謂彌綸之使無失其叙則日月代眀寒暑迭運將來者進成功者退夫是之謂綸易說白雲郭氏曰自此别為一章至鬼神之情狀且天地至大也人居其中則備三才易之為書三才之道也是以一卦之中皆備三才之象故與天地凖凖則其道彌綸周滿天地而無有餘不足之差故天地人鬼無或不知者以不能外乎此故也言天地則人在其中矣易說仰以觀於天文俯以察於地理是故知幽明之故伊川先生曰仰觀天文俯察地理驗之著見之跡故能知幽明之故在理為幽成象為明知幽明之故知理與物之所以然也經說橫渠先生曰天文地理皆因明而知之非明則皆幽也此所以知幽明之故萬物相見乎離非離不相見也見者由明而不見非無物也乃是天之至處彼異學則皆歸之空虛蓋徒知乎明而已不察夫幽所見一邊耳氣聚則離明得施而有形氣不聚則離明不得施而無形方其聚也安得不謂之有方其散也安得遽謂之無故聖人仰觀俯察但云知幽明之故不云知有無之故盈天地之間者法象而已文理之察非離不相覩也方其形也有以知幽之故方其不形也有以知明之故並易說白雲郭氏曰由易之道仰觀俯察則天地幽明之故無不知幽則天地之道其隱者也明則天地之道其顯者也易說原始反終故知死生之說伊川先生曰原究其始要考其終則可以見死生之理經說原始則足以知其終反終則足以知其始死生之說如是而已矣故以春為始而原之其必有冬以冬為終而反之其必有春死生者其與是類也暢潜道録原始要終知得死生之說人能原始知得生理便能要終知得死理若不明得便雖千萬般安排著亦不濟事劉元承手編原始反終故知死生之說但窮得則自知死生之說不須將死生便做一箇道理求入關語録夫子曰未知生焉知死知生則知死矣能原始則能要終矣答謝若雨疑難橫渠先生曰海水凝則氷浮則漚然氷之才漚之性其存其亡海不得而與焉推是足以䆒死生之說易謂原始要終故知死生之說者謂原始而知生則求其終而知死必矣此夫子所以直季路之問而不隱也並正蒙白雲郭氏曰在人則原形氣之始反形氣之終其死生之說尤為易知故謂幽明之故者以事理言至死生則可說者也易說精氣為物遊魂為變是故知鬼神之情狀伊川先生曰聚為精氣散為遊魂聚則為物散則為變觀聚散則見鬼神之情狀萬物始終聚散而已鬼神造化之功也經說問世言鬼神之事雖知其無然不能無疑懼何也曰此只是自疑爾曰如何可以曉悟其理曰理會得精氣為物遊魂為變與原始要終之說便能知也須是於原字上用工夫或曰遊魂為變是變化之變否曰既是變則存者亡堅者腐更無物也鬼神之道只恁說與賢雖㑹得亦信不過須是自得也劉元承手編問易言知鬼神情狀果有情狀否曰有之又問既有情狀必有鬼神矣曰易說鬼神便是造化也唐棣雜録橫渠先生曰動物夲諸天以呼吸為聚散之漸植物夲諸地以隂陽升降為聚散之漸物之初生氣日至而滋息物生既盈氣日反而遊散至之謂神以其申也反之為鬼以其歸也易說隂陽之氣散則萬殊人莫知其一也合則混然人不見其殊也形聚為物形潰反原反原者其遊魂為變與所謂變者對聚散存亡為文非如螢雀之化指前後身而為說也正蒙龜山楊氏曰先王報夲反始之義與夫觀盥不薦渙萃假有廟之象則聖人所以自盡其心者於是為至非深知鬼神之情狀其孰能知之中庸解白雲郭氏曰萬物出於天地者也人與萬物皆一也由天地至精之氣鍾而為物物散而變則復於天地是鬼神之情狀雖極幽隱不過於人物聚散而已蓋可得而知也故文王之易於卦具天地而爻具人位是人由天地精氣而生雖有參天地之道而無同天地之體也卦已用事而終窮窮而變亦猶鬼神也故人鬼之象與卦一也上言幽明之故天地也死生之說人也精氣遊魂鬼神也辨天地人鬼之理冝其同章先儒别鬼神於下章未詳其旨易說易稱精氣為物逰魂為變是故知鬼神之情狀夫鬼神之情狀不可得而知也聖人自無入有以觀之則所以為物者如此所以為變者亦如此也是鬼神之情狀可得而知也中庸解與天地相似故不違伊川先生曰以幽明之故死生之理鬼神之情狀觀之則可以見天地之道易之義與天地之道相似故無差違相似謂同也經說橫渠先生曰如天地無私則於道不離然遺物而獨化又過乎大中之表也故下文曰範圍天地之化而不過曲成萬物而不遺通乎晝夜之道而知易說白雲郭氏曰自此别為一章論聖人之道至無方無體而終且聖人與天地合其德故與天地相似天且弗違而况於人乎是以天地無違於聖人聖人亦無違於天地也或謂易與天地相似易非特相似而已相似者謂人道也易說知周乎萬物而道濟天下故不過伊川先生曰義之所包知也其義周盡萬物之理其道足以濟天下故無過差經說今語道則須待要寂滅湛靜形使如槁木心使為死灰豈有直做墻壁木石而謂之道所貴乎智周天地萬物而不遺又幾時要如死灰所貴乎動吕與叔東見録橫渠先生曰未能周萬物則必有過過失也君子立法必其智周天下之利害而其道又足以濟天下然後不過過失也知周萬物道濟天下然後不錯若不如此或得於彼則或失於此也天惟運動一氣鼓萬物而生無心以恤物聖人則有憂患不得似天天地設位聖人成能聖人主天地之物又智周乎萬物而道濟天下必也為之經營不可以有愛付之無憂易說儒者則因明致誠因誠致明故天人合一致學而可以成聖得天而未始遺人易所謂不遺不流不過者也正蒙以有限之心止可求有限之事欲以致博大之事則當以博大求之知周乎萬物而道濟天下也經學理窟白雲郭氏曰聖人以周物為知以濟天下為道未嘗私一身而周濟之也故能與天地相似其道雖大而不為過者以此上言與天地相似猶中庸所謂參天地也此言智周乎萬物而道濟天下猶中庸所謂非自成己而已也所以成物也易說旁行而不流伊川先生曰旁通逺及而不流失正理經說橫渠先生曰旁行而不流圎成不倚也易說白雲郭氏曰聖人應天下之變一以易道而已故雖委曲旁通而未嘗逐物流移適則用之過則棄之而已所以和而不流也蓋亦曲能有誠之義易說樂天知命故不憂明道先生曰樂天知命通上下而言之也聖人樂天則不須言知命知命者知有命而信之者爾不知命無以為君子是矣命者所以輔義一循於義則何庸斷之以命哉若夫聖人之知天命則異於此吕與叔東見録仁者不憂樂天者也劉絢師訓仁者在己何憂之有凡不在已逐物在外皆憂也樂天知命故不憂此之謂也若顔子簞瓢在它人則憂而顔子獨樂者仁而已朱公掞問學拾遺伊川先生曰順乎理樂天也安其分知命也順理安分故無所憂經說橫渠先生曰聖人樂天故合內外而誠其仁正蒙白雲郭氏曰聖人不能無憂而此言不憂者蓋聖人之憂在道而其所不憂者在身樂天則無僞知命則無欲憂者僞欲之所生無僞無欲無適而非天則憂無自而至也此言天者孟子所謂知性則知天之天也此言命者孟子所謂有命焉之命也中庸言天命之謂性亦是道也故此言樂天知命說卦言窮理盡性至於命及中庸孟子之言其道皆一致中說竊聖人之言曰樂天知命吾何憂窮理盡性吾何疑其言似也其道非也且言樂天知命吾何憂雖未大失然其意以窮通為命矣至言窮理盡性其失逺矣夫窮理盡性聖人之事非特去疑而已其與樂天知命相為終始未易以憂疑為辨也語曰知者不惑不惑則無疑矣况窮理盡性聖之事乎聖人之無疑久矣至於盡己之性盡人之性盡物之性又豈無疑而已哉文中子不明此務為心迹之說反覆其言不過於一身憂疑而止耳蓋不知知周乎萬物而道濟天下以窮盡性之說者也故區區於心迹之間終不能遺一身而觀之是之謂不知道易說安土敦乎仁故能愛伊川先生曰安土安所止也敦乎仁存乎同也是以能愛經說橫渠先生曰安土樂其所自生忠厚之道也易說安所遇而敦仁故其愛有常心有常心則物被常愛也樂天安土所居而安不纍於物也並正蒙白雲郭氏曰安土常人之情聖人之治因之而已固不能從己之欲也能因其所安而安之而後可以敦乎仁敦乎仁則愛道廣矣所謂仁者愛人也愛者好生之德也易說範圍天地之化而不過曲成萬物而不遺通乎晝夜之道而知故神無方而易無體明道先生曰範圍天地之化而不過者模範出一天地爾非在外也如此曲成萬物豈有遺哉冬寒夏暑隂陽也所以運動變化者神也神無方故易無體若如或者别立一天謂人不可以包天則有方矣是二夲也並劉絢師訓伊川先生曰範圍俗語謂之模量模量天地之運化而不過差委曲成就萬物之理而無遺失通晝夜闔闢屈伸之道而知其所以然如此則得天地之妙用知道德之夲源所以見至神之妙無有方所而易之凖道無有形體經說範圍天地之化天夲廓然無窮但人以目力所及見其寒暑之序日月之行立此規模以窺測它天地之化不是天地之化其體有如城郭之類都盛其氣假使言日升降於三萬里不可道三萬里外更無物又如言天地升降於八萬里中不可道八萬里外天地盡學者要默體天地之化如此言之甚與天地不相似其卒必有窒礙入關語録通乎晝夜之道而知晝夜死生之道也暢潜道録橫渠先生曰過則溺於空淪於靜既不能存其神又不能知夫化矣大抵過則不是著有則是著無聖人自不言有無諸子乃以有無為說說有無斯言之陋也在易則惟曰神神則可以兼統通乎晝夜之道而知不偏滯於晝夜之道故曰通知神無方而易無體繫辭言易大槩是語易書制作之意其言易無體之類則是天易也神易雖是一事方與體雖是一義以其不測故言無方以其生生故言無體然則易近於化並易說母意必固我然後範圍天地之化大人者有容物無去物有愛物無徇物天之道然天以直養萬物代天而理物者曲成而不害其直斯盡道矣義入神動一靜也仁敦化靜一動也仁敦化則無體義入神則無方日月相推而明生寒暑相推而嵗成神易無方體一隂一陽隂陽不測皆所謂通乎晝夜之道也不知來物不足以利用不通晝夜未足以樂天體不偏滯乃可謂無方無體偏滯於晝夜隂陽者物也若道則兼體而無纍也以其兼體故曰一隂一陽又曰隂陽不測又曰一闔一闢又曰通乎晝夜語其推行故曰道語其不測故曰神語其生生故曰易其實一物指事異名爾大率知晝夜隂陽則能一性命能知性命則能知聖人知鬼神彼欲直語太虛不以晝夜隂陽纍其心則是未始見易未始見易則雖欲免隂陽晝夜之纍末由也已易且不見又烏能更語真際捨真際而談鬼神妄也晝夜者天之一息乎寒暑者天之晝夜乎天道春秋分而氣易猶人一寤寐而魂交魂交成夢百感紛紜對寤而言一身之晝夜也氣交為春萬物糅錯對秋而言天之晝夜也神無方易無體大且一而已爾並正蒙廣平游氏曰範之使有常則日月無薄食陵谷無遷易四時常若風雨常均若此者範之者也圍之使無踰則春無凄風秋無苦雨冬無愆陽夏無伏隂若此者圍之者也或曰伊川序易曰隨時變易以從道然則易與道為二乎曰神無方而易無體易者道之用也既已涉於用矣且得無從乎惟其變易而不離於道斯可名於無體矣若春作夏長秋斂冬藏皆神之所為也神之所為異於人為者以其從道而已此四時之所以不忒也老子曰道法自然亦即人所見以明道也先生之意正欲使學易者知變易之必從道則用不詭於易矣並易說龜山楊氏曰通乎晝夜之道而知則人鬼死生當源源自見初無二致也故問事鬼告以事人問死告以知生所以發子路之問而不隱也蓋聖人之言常近矣探索之則賾隱存焉語解中以形道之體和以顯道之用致中則範圍而不過致和則曲成而不遺中庸解白雲郭氏曰聖人以一人之身固不能範圍天地之化然所謂範圍者為之有制而已天地之化有時而過者在彼聖人範圍之制無傷財害民之失則所過在彼而制其過者在聖人是猶泰所謂財成天地之道也曲成萬物而不遺者盡人之性盡物之性生成而無夭傷無所遺焉所謂輔相天地之宜也易言晝夜之道最為難明夫幽明隱顯也晝夜之道非幽明之故也昏極則生晝明極則生夜猶隂之生陽柔之變剛動極而靜皆有道以運之而變於是乎生變者有象運者無形由有象則可以知無形由晝夜隂陽剛柔動靜則可以知道故曰通乎晝夜之道而知通乎晝夜則隂陽剛柔其類舉可知也以人事言之則盛襄治亂進退存亡得喪孰非晝夜之道乎故有範圍之道以參天地有曲成之道以育萬物通乎晝夜之道則寂然不動感而遂通天下之故矣非聖人極天下之至神其孰能與於此先儒或以範圍為犯違誤矣經言神易道聖人凡有四者之異且神無自神其在道則道之神也在易則易之神也在聖人則聖人之神也神寓於道易聖人而道易聖人各有其名不謂之神此神所以無方也易之有體者書也書之為體者卦象也書以卦象為體卦象未立而是道具有及其既立則曰卦也曰象也不得復謂之易如此則易為無體矣然聖人範圍曲成通乎晝夜豈無自而能然哉蓋用易無體之道以盡無方之神而後能之也如是則神也易也託聖人以為方體耳故以是終之並易說大易粹言卷六十五
