body:
  text: 大易粹言卷七十三宋方聞一編雜卦乾剛坤柔橫渠先生曰不曰天地而乾坤云者言其用也乾坤亦何形猶言神也人鮮識天天竟不可方體姑指日月星辰處視以為天陰陽言其實乾坤言其用如言剛柔也乾坤則所包者廣易説白雲郭氏曰六子之剛柔索於乾坤六十四卦之剛柔重於八卦故卦中之剛柔皆乾之剛坤之柔也是以獨乾坤為剛柔易説比樂師憂白雲郭氏曰比以比輔從順為樂師以相須行險致憂是天下可久比而不可久師也故比有永貞而師無之易説臨觀之義或與或求白雲郭氏曰臨與所臨觀與所觀二卦皆有與求之義或有與無求有求無與皆非臨觀之道有舜在上必有戴舜者是為臨觀也易説屯見而不失其居蒙雜而著橫渠先生曰險在外故不失其居與渙解義反故曰緩必有所失蒙雜而著著古著字雜著於物所以為蒙蒙昏蒙也易説白雲郭氏曰屯旅皆近困旅困於已窮故失其居屯困於始生故不失其居而利於有為也蒙未有所知之時中無所執則雜而著見故發之屯之難見於象者也蒙之稚著於形者也易説震起也艮止也白雲郭氏曰陽動起於震初止於艮終蓋震為一索之始艮為三索之終也易説損益盛衰之始也白雲郭氏曰損己必盛故為盛之始益己必衰故為衰之始消長相循在道當如是也易説大畜時也白雲郭氏曰君子藏器於身待時而動然則多識前言往行以畜其德亦以待時也易傳無妄災也白雲郭氏曰無妄之謂災其餘自作孽而已故無妄匪正有眚易説萃聚而升不來也白雲郭氏曰不來不知反也故至於困來則知止無困矣易説謙輕而豫怠也白雲郭氏曰謙輕己豫怠已也以樂豫故心怠是以君子貴知幾易説噬嗑食也賁無色也白雲郭氏曰頥中有物則必斷故噬嗑利斷猶人之食也賁以白賁無咎故無色則質全有天下之至飾存焉易説兊見而巽伏也橫渠先生曰兊説在外巽入在隱易説白雲郭氏曰其道見則説其道伏故入易説隨無故也蠱則飾也白雲郭氏曰隨之道在此事在彼所隨有道不為事變故言無故蠱弊事特加整治因飾之而已言非大有作也易説剝爛也復反也白雲郭氏曰小人之道必害於物君子必反於道易説晉晝也明夷誅也白雲郭氏曰晉與明夷朝暮之象也故言明出地上明入地中誅亦傷也易説井通而困相遇也橫渠先生曰澤無水理勢適然故曰相遇易説白雲郭氏曰往來井井則其道通困遇剛掩所以為困遇者柔遇剛之遇也遇其困我者也易説咸速也恆久也白雲郭氏曰感為天下至速之道所謂不疾而速者也易説渙離也節止也白雲郭氏曰散則離矣有節故可止易説解緩也蹇難也睽外也家人內也白雲郭氏曰睽本於外疑家人本於內治故治家者必先其身治天下者必先其家易説否泰反其類也白雲郭氏曰否泰反類而相馴致之道故休否之道復反其類類謂陰陽之類如君子小人是也否反其類得君子則傾也泰反其類得小人則亂也在人道言之則曰君子小人治亂而已合三才言之故云類也易説大壯則止遁則退也白雲郭氏曰壯不知止小人之壯也君子之壯則有止遁之退大壯之止皆克己之道易説大有衆也同人親也白雲郭氏曰其有非一故衆衆則大能同乎人則天下親之易知則有親同人之親其得乾之易乎易説革去故也鼎取新也白雲郭氏曰革鼎之義相為終始是以去故取新共成一道易説小過過也中孚信也豐多故也親寡旅也橫渠先生曰過而未顚也易説白雲郭氏曰因豐則多事無親而後為旅旅則我之親寡也非天下皆寡親也易説離上而坎下也白雲郭氏曰上下猶水火之性也易説小畜寡也履不處也橫渠先生曰危者安其位者也故履以不處為吉易説白雲郭氏曰寡則不能大其施履以行為義非處之道易説需不進也訟不親也白雲郭氏曰需有待則不能自進訟違行相親之道絶矣易説大過顚也橫渠先生曰過至於顚故曰大易説白雲郭氏曰中之四剛大難之象也有大難而本末弱故顚易説姤遇也柔遇剛也白雲郭氏曰柔之遇剛曰姤剛之來復不可謂之遇也易説漸女歸待男行也白雲郭氏曰待男而行其行漸也是以吉易説頥養正白雲郭氏曰養其正所以去其非正謂之頥易説既濟定也白雲郭氏曰濟則難定易説歸妹女之終也橫渠先生曰妹歸而長女之終也一作歸妹易説白雲郭氏曰女以歸為有終易説未濟男之窮也白雲郭氏曰剛柔失位男道弱而窮矣柔失位則以賤居尊剛失位則以貴居賤是以窮也易説夬決也剛決柔也君子道長小人道憂也白雲郭氏曰姤遇夬決始終之道異也聖人貴於行道每致意於君子小人之際故以是終之雜卦前皆二二相耦至大過之後獨各言一卦觀歸妹未濟之辭又非簡錯聖人之旨莫可詳也易説大易粹言卷七十三
