body:
  text: 大易粹言卷十九宋方聞一編兊下坤上伊川先生曰臨序卦有事而後可大故受之以臨臨者大也蠱者事也有事則可大矣故受之以臨也韓康伯云可大之業由事而生二陽方長而盛大故為臨也為卦澤上有地澤上之地岸也與水相際臨近乎水故為臨天下之物密近一作通相臨者莫若地與水故地上有水則為比澤上有地則為臨也臨者臨民臨事凡所臨皆是在卦取自上臨下臨民為義易傳臨元亨利貞至于八月有凶伊川先生曰以卦才言也臨之道如卦之才則大亨而正也二陽方長於下陽道嚮盛之時聖人豫為之戒曰陽雖方盛至於八月則其道消矣是有凶也大率聖人為戒必於方盛之時方盛而慮衰則可以防其滿極而圖其永久若既衰而後戒亦無及矣自古天下安治未有久而不亂者蓋不能戒於盛也方其盛而不知戒故狃安富則驕侈生樂舒肆則綱紀壞忘禍亂則釁孽萌是以浸淫不知亂之至也並易傳臨言八月有凶謂至八月是遁也當其剛浸長之時便戒以隂長之意周行已録橫渠先生曰臨言有凶者大抵易之於爻變陽至二便為之戒恐有過滿之萌未過中已戒猶履霜堅冰之義及泰之三曰無平不陂無往不復皆過中之戒也易說白雲郭氏曰臨以大臨小上臨下為義序卦曰臨者大也蓋臨為大而所臨者小故也元亨利貞天地生物之大德澤下於地施生物之德故臨具四德也自一陽生而為復長而為臨凡八變而得遁遁臨之反也有臨之大亨是以知遁之有凶也有凶不必凶至蓋有凶之理也與隨有獲其義凶同意易於臨言月於復言日者日月皆一也論天道則稱日論人道則稱月從其類也堯典言日中日永稱日也仲春仲夏稱月也日之所次月之所周皆為一月故後世為月令者曰孟春之月日在營室雖别言之合而言之其義皆同易說彖曰臨剛浸而長說而順剛中而應大亨以正天之道也至于八月有凶消不久也伊川先生曰浸漸也二陽長於下而漸進也下兊上坤和說而順也剛得中道而有應助是以能大亨而得正合天之道剛正而和順天之道也化育之功所以不息者剛正和順而已以此臨人臨事臨天下莫不大亨而得正也兊為說說乃和也夬彖云決而和臨二陽生陽方漸盛之時故聖人為之戒云陽雖方長然至于八月則消而凶矣八月謂陽生之八月陽始生於復自復至遁凡八月自建子至建未也二隂長而陽消矣故云消不久也在隂陽之氣言之則消長如循環不可易也以人事言之則陽為君子隂為小人方君子道長之時聖人為之誡使知極則有凶之理而虞備之常不至於滿極則無凶也並易傳龜山楊氏曰復陽始生也五隂在上小人衆而君子獨非一人一日之力所能勝也故動而以順行朋來乃無咎臨二陽朋來也浸而長非暴為之也剛方長之時恃剛以臨之則勝復作而亂之所由生也故說而順剛中而應臨之所以大亨以正也夫說而順合二體言之也剛中而應以九二之才言之也而臨之大亨以正此蓋天之道非人所能為也至于八月有凶者自臨至遁凡八月也遁二隂也以二陽進而為泰則二隂進而為否可知矣故言八月有凶知其消不久也夫隂陽之往來相為屈伸蓋天地常然之理不能相無也故雖治世不能絶之使無小人君子能於幾微之際預為之防而已夫姤隂始生也而初爻曰繫于金柅蓋柅之使無行也至於二隂浸而長則必至於否矣尚如之何哉有遁而已矣故言八月有凶欲其預為之防也非夫知微知彰其孰能與於此自臨元亨至此易說白雲郭氏曰自一卦之象言之二陽之生為臨其生不已也故曰剛浸而長不言陽而言剛者以初九九二二爻言也自內外二卦之象言之則曰說而順自九二成卦之爻言之則曰剛中而應順者順天之道而說萬物也九二剛中之德足以有臨其有不大亨以正者乎且剛柔之義相反以相生故泰中有復否中有傾而臨之中有八月之凶也君子知幾之義欲其辨早而思其亡之戒也易說象曰澤上有地臨君子以教思無窮容保民無疆伊川先生曰澤之上有地澤岸也水之際也物之相臨與含容無若水之在地故澤上有地為臨也君子觀親臨之象則教思無窮親臨於民則有一無有字教導之意思也無窮至誠無斁也觀含容之象則有容保民之心無疆廣大無疆限也含容有廣大之意故為無窮無疆之義易傳龜山楊氏曰君子之臨人非以力制之也亦教之容保之而已此坤澤之象也教而稽其弊故無窮容保之無逺邇之異故無疆易說白雲郭氏曰天之澤謂之澤地之澤亦謂之澤皆以及物為功故澤為說也猶坎之水在上為雲在下為雨在地為水具三者之義斯為坎矣坎之為水夲周流轉注淵深莫測之已及其為澤皆兊之功也然其道亦相須焉此坎為險而兊為說之意也觀雲雷為屯雷雨作解澤地為萃地澤為臨則知臨之及物至矣是以有元亨利貞之德也君子法之以教思無窮充澤之利也保民無疆充地之容也不如是不能大不能大則不足以有臨也易說初九咸臨貞吉象曰咸臨貞吉志行正也伊川先生曰咸感也陽長之時感動於隂四應於初感之者也比它卦相應尤重四近君之位初得正位與四感應是以正道為當位所信任得行其志獲乎上而得行其正道是以吉也它卦初上爻不言得位失位蓋初終之義為重也臨則以初得位居正為重凡言貞吉有既正且吉者有得正則吉者有貞固守之則吉者各隨其事一作時也所謂貞吉者九之志在於行正也以九居陽爻應四之正其志正也並易傳橫渠先生曰臨為剛長己志應上故雖感而行正也易說龜山楊氏曰二陽浸而長其勢足以有臨矣而上下感應以相與咸臨也初與四皆居得其正故正吉夫剛方長蓋以大臨小之時也然以位則子君也我臣也初在下屈己以應上亦志行正而已易說白雲郭氏曰先人曰臨觀之義或與或求故初九九二六四六五皆有焉雍曰咸感也感之而應也初九以此道正而吉無它求焉可謂行正之君子也諸卦皆感而應也獨臨觀具與求之義者蓋臨者求也臨之者與也童窺求也大觀與也易說九二咸臨吉無不利象曰咸臨吉無不利未順命也伊川先生曰二方陽長而漸盛感一作咸動於六五中順之君其交之親故見信任得行其志所臨吉而無不利也吉者已然如是故吉也無不利者將然於所施為無所不利也未者非遽之辭孟子或問勸齊伐燕有諸曰未也又云仲子所食之粟伯夷之所樹歟抑亦盜跖之所樹歟是未可知也史記侯嬴曰人固未易知古人用字之意皆如此今人大率用對己字故意似異然實不殊也九二與五感應以臨下蓋以剛德之長而又得中至誠相感非由順上之命也是以吉而無不利五順體而二說體又隂陽相應故象特明其非由說順也並易傳橫渠先生曰非咸則有上下之疑有所不利易說廣平游氏曰君唱而臣和禮之正也若臨之九二以剛中之才任六五之眷倚則有從道不從君之事矣故象以為未順命至於為上為德而君臣一道則上之所唱豈終不和耶故以未順言之咸臨吉無不利者二與五以同德相與至誠以相感而無私意也其順之實固己見於未命之前矣故曰未順命也猶言未占有孚也並易說龜山楊氏曰九二剛浸長而上應六五中順之君所謂說而順剛中而應也故吉無不利然九二以剛中之德而位乎下位雖君臣以德則子事我者也故欲有謀焉則就之召之則不往未順命也未者非遽然之辭學然後臣之終則順命矣易說兼山郭氏曰九二雜卦曰臨觀之義或與或求故初九九二六四六五皆有焉故曰咸臨也方剛浸而長大亨以正天之命也何事於感而行未順命者言君命也易說白雲郭氏曰剛中有應為一卦之主方剛長之時權獨在己而能感中順之君以求應焉斯吉無不利矣未順命者有獻可替否之義非獨順命而後利也蓋君之所言而然所行而善則世俗謂之不肖臣故舜之戒禹曰豫違汝弼汝無面從退有後言六五中順之君在上故九二未以順命為吉也易說六三甘臨無攸利既憂之無咎象曰甘臨位不當也既憂之咎不長也伊川先生曰三居下之上臨人者也隂柔而說體又處不中正以甘說臨人者也在上而一無而字以甘說臨下失德之甚無所利也兊性既說乂乘二陽之上陽方長而上進故不安而益甘既知危懼而憂之若能持謙守正至誠以自處則無咎也邪說由己能憂而改之復何咎乎隂柔之人處不中正而居下之上復乘二陽是處不當位也既能知懼而憂之則必强勉自改故其過咎不長也並易傳橫渠先生曰體說乘剛故甘邪說求容而以臨物安有所利能自憂懼庶可免咎易說龜山楊氏曰柔不中正居說之極甘臨也以姑息臨下而不以德無往而利矣易說白雲郭氏曰以柔而居不中不正之位是以不正之道甘而說人者也安足以有臨乎無攸利者也剛長泰來又豈容小人以邪說誣民而充塞仁義也哉能知時之變懼而憂之可以補過矣易說六四至臨無咎象曰至臨無咎位當也伊川先生曰四居上之下與下體相比是切臨於下臨之至也臨道尚近故以比為至四居正位而下應於剛陽之初處近君之位守正而任賢以親臨於下是以無咎所處當也居近君之位為得其任以隂處四為得其正與初相應為下賢所以無咎蓋由位之當也並易傳橫渠先生曰以隂居隂體順應正一作說盡臨之道雖在剛長可以無咎易說廣平游氏曰臨之六四為至臨者應下而順上守之以正以臨其民則民敬而從之是其為臨也可名於至矣然多懼之地而才不足以有為非若六五知臨之大也故稱無咎而不言吉適當其位而已易說龜山楊氏曰四初皆當位誠意以相與至臨也故無咎易說白雲郭氏曰六之居四柔之至也初以至剛而感四以至柔臨之以至柔臨至剛無乖爭之變是為至臨然位則當然也知當然而然則不失剛長之道故無咎易說六五知臨大君之冝吉象曰大君之冝行中之謂也伊川先生曰五以柔中順體居尊位而下應於二剛中之臣是能倚任於二不勞而治以知臨下者也夫以一人之身臨乎天下之廣若區區自任豈能周於萬事故自任其知者適足為不知唯能取天下之善任天下之聰明則無所不周是不自任其知則其知大矣五順應於九二剛中之賢任之以臨下乃已以明知臨天下大君之所冝也其吉可知君臣道合蓋以氣類相求五有中德故能倚任剛中之賢得人君之冝成知臨之功蓋由行其中德也人君之於賢才非道同德合豈能用也並易傳橫渠先生曰順命行中天子之宜易說龜山楊氏曰中庸曰聰明睿知足以有臨也人君之聰明憲天而已非以小智自私也故明四目達四聰好問而好察邇言樂取諸人以為善此舜所以為大知也歟人君之知孰過於是易說兼山郭氏曰六五臨人之道知柔以臨之無剛以制之不可也知剛以制之無柔以接之不可也君子知柔知剛知微知彰萬夫之望惟六五能盡之矣故寬而有制從容以和知柔知剛者也方剛長之世而接之以柔知天道之行戒之以早知微知彰者也故萬夫之望冝以君臨者也詩云不剛不柔敷政優優其是之謂乎易說白雲郭氏曰聰明睿知足以有臨聖之事也大君之冝也何往而不吉也舜之大智是也舜執其兩端用其中於民其行中之謂乎非行中蓋不足以為大君之冝矣中庸率性之謂道修道之謂教洪範皇建其有極用敷錫厥庶民皆行中也易說上六敦臨吉無咎象曰敦臨之吉志任內也伊川先生曰上六坤之極順之至也居臨之終敦厚於臨也與初二雖非正應然大率隂求於陽又其至順故志在從乎二陽尊而應卑髙而從下尊賢取善敦厚之至也故曰敦臨所以吉而無咎隂柔在上非能臨者冝有咎也以其敦厚於順剛是以吉而無咎六居臨之終而不取極義臨無過極故止為厚義上無位之地止以在上言志任內應乎初與二也志順剛陽而敦篤其吉可知並易傳橫渠先生曰體順則無所違極上則無所進不以無應而志在於臨故曰敦臨志在內也易說龜山楊氏曰上六以隂柔居上卦之上而無應於內處順之極不以勢臨下而志在於從剛厚之至也故曰敦臨吉然柔不當位冝有咎也以其吉故無咎易說兼山郭氏曰上六敦臨之道其盡臨之所以為臨者乎易說臼雲郭氏曰有感而應理之常也無感而志在內者蓋二陽方進為君子道長之時不以尊髙自居而有下賢之志是厚於君子而薄於小人德之盛者也其有敦臨之吉冝矣以一身言之則可獲吉以臨之道論之是無咎也易說大易粹言卷十九
