body:
  text: 大易粹言卷五十九宋方聞一編坎下巽上伊川先生曰渙序卦兊者説也説而後散之故受之以渙説則舒散也人之氣憂則結聚説則舒散故説有散義渙所以繼兊也為卦巽上坎下風行於水上水遇風則渙散所以為渙也易傳渙亨王假有廟利涉大川利貞明道先生曰萃渙皆亨於帝立廟因其精神之聚而形於此為其渙散故立此以收之謝顯道録伊川先生曰渙離也人之離散由乎中人心離則散矣治乎散亦本於一作必由中能一有利貞字收合人心則散者可聚也故卦之義皆主於中利貞合渙散之道在乎正固也易傳橫渠先生曰萃王假有廟渙然後聚道乃久故王假有廟互見於此凡言有廟者聚道之極也易説龜山楊氏曰或問禘之説孔子曰不知也則其説蓋有言論之所不能及也非求之度數之末所能知也惟先王報本反始之義與夫觀盥不薦渙萃假有廟之象則聖人所以自盡其心者於是為至非深知鬼神之情狀其孰能知之知此則於治國乎何有中庸解白雲郭氏曰渙者離散之義天下離散為渙而散天下之難亦為渙居渙得散而亨散天下之難亦亨也王道至而有廟則難散矣萃與渙其義相類難渙則萃萃則渙難故當萃聚難渙之時宜莫先於有廟以致孝享也利涉大川木行水上之才也利貞者渙難以是為德之先也經曰孝莫大於嚴父嚴父莫大於配天王者有廟孝享必至於嚴父配天而後其道盡故象又言享于帝立廟所以終王假有廟之義也易説彖曰渙亨剛來而不窮柔得位乎外而上同王假有廟王乃在中也利涉大川乘木有功也伊川先生曰渙之能亨者以卦才如是也渙之成渙由九來居二六上居四也剛陽之來則不窮極於下而處得其中柔之往則得正位於外而上同於五之中巽順於五乃上同也四五君臣之位當渙而比其義相通同五乃從中也當渙之時而守其中則不至於離散故能亨也王假有廟之義在萃卦詳矣天下離散之時王者收合人心至於有廟乃是在其中也在中謂求得其中攝其心之謂也中者心之象剛來而不窮柔得位而上同卦才之義皆主於中也王者拯渙之道在得其中而已孟子曰得其民有道得其心斯得民矣享帝立廟民心所歸從也歸人心之道無大於此故云至於有廟拯渙之道極於此也治渙之道莫濟於險難而卦有乘木濟川之象上巽木也下坎水大川也利涉險以濟川也木在水上乘木之象乘木所以涉川也涉則有濟渙之功卦有是義有是象也並易傳橫渠先生曰財散則民聚王乃在渙中之一也易説白雲郭氏曰渙之成卦自否來故剛自四來而為二柔自二升為四剛來得中而不窮柔自內升位乎外而上同此成卦之義也王乃在中者以王居於渙難之中故難散而後假有廟也大川難也乘木濟難之方也濟難有功則難散矣此渙之所以亨也易説象曰風行水上渙先王以享于帝立廟伊川先生曰風行水上有渙散之象先王觀是象救天下之渙散至于享帝立廟也收合人心無如宗廟祭祀之報出於其心故享帝立廟人心之所歸也係人心合離散之道無大於此易傳白雲郭氏曰水難也風行水上則無不散矣此渙難之象也享于帝立廟者天地祖考王祭之大也難渙之時莫急於此也能此則治天下可運諸掌不能此則亂將復矣是以先王不敢後也易説初六用拯馬壯吉象曰初六之吉順也伊川先生曰六居卦之初渙之始也始渙而拯之又得馬壯所以吉也六爻獨初不云渙者離散之勢辨之宜早方始而拯之則不至於渙也為教深矣馬人之所託也託於壯馬故能拯渙馬謂二也二有剛中之才初隂柔順兩皆無應無應則親比相求初之柔順而託於剛中之才以拯其渙如得壯馬以致逺必有濟矣故吉也渙拯於始為力則易時之順也初之所以吉者以其能順剛中之才也始渙而用拯能順乎時也並易傳橫渠先生曰處險之下故必用拯無應於上順比九二之剛拯而馬壯其吉宜也易説白雲郭氏曰初六難之始也方難之始而能竭其至健之才以拯之則難無不濟矣是其所以吉也天下之事辨之於早則順而易舉故象曰初六之吉順也卦以初二四五皆為渙難者初能比二四能比五故也三與上私於其應能免其身幸矣明夷用拯馬壯吉曰順以則也此言順也是知馬以健順為義故坤之彖有取於馬也易説九二渙奔其機悔亡象曰渙奔其機得願也伊川先生曰諸爻皆云渙謂渙之時也在渙離之時而處險中其有悔可知若能奔就所安則得悔亡也機者俯憑以為安者也俯就下也奔急往也二與初雖非正應而當渙離之時兩皆無與以隂陽親比相求則相賴者也故二目初為機初謂二為馬二急就於初以為安則能亡其悔矣初雖坎體而不在險中也或疑初之柔微何足賴蓋渙之時合力為一作而勝先儒皆以五為機非也方渙離之時二陽豈能同也若能同則成濟渙之功當大一有吉字豈止悔亡而已機謂俯就也渙散之時以合為安二居險中急就於初求安也賴之如機而亡其悔乃得所願也並易傳橫渠先生曰奮於險中進而之前則難解悔亡故曰奔其機三四皆險故曰得願若退纍於初則險不能出具悔終存易説白雲郭氏曰九二之剛自外來而得中得去危就安之義故有奔其機之象焉剛不得中則不可有為而其道窮道窮則其志失矣唯得中就安故彖所以言不窮而象言得願此悔之所以亡也言奔與悔亡皆去危之義易説六三渙其躬無悔象曰渙其躬志在外也伊川先生曰三在渙時獨有應與無渙散之悔也然以隂柔之質不中正之才上居無位之地豈能拯時之渙而及人也止於其身可以無悔而已上加渙字在渙之時躬無渙之悔也志應于上在外也與上相應故其身得免于渙而無悔悔亡者言本有而得亡無悔者本無也並易傳橫渠先生曰援上而進惟求自脫于險無悔而已非能及物者也易説白雲郭氏曰渙離之時六三知應于上而不知有所擇而比之以行渙難之志是其志之小者也故其為道止及其身而已終無濟時之義然不失正應終亦不為悔也志在外者志應上九也易説六四渙其羣元吉渙有丘匪夷所思象曰渙其羣元吉光大也伊川先生曰渙四五二爻義相須故通言之彖故曰上同也四巽順而正居大臣之位五剛中而正居君位君臣合力剛柔相濟以拯天下之渙者也方渙散之時用剛則不能使之懷附用柔則不足為之依歸四以巽順之正道輔剛中正之君君臣同功所以能濟渙也天下渙散而能一無能字使之羣聚可謂大善之吉也渙有丘匪夷所思贊美之辭也丘聚之大也方渙散而能致其大聚其功甚大其事甚難其用至妙夷平常也非平常之見所能思及也非大智賢孰能如是稱元吉者謂其功德光大也元吉光大不在五而在四者二爻之義通言也於四言其施用於五言其成功君臣之分也並易傳橫渠先生曰已處險外無私其事常以拯衆為心則其志光大獲吉若志在所歸之地近纍於五則非能平均其慮者也易説白雲郭氏曰六四之柔自下而升故有上同之義夫以柔道上行而輔君為臣之至美故君臣相濟能渙天下之難也羣者天下罹於難者也能渙天下之難則其道大矣非止於其躬而已故元吉難雖渙散猶若有丘焉勿謂難之小而弗戒也有丘則匪夷矣有丘匪夷之思其可一日忘乎此雖已濟難不敢忘難之意也是亦其亡苞桑之義昔禹平水土成湯伐夏救民皆渙其羣者也成王懲而毖後患所謂匪夷之思也元吉光大之義於夏商可見然易之象變屢見於彖至渙尤明見於二爻之辭不然則九二剛中自無奔機之象而六四至柔豈能具渙羣之吉乎唯究成卦之變則二爻之辭可得也易説九五渙汗其大號渙王居無咎象曰王居無咎正位也伊川先生曰五與四君臣合德以剛中正巽順之道治渙得其道矣唯在浹洽於人心則順從也當使號令洽一作浹於民心如人身之汗浹於四體則信服而從矣如是則可以濟天下之渙居王位為稱而無咎大號大政令也謂新民之大命救渙之大政再云渙者上謂渙之時下謂處渙如是則無咎也在四己言元吉五惟言稱其位也渙之四五通言者渙以離散為害拯之使合也非羣臣同助合力其能濟乎爻義相須時之宜也一作而已王居謂正位人君之正位也能如五之為則居尊位為稱而無咎也並易傳橫渠先生曰為渙之主使物遍被其澤正位凝命可以免咎不私于應故能均布其大號也渙然廓大以王道自居乃無咎易説白雲郭氏曰令出唯行弗唯反則號令之出猶其渙汗乎一出不反之義也是以王者重慎之四五君臣合德以渙天下之難其號大矣故渙之大號則王居之渙羣之功則六四主之王居渙號則正位以令天下得君道也故無咎六四主渙羣之功則宣力四方盡臣職也吉孰大焉故元吉此君臣之義不同也易説上九渙其血去逖出無咎象曰渙其血逺害也伊川先生曰渙之諸爻皆無係應亦渙離之象惟上應于三三居險陷之極上若下從于彼則不能出於渙也險有傷害畏懼之象故云血惕然九以陽剛處渙之外有出渙之象又居巽之極為能巽順於事理故云若能使其血去其惕出則無咎也其者所有也渙之時以能合為功獨九居渙之極有係而臨險以能出渙逺害為善也若如象文為渙其血乃與屯其膏同也義則不然蓋血字下脫去字血去惕出謂能逺害則無咎也並易傳橫渠先生曰乘剛在上若係於三害不可免能絶棄隂類逺去其害則可免咎易説白雲郭氏曰難不能散則傷之者至矣上九知見傷之憂故渙其血去逖出而後無咎也逖逺也違難必逺乃可免害此與渙其躬者無以異蓋止於一身之謀非天下之大計也夫同聲相應同氣相求二爻之應亦其志同耳然渙之六爻皆無凶悔者以皆知濟難及保身之道也苟不能有道以濟天下之難又不能明哲以自保其身是皆凶悔之徒與此蓋不必六爻有象而後知之故易之辭觀吉可以知凶由凶可以見吉斯得知微知彰之義矣易説大易粹言卷五十九
