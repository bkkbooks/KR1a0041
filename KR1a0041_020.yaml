body:
  text: 大易粹言卷二十宋方聞一編坤下巽上伊川先生曰觀序卦臨者大也物大然後可觀故受之以觀觀所以次臨也凡觀視於物則為觀平聲為觀於下則為觀去聲如樓觀謂之觀者為觀於下也人君上觀天道下觀民俗則為觀修德行政為民瞻仰則為觀風行地上遍觸萬類周觀之象也二陽任上四隂在下陽剛居尊為羣下所觀仰觀之義也在諸爻則唯取觀見隨時為義也易傳觀盥而不薦有孚顒若伊川先生曰豫聞之胡益之先生曰君子居上為天下之一無之字表儀必極其莊敬則下觀仰而化也故為天下之觀當如宗廟之祭始盥之時不可如既薦之後則下民盡其至誠顒然瞻仰之矣盥謂祭祀之始盥手酌鬱鬯於地求神之時也薦謂獻腥獻熟之時也盥者事之始人心方盡其精誠嚴肅之至也至既薦之後禮數繁縟則人心散而精一不若始盥之時矣居上者正其表儀以為下民之觀當一作常莊嚴一作敬如始盥之初勿使誠意少散如既薦之後則天下之人莫不盡其孚誠顒然瞻仰之矣顒仰望也易傳橫渠先生曰盥求神而薦褻也易説龜山楊氏曰禮莫重於祭祭莫重於灌蓋求鬼神於幽隂之時未致其文於此而能致誠以格鬼神則自灌而往其威儀度數足觀矣若不既其實而徒以繁文從事何足觀乎故孔子嘗曰禘目既灌而往者吾不欲觀之矣蓋歎時也易曰東鄰殺牛不如西鄰之禴祭又曰二簋可用享其不貴物而貴誠如此語解觀盥而不薦有孚顒若誠意所寓故也古人修身齊家治國平天下本於誠吾意而已詩書所言莫非明此者但人自信不及故無其效聖人知其效必本於此是以必由也語録白雲郭氏曰鬼神至幽也人至明也聲臭之所不能交也聖人設為祭祀寓之誠心洋洋乎如在其上如在其左右是道也天地鬼神尚且弗違況人乎故盥而不薦一示於上則有孚顒若必見於下觀而化也馬氏曰盥者進爵灌地以降神也郊特牲言周人既灌然後迎牲祭統曰祭有三重焉獻之屬莫重於祼祭必先灌而後薦腥薦熟方灌之時其道一於誠而已非若薦之託物也灌者祭之本也薦者祭之末也籩豆之事則有司存是為有司可備之禮也故自灌而往孔子不觀蓋君子惟誠之為貴之義也夫誠之感人不行而至故方盥之時欲誠於求神初非有意於化天下而天下觀之者感其誠而顒肅之心自生焉惟其不期化而自化此所謂大觀之道使聖人有意於化民是教以化之非大觀之義也記曰明乎郊社之禮禘嘗之義治國其如示諸掌乎豈非誠之所感天地鬼神不能違況人也哉易説彖曰大觀在上順而巽中正以觀天下觀盥而不薦有孚顒若下觀而化也觀天之神道而四時不忒聖人以神道設教而天下服矣伊川先生曰五居尊位以剛陽中正之德為下所觀其德甚大故曰大觀在上下坤而上巽是能順而巽也五居中正以巽順中正之德為觀於天下也為觀之道嚴敬如始盥之時則下民至誠瞻仰一作仰觀而從化也不薦謂不使誠意少散也天道至神故曰神道觀天之運行四時無有差忒則見其神妙聖人見天道之神體神道以設教故天下莫不服也夫天道至神故運行四時化育萬物無有差忒至神之道莫可名言惟聖人默契體其妙用設為政教故天下之人涵泳其德而不知其功鼓舞其化而莫測其用自然仰觀而戴服故曰以神道設教而天下服矣並易傳橫渠先生曰內順外巽示民以順而外從巽此祭所以為教之本故盥而不薦中正以觀天下又曰大觀在上皆謂五也凡言觀我生亦皆謂五也天不言藏其用而四時行神道如盥而不薦之類盥簡潔而神薦褻近而煩也有兩則須有感然天之感有何思慮莫非自然聖人則能用感何謂用感凡教化設施皆是用感也作於此化於彼者皆感之道聖人以神道設教是也並易説上天之載有感必通聖人之為得為而為之也天不言而四時行聖人神道設教而天下服誠於此動於彼神之道歟成變化行鬼神成形隂陽之氣而已矣正蒙廣平遊氏曰聖人久於其道而天下化成蓋天下之化非有資於號令之鼓舞也刑賞之懲勸也一於誠而已誠至則天下徯其志而從之如恐不及矣故曰盥而不薦有孚顒若先王之化民豈能拂其所有而與之以所無哉亦曰順以巽而已中正民之性也順其性而入之則將淪肌膚而浹骨髓矣下觀而化自然之理也易説龜山楊氏曰二陽在上居中履正而得尊位下之所觀也故曰大觀在上盥者酌鬯求神之時也祭莫重焉貴氣臭而不以物誠一而已惟天下至誠為能化故有孚顒若下觀而化也夫其為物不二其生物不測天之神道也而四時不忒以其誠無息而已聖人觀天之神道而設教亦惟誠而已天下服君子篤恭而天下平意誠心正而天下治率此道也易説盥而不薦初未嘗致物也威儀度數亦皆未舉而已有孚顒若其所以交於神明者蓋有在矣又云禮莫重於祭祭莫重於灌蓋求鬼神於幽隂之時未致其文於此而能致誠以格鬼神則自灌而往其威儀度數足觀矣若不既其實而徒以繁文從事何足觀乎故孔子嘗曰禘自既灌而往者吾不欲觀之矣蓋歎時也易曰東鄰殺牛不如西鄰之禴祭又曰二簋可用享其不貴物而貴誠如此又曰古人所以交神而接人其道一主於誠初無二也故曰明則有禮樂幽則有鬼神幽明夲無二理故所以感之者亦以一理聖人以神道設教而天下服所謂神道誠意而已誠意大德也語録兼山郭氏曰在下而觀上謂之觀童觀窺觀觀國之光是也在上而視下謂之觀大觀在上觀我生觀民是也故在下者觀上之好惡而風知所移在上者不求於下至誠以示之而已故曰大觀在上順而巽中正以觀天下盥而不薦有孚顒若下觀而化也觀之成卦二陽在上四隂在下所謂大觀也坤下而巽上所謂巽而順也九五得位而應焉所謂中正以觀天下也聖人在上無思無為以治天下何事於精神心思之所及哉至誠以示之而已故曰可以贊天地之化育與天地參況萬民乎故垂衣拱手不下袵席之上而天下化者誠以先之也故曰誠則形形則著著則明明則動動則變變則化惟天下至誠為能化也經曰觀盥而不薦有孚顒若誠之夲也至於薦也備物而將之末也且天之神道四時見之矣其升降之運本之一氣一氣之運本之於一誠故八卦之變起於中孚非誠則不能也聖人之神道見於教化教化之成敗見之於風俗風俗之所自出於上之誠信故知逺之近知風之自則有至於無聲無臭者矣彼刑名度數曷足以明之故聖人以神道設教而天下服者豫知其聲色之於化民末也夫乾確然示人易矣夫坤隤然示人簡矣又曰天地之道貞觀者也其所以為貞觀者何乎易簡而已矣天之生物也不期於生而萬物以之生地之成物也不期于成而萬物以之成孰為之主張孰為之或使莫之令而常自然蓋天得一以清地得一以寧一者誠而已故聖人之治順而巽中正以觀天下中正以應之而已故曰侯王得一以為天下貞貞則亦誠而已故誠者天之道也聖人不勉而中不思而得從容中道者也夫誠之為道也至矣則何施何為而可以臻于此乎蓋君子內省不疚無惡於志其所不可及者唯人之不見乎詩云相在爾室尚不愧于屋漏不動而敬不言而信篤恭而天下平也三代之盛時正月之吉布治於邦國乃縣治象之法使萬民觀治象浹日而斂之及其衰也治象之法未廢也而治亂之迹如是之不同何也誠與不誠之效也故曰至誠如神鬼神之為德也視之而不見聽之而弗聞使天下齊明盛服以承其祭祀洋洋乎如在其上如在其左右故曰神之格思不可度思故天之神道聖人之神道推此可得而知之也嗚呼二帝三王逺矣吾於此猶可觀焉並易説白雲郭氏曰大觀在上以巽順之德居中正之位初未嘗有心於示人也其誠明之著晬然見於面盎於背施於四體有不可掩者焉亦猶聖人有以示之也觀之者至於不期化而自化是之謂神道神道之謂大觀且觀之天則天亦無所示也特四時不忒而已因四時不忒而萬物自生自化故知四時不忒是為天之神道由人言之亦曰天之大觀也聖人大觀其道同天則下觀而化也冝矣曰設教者天無教聖人主教雖以不教教之亦曰設教可也帝堯之則天孔子欲無言皆是道也乾卦言各正性命保合太和天之神道其及物如此而已然彖因卦辭盥而不薦明一卦之全體盡巽順之道以居中正故曰大觀九五言一爻之義能巽而已故反諸其身為觀民之道也卦辭彖辭明其大者象與爻抑又次焉是亦取義不同也卦之名不曰大觀者以上下大小之觀無不兼統而言故獨曰觀而彖則首明大觀之義也易説象曰風行地上觀先王以省方觀民設教伊川先生曰風行地上周及庶物為由厯周覽之象故先王體之為省方之禮以觀民俗而設政教也天子巡省四方觀視民俗設為政教如奢則約之以儉儉則示之以禮是也省方觀民也設教為民觀也易傳龜山楊氏曰風行地上省方之象也先王之省方無非事者所以觀民設教也易説白雲郭氏曰風之為物初不知其生化萬物也而風行地上萬物自生自化猶大觀在上下觀而化故為觀之象也省方觀民設教伊川謂如奢則示之以儉儉則示之以禮是也禮王制言巡狩之禮命大師陳詩以觀民風命市納賈以觀民之所好惡命典禮考時月定日同律禮樂制度衣服正之此省方觀民設教也彖言神道設教天下不知所以然而然觀民設教則其迹可見矣所以為王者之事非盡彖之道者也易説初六童觀小人無咎君子吝象曰初六童觀小人道也伊川先生曰六以隂柔之質居逺於陽是以一作其觀見者淺近如童稚然故曰童觀陽剛中正在上聖賢之君也近之則見其道德之盛所觀深逺初乃逺之所見不明如童蒙之觀也小人下民也所見昏淺不能識君子之道乃常分也不足謂之過咎若君子而如是則可鄙吝也所觀不明如童稚乃小人之分故曰小人道也並易傳橫渠先生曰所觀者末小人之道施於君子則吝易説廣平遊氏曰夫先王豈以其術智籠天下之民而愚之哉蓋道無方也反而觀之則無己泛而觀之則無物虎豹得之而猛噬蛇虺得之而毒螫厚者見之而為仁薄者見之而為惡觀老子之學變而為申韓則民不可使知之理可見矣蓋其氣質或不良而竊窺其端倪則適足以逞其不肖之心而已此小人之童觀所以無咎也語解龜山楊氏曰初以隂柔在下而逺於陽明不足以視逺矣童觀也童蒙未有知者也君子之所為衆人固不識乃其常分耳大觀在上而小人以童觀未有咎也君子冝知之者也而以童觀則可吝矣易説白雲郭氏曰在觀之初以柔自處未見其有立童觀是也童則蒙而無知小人道也小人能用童觀則內無剛戾之性外無強暴之行惟知觀人而效之者也何咎之有君子以設教立道為事反同小人之觀不亦鄙乎故曰君子吝初六小人之觀也六二女子之觀也三四君子之觀也易説六二窺觀利女貞象曰窺觀女貞亦可醜也伊川先生曰二應於五觀於五也五剛陽中正之道非二隂暗柔弱所能觀見也故但如窺覘之觀耳窺覘之觀雖少見而不能甚一作盡明也二既不能明見剛陽中正之道則利如女子之貞雖見之不能甚明而能順從者女子之道也任女子為貞也二既不能明見九五之道能如女子之順則不失中正乃為利也君子不能觀見剛陽中正之大道而僅一有能字窺覘其倣佛雖能順從乃同女子之貞亦可羞醜也並易傳橫渠先生曰得婦人之道雖正可羞易説龜山楊氏曰大觀在上而二以隂柔之質在下卦之內五之宗廟之美室家之好非二之所能見也窺觀而已夫視不出乎閨門之內為女子之正則利矣居大觀之時而為女子之正是亦可醜也易説白雲郭氏曰窺者觀之小道也六二柔順居中女子之象也而見應焉故利女貞所謂可醜者非女子之醜也君子為窺觀則醜也男女吉凶不同故恆卦曰婦人貞吉夫子凶則此利女貞者固知為男子之醜也故初之象言小人道則知君子必吝二之爻言利女貞則知男子可醜不然柔順居中得其正應何醜之有易説六三觀我生進退象曰觀我生進退未失道也伊川先生曰三居非其位處順之極能順時以進退者也若居當其位則無進退之義也觀我生我之所生謂動作施為出於己者觀其所生而隨冝進退所以處雖非正而未至失道也隨時進退求不失道故無悔咎一作吝以能順也觀己之生而進退以順乎冝故未至於失道也並易傳橫渠先生曰觀上所施而進退雖以隂居陽於道未失以其在下卦之體而應於上故曰進退易説廣平遊氏曰觀六三觀我生進退者省諸己也度德以就位量能以任官也九五觀我生者驗諸民也所以審好惡而察治忽也夫如是則興事造業無過舉矣故無咎此在上位者與德稱而志在民者之所為也故特稱君子以别六三也若夫上九之觀其生則觀其時之施設也此有君子之才而無其位身在畎畝而志常在君者之所為故亦稱君子而象因其有觀以知其志未平也易説龜山楊氏曰九五以中正之德觀天下之所冝觀也六三上應於九而居非其位能量己以進退雖未得正未失道也易説白雲郭氏曰六三順而應上可以進也柔不當位可以退也觀我道之可進而進可退而退則為不失進退之道矣雖孔子用舍行藏孟子得志不得志之説不過如是而已易説六四觀國之光利用賔于王象曰觀國之光尚賔也伊川先生曰觀莫明於近五以剛陽中正居尊位聖賢之君也四切近之觀見其道故云觀國之光觀見國之盛德光輝也不指君之身而云國者在人君而言豈止觀其行一身乎當觀天下之政化則人君之道德可見矣四雖隂柔而巽體居正切近於五觀見而能順從者也利用賔于王夫聖明在上則懷抱才德之人皆願進於朝廷輔戴之以康濟天下四既觀見人君之德國家之治光華盛美所冝賔于王朝效其智力上輔於君以施澤天下故云利用賔于王也古者有賢德之人則人君賔禮之故士之仕進於王朝則謂之賔君子懷負才業志在乎兼善天下然有卷懷自守者蓋時無明君莫能用其道不得已也豈君子之志哉故孟子曰中天下而立定四海之民君子樂之既觀見國之盛德光華古人所謂非常之遇也一無也字所以志願登進王朝以行其道故云觀國之光尚賔也尚謂志尚其志意願慕賔于王朝也並易傳橫渠先生曰體柔巽而以隂居下賔之必無過也故利下一作隂易説龜山楊氏曰大觀在上國之光也而四近之則觀國之光冝賔于王矣蓋四大臣之位人主之所尊禮也故謂之賔易説兼山郭氏曰六四詩云樂只君子邦家之光六三觀我生進退量力度德而後進也六四以量力度德為未盡則又觀國之光見其有禮也見其多賢也然後利賔于王蓋君子難進而易退也如是而説者乃謂賔有不純臣之義舜賔于四門豈皆禮其不純臣者邪蓋道合則從不合則去則孰無賔之義乎易説白雲郭氏曰先人曰古之人道合則從不合則去孰無賔之義乎雍曰君之光莫光於有德國之光莫光於用賢六三逺君方且自觀其身而圖進退四則處近君之地己進而觀國者也國有光焉非利用賔于王之時乎蓋無進退之疑也或謂賔有不純臣之義夫忠臣嘉賔賢有德之稱也易説九五觀我生君子無咎象曰觀我生觀民也伊川先生曰九五居人君之位時之治亂俗之美惡繫乎己而己觀已之生若天下之俗皆君子矣則是己之所為政化善也乃無咎矣若天下之俗未合君子之道則是己之所為政治未善不一作未能免於咎也我生出於己者人君欲觀己之施為善否當觀於民民俗善則政化善也王弼云觀民以察己之道是也並易傳橫渠先生曰觀我所自出者易説龜山楊氏曰九五以中正觀天下而天下之所觀也故得失驗之民而後見欲觀我生觀諸民而已矣苟有失焉其過可補也故君子無咎易説道雖夲諸身得失則驗之民而後見故易曰觀我生觀民也語録白雲郭氏曰九五尊位大中居大觀之位未嘗責天下以必化惟觀我道之何如耳天下入於君子之塗我之道得也故無咎是觀民所以為觀我生也中庸曰取人以身修身以道又曰失諸正鵠則反諸其身皆九五觀民之道也羣黎百姓遍為爾德人有士君子之行皆天下為君子之時也易説上九觀其生君子無咎象曰觀其生志未平也伊川先生曰上九以剛陽之德處於上為下之所觀而不當位是賢人君子不在於位而道德為天下所觀仰者也觀其生觀其所生也謂出於己者德業行義也既為天下所觀仰故自觀其所生若皆君子矣則無過咎也苟未君子則何以使人觀仰矜式是其咎也雖不在位然以人觀其德用為儀法故當自愼省觀其所生常不失於君子則人不失所望而化之矣不可以不在於位故安然放意無所事也是其志意未得安也故云志未平也平謂安寧也並易傳上九以剛陽之德居無位之地是賢人君子抱道德不居位為衆人觀仰法式者也雖不當位然為衆人所觀固不得安然放意謂己無與於天下也必觀其所生君子矣乃得無咎聖人又從而贊之謂志當在此固未得安然平定無所事也觀聖人教示後賢如是之深賢者存心如是之仁與夫素隱獨善者異矣語録橫渠先生曰以剛陽極上之德居不臣不任之位以觀國家之政志有所未平也有君子循理之心則可免咎俯視九五之為故曰觀其生易説龜山楊氏曰居一卦之外賢人無位而為天下之所觀也能觀己之動出而補其過則無咎矣曽子之三省是也易説白雲郭氏曰上九道之己成處觀之極不當其任者非若小人女子之童窺又無進退之疑無賔主之利者也故觀其生九五之君六三之臣皆在所觀也志未平者上不能忘君下不能忘民猶有心於觀焉故君子居之則無咎是以聖人愼於在上之觀必觀天而設教者以此易説大易粹言卷二十
