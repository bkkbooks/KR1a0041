body:
  text: 大易粹言卷四十七宋方聞一編坎下兊上伊川先生曰困序卦升而不已必困故受之以困升者自下而上自下升上以力進也不已必困矣故升之後受之以困也困者憊乏之義為卦兊上而坎下水居澤上則澤中有水也乃在澤下枯涸無水之象為困乏之義又兊以隂在上坎以陽居下與上六在二陽之上而九二陷于二隂之中皆隂柔掩于陽剛所以為困也君子為小人所掩蔽窮困之時也易傳困是處困之道道無時不可行遊定夫録橫渠先生曰困而不知變民斯為下矣不待困而喻賢者之常也困之進人也為德辨為感速孟子謂人有德慧術智常存乎疢疾以此自古困於內無如舜困於外無如孔子以孔子之聖而下學於困則其蒙難正志聖德日躋必有人所不及知而天獨知之者故曰莫我知也夫知我者其天乎語解困亨貞大人吉無咎有言不信伊川先生曰如卦之才則困而能亨且得貞正乃大人處困之道也故能吉而無咎大人處困不唯其道自吉樂天安命一作知命一作安義乃不失其吉也況隨時善處復有裕乎有言不信當困而言人誰信之易傳白雲郭氏曰天下之時不同而所以處之之道不能一也困為難處之時唯君子反諸其身以修德不繫於困也故不失其亨也大人之貞寬裕有容如天地然何物足以困之是以吉而無咎以見小人匪正不能處困而凶咎必至也處困尚德而不尚言雖君子之言人亦未之信況衆人乎易説彖曰困剛掩也險以説困而不失其所亨其唯君子乎貞大人吉以剛中也有言不信尚口乃窮也伊川先生曰卦所以為困以剛為柔所掩蔽也陷於下而掩於上所以困也陷亦掩焉剛陽君子而為隂柔小人所掩蔽君子之道困窒之時也險以説以卦才言處困之道也下險而上説為處險而能説雖在困窮艱險一作險難之中樂天安義自得其説樂也時雖困也處不失義則其道自亨困而不失其所亨也能如是者其唯若子乎若時當困而反亨身雖亨乃其道之困也君子大人通稱困而能貞大人所以吉也蓋其以剛中之道也五與二是也非剛中則遇困而失其正矣當困而言人所不信欲以口免困乃所以致窮也以説處困故有尚口之戒並易傳白雲郭氏曰困之所以成卦以剛掩於隂不能伸故為困也險陷而能説不失其所亨之道人之難能也故唯君子能之君子亦大人也言其成德曰君子語其德之大則曰大人大人以貞而吉者有剛中之德也尚口乃窮者君子有德則以德濟身尚德也小人無德則以利口辨辭濟其身故云尚口也尚德則不失其所亨尚口則終窮矣孔子曰君子固窮小人窮斯濫矣君子小人唯困乃見故繫辭曰困德之辨也易説象曰澤無水困君子以致命遂志伊川先生曰澤無水困乏之象也君子當困窮之時既盡其防慮之道而不得免則命也當推致其命以遂其志知命之當然也則窮塞禍患不以動其心行吾義而已苟不知命則恐懼於險難隕穫於窮尼所守亡矣安能遂其為善之志乎易傳橫渠先生曰升而不已必困故受之以困困於險下柔不自振非窮而能亨致命遂志者也易説白雲郭氏曰澤水一物也語其為功利之名曰澤論其為功利之物則曰水也故澤必資水而利萬物澤無水則困而無以資物矣君子得位而後能澤加於民無位則困而窮處矣君子知命者也當其困也豈復怨天尤人哉一歸之天命而已故孔子曰道之將行也與命也道之將廢也與命也而孟子亦曰行止非人所能為也吾之不遇魯侯天也則孔孟之困皆致之天命而無怨也遂志者君子所志者道道不以困窮而變窮亦是道也通亦是道也故孔子曰用之則行舍之則藏遂志也孟子窮則獨善其身達則兼善天下亦遂志也遂志是以不失其所亨也易説初六臀困于株木入于幽谷三嵗不覿象曰入于幽谷幽不明也伊川先生曰六以隂柔處於至卑又居坎險之下在困不能自濟者也必得在上剛明之人為援助則可以濟其困矣初與四為正應九四以陽而居隂為不正失一作夫剛而不中又方困於隂掩是惡能濟人之困猶株木之不能蔭覆於物株木無枝葉之木也四近君之位在它卦不為無助以居困而不能庇物故為株木臀所以居也臀困於株木謂無所庇而不得安其居居安則非困也入於幽谷隂柔之人非能安其所遇既不能免於困則益迷暗妄動入於深困幽谷深暗之所也方益入於困無自出之勢故至於三嵗不覿終困者也不覿不遇其所亨也幽者不明也謂益入昏暗自陷於深困也明則不至於陷矣並易傳橫渠先生曰處困者正乃無咎居非得中故幽而不明易説白雲郭氏曰臀困內自困也困于株木外困于物也處困之初內不能自安外不能有行內外皆困而欲以柔濟之則困益甚矣是以入于幽谷三嵗不覿也幽谷不明之所愈不能自安至於三嵗之久無所見焉又不若困于株木之有物也既困于株木而處之非其道故有入于幽谷三嵗不覿之象雖九四為應方且自困不能庇初故如株木不能庇物也然則處困之道何如唯修德以致命遂志而已易説九二困于酒食朱紱方來利用亨祀征凶無咎象曰困于酒食中有慶也伊川先生曰酒食人所欲而所以施惠也二以剛中之才而處困之時君子安其所遇雖窮厄險難無所動其心不恤其為困也所困者唯困於所欲耳君子之所欲者澤天下之民濟天下之困也二未得遂其欲施其惠故為困于酒食也大人君子懷其道而困於下必得有道之君求而用之然後能施其所藴二以剛中之德困於下上有九五剛中之君道同德合必來相求故云朱紱方來方且來也朱紱王者之服蔽膝也以行來為義故以蔽膝言之利用享祀享祀以至誠通神明也在困之時利用至誠如享祀然其德既誠一作成自能感通於上自昔賢哲困於幽逺而德卒升聞道卒為用者唯自守至誠而已征凶無咎方困之時若不至誠安處以俟命往而求之則犯難得凶乃自取也將誰咎乎不度時而征乃不安其所為困所動也失剛中之德自取凶悔何所怨咎卦二五以隂陽相應而吉唯小畜與困乃厄於隂故同道相求小畜陽為隂所畜困陽為隂所掩也雖困於所欲未能施惠於人然守其剛中之德必能致享而有福慶也雖使時未亨通守其中德亦君子之道亨乃有慶也並易傳橫渠先生曰困危之際一作世物思所附九二以剛居中正大人之吉上下交説不施聰明美物方至然未可有為故以祭則吉以征則凶征雖或凶於義無咎易説白雲郭氏曰彖曰困剛掩也謂九二之剛掩於二隂所以為困非止三之掩二也然九二剛中之大人困而不失其所亨者特君臣未遇天祿未食君子困于家食之際無飲食宴樂之奉而已其道不可得而困也朱紱王者之象九五之君方將以同德而來求則困于酒食非所患矣利用享祀者天下之至難致者君之求至難通者鬼神之德而九二剛中之德至誠感物故無或不通以之待君之求則朱紱方來以之交鬼神則利用享祀是其至誠之道無所感而不通也苟不知是道而欲妄進以求用則先自失其所亨凶之道也將誰咎乎中有慶者大人以道自任豈以口腹酒食為困哉蓋酒食以見君臣相遇交際之道不得乎此雖如伊尹樂堯舜之道不過老死莘野而已終無享天心革夏正之事也是知酒食之間有天下之大慶存焉故需卦於九五言需于酒食而詩人於鹿鳴言燕樂蓋一義也易説六三困于石據乎蒺䔧入于其宫不見其妻凶象曰據于蒺䔧乘剛也入于其宫不見其妻不祥也伊川先生曰六三以隂柔不中正之質處險極而用剛居陽用剛也不善處困之甚者也石堅重難勝之物蒺䔧刺一無刺字不可據之物三以剛險而上進則二陽在上力不能勝堅不可犯益自困耳困于石也以不善之德居九二剛中之上其不安猶藉刺據于蒺䔧也進退既皆益困欲安其所益不能矣一作也宫其居所安也妻所安之主也知進退之不可而欲安其居則失其所安矣進退與處皆不可一有則字唯死而已其凶可知繫辭曰非所困而困焉名必辱非所據而據焉身必危既辱且危死期將至妻其可得見邪二陽不可犯也而犯之以取困是非所困而困也名辱其事惡也三在二上固為據之然苟能謙柔以下之則無害矣乃用剛險以乘之則不安而取困如據蒺䔧也如是死期將至所安之主可得而一無而字見乎據于蒺䔧謂乘九二之剛不安猶藉刺也不祥者不善之徵失其所安者不善之效故云不見其妻不祥也並易傳白雲郭氏曰石之為物堅不可犯知不可犯而不犯則無困焉知不可犯而犯之是以遇困也六三之柔不能以柔道自安反欲用剛上于二陽困于石也下乘九二之剛據于蒺䔧也宫者自安之所也妻者所安之主也以進則非所困而困以退則非所據而據上下夫自安之道雖有宫有妻將皆失之矣是以凶也象曰不祥也者其不能自安則不善之機也至於不見其妻則不善之明應也故知處困而不自安終必至於名辱身危死期將至而後不祥之效終焉至于不能保妻子則他人可知矣易説九四來徐徐困于金車吝有終象曰來徐徐志在下也雖不當位有與也伊川先生曰唯力不足故困亨困之道必由援助當困之時上下相求理當然也四與初為正應然四以不中正處困其才不足以濟人之困初六比二三有剛中之才足以拯困則冝為初所從矣金剛也車載物者也二以剛在下載已故謂之金車四欲從初而阻於二故其來遲疑而徐徐是困于金車也己之所應疑其少已而之它將從之則猶豫不敢遽前豈不可羞吝乎有終者事之所歸者正也初四正應終必相從也寒士之妻弱國之臣各安其正而已苟擇勢而從則惡之大者不容於世矣二與四皆以陽居隂而二以剛中之才所以能濟困也居隂者尚柔也得中者不失剛柔之宜也四應於一無於字初而隔於二志在下求故徐徐而來雖居不當位為未善然其正應相與故有終也並易傳橫渠先生曰必有偏係吝也以陽覆柔故有終易説白雲郭氏曰當困之時以隂求陽者無它焉求濟而已初六之困甚矣而九四正應不能以濟者以九二剛中在下力足以有濟而初六近而可從也故有金車之象焉金有堅剛之象車有積中之德謂九二也來徐徐者初六既從二而於九四之應則徐徐其來也當困之時九二得濟難之權四不當位非其敵也故不能濟初之急而致徐徐其來也不能濟初之急是困于九二之權也困于九二而未能應初吝也雖吝而有終者正道終復而應也故初六言三嵗以見雖久而有期非若終凶者也與九四有終之義相符象言志在下者彼雖徐徐其來而四則未有忘初之志也有與者雖不當濟困之事以初六正應而有當與之道也易説九五劓刖困于赤紱乃徐有説利用祭祀象曰劓刖志未得也乃徐有説以中直也利用祭祀受福也伊川先生曰截鼻曰劓傷於上也去足為刖傷於下也上下皆掩於隂為其傷害劓刖之象也五君位也人君之困由上下無與也赤紱臣下之服取行來之義故以紱言人君之困以天下不來也天下皆來則非困也五雖在困而有剛中之德下有九二剛中之賢道同德合徐必相應而來共濟天下之困是始困而徐有喜説也利用祭祀祭祀之事必致其誠敬而後受福人君在困時宜念天下之困求天下之賢若祭祀然致其誠敬一作至誠則能致天下之賢濟天下之困矣五與二同德而云上下無與何也曰隂陽相應者自然相應也如夫婦骨肉分定也五與二皆陽爻以剛中之德同而相應相求而後合者一無者字也如君臣朋友義合也方其始困安有上下之與有與則非困也故徐合而後有一無有字説也二云享祀五云祭祀大意則宜用至誠乃受福也祭與祀享泛言之則可通分而言之祭天神祀地示享人鬼五君位言祭二在下言享各以其所當用也始為隂掩無上下之與方困未得志之時也徐而有説以中直之道得在下之賢共濟於困也不曰中正與二合者云直乃宜也直比正意差緩盡其誠意如祭祀然以求天下之賢則能一無能字享天下之困而享受其福慶也並易傳橫渠先生曰以陽居陽處困以剛威怒以求物之來是反為赤紱所困者也與九二之義反矣苟能徐以俟之乃心有説故曰乃徐有説物既自至以事鬼神然後福可致焉處困用中可以不失其守而已故言利用祭祀然非有為之時也易説白雲郭氏曰困之象上下皆掩於隂在常人處之受其困而已在有為之君必思所以去之是以有用刑之象劓刖者上下皆刑之也刑小人而去之所以進君子故九五劓刖以困于赤紱故也赤紱君子之服也病君子之不進故刑及小人也君子進則善者勸而不仁者逺何困之有且君子難進易退不求而致之不可得也故九五患赤紱之不進而九二有朱紱方來之辭以見九五之求之也九二中直之臣至而後有説故曰乃徐有説必曰紱者紱蔽膝也與黃裳之義同取其謙下之道也九二以謙而不敢自進九五以謙而下求之故皆曰紱也君臣相與至誠而已其道雖鬼神可交況人乎故以九二事君之道用於享祀則利用享祀矣以九五下賢之道用於祭祀則利用祭祀矣此亦見其君臣同於至誠之德用於人用於神皆可也如是則天下其有不治者哉志未得者非樂於用刑也君子未進人君志未得之初不得已而用之也受福者與孔子祭則受福之義同蓋是道也用於君子則必得賢用於鬼神則必受福人神雖不同其交感之道則一而已易説上六困于葛藟于臲卼曰動悔有悔征吉象曰困于葛藟未當也動悔有悔吉行也伊川先生曰物極則反事極則變困既極矣理當變也葛藟纒束之物臲卼危動之狀六處困之極為困所纒束而居最髙危之地困于葛藟與臲卼也動悔動輒有悔無所不困也有悔咎前之失也曰自謂也若能曰如是動皆得悔當變前之所為有悔也能悔則往而得吉也困極而征則出於困矣故吉三以隂在下卦之上而凶上居一卦之上而無凶何也曰三居剛而處險困而用剛險故凶上以柔居説惟為困極耳困極則有變困之道也困與屯之上皆以無應居卦終屯則泣血漣如困則有悔征吉屯險極而困説體故也以説順進可以離乎困也為困所纒而不能變未得其道也是處之未當也知動則得悔遂有悔而去之可出於困是其行而吉也並易傳橫渠先生曰處困之極重剛在下不得其肆居非所安舉則招悔取捨皆咎故行然後吉一云動悔有悔猶云動悔之悔也易説白雲郭氏曰上六以柔居困之極不能脫困有葛藟纒糾之象復欲安而居之又甚危不可安也是處困之不能退不能遂者故曰困于葛藟于臲卼也曰動悔有悔者畏懦之過徒知悔吝生乎動不敢動乎悔中如是則必有悔至不知當困之極征而脫困則吉是未可與權之士也未當者處困之道未當也吉行者謂悔雖生乎動而困之上六吉在於行時有不得同也此爻蓋聖人明處困失時之戒易説大易粹言卷四十七
