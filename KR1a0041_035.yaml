body:
  text: 大易粹言卷三十五宋方聞一編坤下離上伊川先生曰晉序卦物不可以終壯故受之以晉晉者進也物無壯而終止之理既盛壯則必進晉所以繼大壯也為卦離在坤上明出地上也日出於地升而益明故為晉晉進而光明盛大之意一作義也凡物漸盛為進故彖云晉進也卦有有德者有無德者隨其宜也乾坤之外云元亨者固有也云利貞者所不足而可以有功也有不同者革漸是也隨卦可見晉之盛而無德者無用有也晉之明盛故更不言亨順乎大明無用戒正也易傳晉康侯用錫馬蕃庶晝日三接伊川先生曰晉為進盛之時大明在上而下體順附諸侯承王之象也故為康侯康侯者治安之侯也上之大明而能同德以順附治安之侯也故受其寵數錫之馬衆多也車馬重賜也蕃庶衆多也不唯錫與之厚又見親禮晝日之中至於三接言寵遇之至也晉進盛之時上明下順君臣相得在上而言則進於明盛在臣而言則進升髙顯受其光寵也易傳白雲郭氏曰伊川曰晉以其明盛故不言亨順乎大明故不戒以正不待言而其德可知雍曰彖言晉進也雜卦曰晉晝也則知晉之義不止於進蓋言明以進故曰晉漸以進不謂之晉也晉卦取名之義與大有略相類大有火在天上君道也故為大有晉明出地上臣道也故為晉君臣天地之象雖不同其欲以明德居上則一而已且以人臣之進獨備一卦之義則臣道之至大者非康侯安足以當之易之卦辭唯晉為異專以康侯為義是以不及其他也康侯如是其亨利貞可知易說彖曰晉進也明出地上順而麗乎大明柔進而上行是以康侯用錫馬蕃庶晝日三接也伊川先生曰晉進也明進而盛也明出於地益進而盛故為晉所以不謂之進者進為前進不能包明盛之義明出地上離在坤上也坤麗於離以順麗於大明順德之臣上附於大明之君也柔進而上行凡卦離在上者柔居君位多云柔進而上行噬嗑睽鼎是也六五以柔居君位明而順麗為能待下寵遇親密之義是以為康侯用錫馬蕃庶晝日三接也大明之君安天下者也諸侯能順附天子之明德是康民安國之侯也故謂之康侯是以享寵錫而見親禮晝日之間三接見於天子不曰公卿而曰侯天子治於上者也諸侯治於下者也在下而順附於大明之君諸侯之象也易傳龜山楊氏曰柔進而上行臣進之盛者故有康侯之象焉侯有君道者也順而麗乎大明故用錫馬蕃庶晝日三接也馬地類坤象也明出地上晝日之象也問國之富以馬錫馬蕃庶其厚之也晝日三接其親之也鄭武公父子並為周司徒其三接之謂歟自晉康侯至此易說白雲郭氏曰明出地上二卦之象也順而麗乎大明晉之義也柔進而上行成卦之序康侯之德也其德柔順而明故下能康一國之民而為之主上能致王者之寵而錫馬蕃庶書日三接也車馬重賜也三接數接乎上也在國能康一國之民則進而麗乎大明斯足以康天下矣古之人文王是也易說象曰明出地上晉君子以自昭明德伊川先生曰昭明之也傳曰昭德塞違昭其度也君子觀明出地上而益明盛之象而以自昭其明德去蔽致知昭明德於己也明明德於天下昭明德於外也明明德在已故云自昭易傳龜山楊氏曰自昭明德所謂明明德也易說白雲郭氏曰元首明哉股肱良哉自古以明為君德之大堯舜文王皆是也而晉為臣道自昭明德何哉蓋侯有君人之道有明德自昭而柔順上行然後備晉之義可以謂之康侯不如是雖使錫馬蕃庶晝日三接亦非晉進之道不得謂之康侯矣古之人莫不務明明德於天下為君為臣亦豈有二德哉是以伊尹言咸有一德武王言同心同德則晉之象言自昭明德不為過矣易說初六晉如摧如貞吉罔孚裕無咎象曰晉如摧如獨行正也裕無咎未受命也伊川先生曰初居晉之下進之始也晉如升進也摧如抑退也於始進而言遂其進不遂其進唯得正則吉也罔孚者在下而始進豈遽能深見信於上苟上未見信則當安中自守雍容寬裕無急於求上之信也苟欲信之心切非汲汲以失其守則悻悻以傷於義矣皆有咎也故裕則無咎君子處進退之道也獨行正者無進無抑唯獨行正道也寬裕則無咎者始欲進而未當位故也君子之於進退或遲或速唯義所當未嘗不裕也聖人恐後之人不逹寬裕之義居位者廢職失守以為裕故特云初六裕則無咎者始進未受命當職任故也若有官守不信於上而失其職一日不可居也然事非一槩久速唯時亦容有為之兆者並易傳橫渠先生曰居晉之初正必見摧故摧如不害於貞吉也未孚於人或未見聽寬以居之乃無咎然初六有應在四居下援上未安其分故曰未受命也易說龜山楊氏曰晉如其進也摧如其退也居晉之初量而後入無心於進退者也雖進退無常獨行正而已故正吉在下未受命者也故罔孚裕無咎孟子曰我無官守也我無言責也則吾進退豈不綽綽然有餘裕哉此之謂也易說白雲郭氏曰在卦之初為進之始有可進可退之義能不以進退為慮唯固守明德柔順上行為臣若此能無吉乎罔孚者雖以明德自任而初之時名實未加於上下未足信於人當是時也進退之際既已處之裕然何咎之有若孔子可以仕則仕可以止則止是也獨行正者獨以明德上行而固守為正不以進退為慮也未受命者無官守言責之時孟子所謂吾進退豈不綽綽然有餘裕哉易說六二晉如愁如貞吉受兹介福于其王母象曰受兹介福以中正也伊川先生曰六二在下上無應援以中正柔和一作順之德非强於進者也故以進為可憂愁謂其進之難也然守其貞正則當得吉故云晉如愁如貞吉王母祖母也謂隂之至尊者指六五也二以中正之道自守雖上無應援不能自進然其中正之德久而必彰上之人自當求之蓋六五大明之君與之同德必當求之加之寵祿受介福於王母也介大也受兹介福以中正之道也人能守中正之道久而必亨况大明在上而同德必受大福也並易傳橫渠先生曰進而無撓多失於肆故愁如乃吉六五以隂居尊故稱王母俱以柔中故受福可必也易說龜山楊氏曰順而麗乎大明晉之時也明明在上而六二以柔順中正處乎衆隂之間而獨無應焉是明不見知也小人相與比周而君子不見察則亂將作矣能無憂乎哉故曰晉如愁如然居中履正素其位而行則明雖不見知鬼神之至幽者其福之矣故受兹介福于其王母詩曰靖共爾位好是正直神之聽之介以景福此之謂也易說白雲郭氏曰六二柔順中正為臣之道莫美於斯而曰晉如愁如者蓋小人以進為喜而君子以進為懼故召公為保則不恱正考父三命而傴俯兹其所以順而麗乎大明歟是以既貞且吉受介福于其王也孔子言諸侯長守富貴之道則曰戰戰兢兢如臨深淵如履薄冰則晉如愁如而受兹介福也宜矣此父之義與卦辭相類蓋言侯之受錫福于王者母字無别義亦衍字也易說六三衆允悔亡象曰衆允之志上行也伊川先生曰以六居三不得中正宜有悔咎一作吝而三在順體之上順之極者也三隂皆順上者也是三之順上與衆同志衆所允從其悔所以亡也有順上向明之志而衆允從之何所不利或曰不由中正而與衆同得為善乎曰衆所允者必至當也況順上之大明豈有不善也是以悔亡蓋亡其不中正之失矣古人曰謀從衆則合天心上行上順麗於大明也上從大明之君衆志之所同也並易傳橫渠先生曰上歷九四不為衆信則取悔可必若志應在上晉為衆允則悔亡易說龜山楊氏曰六三在坤體之上以隂承陽順之至也順而麗乎大明雖不當位衆允之也故悔亡易說白雲郭氏曰在晉之初名實未加未孚於人至三則忠順不失以事其上也久矣於是乎衆允之也雖非中正疑於有悔及衆允之時則悔亡矣三之上行有嚮明之志所謂順而麗乎大明者是以衆不為疑而允之也故曰志上行也易說九四晉如鼫鼠貞厲象曰鼫鼠貞厲位不當也伊川先生曰以九居四非其位也非其位而居之貪據其位者也貪處髙位既非所安而又與上同德順麗於上三隂皆在己下勢必上進故其心畏忌之貪而畏人者鼫鼠也故云如鼫鼠貪於非據而存畏忌之心貞固守此其危可知言貞厲者開有改之道也賢者以正德宜在髙位不正而處髙位則為非據貪而懼失則畏人固處其地危可知也並易傳橫渠先生曰鼫鼠為物貪而畏人體陽在進反據隂位故動止皆失與六三之義為相反矣易說龜山楊氏曰晉而麗乎險鼫鼠之象也易說白雲郭氏曰離以明為德而火以暴為失故離之九四有突如其來如焚如死棄之象晉之九四與離同位雖順德在下不至於焚如之暴然當晉之時不免有貪位慕祿之失也鼫鼠貪而畏人者也守此道以事上能無危乎位不當者既未進六五之明又過三隂之順以剛自進故不當也晉之六父無凶獨四以貪而厲上以伐而吝蓋才有餘而德不足者豈若初二三五之昭明德也哉是以聖人德之為貴易說六五悔亡失得勿恤往吉無不利象曰失得勿恤往有慶也伊川先生曰六以柔居尊位本當有悔以大明而下皆順附故其悔得亡也下既同德順附當推誠委任盡衆人之才通天下之志勿復自任其明恤其失得如此而往則吉而無不利也六五大明之主不患其不能明照患其用明之過至於察察失委任之道故戒以失得勿恤也夫私意偏任不察則有蔽盡天下之公豈當一作得復用一有其字私察也以大明之德得下之附推誠委任則可以成天下之大功是往而有福慶也並易傳橫渠先生曰進而遇陽故失得不恤而吉也位不當必有悔獲吉則悔亡易說龜山楊氏曰不當位悔也以柔居之能不有其位者也故悔亡悔亡則失得勿恤矣六五尊位也柔進而上行猶患失之之時也苟不以直道自居而務為持祿保位之謀其能失得勿恤乎行斯以往何不利之有易說白雲郭氏曰君道無它焉在中與明而已六五居中何悔不亡又唯自昭明德而一己之失得勿恤于外蓋君子失諸正鵠反諸其身之道也如是則何往不吉何行不利乎象言往有慶者人君勿恤一己之失得獨以離明自昭所謂一人有慶兆民賴之者矣孟子告滕文公曰君子創業垂統為可繼也若夫成功則天也君如彼何哉强為善而已矣失得勿恤之意强為善也謂之强為善亦自昭明德之義易說上九晉其角維用伐邑厲吉無咎貞吝象曰維用伐邑道未光也伊川先生曰角剛而居上之物上九以剛居卦之極故取角為象以陽居上剛之極也在晉之上晉之極也剛極則有强猛之過進極則有躁急之失以剛而極於進失中之甚也無所用而可維一作惟字獨用於伐邑則雖厲而吉且無咎也伐四方者治外也伐其居邑者治內也言伐邑謂內自治也人之自治剛極則守道愈固進極則遷善愈速如上九者以之自治則雖傷於厲而吉且無咎也嚴厲非安和之道而於自治則有功也復云貞吝以盡其義極於剛進雖自治有功然非中和之德故於貞正之道為可吝也不失中正為貞維用伐邑既得吉而無咎復云貞吝者其未光大也以正理言之猶可吝也夫道既光大則無不中正安有過也今以過剛自治雖有功矣然其道未光大故亦可吝聖人言盡善之道並易傳橫渠先生曰窮無所往故曰角居明之極其施未光而應尚狹持此以進伐邑討叛而已危而幸吉以得無咎然終吝道也無可進而進不已惟伐邑於內而可矣如君子則知止也易說龜山楊氏曰明出地上非日中之時也則剛上窮而不足以照天下道未光也故維用伐邑而已若夫道足以照天下則無思不服矣尚何伐邑之有易說白雲郭氏曰角上窮之物位進而上窮亦危矣然晉非止於進而已明順之義存焉是以用伐邑也然自危則終吉自危者如臨深淵如履薄冰之義不得已而用之非好攻戰而樂殺人也是以無咎不然則既伐邑而厲不亡幸矣何吉之有至於伐邑則明德之昭已或虧蔽故象言道未光也固以伐邑為貞不知明德之虧非吝而何是以春秋無義戰彼善於此聖人無取焉然則齊晉之霸方之康侯其未優乎易說大易粹言卷三十五
