body:
  text: 大易粹言卷六十六宋方聞一編繫辭上二一隂一陽之謂道繼之者善也成之者性也仁者見之謂之仁知者見之謂之知百姓日用而不知故君子之道鮮矣明道先生曰一隂一陽之謂道道非隂陽也所以一隂一陽道也如一闔一闢謂之變謝顯道録天只是以生為道繼此生理者即是善也善便有一箇元底意思元者善之長萬物皆有春意便是繼之者善也成之者性也成却待他萬物自成其一作甚性須得這箇義理仁者又看做仁了也知者又看做知了也百姓又日用而不知此所以君子之道鮮矣此箇亦不少亦不剩只是人看他不見並吕與叔東見録一隂一陽之謂道自然之道也繼之者善也出道則有用元者善之長也成之者却只是性各正性命者也故曰仁者見之謂之仁知者見之謂之知百姓日用而不知故君子之道鮮矣如此則亦無始亦無終亦無因甚有亦無因甚無亦無有處有亦無無處無劉絢所録凡人説性只是説繼之者善也孟子言人性善是也夫所謂繼之者善也者猶水流而就下也皆水也有流而至海終無所汚此何煩人力之為也有流而未逺固已漸濁有出而甚逺方有所濁有濁之多者有濁之少者清濁雖不同然不可以濁者不為水也如此則人不可以不加澄治之功故用力敏勇則疾清用力緩怠則遲清及其清也則却只是元初水也亦不是將清來換却濁亦不是取出濁來置在一隅也水之清則性善之謂也故不是善與惡在性中為兩物相對各自出來此理天命也順而循之則道也循此而修之各得其分則教也自天命以至於教我無加損焉李籲所録伊川先生曰道者一隂一陽也動靜無端隂陽無始非知道者孰能識之動靜相因而成變化順繼此道則為善也成之在人則謂之性也在衆人則不能識隨其所知故仁者謂之仁知者謂之知百姓則由之而不知故君子之道人鮮克知也經説一隂一陽之謂道此理則固深説則無可説所以隂陽者道既曰氣則便是一作有二言開闔便是感既二則便有感所以開闔者道開闔便是隂陽老氏言虛而生氣非也隂陽開闔夲無先後不可道今日有隂明日有陽如人言形影蓋形影一時不可言今日有形明日有影有便齊有離了隂陽更無道所以隂陽者是道也隂陽氣也氣是形而下者道是形而上者止於至善不明乎善此言善者義理之精微無可得名且以至善目之繼之者善此言善却言得輕但謂繼斯道者莫非善也不可謂惡並入關語録橫渠先生曰一隂一陽是道也能繼繼體此而不已者善也善之猶言能繼此者也其成就之者則必俟見性是之謂聖仁者不已其仁始謂之仁知者不已其知方謂之知此是致曲曲能有誠也誠則有變化必仁智會合乃為聖人也前謂聖者於一節上成性也夷惠所以亦得稱聖人然行在一節而已百姓日用而不知蓋所用莫非在道飲食男女皆性也但己不自察由旦至暮凡百舉動莫非感而不之知今夫心又不求感又不求所以醉而生夢而死者衆也言繼繼不已者善也其成就者性也仁智各以成性猶仁禮以成性勉勉而不息可謂善成而存存在乎性仁知見之所謂曲能有誠者也不能見道其仁知終非性之有也性未成則善惡混故亹亹而繼善者斯為善矣惡盡去則善因以亡故舍曰善而曰成之者性神不可致思存焉可也化不可助長順焉可也存虛名久至德順變化達時中仁之至義之盡也知微知彰不舍而繼其善然後可以成之性矣並易説所謂勉勉者謂繼之者善也成之者性也繼繼不已乃善而能至於成性也經學理窟聞見不足以為己有仁者見之謂之仁知者見之謂之知心各有本性始為己有苟未見性須當勉勉今學者既知趨向殊不費力何謂不勉勉百姓日用而不知溺於流也並易説廣平遊氏曰孔子之言性有以其本言之者若繼之者善成之者性是也有以人所見言之者若性相近習相逺是也孟子亦然其道性善深探其本也其曰孺子將入井皆有怵惕惻隱之心乃若其情則可以為善矣姑據人所見而語之也是以當時學者不能無疑夫道未始有名感於物而出則善之名立矣託於物而生則性之名立矣善者性之德故莊子曰物得以生謂之德性者善之資也故莊子曰形體保神謂之性蓋道之在天地則播五行於四時百物生焉無非善者也無惡也故曰繼之者善也道之在人則出作而入息渴飲而飢食無非性者無妄也苟得其性之本然反身而誠則天地萬物之理得而道自我成矣故曰成之者性也惟其同出於一氣而氣之所值有全有偏有邪有正有粹有駁有厚有薄然後有上知下愚中人之不同也語解龜山楊氏曰仲素問橫渠云氣質之性如何曰人所資稟固有不同者若論其本則無不善蓋一隂一陽之謂道隂陽無不善而人則受之以生故也然而善者其常也亦有時而惡矣猶人之生也氣得其和則為安樂人其有疾也以氣不和而然也然氣不和非其常治之而使其和則反常矣其常者性也此孟子所以言性善也橫渠説氣質之性亦云人之性有剛柔緩急強弱昏明而已非謂天地之性然也今夫水清者其常然也至於湛濁則沙泥混之矣沙泥既去其清者自若也是故君子於氣質之性必有以變之其澄濁而水清之義歟橫渠言性未成則善惡混亹亹而繼善者斯為善矣惡盡去則善因以亡故舍曰善而曰成之者性伯思疑此以問公曰不知橫渠因何如此説據此説於易之文亦自不通却令伯思説伯思言善與信皆當就人言繼之為説如子繼父成乃無所虧之名矣若非人即不能繼而成之曰不獨指人言萬物得隂陽而生皆可言繼之者善亦有多般如乾之四德有仁義禮智之不同後人以配四時若如四時則春固不可為秋冬固不可為夏其實皆善也元者特善之長也固出於道故曰繼之者善性則具足圎成夲無虧欠要成此道除是性也今或以萬物之性為不足以成之蓋不知萬物所以賦得偏者自其氣稟之異非性之偏也孔子曰天地之性人為貴人之性特貴於萬物耳何嘗與物是兩般性並語録道者民所日用故可使由之以其日用而不知故不可使知之世儒以謂民可使由之而已不可使知之務為智術籠天下之愚而役之失其旨矣語解白雲郭氏曰繫辭言道此章為甚著蓋唯道兼統三才三才不過二象隂陽是也天地人皆具隂陽故六是之謂一隂一陽之道也繼之者有自然之善成之者有在人之性大其性者於此成其大小其性者於此成其小仁者見其仁而得之謂道為仁知者見其知而得之謂道為知故自古聖賢雖各有得而未嘗同者其性之所成異故也然謂仁知非道則不可也特非道之大全耳仁知猶有見而得之斯民之愚又日用而不知矣凡日用而順成者皆道也百姓不知有道故性之所成者鮮此聖人所以明之也明之則天下後世皆知一隂一陽為具三才之道繼之者有善而成之在人使仁知不為獨見之異百姓用而知之此聖人明道之意也然則聖人何如其明也包犧以八卦文王以六十四孔子以彖象擊辭是已故易之為書所以明易之道也易之道三才之道也三才之道一隂一陽之道也一隂一陽之道道之大全也道之大全天得之而天地得之而地人得之而人至人又成於性者有仁知聖賢之異道盡於斯矣然經自成之者性之後主人事而言其言繼之者善則與道同體不獨在人之善矣經所謂易簡之善配至德之善也能充孟子性善之説則可以明此為善惡論者不知有此也此善天道也天道無不誠故至善存焉中庸論誠首言天命之謂性孟子良心赤子之心與性善之説雖夲諸此又加詳焉易説顯諸仁藏諸用鼓萬物而不與聖人同憂明道先生曰鼓萬物而不與聖人同憂聖人人也故不得無憂天則不為堯存不為桀亡者也劉絢師訓伊川先生曰運行之迹生育之功顯諸仁也神妙無方變化無迹藏諸用也天地不與聖人同憂天地不宰聖人有心也天地無心而成化聖人有心而無為經説和靖云見王信伯云昔時問鼓萬物而不與聖人同憂之意於張思叔思叔對曰堯舜其猶病諸後因侍伊川伊川問鼓萬物而不與聖人同憂如何説則對以思叔之語伊川曰不然天地以無心故不憂聖人致有為之事故憂吕堅中記尹和靖語鼓萬物而不與聖人同憂聖人有為之功天地不宰之功遊氏拾遺鼓舞萬物而不與聖人同憂此天與人異處聖人有不能為天之所為處吕與叔東見録天理鼓動萬物如此聖人循天理而欲萬物同之所以有憂患遊定夫所録橫渠先生曰非神不能顯諸仁非知不能藏諸用老子言天地不仁以萬物為芻狗此是也聖人不仁以百姓為芻狗此則異矣聖人豈有不仁所患者不仁也天地則何意於仁鼓萬物而已聖人則仁耳此其為能𢎞道也天不能皆生善人政以天無意也鼓萬物而不與聖人同憂聖人之於天下法則無不善也然古者治世多而後世不治何也人徒見文字所記自唐虞以上幾治幾亂須歸之運數有大運有小運故孟子曰天之生民久矣一治一亂繫之為言或説易書或説天或説人卒歸一道蓋不異術故其參錯而理則同也鼓萬物而不與聖人同憂則於是分出人之道不可混天鼓萬物而不與聖人同憂此言天德之至也與天同憂樂垂法於後世雖是聖人之事亦猶聖人之末流耳神則不屈無復回易鼓萬物而不與聖人同憂者此直謂天也天則無心神故可以不詘聖人則豈忘思慮憂患雖聖亦人耳焉得遂欲如天之神庸不害於其事聖人苟不用思慮憂患以經世則何用聖人天治自足矣聖人所以有憂者聖人之仁也不可以憂言者天也蓋聖人成能所以異於天地並易説鼓萬物而不與聖人同憂天道也聖不可知也無心之妙非有心所及也正蒙白雲郭氏曰此章明易與聖人之同用且易之道無體故隱顯無常當用則顯諸仁已用則藏諸用顯也藏也皆有所託故知易之無體也方其用也雖鼓動萬物使之化育而無道不行之憂是不與聖人同憂矣易説盛德大業至矣哉富有之謂大業日新之謂盛德伊川先生曰天地聖人之盛德大業可謂至矣富有溥博也日新無窮也經説君子之學必日新日新者日進也不日新者必日退未有不進而不退者唯聖人之道無所進退以其所造者極也暢潛道録問日新有進意抑只是無弊意曰有進意學者求有益須是日新楊遵道録日新之謂盛德生生之謂易隂陽不測之謂神要思得之劉絢師訓橫渠先生曰富有廣大不禦之盛歟日新悠久無疆之道歟富有者大無外也日新者久無窮也顯其聚也隱其散也顯且隱幽明所以存乎象聚且散推蕩所以妙乎神日新之謂盛德過而不有不凝滯於心知之細也非盛德日新惟日新是謂盛德義理一貫然後日新易説白雲郭氏曰易有盛德大業聖人用易之道亦見於德業故盛德大業不獨主聖人言之易窮則變變則通通則久此易之盛德也以言乎天地之間則備矣此易之大業也然富有則無外無外大之至也聖人用此故有可大之業日新則無窮無窮則久聖人用此故有可久之德也前言易道之不與聖人同憂者此言其所同者德業也易説生生之謂易成象之謂乾效法之謂坤極數知來之謂占通變之謂事隂陽不測之謂神明道先生曰生生之謂易生生之用則神也劉絢師訓生生之謂易天地設位而易行乎其中豈可只以今之易書為易乎生生之謂易天地設位而易行乎其中乾坤毁則無以見易易不可見乾坤或幾乎息矣易畢竟是甚又指而言曰聖人以此洗心退藏於密聖人示人之意至此深且明矣終無人理會易也此也密也是甚物人能至此深思當自得之並劉絢所録伊川先生曰生生相續變易而不窮也乾始物而有象坤成物而體備法象著矣推數可以知來物通變不窮事之理也天下有不離乎隂陽惟神也莫知其鄉不測其為剛柔動靜也經説天地隂陽其勢髙下甚相背然必相須而為用也有隂便有陽有陽便有隂有一復有二才有一二便有一二之間便是三已往更無窮老子亦言三生萬物此是生生之謂易理自然如此附劉元承手編生生之謂易是天之所以為道也天只是以生為道吕與叔東見録遊定夫問伊川隂陽不測之謂神伊川曰賢是疑了問是揀難砥問朝氏客語仲尼於論語中未嘗説神字只於易中不得已言數處而已入關語録橫渠先生曰生生猶言進進也極數知來前知也前知其變有道術以通之君子所以措於民者逺矣能通其變而措於民聖人之事業也並易説白雲郭氏曰此章先明易與乾坤體用後言聖人之效法且自易而生乾坤自乾坤生八卦八卦生六十四而後二篇之䇿當萬物之數所謂生生之謂易也自易之生乾為成象之始坤則效法於乾此乾坤之義也能盡天下之數以前知者易之占也通其變而周流無窮者易之事也惟神無方無乎不在故以隂陽不測言之此論易與乾坤之體以及於不可知之神皆體也自此而下易與乾坤之用也易説夫易廣矣大矣以言乎逺則不禦以言乎邇則靜而正以言乎天地之間則備矣伊川先生曰易道廣大推逺則無窮近言則安靜而正天地之間萬物之理無有不同易説白雲郭氏曰易道廣大彌綸天地故逺不可禦而無不及近無所遺皆靜而正天地之間或道或事在人在物無不備於斯此易道之用也易説夫乾其靜也專其動也直是以大生焉夫坤其靜也翕其動也闢是以廣生焉明道先生曰乾陽也不動則不剛其靜也專專一其動也直直遂不專一則不能直逐坤隂也不靜則躁其靜也翕翕聚其動也闢發散不翕聚則不能發散劉絢師訓伊川先生曰乾靜也專動也直專專一直直易惟其專直故其生物之功大坤靜翕動闢坤體動則開應乾開闔而廣生萬物經説白雲郭氏曰乾為陽主動坤為隂主靜一於動則不能生大無其體也一於靜則不能生廣無其用也大哉乾元萬物資始靜專也雲行雨施品物流形動直也坤之含𢎞靜翕也光大動闢也故又曰坤至柔而動也剛至靜而德方此廣大所由以生也易説廣大配天地變通配四時隂陽之義配日月易簡之善配至德伊川先生曰廣大天地之功也變通四時之運也一隂一陽日月之行也乾坤易簡之功乃至善之德也經説橫渠先生曰循天下之理之謂道得天下之理之謂德故曰易簡之善配至德易説白雲郭氏曰乾坤之廣大足以配天地其變通足以配四時其為隂陽之義足以配日月其易簡之善足以配至德至德主聖人中庸之德而言盡中庸人道之至德則可久之德可大之業皆至德也配者非乾坤不足於是四者而曰配也以言乾坤之一足以配其全德則天地四時日月至德皆為乾坤之一象耳是以乾坤以廣大之一道足以盡天地而天地不足以盡乾坤者此也易説子曰易其至矣乎夫易聖人所以崇德而廣業也知崇禮卑崇效天卑法地天地設位而易行乎其中矣成性存存道義之門明道先生曰天地設位而易行乎其中矣乾坤毁則無以見易易不可見則乾坤或幾乎息矣易是箇甚易又不只是這一部書是易之道也不要將易又是一箇事即是盡天理便是易也成性存存道義之門亦是萬物各有成性存存亦是生生不已之意天只是以生為道並吕與叔東見録且渙做中若以四方之中為中則四邊無中乎若以中外之中為中則外面無中乎如生生之謂易天地設位而易行乎其中豈可只以今之易書為易乎中者且謂之中不可捉一箇中來為中成性存存便是道義之門並劉絢録天位乎上地位乎下中無人則無以見天地書曰惟天地萬物父母惟人萬物之靈易曰天地設位而易行乎其中天地設位而易行其中何不言人行其中蓋人亦物也若言神行乎其中則人只於鬼神上求矣若言理言誠亦可也而特言易者欲使人默識而自得之也並劉絢師訓伊川先生曰易之道其至矣乎聖人以易之道崇犬其德業也知則崇髙禮則卑下髙卑順理合天地之道也髙卑之位設則易在其中矣斯理也成之在人則為性成之者性也人心存乎此理之所存乃道義之門也經説崇砥便是知卑砥便是禮遊氏拾遺天地設位而易行乎其中只是敬也敬則無間斷體物而不可遺者誠敬而已矣不誠則無物也詩曰維天之命於穆不已於乎不顯文王之德之純純則不已純則無間斷矣天地只是設位易行乎其中者神也成性存存道義之門道無體義有方也並劉絢師訓橫渠先生曰崇天也形而上也通晝夜之道而知其知崇矣知及之而不以禮性之非己有也故知禮成性而道出如天地位而易行天地位定而易行其中知禮成而道義出夫易聖人所以崇德廣業以知為德以禮為業也蓋知崇則德崇矣此論易書之道而聖人亦以教人天地設位而易行乎其中比下文成性存存道義之門而言也天地設位故易行乎其中知禮成性則道義自此而出也道義之門者由仁義行也聖人亦必知禮成性然後道義從此出譬之天地設位則造化行乎其中知則務崇禮則惟欲乎卑成性須是知禮存存則是長存知禮亦如天地設位非知德不崇非禮業不廣知崇禮卑叩其兩端而竭也崇既效天卑必法地何以致不息成性則不息誠成也誠為能成性也仁人孝子所以成身桞下惠不息其和也伯夷不息其清也於清和以成其性故亦得為聖人也然清和猶是一端不得完正不若知禮以成性即道義從此出智極其髙故效天禮著實處故法地人必禮以立失禮則孰為道天地設位而易行乎其中成性存存道義之門得知禮以成性性乃存然後道義從此出學不能自信而明者患在不勉耳當守道不回如川之流源泉混混不捨晝夜無復回却則自明自得之也易曰繼之者善也惟能相繼而不已者道之善也至于成性則不勉而中不思而得從容中道矣易曰成性存存道義之門並易説龜山楊氏曰道之峻極于天道之至也無禮以範圍之則蕩而無止而天地之化或過矣禮儀三百威儀三千所以體道而範圍之也故曰苟不至德至道不凝焉所謂至德者禮其是乎夫禮天所秩也先王之禮述天理而已後世或以為忠信之薄或以為偽或以為戲事皆不知天者也故曰待其人然後行蓋道非禮不止禮非道不行二者常相資也苟非其人而梏於儀章器數之末則愚不肖者之不及也尚何至道之凝哉易曰知崇禮卑崇效天卑法地天地設位而易行乎其中矣此之謂也中庸解白雲郭氏曰前言易與乾坤之義故此復嘆美易之至而言聖人用其道以崇德廣業也崇德故德盛廣業故業大盛德大業非用易之道則不能至故聖人先嘆美易之至而後言法效也至謂前所言易與乾坤之事也易之廣大備於天地之間故舉天下之事莫不皆有易之道凡具天地之象者易已在其中矣故聖人無適而不用易非獨崇德廣業而已也且知以崇髙而後明禮以卑遜而後恭知崇禮卑宜無與於易矣然崇者天之道卑者地之德知崇效天禮卑法地則天地之位已設矣天地之位已設則易已行乎知禮之中此聖人所以大而德業小而言行至於天地人鬼之變無適而不用易者此也惟成之以性存存不忘則修身齊家治國治天下其道義之要皆由此塗出故易為道義之門也法乾坤簡易以崇德廣業特其大者耳故此又言知崇禮卑以見其小者也並易説聖人有以見天下之賾而擬諸形容象其物宜是故謂之象聖人有以見天下之動而觀其會通以行其典禮繫辭焉以斷其吉凶是故謂之爻言天下之至賾而不可惡也言天下之至動而不可亂也擬之而後言議之而後動擬議以成其變化伊川先生曰聖人見天下深逺之事賾深逺也而比擬其形容體象其事類故謂之象天下之動無窮也必觀其會通會通綱要也乃以行其典禮典禮法度也物之則也繫之辭以斷其吉凶者爻也言天下之深逺難知也而理之所有不可厭也言天下之動無窮也而物有其方不可紊也擬度而設其辭商議以察其動擬議以成其變化也變化爻之時義擬議議而言之也舉鳴鶴在隂以下七爻擬議而言者餘爻皆然也經説橫渠先生曰易語天地隂陽情偽至隱賾而不可惡也諸子馳騁説辭窮髙極幽而知德者厭其言故言為非艱使君子樂取之為貴易之為書有君子小人之雜道有隂陽爻有吉凶之戒使人先事決疑避凶就吉几一言動是非可不可隨之而生所以要愼言動擬之而後言議之而後動不越求是而已自此以下皆著爻象之詞所以成變化之道擬議以教人也凡有一迹出則便有無限人議論處至如天之生物亦甚有不齊處然天則無心不恤此所以要慎易曰擬之而後言議之而後動只是要求是也並易説白雲郭氏曰此章明擬議爻象之道至盜之招也而終且賾者天下之至隱不可得而見也聖人或擬其形容或象其物宜易於是乎有象矣天下之動變所由生觀時會通以行典禮則爻之動為觀時之要也繫之以辭斷其吉凶則爻之辭吉凶之證也謂之爻者如此二者蓋作易聖人立爻象之初意也象為天下之至賾勿遂惡其賾而忽之也爻為天下之至動蓋因時有宜而不可亂也所以然者君子於一言一動必以爻象擬議之而後能成變化之道則所樂而玩者極其至矣上言聖人立爻象之本意下言君子擬議爻象而後言動亦猶前言聖人設卦觀象終之以君子觀象玩辭之説也能明此故知爻象之用是以君子玩易必擬其象而議其辭可也易説鳴鶴在隂其子和之我有好爵吾與爾靡之子曰君子居其室出其言善則千里之外應之况其邇者乎居其室出其言不善則千里之外違之况其邇者乎言出乎身加乎民行發乎邇見乎逺言行君子之樞機樞機之發榮辱之主也言行君子之所以動天地也可不慎乎同人先號咷而後笑子曰君子之道或出或處或默或語二人同心其利斷金同心之言其臭如蘭伊川先生曰有孚於中物無不應誠同故也至誠無逺近幽深之間故繫辭云善則千里之外應不善則千里之外違之誠通也至誠感通之理知道者為能識之中誠所同出處語默無不同天下莫能間也同者一也一不可分分乃二也一可以通金石冒水火無所不能入故云其利斷金其理至微故聖人贊之曰同心之言其臭如蘭謂其言意味深長也並易傳橫渠先生曰君子自知自信了然不惑又於出處語默之際獲與人同則其志決然利可斷金惟仁者能聽盡言已不欲為善則已苟欲為善惟恐人之不言二人同心其利斷金夫一人固自明矣又有一人言而同心其為利也知金鐡之可斷義理必至于出處語默之不可易如此其同也已固自信又得一人與之同故利可斷金並易説龜山楊氏曰明則誠矣未有誠而不動動而不變也鳴鶴在隂其子和之非動乎曲能有誠誠在一曲也明則誠矣無物不誠也中庸解禇遂良修起居注唐太宗曰朕有不善亦當記之乎或為之言曰借使遂良不記天下亦當記之曰此語亦善但人主好名則可以動之耳未盡也夫君子居其室出其言善則千里之外應之出其言不善則千里之外違之故言行君子之樞機不可不慎縱使史官不記而民之應違如此雖欲自掩其不善其可得乎語録白雲郭氏曰自此以下皆言擬議爻象之道也且鳴鶴在隂其子和之我有好爵吾與爾靡之初非有及於言行也聖人擬議之則見言行之不可不慎既得其道則言行之間所以成其變化也同人先號咷而後笑初非有及於出處語默也聖人擬議之則見其同心之利同言之臭既得其道則出處語默之際所以成其變化也聖人憂患後世不知爻象之用故明擬議之道如此而已易説初六藉用白茅無咎子曰苟錯諸地而可矣藉之用茅何咎之有慎之至也夫茅之為物薄而用可重也愼斯術也以往其無所失矣勞謙君子有終吉子曰勞而不伐有功而不德厚之至也語以其功下人者也德言盛禮言恭謙也者致恭以存其位者也亢龍有悔子曰貴而無位髙而無民賢人在下位而無輔是以動而有悔也不出户庭無咎子曰亂之所生也則言語以為階君不密則失臣臣不密則失身幾事不密則害成是以君子慎密而不出也子曰作易者其知盜乎易曰負且乘致寇至負也者小人之事也乘也者君子之器也小人而乘君子之器盜思奪之矣上慢下暴盜思伐之矣慢藏誨盜冶容誨淫易曰負且乘致寇至盜之招也伊川先生曰茅之為物雖薄而用可重者以用之能成敬慎之道也慎守斯術而行豈有失乎大過之用也繫辭云苟錯諸地而可矣藉之用茅何咎之有慎之至也夫茅之為物薄而用可重也慎斯術也以往其無所失矣言敬慎之至也茅雖至薄之物然用之可甚重以之藉薦則為重慎之道是用之重也人之過於敬慎為之非難而可以保其安而無過苟能慎斯道推而行之於事其無所失矣有勞而不自矜伐有功而不以為德是其德𢎞厚之至也言以其功勞而自謙以下於人也德言盛禮言恭以其德言之則至盛以其自處之禮言之則至恭此所謂謙也夫謙也者謂致恭以存其位者也存守也致其恭巽以守其位故髙而不危滿而不溢是以能終吉也夫君子履謙乃其常行非為保其位而為之也而言存其位者蓋能致恭所以能存其位言謙之道如此如言為善有令名君子豈為令名而為善哉亦言有令名者為善之故也亢龍有悔九居上而不當尊位是以無民無輔動則有悔也不出户庭無咎繫辭所解獨以言者在人所節惟言與行節於言則行可知言當在先也聖人於繫辭明其致冦之道曰作易者其知道乎盜者乘釁而至苟無釁隙則盜安能犯負者小人之事乘者君子之器以小人而乘君子之器非其所能安也故盜乘釁而奪之小人而居君子之位非其所能堪也故滿假而陵慢其上侵暴其下盜則乘其過惡而伐之矣伐者聲其罪也盜橫暴而至者也貨財而輕慢其藏是教語乎盜使取之也女子而夭冶其容是教語淫者使暴之也小人而乘君子之器是招盜使奪之也皆取之之謂也並易傳白雲郭氏曰此五者當與鳴鶴在隂同居爻象擬議之終蓋皆擬議之道也或别為一章非也擬議者聖人用易之道蓋觀象玩辭所以反諸其身也然不曰用而曰擬議者爻象必先擬議而後可用方擬諸形容象其物宜必從其事物象類以探作易聖人之意是以必至於擬議而後可也古之君子以擬議為學易之要務而世多略而不言或言之復失擬議之道是以易終不用於世也且玩易之辭有曰藉用白茅無咎則知無所失之慎有曰勞謙君子有終吉則知以功下人之恭有曰亢龍有悔則知貴髙不可以無輔有曰不出户庭無咎則知言語不可以不密有曰負且乘致冦至則知非所乘而招盜是皆擬議而知其變化也五者之下各繫以孔子之言蓋孔子擬議之辭所謂擬之而後言者也能觸類而長之則三百八十四爻能事畢矣天地之間備矣聖人存其大法得此七者已足用蓋難盡為之言也聖人初已盡言於彖象文言以謂擬議之學未明故復繫於此其憂後世所以垂教至矣盡矣後世欲務空言誇世則不必深明其説苟欲為力行之學歸於君子之儒則擬議之道宜先盡心焉其言作易者其知盜乎者蓋聖人嘆易之道無不備也盜之情不必知也宜其無所見於易也尚且深明於此則天地之間舉無遺矣擬議之道其可忽乎故驚而嘆之有是言也觀此則知崇禮卑又無足疑者繫辭自天尊地卑之後至此章終凡言重卦設卦易道易辭爻位彖象乾坤神聖及聖賢之所法則君子之所觀玩與夫學者擬議之道略盡於斯其所未言者數所未詳者變化之道故繼之於後也易説大易粹言卷六十六
