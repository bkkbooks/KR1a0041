body:
  text: 大易粹言卷十三宋方聞一編離下乾上伊川先生曰同人序卦物不可以終否故受之以同人夫天地不交則為否上下相同則為同人與否義相反故相次又世之方否必與人同力一作欲乃能濟同人所以次否也為卦乾上離下以二象言之天在上者也火之性炎上與天同也故為同人以二體言之五居正位為乾之主二為離之主二爻以中正相應上下相同同人之義也又卦惟一隂衆陽所欲同亦同人之義也它卦固有一隂者在同人之時而二五相應天火相同故其義大易說同人于野亨利涉大川利君子貞伊川先生曰野謂曠野取逺與外之義夫同人者以天下大同之道則聖賢大公之心也常人之同者以其私意所合乃昵比之情耳故必于野謂不以昵近情之所私而于郊野曠逺之地既不係所私乃至公大同之道無逺不同也其亨可知能一作既與天下大同是天下皆同之也天下皆同何險阻之不可濟何艱危之不可亨故利涉大川利君子貞上言于野止謂不在昵比此復言宜以君子正道君子之貞謂天下至公大同之道故雖居千里之逺生千嵗之後若合符節推而行之四海之廣兆民之衆莫不同一作合小人則惟用其私意所比者雖非亦同所惡者雖是亦異故其所同者則為阿黨蓋其心不正也故同人之道利在君子之貞正易傳白雲郭氏曰同人名卦不曰同者同大同也大同則三才無不同矣聖人明人道得失必有所指故名曰同人不曰同也然聖人雖行人道而其道未嘗不同天者蓋由同人則同天矣人道以同人為大故也故為君臣父子為兄弟夫婦朋友至於臨民為政處己接物凡有見於外者無非欲盡同人之道子思之所謂盡性孟子之所謂盡心其說一本於此然天無事於人也聖人亦同其無事於人則不期同天而天自同矣大舜善與人同孔子稱其無為而治則同天矣孔子曰豫欲無言是亦同其無事之義也野者逺於有事又其廣大無際同人之道至于野則廣大無不同矣六爻之才皆不及此利涉大川天道之大且健也利君子貞廣大非小人之事言惟君子可得同人之道也夫不能同人而欲人同已者小人也能同人則君子矣君子言其德之盛大蓋不以才言以是知同人之道在德不在才也中庸曰天之所覆地之所載日月所照霜露所隊凡有血氣者莫不尊親故曰配天此同人之道也易說彖曰同人柔得位得中而應乎乾曰同人同人曰同人于野亨利涉大川乾行也文明以健中正而應君子正也唯君子為能通天下之志伊川先生曰言成卦之義柔得位謂二以隂居隂得其正位也五中正而二以中正應之得中而應乎乾也五剛健中正而二以柔順中正應之各得其正其德同也故為同人五乾之主故云應乎乾象取天火之象而彖專以二言同人曰此三字羡文至誠無私可以蹈險難者乾之行也無私天德也又以二體言其義有文明之德而剛健以中正之道相應乃君子之正道也天下之志萬殊理則一也君子明理故能通天下之志聖人視億兆之心猶一心者通於理而已文明則能燭理故能明大同之義剛健則能克己故能盡大同之道然後能中正合乎乾行也並易傳橫渠先生曰不能與人同未足為正也天下之心天下之志自是一物天何常有如此間别並易傳龜山楊氏曰天道上行火炎上皆親乎上者也故為同人之象卦惟一隂則一隂為之主柔得位而不中得中而不應皆非所以為同也得位得中而應乎乾六二以之卦之所以為同人也同人于野利涉大川利君子貞夫人之常情昵近遺逺則其同不廣矣故同人于野亨野郊之外逺於邑者也于野則無昵比之私焉是以亨也蓋公則一私則萬殊合天下之公而誠焉天德也術斯以往何險難之不濟乎故曰利涉大川乾行也文明以健總一卦之才言也中正而應以二五言也文明而不健則物或蔽之中正而不應則物或間之雖有同焉寡矣唯君子為能先得人之所同然者故能通天下之志能通天下之志則視天下無一物非我也尚誰異哉列子曰和者大同於物夫五味相得而後和則和初非同也合異以為同者也如是然後為大同若夫物各以類而同之則所同者小矣且天下之志固非一也而君子能通天下之志而同之亦若是而已所謂君子貞者如此苟在物一曲則非正也同之之道孰利於此乎自同人于野亨至此易說兼山郭氏曰衆不能治衆治衆者至寡者也動不能制動制天下之動者正夫一者也一卦五隂而一陽則一陽為之主五陽而一隂則一隂為之主隂雖至賤而為一卦之主者處其至少之地也是以同人六二獨為五陽之所宗用此道也六二柔順中正麗乎大明上應九五九五乾道也凡以人同人未有能同之者以人同天蓋不期于同而自同矣孟子曰聖人先得我心之所同然者是也然則天道逺安得而同之同其所無事也孔子曰同人于野亨利涉大川凡以文明以健中正而應故也充中正應乾之道則天下之志其有不通者哉易說白雲郭氏曰同人之成卦以六二為主故言柔得中而應乎乾曰同人以成卦言也同人于野非六二之事獨卦辭言同人之道故稱同人曰以别之同人于野亨利涉大川彖言以乾道而行是為天道也文明以健中正而應彖言二五之才君子之道也同人之所以同乾之行者無事而已至大且健而已君子之所以貞者明健而已中正而已唯君子能通天下之志此言君子之事業也子思曰能盡其性則能盡人之性能盡人之性則能盡物之性則可以贊天地化育與天地參矣夫盡人物之性則盡同人之道也盡同人之道則同天而配天矣故贊化育參天地夫如是天下之志其有不通者乎通天下之志則人物之性盡矣易說象曰天與火同人君子以類族辨物伊川先生曰不云火在天下天下有火而云天與火者天在上火性炎上火與天同故為同人之義君子觀同人之象而以類族辨物各以其類族辨物之同異也若君子小人之黨善惡是非之理物情之離合事理之異同凡同異者君子能辨明之故處物不失其方也易傳龜山楊氏曰惟和者能大同於物小人則同而不和大同者合異以為同也居同人之時不知類族辨物則小人之同而已非大同也易說兼山郭氏曰陳相道許行之言使市賈不二國中無僞孟子曰物之不齊物之情也或相倍蓰或相什百或相千萬子比而同之是亂天下也故類族辨物乃所以盡同之之道也易說白雲郭氏曰先人曰陳相道許行之言使市價不二國中無僞孟子曰物之不齊物之情也或相倍蓰或相什百或相千萬子比而同之是亂天下也故類族辨物乃所以盡同之之道易說初九同人于門無咎象曰出門同人又誰咎也伊川先生曰九居同人之初而無係應是無所偏私同人之公者也故為出門同人出門謂在外在外則無踈昵之偏其同博而公如此則無過咎也出門同人于外是其所同者廣無所偏私人之同也有厚薄親疏之異過咎所由生也既無所偏黨誰其咎之易傳龜山楊氏曰居同人之初不係於私應出門同人者也雖未能同人于野方之同于宗則裕矣故無咎易說白雲郭氏曰同人之始未足以及逺故言于門知出而同人母我者也則無咎矣出于門則一東一西一南一北或逹于大道䆒四方萬里之逺或困于窮途止于五十步百步之間是皆未可知也吉凶悔吝隨動以生豈能䆒言之哉此特能知出門之同則無咎於其初也易說六二同人于宗吝象曰同人于宗吝道也伊川先生曰二與五為正應故曰同人于宗宗謂宗黨也同於所係應是有所偏與在同人之道為私狹矣故可吝二若陽爻則為剛中之德乃以中道相同不為私也諸卦以中正相應為善而在同人則為可吝故五不取君義蓋私比非人君之道相同以私為可吝也並易傳龜山楊氏曰二係於正應同人于宗者也宗其親黨也與同人于野異矣然二五以中正而應雖係于宗未至於凶也故吝而已易說白雲郭氏曰在卦論之六二文明之性固知同人之義自爻觀之其才至柔不足與立安能大同於物是雖知之力有所不能也故彖之所論者卦之德也六二之所言者爻之才也然知同于五不失上下之分又以中正同中正亦何異於宗黨同於所尊者哉然以同人之道論之則小而吝矣易說九三伏戎于莽升其髙陵三嵗不興象曰伏戎于莽敵剛也三歲不興安行也伊川先生曰三以陽居剛而不得中是剛暴之人也在同人之時志在於同卦惟一有二字一隂諸陽之志皆欲同之三又與之比然二以中正之道與五相應三以剛強居二五之間欲奪而同之然理不直義不勝故不敢顯發伏藏兵戎于林莽之中懷惡而內負不直故又畏懼時升髙陵以顧望如此至於三歲之久終不敢興此爻深見小人之情狀然不曰凶者既不敢發故未至凶也所敵者五既剛且正其可奪乎故畏憚伏藏也至於三歲不興矣終安能行乎並易傳廣平游氏曰伏戎于莽欲以劫五之下接也升其髙陵欲以扞二之上比也二五以同德合而九三居剛不中不務德而欲以力爭冝其三歲不興也三在下體之上有髙陵之象故曰升其髙陵其者指三之本體也易說龜山楊氏曰卦惟一隂衆陽宗之以為同也九三重剛而不中故伏戎于莽升其髙陵據隂以陵上也居同人之時上陵下據害乎同者也義不直矣方乾道上行而九五以剛健中正居其上非三之所能陵也故伏戎而已不能興戎以為敵也故曰三歲不興安行也安行不遽之辭易說白雲郭氏曰有得同人之道者于野是也郊庶幾焉失其道者大師相遇是也伏戎甚矣九三之爻居下卦之極性剛而炎上其暴可知也然同人有道力不能強雖使伏戎升髙經時纍年肆其強暴雖二之柔終不可得而同也況九五之剛敵乎故至於三歲之久而不能興也冝矣安行者行將安之也伏戎不敢顯發也升髙畏而顧望之意伊川曰此爻深見小人之情狀然小人欲以此道同人難矣易說九四乘其墉弗克攻吉象曰乘其墉義弗克也其吉則困而反則也伊川先生曰四剛而不中正其志欲同二亦與五為仇者也墉垣所以限隔也四切近於五如隔墉耳乘其墉欲攻之知義不直而不克也苟能自知義之不直而不攻則為吉也若肆其邪欲不能反思義理妄行攻奪則其凶大矣三以剛居剛故終其強而不能反四以剛居柔故有困而能反之義能反則吉矣畏義而能改其吉冝矣所以乘其墉而弗克攻之者以其義之弗一作不克也以邪攻正義不勝也其所以得吉者由其義不勝困窮而反於法則也二者衆陽所同欲也獨三四有爭奪之義者二爻居二五之間也初終遠故取義别並易傳龜山楊氏曰六二柔順中正為一卦之主衆之所欲同也九三切比之而九四居其上乘其墉者也九四剛健而不中正雖乘其墉義弗克矣然以剛居柔非恃強以攻之也知自反而不縮則困而反則矣所以吉而不至於凶也易說白雲郭氏曰同人之時以一隂欲同衆陽而衆陽亦欲同於二也三四居二五之間故有爭奪之象亦以見君子志於大同而小人私於同已者也說者謂九四乘其墉而欲攻五或謂欲攻三不克而困反於則乃吉夫三可攻者也弗克攻反非吉也謂攻五者其理尤悖且乘墉之逼過於伏戎干莽之逺也弗克之攻過於升髙陵之不興也是則強暴悖逆過九三逺矣況君臣大分一有犯焉困而反則何吉之有而曰弗克攻吉者何哉蓋九四近君之地聖人言其地近易攻如在其墉間勢可攻也非若于莽之逺不能攻也弗克攻者言其勢可攻而不攻也勢可攻而不攻知君臣之大分也知君臣之大分是以吉也然九四無應居三五二剛之間為多懼之地困窮甚矣窮斯濫小人之常情也九四雖困而反能守則君子固窮者也異於小人之情矣豈所謂利君子貞者乎不然一乘其墉終身無可吉之道故知乘墉如升堂入室皆親近之意非必真乘其墉而攻之四爻言此深罪三之伏戎也然伊周示大信於天下萬世必無乘墉弗攻之議觀漢帝驂乘之憚蜀主臨終之言則霍光與亮不幾於乘墉弗攻之人歟易說九五同人先號咷而後笑大師克相遇象曰同人之先以中直也大師相遇言相克也伊川先生曰九五同於二而為三四二陽所隔五自以義直理勝故不勝憤抑至於號咷然邪不勝正雖為所隔終必得合故後笑也大師克相遇五與二正應而二陽非理隔奪必用大師克勝之乃得相遇也云大師云克者見二陽之強也九五君位而爻不取人君同人之義者蓋五專以私昵應於二而失其中正之德人君當與天下大同而獨私一人非君道也又先隔則號咷後遇則笑一有正字是私昵之情非大同之體也二之在下尚以同于宗為吝況人君乎五既於君道無取故更不言君道而明二人同心不可間隔之義繫辭云君子之道或出或處或默或語二人同心其利斷金中誠所同出處語默無不同天下莫能間也同者一也一不可分分乃二也一可以通金石冒水火無所不能入故云其利斷金其理至微故聖人贊之曰同心之言其臭如蘭謂其言意味深長也先所以號咷者以中誠理直故不勝其忿切而然也雖其敵剛強至用大師然義直理勝終能克之故言能相克也相克謂能勝見二陽之強也並易傳橫渠先生曰二與五應而為它間已直人曲望之必深故號咷也師直而壯義同必克故遇而後笑易說龜山楊氏曰六二五之正應也二陽乘之而不得同故先號咷大師克之而相遇故後笑夫五以乾健中正而得尊位故稱大師義直理勝故能克雖處尊位而昵係於私應不能通天下之志而大同之非君人之道也故以二人同心出處語默之義言之雖克相遇止於後笑而已亦不言吉也易說兼山郭氏曰九五文明以健中正而應所謂二人同心者也故以心同者未嘗不合以迹同者未嘗不睽古之為道者亦然故顔子以德禹以功孟子謂禹稷顔回同道是也況乎矜勢利尚詐力能得志於斯時乎孟子曰以力假人者霸霸必有大國以德行仁者王王不待大是九三九四之所尚不能克二五之中正也明矣孔子曰二人同心其利斷金是也春秋之時征伐㑹盟遍于天下或兵車以摟其衆盟誓以要其心然而口血未乾逡巡而去者皆是也獨齊俟衛侯胥命于蒲由是而終身不相侵伐彼約言而退較之載書歃血之心固不可論其重輕然於同心之言其臭如蘭亦庶幾矣雜卦曰同人親也九五有應于六二是以先號咷而後笑親寡旅也上九無應于九三是以先笑而後號咷非特時之異也於爻亦有取之耳易說白雲郭氏曰九五之君能盡于野之道則亨矣而其私在於六二安足以盡同人之道哉故九三伏戎升髙亦有以致之也然方其為三所間則憤抑而號咷及其克而同也則歡然而笑以此見其私於一人非大有為之道所可取者特斷金之利同心之言而已終以大師克之其於同人之道亦未優乎故象言二五之同其先本以中直之道而及至於大師相遇以失于野之亨也九五之君私其應如此者無它焉蓋乾剛在上而離明在下剛有餘而明不足故也與大有之君異矣易說上九同人于郊無悔象曰同人于郊志未得也伊川先生曰郊在外而逺之地求同者必相親相與上九居外而無應終無與同者也始有同則至終或有睽悔處逺而無與故雖無同亦無悔雖欲同之志不遂而其終無所悔也居逺莫同故終無所悔然而在同人之道求同之志不得遂雖無悔非善處也並易傳龜山楊氏曰同人于野亨上九同人于郊止於無悔而已何也蓋以一卦之義言之則于野無昵比之私焉故亨上九居卦之外而無應不同乎人人亦無同之者則靜而不通乎物也故無悔而已以吉凶悔吝生乎動故也易說白雲郭氏曰郊之與野其庶幾乎然上九非有為之位其自為則善矣所以同天下之道則未𢎞也故無悔者言自為也志未得也不能同天下之大也夫同人之道甚大六爻皆非其才自卦觀之以人同天以隂同陽以有為同無事則同人之義可得矣謂之于野者如此易說大易粹言卷十三
