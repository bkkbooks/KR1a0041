body:
  text: 大易粹言卷二十六宋方聞一編乾下艮上伊川先生曰大畜序卦有無妄然後可畜故受之以大畜無妄則為有實故可畜聚大畜所以次無妄也為卦艮上乾下天而在於山中所畜至大之象畜為畜止又為畜聚止則聚矣一有又字取天在山中之象則為藴畜取艮之止乾則為畜止止而後有積故止為畜義易傳大畜利貞不家食吉利涉大川伊川先生曰莫大於天而在山中艮在上而止乾於下皆藴畜至大之象也在人為學術道德充積於內乃所畜之大也凡所畜聚皆是專言其大者人之藴畜宜得正道故云利貞若夫異端偏學所畜至多而不正者固有矣既道德充積於內宜在上位以享天祿施為於天下則不獨於一無於字一身之吉天下之吉也若窮處而自食於家道之否也故不家食則吉所畜既大宜施之於時濟天下之艱險乃大畜之用也故利涉大川此只據大畜之義而言彖更以卦之才德而言諸爻則唯有止畜之義蓋易體道隨宜取明且近者易傳廣平遊氏曰説者以大畜為君畜臣夫賢者易祿而難畜而盛德之士蓋有君不得而臣者恐無畜大賢之理如以為所畜者非成德之彥則不足以當所尚之賢而非所謂止健也且攬羣材而並用之故重道輕祿者不足以自髙宜莫如堯舜而童牛之牿豶豕之牙徒取於私欲不行豈聖君之盛德曽何健之止乎又以不家食為聖人能養賢以及萬民不待家食而民被其養矣然自古養萬民者藉令不知為政亦無家食之理況大畜尚賢之卦也其畜道之成亦曰何天之衢亨未及言養民也恐不須生此義易説白雲郭氏曰健天德也能止天德其畜大矣惟天為大惟堯則之堯之止健也不識不知順帝之則文王之止健也天何言哉四時行焉百物生焉孔于之止健也能止之則畜而有之矣為大利為大貞上合乾德內之所畜也不家食以養賢外之所畜也外內止健而畜之其於濟難也何有無妄動以天大畜止天德畜之所以能動也而序卦言有無妄而後可畜者是亦無妄言不利有攸往之義也然則畜之而後能動者又大畜言利涉大川之義也二卦相終始而後其道大備易説彖曰大畜剛健篤實輝光日新其德剛上而尚賢能止健大正也不家食吉養賢也利涉大川應乎天也伊川先生曰剛健篤實輝光以卦之才德而言也乾體剛健艮體篤實人之才剛健篤實則所畜能大充實而有輝光畜之不已則其德日新也剛上陽居上也陽剛居尊位之上為尚賢之義止居健上為能止健之義止乎健者非大正則安能以剛陽在上與尊尚賢德能止至健皆大正之道也大畜之人所宜施其所畜以濟天下故不食於家則吉謂居天位享天祿也國家養賢賢者得行其道也利涉大川謂大有藴畜之人宜濟天下之艱險也彖更發明卦才云所以能涉大川者以應乎天也六五君也下應乾之中爻乃大畜之君應乾而行也所行能應乎天無艱險之不可濟況其它乎並易傳橫渠先生曰剛健篤實日新其德乃天德也強學者往往心多好勝必無心處一乃善也定然後始有光明唯能定已是光明矣若常移易不定何求光明易大抵以艮為止止乃光明時止時行動靜不失其時其道光明謙天道下濟而光明天在山中大畜君子以剛健篤實輝光日新其德定則自光明故大學定而至於能慮人心多則無由光明陽卦在上而上九又在其上故曰剛上而尚賢並易説廣平遊氏曰柔得位而上下應之小者之畜也古之人有行之者若仲山甫之於宣王是也故詩人稱之曰柔嘉維則又曰衮職有闕惟仲山甫補之剛上而五承之能止健大者之畜也古之人有行之者若伊尹之於太甲是也故髙宗稱之曰先正保衡作我先王則補衮之闕不足道也夫人主之利勢固能利害而擅生殺矣可不謂健已乎非有大人之正德終始惟一者孰能止之昔之辨士蓋有能變亂名實而使其君虛己以聽之至於疏間親新間舊言聽計從無不遂其意者其術智亦足以畜其君矣而君子惡之為其不正耳此大畜所以言其利貞也大人在上則天下利見而野無遺賢矣羣賢畢進則蒞天職而食於朝此所謂不家食也羣賢不家食則禮義立而政事修財用足而百志成萬邦咸寧吉孰大焉亦何難之不濟乎故曰利涉大川當是時命有德討有罪無容心焉天理而已矣故曰應乎天也易説龜山楊氏曰艮止也乾健也一陽在上能止健大者畜也與小畜異矣剛健篤實乾德也畜之於內則輝光日新所畜亦大矣此天在山中之象也剛上而尚賢能止健言上九也剛居一卦之上與三合志則乾道上行矣尚賢也尚賢止健非大者正其孰能之所以利正也然尚賢而不與之共天位食天祿非尚賢之義也故不家食乃吉五居尊位而應乎乾應乎天也應天而時行則無往不濟矣故利涉大川自大畜利貞至此易説兼山郭氏曰易之稱大者凡四卦皆以賢為主大有有賢之卦也大畜畜賢之卦也大壯大者之壯大過大者之過老子曰域中有四大而王居一焉則王之為大者以賢為大也故其辭曰剛上而尚賢能止健大正也利涉大川應乎天者謂二五也六五才不足而位有餘疑不可以濟難唯能應乎天無行險以徼幸之心是以必濟也而説者謂挾衆為助其未優乎易説健為天德大畜止健畜天德也故彖曰剛健篤實輝光日新其德不能畜天德則見於有為者不能無妄故天德止於大畜而動於無妄也序卦曰有無妄而後可畜是為交相養之道則知無妄者動亦無妄靜亦無妄而大畜一於止矣大畜圖白雲郭氏曰卦之才能止健故內能成剛健篤實之德發於事業者又輝光而日新也剛健篤實猶中庸所謂至誠輝光所謂誠則形形則著著則明也日新所謂悠久無疆也好剛者常不能下人蓋有剛強不撓之才非有德故也大舜樂取於人以為善所謂有德者也書以玄德稱之玄德天德也故剛上而尚賢者必止健得天德之大正者能之非有天德之大者不能也賢不家食祿之也書曰惟賢非后不食蓋古之人不仕無祿則耕耕而食之家食也仕而得祿以代耕則不耕不耕則非家食也至於孟子所謂廩人繼粟庖人繼肉皆養賢大烹之道不必人君蚤暮哺啜之也二五之應以艮應乾止乾之健而畜之其於涉大川為餘事蓋有剛德可以涉難尚賢可以涉難大畜兼之故涉大川優為之矣易説象曰天在山中大畜君子以多識前言往行以畜其德伊川先生曰天為至大而在山之中所畜至大之象君子觀象以大其藴畜人之藴畜由學而大在多聞前古聖賢之言與行考迹以觀其用察言以求其心識而得之以畜成其德乃大畜之義也易傳陳瑩中答吳國華天在山中便是芥子納須彌之義先生謂正南北説却須彌無體芥子無量楊遵道録橫渠先生曰博文約禮猶至著入至簡故可使不得叛而去溫故知新多識前言往行以畜德繹舊業而知新蓋思昔未至而今至緣舊所見聞而察來皆其義也正蒙且滋養其明明則求經義將自見矣又不可徒養須觀它前言往行使畜得己德若要成德須是速行之學不長者無它術唯是與朋友講治多識前言往行以育其德非禮勿言非禮勿動即是養心之術也苟以前言往行為無益自謂不能明辨是非則是不能居仁由義自棄也決矣學者既知此心且擇所安而行之已不愧疑則闕之更多識前言往行以養其德多聞闕疑多見闕殆而今方要從頭整理將前言往行常合為一有不合自是非也人能不疑便是德進蓋已於大本處不惑雖未加工思慮必常在此積久自覺漸變學者惡其自足足則不復進並經學理窟龜山楊氏曰君子多識前言往行非徒資見聞而已所以畜德也畜德則所畜大矣易説易曰君子多識前言往行以畜其德孟子曰博學而詳説之將以反説約也世之學者欲以雕繪組織為工誇多鬬靡以資見聞而已故托其華不茹其實未嘗畜德而反約也彼亦烏用學為哉孟解白雲郭氏曰髙髙在上者天之體也而天道無乎不在其在人亦莫不有之皆自失之耳且以山言之一山必不能畜天之大也而畜天之道則為有餘在人亦然故君子欲多識前聖之言以知天之德何如而可畜也欲多識往聖之行以見天之德如是而可畜也是以稽其言考其行如是而畜之則天德盡在是矣故能畜其德也其德者謂剛健篤實輝光日新之天德也此所以為大畜也歟且識孔子之言曰天何言哉四時行焉百物生焉則知天之德以是而畜之也識惟天為大惟堯則之則見天之德以是而可畜也故知帝堯孔子之言行如此是為多識前言往行矣所以能畜其德也然自其不可名而言之則曰天道自其可名而言之則曰天德其實一也畜以德為本故大畜言畜其德小畜言懿文德能畜天德斯能行大道矣易説初九有厲利己象曰有厲利己不犯災也伊川先生曰大畜能一作艮止畜乾也故乾三爻皆取被止一作正之為義艮三爻皆取止之為義初以陽剛又健體而居下必上進者也六四在上畜止於己安能敵在上得位之勢若犯之而進則有危厲故利在己而不進也在它卦則四與初為正應相援者也在大畜則相應乃為相止畜上之與三皆陽則為合志蓋陽皆上進之物故有同志之象而無相止之義有危則宜已不可犯災危而行也不度其勢而進有災必矣並易傳橫渠先生曰趨其應則有二三之阻故不若己也易説廣平遊氏曰且賢者之畜君亦必有道焉量而後入信而後諌不量而入則將至於失身未信而諌則君必以為謗已故初則有厲而利己易説龜山楊氏曰剛健而上行乾德也然陽微而居一卦之下為上所畜有厲也進則犯災矣故利己易説白雲郭氏曰天道上行今居下焉有難畜之象惟聖人則安而畜之賢人則利而畜之中人之才則勉強而畜之必不使有失於天德也失天德則納諸陷阱其危可立而待然人雖知危之可畏而不知危之為利知危之可畏者不知反身修德之道也知危之為利者蓋以危而修德則無犯災之理反所以為己之利也故古之人以宴安為鴆毒如此則有厲為利己明矣畜德之初蓋有出於勉強知之而未必好之者故因有厲而畜其德也如艮之九三為力止之道則曰厲薰心同意若夫聖人則安不忘危存不忘亡治不忘亂蓋其修德不繫乎有厲無厲是以其身常安而國家可保故曰有始有卒者其惟聖人乎初九不足以與此利己者非若利吾身之利蓋誠利於治已也易説九二輿説輹象曰輿説輹中無尤也伊川先生曰二為六五所畜止勢不可進也五據在上之勢豈可犯也二雖剛健之體然其處得中道故進止無失雖志於進度其勢之不可則止而不行如車輿脫去一有其字輪輹謂不行也輿説輹而不行者蓋其處得中道動不失宜故無過尤也善莫善於剛中柔中者不至於過柔耳剛中中而才也初九處不得中故戒以有危宜已二得中進止自無過差故但言輿説輹謂其能不行也不行則無尤矣初與二乾體剛健而不足以進四與五隂柔而能止時之盛衰勢之強弱學易者所宜深識也並易傳橫渠先生曰不阻於三則見童於四不躁進者位中也易説廣平遊氏曰二則輿説幅二得中矣有剛中之德有載上之才猶有待而後行非不欲行也道合則從不可則去此中無尤之道也易説龜山楊氏曰五居尊位與二為應能上健者也二以剛中為上所畜雖欲上行不可得也故曰輿説輹言不行也以其得中故無尤易説白雲郭氏曰人心操則存捨則亡古之人必求其放心而後謂之學者以不能操其心而止之則不能畜德故也畜之初未能力也畜之中則不得不力止之矣故九二有輿説輹中無尤之辭焉輿説輹蓋必止不行之象止而説之則不失其中故無尤不能説而上雖中亦尤也孔子絶四曰毋意毋必毋固毋我雖孔子之聖亦必絶而毋之然後天德可存而孔子乃能配天況衆人乎故二過遷怒皆放心之小者顔子未嘗有焉亦可謂庶幾畜天德者矣此中庸所以言慎獨君子戒慎乎其所不睹恐懼乎其所不聞然後天命之性可使不失不然則物交物而引之驅而納諸罟擭陷阱之中矣至孟子則曰我四十不動心蓋亦説輹之道也易説九三良馬逐利艱貞曰間輿衛利有攸往象曰利有攸往上合志也伊川先生曰三剛健之極而上九之陽亦上進之物又處畜之極而思變也與三乃不相畜而志同相應以進者也三以剛健之才而在上者與合志而進其進如良馬之馳逐言其速也雖其進之勢一作志速不可恃其才之健與上之應而忘備與慎也故宜艱難其事而由貞正之道輿者用行之物衛者所以自防當自一無自字日常間習其車輿與其防衛則利有攸往矣三乾體而居正能貞者也當其鋭進故戒以知難與不失其貞一作正也志既鋭於進雖剛明有時而失不得不誡也九三所以利有攸往者以與在上者合志也上九陽性上進且畜已極故不下畜三而與一有三字合志上進也並易傳橫渠先生曰不防輿衛而進歷二隂則或有童牿説輹之害不利其往也本乎天者親上故上合志也易説廣平遊氏曰九二輿説輹至於三位髙而近君矣故良馬逐然世治不輕進國有道不變塞焉故利艱貞猶且自戒曰間吾輿以習其載間吾衛以防其逸力厚而義不行才全而用有序上非我應也而其德同已非上比也而其志合內之畜於己者如此其周外之畜於君者如此其審則安往而不利哉易説龜山楊氏曰九三居乾體之極能健行者也故曰良馬逐恃才而往易而不知戒則行或躓矣故利艱貞曰間輿衛輿以行逺間之則無覆轍之虞衛以自防間之則無失守之患此戒慎之至也然畜極而反理之常然上九雖有止健之才當畜道之窮變而通之之時也三為正應則與之合志矣故利有攸往易説兼山郭氏曰九三乾為馬三陽至此而並進良馬角逐之象也三陽之進有正有不正者焉則其從之難是以利艱正也經曰君子安其身而後動故曰間輿衛然後利有攸往方上九何天之衢往則合志也必也擇利於其身擇利於其君是則二三其德者也何畜賢之有哉易説白雲郭氏曰能止健而畜德無若九二説輹之道也説輹止健而有之夫欲何為哉蓋欲施之天下國家非獨善其一身而已此中庸之道也大畜之健中庸天命之性也止健率性之道也九三良馬逐修道之教也故中庸言能盡其性則盡説輹之義矣盡其性而盡人物之性此良馬逐利有攸往之義也良馬逐利有攸往蓋言用道也聖人之畜德確乎不可拔及其用也推而放諸四海而準雖有良馬之逐所以合天衢之志也良馬正為乾象言良馬則知九三畜乾之德至於用九矣然自輿説輹之止至於良馬逐之用中庸之道已備已蓋參天地贊化育之時上合天地之志猶曰利艱貞間輿衛蓋懼有失焉此中庸始言戒慎恐懼慎獨終言不愧于屋漏之義不然則湯之栗栗危懼文王小心翼翼詩書何取焉易説六四童牛之牿元吉象曰六四元吉有喜也伊川先生曰以位而言則四下應於初畜初者也初居最下陽之微者微而畜之則易制猶童牛而加牿大善而吉也槩論畜道則四艮體居上位而得正是以正德居大臣之位當畜之任者也大臣之任上畜止人君之邪心下畜止天下之惡人一無人字人之惡止於初則易既盛而後禁則扞格而難勝故上之惡既甚則雖聖人救之不能免違拂下之惡既甚則雖聖人治之不能免刑戮莫若止之於初如童牛而加牿則元吉也牛之性抵觸以角故牿以制之若童犢始角而加之以牿使抵觸之性不發則易而無傷以况六四能畜止上下之惡於未發之前則大善之吉也天下之惡已盛而止之則上勞於禁制而下傷於刑誅故畜止於微小之前則大善而吉不勞而無傷故可喜也四之畜初是也上畜亦然並易傳教人之術若童牛之牿當其未能觸時己先制之善之大者其次則豶豕之牙豕之有牙既已難制以百方制之終不能使之改唯豶其勢則性自調伏雖有牙亦不能為害如有不率教之人却須置其檟楚别以道格其心則不須檟楚將自化矣李籲師説廣平遊氏曰九三良馬逐利艱貞夫然後禁於未發如六四故為童牛而牿加焉格其非心如六五故為豶豕之牙蓋六四純隂而勢順賢者以剛克止之則牿牛之象也易説龜山楊氏曰六四居艮體之下與初為應畜初者也初雖乾體有健行之才陽微而未壯也故有童牛之象焉夫牛善觸者也童牛角始生未能觸者也牿之則易制矣四履近尊之位大臣任畜之責也上以格君心之非下以畜民之惡如童牛而牿之則元吉而有喜矣至其過惡已成而畜之雖有比干之忠臯陶之刑不能勝也易説兼山郭氏曰六四大畜之六四臣位也臣有止君之象六五君位也君有畜天下之象何以言之經曰剛上而尚賢能止健大正也大正者主乎艮也艮之能止者主乎四五之二爻六四以至柔而接乎下初九以剛健而應乎上上下之情通而能行止之時也方初九私欲之未行而能畜之將順於其早正救於其小也古之人君垂衣拱手不下袵席之上冕而前旒以蔽明黈纊充耳以塞聰前疑後丞左輔右弼王居中無為以守至正其止之有素也必也好惡之已形嗜欲之已著而欲面折廷爭攖龍鱗犯嚴顔自謂曰我能事君我能事君何知之晚也故成王剪桐之戲而唐叔以封非周公孰為之蓋將順之於其早正救之於其小故也然則六五畜天下者如之何書曰無若火始焰焰厥攸灼敘是以貴除其本也民惟邦本本固邦寧是則有固本之道也上古結繩以治後世聖人易之以書契為之書契除民訟之本也周人羣飲汝勿佚盡執拘以歸于周子其殺絶酒禍之本也詩首關雎之義明夫婦之道成父子之親也春秋書王正月公即位立君臣之正也父子親君臣正使父父子子夫夫婦婦而各止其分義豈一朝一夕之能哉蓋申其義去其害之有素是豶豕之牙之義也夫然後仁者不遺其親義者不後其君日月所照霜露所墜尺地莫非其有一民莫非其臣夫是之謂大畜也然六四者能盡事君之一心故能有喜六五賴及於天下故言有慶亦小大之異也易説白雲郭氏曰四在上卦之初蓋知早辨而止之於初者止於初則天理不失而人偽不萌故能全其天童牛全其天者也亦猶人之赤子也自童牛而後角角而充之其狠戾鬬爭之性斯無不至自赤子而充之放其良心亦無不至牛豈無童牛之善人豈無赤子之心哉皆以其放不知止故人欲日窮而天理日滅也孟子言大人不失赤子之心此童牛之牿之象也吉孰大於是哉牿牢之也童牛不必牿而牿之君子戒慎乎其所不睹也赤子之心良心也中庸天命之性也誠是已易説六五豶豕之牙吉象曰六五之吉有慶也明道先生曰豶豕之牙吉不去其牙而豶其勢則自善矣治民者不止其爭而教之讓之類是也劉絢師訓伊川先生曰六居君位止畜天下之邪惡夫以億兆之衆發其邪欲之心人君欲力以制之雖密法嚴刑不能勝也夫物有總攝事有機會聖人操得其要則視一無視字億兆之心猶一心道之斯行止之則戢故不勞而治其用若豶豕之牙也豕剛躁之物而牙為猛利若強制其牙則用力勞而不能止其躁猛雖縶之維之不能使之變也若豶去其勢則牙雖存而剛躁自止其用如此所以吉也君子法豶豕之義知天下之惡不可以力制也則察其機持其要塞絶其本原故不假刑法嚴峻而惡自止也且如止盜民有欲心見利則動苟不知教而迫於飢寒雖刑殺日施其能勝億兆利欲之心乎聖人則知所以止之之道不尚威刑而修政教使之有農一作耕桑之業知廉恥之道雖賞之不竊矣故止惡之道在知其本得其要而已不嚴刑於彼而修政於此是猶患豕牙之利不制其牙而豶其勢也在上者不知止惡之方嚴刑以敵民欲則其傷甚而無功若知其本制之有道則不勞無傷而俗革天下之福慶也並易傳豶豕之牙豕牙最能嚙害人只制其牙如何制得今人為惡却只就它惡禁之便無由禁止此見聖人機會處楊遵道祿廣平遊氏曰六五柔質而處剛又當尊位質柔則嗜欲易以深處剛則躁競易以逞當大畜之時賢者以大中之道正其大本則豶豕之象也禁於未發故能使之棄所習捐所能而人斯與之矣故有喜格其非心則窒其原矣非特禁未發而已也且幽王之惡大矣而當時大夫欲訛其心以畜萬邦則畜君之要正在於格其非心而已故取象於豶豕而無嫌於六五也蓋豕之為象其躁忿足以傷物而賊仁其嗜欲足以伐性而滅義今而窒其原則貪欲之情可化為不求而義不可勝用矣躁忿之質可化為不忮而仁不可勝用矣君仁莫不仁君義莫不義則非特人與之而已天斯祐之矣故有慶易説龜山楊氏曰六五君位也為大畜之主任天下之畜者也惟天生民有欲無主乃亂則民之亂以有欲也故先王畜天下之惡靜亂而息民在窒其欲而已孔子曰苟子之不欲雖賞之不竊欲民之不竊在上之不欲耳非刑威所能禁也五以柔順大中而履尊位其畜天下能不以威刑者也故曰豶豕之牙吉豕牙躁動而難制非力之所能勝也豶之以窒其欲則躁動自息矣此先王畜天下之道也易説兼山郭氏曰六五書之費誓曰今惟淫舍牿牛馬先儒以牿為牢間疑其非橫木也豶豕者去其勢也去其勢安在有牙而不可犯也童牛之牿殆謂馴之於初豶豕之牙殆謂絶其勢而制之止也不然則繫于金柅且不能制其蹢躅也久矣易説白雲郭氏曰不能止之於初如童牛之牿如大人不失赤子之心或至於有害當如九二説輹之道故言豶豕之牙也牛之所以為害者角也豕之所以為害者牙也童牛則止於角未生之初故其止也易豕既有牙斯不可止必除其牙則不為害矣是猶君子必盡去人欲然後天性良心可得而復也童牛未嘗失天性無欲可去故大人不失赤子之心似之牙豕已有失矣蓋已陷於人欲者故求其放心之論似之能求其放心是以吉而有慶也復之不逺復顔子之克已復禮其義皆相近有喜者自得於一心而已有慶者喜其廣大及物之意蓋五為君道與四不同能盡已之性以盡人物之性贊天地之化育其慶豈不大哉易説上九何天之衢亨象曰何天之衢道大行也伊川先生曰豫聞之胡先生曰天之衢亨誤加何字事極則反理之常也故畜極而亨小畜畜之小故極而成大大畜畜之大故極而散極既當變又陽性上行故逐散也天衢天路也謂虛空之中雲氣飛鳥往來故謂之天衢之亨謂其亨通曠闊無有蔽阻也在畜道則變矣變而亨非畜道之亨也何以謂之天衢以其無止礙道路大通行也以天衢非常語故象特設問曰何謂天之衢以道路大通行取空豁之狀也以象有何字故爻下亦誤加之並易傳橫渠先生曰其道大行也升於天何待衢路而進言無所不通也衢字當為絶句艮為止上二隂也不以止其類也故亨易説廣平遊氏曰畜道之成至於天人交助則賢路自我而四達矣故上九曰何天之衢亨賢路而謂之天衢言陟降之當於天心也彖曰剛上而尚賢則大畜之義主於上九也然崇俊良以列庶位而推轂賢路使天下無家食之賢者上九之任也故其爻以何天之衢為言天下至於無家食之賢則道之大行孰盛於此此大畜所以為先王之盛時也易説龜山楊氏曰居大畜之終畜極而反則乾道上行矣故天衢亨也易説白雲郭氏曰孟子曰聖人之於天道命也有性焉君子不謂命也如童牛之牿豶豕之牙如不失赤子之心求其放心豈非其性哉能盡是性是以至於天之衢也何天之衢聖人止於天道矣止於天道然後萬物各正性命保合太和是以道大行而亨也以在上言之則蕩蕩乎民無能名之時也以在下言之則仰之彌髙鑽之彌堅瞻之在前忽焉在後之時也方是時博厚配地髙明配天悠久無疆雖日月所照霜露所墜凡有血氣者莫不尊親故曰配天其上九之謂歟究觀大畜上下卦三爻各相類童牛之牿則知利己之厲矣豶豕之牙則説輹矣良馬逐則何天之衢矣蓋艮之所止者乾之健也乾之健為艮之所止也是以三爻各相類特君臣之道不同耳然尚賢之義六爻有之乎曰止健與止賢畜德與畜賢其義皆一反求尚賢之義於六爻之中亦猶止健畜德之道也特尚賢為大畜之一耳止健畜德足以兼之易説大易粹言卷二十六
