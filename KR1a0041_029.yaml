body:
  text: 大易粹言卷二十九宋方聞一編坎下坎上伊川先生曰習坎序卦物不可以終過故受之以坎坎者陷也理無過而不已過極則必陷坎所以次大過也習謂重習它卦雖重不加其名獨坎加習者見其重險險中復有險其義大也卦中一陽上下二隂陽實隂虛上下無據一陽陷於二隂之中故為坎陷之義陽居隂中則為陷隂居陽中則為麗凡陽在上者止之象在中陷之象在下動之象隂在上説之象在中麗之象在下巽之象陷則為險習重也如學習溫習皆重復之義也坎陷一作險也卦之所言處險難之道坎水也一始於中有生之最先者也故為水陷水之體也易傳問張子曰隂陽之精互藏其宅然乎曰此言甚有味由人如何看水離物不得故水有離之象火能入物故火有坎之象胡氏拾遺橫渠先生曰習坎重襲之義八純卦唯此加習者餘皆一字可盡其義坎取其險故重之而其險乃著也色以離見聲以震聞臭以巽知味以坎逹坎離者天地之中二氣之正交然離本隂卦坎本陽卦以此見二氣其本如此而交性也非此二物則無易並易説一陷溺而不得出為坎一附麗而不能去為離正蒙習坎有孚維心亨行有尚伊川先生曰陽實在中為中有孚信維心亨維其心誠一故能亨通至誠可以通金石蹈水火何險難之不可亨也行有尚謂以誠一而行則能出險有可嘉尚謂有功也不行則常在險中矣易傳橫渠先生曰人欲得正己而物正大抵道義雖不可緩又不欲急迫在人固須求之有漸於己亦然蓋精思潔慮以求大功則其心隘惟是得心洪放得如天地易簡易簡然後能應物皆平正博學於文者只要得習坎心亨蓋人經歷險阻艱難然後其心亨通博學者皆是小經應物不學則無由知之故中庸之欲前定將所以應物也經學理窟白雲郭氏曰易中諸卦於卦上無加字者獨此稱習坎孔氏正義云以坎為險難故特加習名王原叔先生引徐氏新義謂習坎字上脫卦名一坎字而易中卦名之下亦無重言卦者故離卦不曰離重離巽卦不曰巽重巽其重言卦名者皆孔子彖辭也孔氏既未明徐氏尤失之或者云本無習字緣坎卦六畫漫滅正如習字故傳寫者誤以漫滅之卦畫為習字又於其上添畫一卦是坎字之上十二畫矣然雖以習字漫滅觀之僅有六畫之象如此則其誤在𨽻古既出之後而彖象皆已先言習坎則此説又非矣大抵坎加習字學者思慮終不能得不可更附會穿鑿也坎離等六卦卦辭并彖皆只以三畫取義坎以剛中而實故稱有孚心亨有剛中之德者未有不能濟難也故行有尚如頥大過噬嗑中孚之類皆六畫取象者也坎以三畫取義是一卦之中其象再見故云習坎豈乾坤不可稱習而六子之序始於坎故坎獨稱歟其義則六卦俱有之矣疑當闕之未可深辨也易説彖曰習坎重險也水流而不盈行險而不失其信維心亨乃以剛中也行有尚往有功也天險不可升也地險山川丘陵也王公設險以守其國險之時用大矣哉伊川先生曰習坎者謂重險也上下皆坎兩險相重也初六云坎窞是坎中之坎重險也水流而不盈陽動於險中而未出於險乃水性之流行而未盈於坎既盈則出乎坎矣行險而不失其信陽剛中實居險之中行險而不失其信者也坎中實水就下皆為信義有孚也維其心可以亨通者乃以其剛中也中實為有孚之象至誠之道何所不通一作亨以剛中之道而行則可以濟險難而亨通也以其剛中之才而往則有功故可嘉尚若止不行則常在險中矣一作也坎以能行為功髙不可升者天之險也山川丘陵地之險也王公君人者觀坎之象知險之不可陵也故設為城郭溝池之險以守其國保其民人是有用險之時其用甚大故贊其大矣哉山河城池設險之大端也若夫尊卑之辨貴賤之分明等威異物采凡所以杜絶陵僣限隔上下者皆體險之用也並易傳橫渠先生曰可盈則非謂重險也中柔則心無常何能亨也內外皆險義不可止故行有尚也坎維心亨故行有尚外雖積險苟處之心亨不疑則雖難必濟而往有功也今水臨萬仞之山要下即下無復凝滯人在險前惟知有義理而已則復何回避所以心通並易説龜山楊氏曰北方寒極而隂凝一陽動乎中故凝釋而為水水者一之所生也一之所起有一而未形其為物不二矣故有孚心亨陽在內也誠孚于中險不能陷故亨夫險非可止之地止於險則終於陷而已故行有尚往乃有功也水流而不盈陽微未出中也萬折必東行險而不失其信隂之陷陽小人害君子之象也宜無施而可然易變易也隨時變易以從道則險亦有時而用矣王公設險以守其國是也險之時用豈不大矣哉繫辭曰變動不居周流六虛其斯之謂歟設險之義伊川論之詳矣自習坎有孚至此易説兼山郭氏曰二五剛中故為有孚維心亨有過物者必濟故行有尚天險不止於法度之威地險不止於髙城深池在夫王公所設之如何爾易説白雲郭氏曰彖言重險正釋習坎二字則習之為重明矣先儒謂便習非也水流而不盈者坎之險無窮已也行險而不失其信者坎之德有孚也夫以一陽而掩於二隂非亨也然終不能陷者剛中也剛中則所守至固雖非亨而心亨矣孟子所謂冨貴不能淫貧賤不能移威武不能屈者也故孔子亦謂棖也欲焉得剛剛中之德用以有行何往而非功其本則自於有孚心亨之微推而及之天下也君子正心誠意而能治天下國家者以此故中庸之學不離乎一性之內其失則為罟擭陷阱而君子每慎其獨者所以守剛中之德為心亨之道也天非險也而人不可升者豈天之大險歟地非險也而山川丘陵豈地之大險歟天地之大尚未離乎坎險之道是以王公內則治教政刑外則城郭溝池皆所以象天地之險以守其國也故彖又曰險之時用大矣哉蓋人知用險於小而不知險有大人之事孟子所謂王請大之者是亦孔子大矣哉之意也坎無時險有時故曰險之時用易説象曰水洊至習坎君子以常德行習教事伊川先生曰坎為水水流仍洊而至兩坎相習水流仍洊之象也水自涓滴至於尋丈至於江海洊習而不驟一作讓者也其因勢就下信而有常故君子觀坎水之象取其有常則常久其德行人之德行不常則偽也故當如水之有常取其洊習相受則以習熟其教令之事夫發政行教必使民熟於聞聽然後能從故三令五申之若驟告未喻遽責其從雖嚴刑以驅之一無之字不能也故當如水之洊習易傳龜山楊氏曰習坎重險也水洊至相仍而不絶故積習而為重險行險而不失其信有常德行之象焉盈科而進不舍晝夜有習教事之象焉故居子以之易説兼山郭氏曰象習坎重險也水流而不盈行險而不失其信言坎之常也行有尚往有功言坎之用也故象曰水洊至習坎君子以常德行習教事易以坎為水水靜則明燭鬚眉平中準而大匠可以取法及其過也懷山襄陵浩浩滔天非方舟順風不能以濟也是以聖人制為刑法以治其小陳其甲兵以防其大有亷陛之峻以象天有封疆之固以象地每歲孟春遒人以木鐸徇于路又曰三時務農一時教戰無非教也故常德行以立事也習教事以制變也黃帝垂衣裳而天下治七十二戰而禽滅蚩尤用此道也經曰地中有水師成諸坎也易説白雲郭氏曰坎者水也原泉混混不舍晝夜放乎四海故言洊至洊至則其來不已險陷亦不已是為習坎之義也君子法之以常德行習教事曰常曰習皆不已之義也常德行所以行險而不失其信習教事所以設險而固其國造次顚沛必於是斯為常矣國家間暇及是時明其政刑斯為習矣常德行故能有孚維心亨習教事故能行有尚而往有功二者其可一日廢乎亦猶君子自強不息以法乾之健者也易説初六習坎入于坎窞凶象曰習坎入坎失道凶也伊川先生曰初以隂柔一無柔字居坎險之下柔弱無援而處不得當非能出乎險也唯益陷於深險耳窞坎中之陷處已在習坎中更入坎窞其凶可知由習坎而更入坎窞失道也是以凶能出於險乃不失道也並易傳橫渠先生曰比於二無出險之志故云入于坎窞也易説龜山楊氏曰柔不當位失道也居重險之時承剛而在下失道而不足以出險則益陷於險矣故入于坎窞凶窞坎中之陷處也易説白雲郭氏曰習坎重險也初六以隂柔之才居重險之下陷於坎險而不能出者也不能出者無剛中之德而失處險之道是以凶也若從便習之義則初六不為坎窞之凶矣易説九二坎有險求小得象曰求小得未出中也伊川先生曰二當坎險之時陷上下二隂之中乃至險之地是有險也然其剛中之才雖未能出乎險中亦可小自濟不至如初益陷入于深險是所求小得也君子處險艱而能自保者剛中而已剛則才足自衛中則動不失宜未出中者方為二隂所陷在至險之地以剛中之才不至陷於深險是所求小得然未能出坎中之險也並易傳橫渠先生曰險難之際弱必附強上下俱隂求必見從故求則必小得然二居險中而未出也易説龜山楊氏曰二隂在外有險也一陽間乎二隂之間未能出中也雖有剛明之才未出中則不足以夷天下之險故求小得而已夫求者自求也外雖有險而心常亨故曰求小得易説白雲郭氏曰以一陽掩於二隂之中不能無難也故曰坎有險然剛而得中有心亨之道故可以求小得而不至於喪其良心也一離乎中則失之矣故象言求小得以其未出中也求得之際道之所以失也以九二剛中尚且小得而已況無剛中之德者乎是以君子戒慎恐懼乎不睹不聞之際誠非用心之過也聖人所謂求小得不過如明哲保身而已異乎小人之求之也易説六三來之坎坎險且枕入于坎窞勿用象曰來之坎坎終無功也伊川先生曰六三在坎陷一作險之時以隂柔而居不中正其處不善進退與居皆不可者也來下則入于險之中之上則重險也退來與進之皆險故云來之坎坎既進退皆險而居亦儉枕謂支倚居險而支倚以處不安之甚也所處如此唯益入於深險耳故云入于坎窞如三所處之道一無之道字不可用也故戒勿用進退皆險處又不安若用此道當益入于險終豈能有功乎以隂柔處不中正雖平易之地尚致悔咎況處險乎險者人之所欲出也必得其道乃能去之求去而失其道益困窮耳故聖人戒如三所處不可用也並易傳橫渠先生曰前之入險退來枕險入窞與初六同易説龜山楊氏曰來則乘剛之則涉險故來之俱坎也險且枕居險而止故入于坎窞入于坎窞則終於陷而已矣故不可用易説白雲郭氏曰三居重險之中當上下之際進則遇險退亦險也又履非其位所處亦險矣既無濟險之道終陷于坎窞而已宜其勿用也又安有行有尚往有功之義哉是知其終無功也來之進退之象坎之下卦言處險之道上卦言用險之道枕言處險之上也易説六四樽酒簋二用缶納約自牖終無咎象曰樽酒簋二剛柔際也伊川先生曰六四隂柔而下無助非能濟天下之險者以其在髙位故言為臣處險之道大臣當險難之時唯至誠見信於君其交固而不可間又能開明君心則可保無咎矣一作也夫以上之篤信唯當盡其質實而已多儀而尚飾莫如燕享之禮故以燕享喻之言當不尚浮飾唯以質實所用一樽之酒二簋之食復以瓦缶為器質之至也其質實如此又須納約自牖納約謂進結於君之道牖一有有字開通之義室之暗也故設牖所以通明自牖言自通明之處以況君心所明處詩云天之牖民如塤如箎毛公訓牖為道亦開通之謂一作義人臣以忠信善道結於君心必自其所明處乃能入也人心有所蔽有所通所蔽者暗處也所通者明處也當就其明處而告之求信則易也故云納約自牖能如是則雖艱險之時終得無咎也且如君心蔽於荒樂唯其蔽也故爾雖力詆其荒樂之非如其不省何必於所不蔽之事推而及之則能悟其心矣自古能諌其君者未有不因其所明者也故訐直強徑者率多取忤而溫厚明辨者其説多行且如漢祖愛戚姬將易太子是其所蔽也羣臣爭之者衆矣嫡庶之義長幼一作少長之序非不明也如其蔽而不察何四老者髙祖素知其賢而重之此其不蔽之明心也故因其所明而及其事則悟之如反手且四老人之力孰與張良羣公卿及天下之心其言之切孰與周昌叔孫通然而不從彼而從此者由攻其蔽與就其明之異耳又如趙王太后愛其少子長安君不肯使質於齊此其蔽於私愛也大臣諌之雖強既曰蔽矣其能聽乎愛其子而欲使之長久富貴者其心之所明也故左師觸龍因其一有所字明而導之以長久之計故其聽也如響非惟告於君者如此為教者亦然夫教必就人之所長所長者心之所明也從其心之所明而入然後推及其餘孟子所謂成德逹才是也象只舉首句此此多矣樽酒簋二質實之至剛柔相際接之道能如此則可終保無咎君臣之交能固而常者在誠實而已剛柔指四與五謂君臣之交際也並易傳或問坎之六四樽酒簋二用缶納約自牖何義也曰坎險之時也此是聖人論大臣處險難之法樽酒簋二用缶謂當險難之時更用甚得無非是用至誠也納約自牖言欲納約於君當自明處牖者開明之處也欲開悟於君若於君所蔽處何由入得如漢髙帝欲易太子它人皆爭如嫡庶之分夫嫡庶之分髙祖豈不知得分明直知不是了犯之此正是髙祖所蔽處更豈能曉之獨留侯招致四皓此正髙祖所明處蓋髙祖自匹夫有天下皆豪傑之力故憚之留侯以四皓輔太子髙祖知天下豪傑歸心於惠帝故更不易也昔秦伐魏欲以長安君為質太后不可左師觸龍請見云云遂以長安君為質焉夫太后只知愛子更不察利害故左師以愛子之利害開悟之也劉元承手編橫渠先生曰四五俱得隂陽之正險阻之際近而相得誠素既接雖簡略於禮無咎也上比於五有進出之漸故無凶易説龜山楊氏曰四居大臣之位無剛健之才不足以夷天下之險故以人臣處險之道言之傳曰為臣必臣敬恪恭儉臣也則為臣之義以敬恪恭儉為主樽酒簋二以儉為禮也缶器之質者也至欽無文不致飾也務盡敬恪而已夫處重險之中非盈禮尚文之時故用缶納約自牖所以進結其君以是而已牖所以通內外開其明也齊宣王曰寡人有疾寡人好勇孟子則以文武之事告之好貨色則以公劉太王之事告之好勇猶之可也好貨好色人君之邪心不可為也而孟子皆曰惟恐王之不好也蓋逆閉其途而拒絶之則齊王進善之心熄矣故孟子啓其蔽開其明使通內外庶乎其有見矣此自牖之義歟知此則知所以事君矣易説兼山郭氏曰六四醴酒之設玄酒之尚貴其誠之著也國有凶荒則殺禮而多昏時有險易也是以至薄之禮虛中之器可以自幽以逹明坎之時為然四五近比而相親非正也自牖之象也説者謂觸龍君因暗以發其明然卦無是象故也易説白雲郭氏曰有孚者坎之德君子行險而不失其信所以法其德也觀乎六四蓋可見矣且一樽之酒二簋之食瓦缶之器至微物也苟能虛中盡誠以通交際之道君子不以微薄為失禮亦猶自牖納約其誠已至不必階序行禮之地是以終無咎也坎之六四在上體之下與五為比當剛柔交際之地所謂能用有孚之道者也傳曰苟有明信澗溪沼沚之毛蘋蘩蕰藻之菜箱筥錡釡之器潢汙行潦之水可薦於鬼神可羞於王公者無它焉交際之道以誠為主故也春秋之時齊侯衛侯胥命于蒲蓋中約言而退終二公之世未嘗以征伐相加雖二君未賢於當時之君胥命未為得禮亦猶自牖納約之事而聖人有取焉傳亦言其近古近正者蓋其信為有餘也孔子不以人廢言況屢盟長亂之世有約言近古之事乎是亦不得中行而與狂狷之義也由是觀之則樽酒簋二足以盡交際之道者主於習坎有孚而已易説九五坎不盈祗既平無咎象曰坎不盈中未大也伊川先生曰九五在坎之中是不盈也盈則平而出矣祗宜音抵抵也復卦云無祗悔必抵於己平則無咎既曰不盈則是未平而一無而字尚在險中未得無咎也以九五剛中之才居尊位宜可以濟於險然下無助也二陷於險中未能出餘皆隂柔無一作非濟險之才人君雖才安能獨濟天下之險居君位而不能致天下出於險則為有咎必祗既平乃得無咎九五剛中之才而得尊位當濟天下之險難而坎尚不盈乃未能平乎險難是其剛中之道未光大也險難之時非君臣協力其能濟乎五之道未大以無臣也人君之道不能濟天下之險難則為未大不稱其位也並易傳橫渠先生曰險難垂出而下比於四不能勉成其功光大其志故聖人惜之曰只既平無咎而已矣不能往有功也一本六坎盈則進而往有尚矣易説龜山楊氏曰剛得中而履尊位宜可以濟天下之險矣然以一陽在重險之中則剛雖中而未大也故坎不盈祗既平而已盈則出險矣然既平則有出險之漸故無咎易説白雲郭氏曰水之來終不可盈而不失其平者水之常也守其常而不變固可以無咎矣然九五以剛中之才而居君位當法天地設險以守其國蓋思有濟險之道以二隂見掩無應以助之僅能守常而已非大人之事也故象曰中未大也與屯膏小貞之義相類易説上六係用徽纆置于叢棘三歲不得凶象曰上六失道凶三歲也伊川先生曰上六以隂柔而居險之極其陷之深者也以其陷之深取牢獄為喻如係縛之以徽纆因置於叢棘之中隂柔而陷之深其不能出矣故云至于三歲之久不得免也其凶可知以隂柔而自處極險之地是其失道也故其凶至于三歲之久而不得免焉終凶之辭也言久有曰十有曰三隨其事也陷于獄至于三歲久之極也它卦以年數言者亦各以其事也如三歲不興十年乃字是也易傳橫渠先生曰上六過中逃險而失道者也不附比陽中幾於迷復之凶故為所係纍也隂柔不能附比於陽處險之極乘剛宜其為所拘戮也易説龜山楊氏曰居重險之極無剛健之才終於陷而已矣猶之係徽纆而置叢棘也無出險之才而置叢棘可謂失道矣其凶三歲不亦宜乎三歲者終凶之辭也易説兼山郭氏曰上六坎者水也源泉混混不舍晝夜決之東方則東流決之西方則西流水無分於東西然而萬折必東者以其信也水由地中放乎四海注焉不滿泄之不竭大通不加窮居不損猶之人也遺佚而不怨厄窮而不憫者由心亨也經曰巽乎水而上水羸其瓶凶以動出為功也故曰有孚維心亨行有尚九二求小得未出中也九五祗既平中未大也皆未能終坎之功至於上六專取用險之極非聖人之所尚三歲不得免而無耻由上失其道也易説白雲郭氏曰坎之爻以近中為得初與四是也初居重險之下失道而凶獨四能行其志是以得納約自牖之道其過中而失之者三與上也三處險而不能有功上用險之過亦已失矣蓋刑法坎險之象而非用坎之道故用徽纆叢棘為坎之道者上六之過也雖使三歲之久亦將不得其情能無凶乎是上失其道而終凶也其道何如有孚維心亨是也以是行之斯有功矣古之聖人任德不任刑故孔子曰上好信則民莫敢不用情上六之失其在兹乎易説大易粹言卷二十九
