body:
  text: 大易粹言卷四十三宋方聞一編乾下兊上伊川先生曰夬序卦益而不已必決故受之以夬夬者決也益之極必決而後止理無常益益一無下益字而不已已乃決也夬所以次益也為卦兊上乾下以二體言之澤水之聚也乃上於至髙之處有潰決之象以爻言之五陽在下長而將極一隂在上消而將盡衆陽上進決去一隂所以為夬也夬者剛決之義衆陽進而決去一隂君子道長小人消衰將盡之時也易傳夬揚于王庭孚號有厲告自邑不利即戎利有攸往伊川先生曰小人方盛之時君子之道未勝安能顯然以正道決去之故含晦俟時漸圖消之之道今既小人衰微君子道盛當顯行之於公朝使人明知善惡故云揚于王庭孚信之在中誠意也號者命衆之辭君子之道雖長盛而不敢忘戒備故至誠以命衆使知尚有危道雖以此之甚盛決彼之甚衰若易而無備則有不虞之悔是尚有危理必有戒懼之心則無患也聖人設戒之意深矣君子之治小人以其不善也必以已之善道勝革之故聖王誅亂必先修已舜之敷文德是也邑私邑告自邑先自治也以衆陽之盛決於一隂力固有餘然不可極其剛至於太過太過乃如蒙上九之為寇也戎兵者強武之事不利即戎謂不宜尚壯武也即從也從戍尚武也利有攸往陽雖盛未極乎上隂雖微猶有未去是小人尚有存者君子之道有未至也故宜進而往也不尚剛武而其道益進乃夬之善也並易傳白雲郭氏曰以剛決柔謂之夬剛柔者君子小人之象也小人之害君子也以喜怒之私心往往隂為之謀以行譛害君子之去小人也以天下之公義是以暴揚于王庭孚號其有自取危厲之道而決之也以一柔而乘五剛自危之道也不能退聽以違之是其可決也告自邑者始自王庭孚號其有厲而決之然後自邑國告之及於四方以見盡天下之公義也夫威天下者不以兵革之利況君子決小人有道存焉豈假威力以強之乎是以不利即戎也利有攸往者乾道將復雖君子不得自己往而決之隨時之義也此舜所以必先去四凶然後天下可得而治矣易説彖曰夬決也剛決柔也健而説決而和揚于王庭柔乘五剛也孚號有厲其危乃光也告自邑不利即戎所尚乃窮也利有攸往剛長乃終也伊川先生曰夬為決義五陽決上之一隂也健而説決而和以二體言卦才也下健而上説是健而能説決而能和決之至善也兊説為和揚于王庭柔雖消矣然居五剛之上猶為乘陵之象隂而乘陽非理之甚君子勢既足以去之當顯揚其罪於王朝大庭使衆知善惡也孚號有厲盡誠信以命其衆而知有危懼則君子之道乃無虞而光大也告自邑當先自治不宜專尚剛武即戎則所尚乃至窮極矣夬之時所尚謂剛武也陽剛雖盛長猶未終尚有一隂更當決去則君子之道純一而無害之者矣乃剛長之終也並易傳橫渠先生曰不可以必勝而忽慢故能矜慎則愈光也除惡務本故利有所進而後為德乃終並易説廣平遊氏曰揚于王庭誦言於上也孚號誕告於下也告自邑自近而及逺也夫去小人而播告之修若是其詳何也蓋君子之夬也豈徒決其人而已固將戮一以懲百使天下皆知惡之不可為如四罪而天下服也然小人之隂慝其慮身甚周其欲害君子之意甚切將欲決之能無疑乎故初則不勝二則惕號三猶有凶也雖然彼以其邪我以吾正彼以其凶我以吾仁又方與羣剛協德盡道以去之其憂不濟乎故其危也乃其所以為光也若夫九五則據利勢操至權其除惡之易如剃莧陸甚易而無危矣然才髙而性剛必期於夬夬而後已雖未過中於道為未光也易説白雲郭氏曰彖明剛決柔謂之夬非剛決柔不名夬也然有乾之健故能決有兊之説故能和小人既決合天下之公義故天下説而和所謂四罪而天下咸服也柔乘五剛不得不正其罪是所以必揚于王庭也其危乃光者明信宣布其所以自取危亡之道則君子之公義乃明矣所尚乃窮者以威力為尚而不知有道存焉適足以致小人之辭是自窮之道也剛長乃終者五剛既盛必復於乾而後己柔不去則剛不長剛不長非終道也小人不去則君子之道不長君子之道不長非君子之終也剛長乃終必決之義也易説象曰澤上於天夬君子以施祿及下居德則忌伊川先生曰澤水之聚也而上於天至髙之處故為夬象君子觀澤決於上而注溉於下之象則以施祿及下謂施其祿澤以及於下也觀其決潰之象則以居德則忌居德謂安處其德則約也忌防也謂約立防禁有防禁則無潰散也王弼作明忌亦通不云澤在天上而云澤上於天上於天則意不安而有決潰之勢云在天上乃安辭也易傳橫渠先生曰君子道長故非德之禁可以必行然不可恃令之行無恩以及下也易説白雲郭氏曰説萬物者莫説乎澤今澤上於天有必下之勢在萬物有必説之理君子法之所以施祿及下是不以富貴自有而與天下共之也施祿及下者君子之所以澤物也居德則忌者君子之所以處己也所處在德不踰法禁之中躬己之厚也子夏所謂大德不踰間之義也惟躬已厚故可以澤物而天下説之矣孔子曰修已以安百姓故人君未有不正心誠意修身能治天下國家者也或謂忌者禁民為非也夬之象以説下為主無法禁之義蓋夬之取名本於五剛一柔卦彖論全卦六畫之象故以剛決為主而象則分兊與乾之二象論之故以説下為主是以其義不同也輔嗣又以則忌為明忌失之矣忌猶自有忌憚故亦通不踰法禁之意易説初九壯于前趾往不勝為咎象曰不勝而往咎也伊川先生曰九陽爻而乾體剛健在上之物乃在下而居決時壯于前進者也前趾謂進行人之決於行也往而宜則其決為是往而不宜則決之過也故往而不勝則為咎也夬之時而往往決也故以勝負言九居初而壯於進躁於動者也故有不勝之戒隂雖將盡而已之躁動自宜有不勝之咎不計彼也人之行必度其事可為然後決之則無過矣理不能勝而且往其咎可知凡行而有咎者皆決之過也並易傳橫渠先生曰言能慮勝而往則無咎易説白雲郭氏曰四剛過中已為大壯況夬之五剛乎故大壯初九曰壯于趾而夬曰壯于前趾則又欲速進其壯矣然初九居剛長之初力未能決有必不勝之理必不勝而往其咎宜也此復所以有朋來無咎之義而夬之初九失之易説九二惕號莫夜有戎勿恤象曰有戎勿恤得中道也伊川先生曰夬者陽決隂君子決小人之時不可忘戒備也陽長將極之時而二處中居柔不為過剛能知戒備處夬之至善也內懷兢惕而外嚴誡號雖莫夜有兵戎亦可勿恤矣莫夜有兵戎可懼之甚也然可勿恤者以自處之善也既得中道又知惕懼且有戒備何事之足恤也九居二雖得中然非正其為至善何也曰陽決隂君子決小人而得中豈有不正也知時識勢學易之大方也並易傳橫渠先生曰警懼中號能孚號而有厲也以必勝之剛決至危之柔能自危慮雖有戎何恤能得中道故剛而不暴易説白雲郭氏曰初九過於用剛而不知不勝之咎九二處中居隂則無過焉是以有兢慎戒不虞之義惕知懼也號明戒也有備則無患故雖莫夜有戎非所憂也得中道者以剛中自治而已非如初九之過於用剛者也大壯以初九九三用壯而二則貞吉皆與夬同惕號鄭氏音號令之號而作號呼者非其義也易説九三壯于頄有凶君子夬夬獨行遇雨若濡有愠無咎象曰君子夬夬終無咎也伊川先生曰爻辭差錯安定胡公移其文曰壯于頄有凶獨行遇雨若濡有愠君子夬夬無咎亦未安也當云壯于頄有凶獨行遇雨君子夬夬若濡有愠無咎夬決尚剛健之時三居下體之上又處健體之極剛果於決者也頄顴骨也在上而未極於上者也三居下體之上雖在上而未為最上上有君而自任其剛決壯于頄者也有凶之道也獨行遇雨三與上六為正應方羣陽共決一隂之時已若以私應之故不與衆同而獨行則與上六隂陽和合故云遇雨易中言雨者皆謂隂陽和也君子道長決去小人之時而已獨與之和其非可知唯君子處斯時則能夬夬謂夬其夬果決其斷也雖其私與當逺絶之若見濡汚有愠惡之色如此則無過咎也三健體而處正非必有是失也因此義以為教耳爻文所以交錯者由有遇雨字又有濡字故誤以為連也一作誤而相連也牽梏於私好由無決也君子義之與比決於當決故終不至於有咎也並易傳橫渠先生曰九三以陽居陽進決於上是壯于頄也不得中道過壯或凶故曰有凶君子明於事幾能夬於用夬進而緩之以善其終不假用衆故曰獨行使之説從故曰遇雨若濡君子之心終無係纍故必有愠雖其有愠於正無害故曰無咎故君子之道綽然餘裕終不為咎也易説白雲郭氏曰夬與大壯內卦三爻相類故初九九三言壯壯者小人用剛之事也非大者之壯也二卦九三皆具君子小人二義故大壯曰小人用壯君子用罔而此則曰壯于頄有凶君子夬夬是也以小人用壯言之則知壯于頄者小人事也頄面顴也上體也用壯于上而不知有時焉是以凶也君子之剛則異乎此當可決之時則決之君子之道也是以九五之決有莧陸之易小人獨行用壯雖遇雨之和猶濡而有愠況非和乎故其為過實自取之無所歸咎也唯君子明夬夬之義則終無咎矣故象言終無咎非釋爻辭也蓋言小人之有咎不若君子終無咎也九三雖用壯而上六為應故有遇雨之象夬夬者上之夬夬時也下之夬決之也得夬之時而後夬決也大壯於君子用罔之下復言小人事故曰羝羊觸藩贏其角此於君子夬夬之後言獨行遇雨其義同也皆言君子小人者九三之位有上下之義然小人之歸者多矣故聖人皆重明小人之戒也胡安定以君子夬夬居若濡有愠之下伊川以獨行遇雨在君子夬夬之上皆以下有無咎二字難釋然義亦可通不必易也至諸家非大失其意則不明釋之皆疑故也易説九四臀無膚其行次且牽羊悔亡聞言不信象曰其行次且位不當也聞言不信聰不明也伊川先生曰臀無膚居不安也行次且進不前也次且進難之狀九四以陽居隂剛決不足欲止則衆陽並進於下勢不得安猶臀傷而居不能安也欲行則居柔失其剛壯不能強進故其行次且也牽羊悔亡羊者羣行之物牽者挽拽之義言若能自強而牽挽以從羣行則可以亡其悔然既處柔必不能也雖使聞是言亦必不能信用也夫過而能改聞善而能用克己以從義唯剛明者能之在它卦九居四其失未至如此之甚在夬而居柔其害大矣九處隂位不當也以陽居柔失其剛決故不能強進其行次且剛然後能明處柔則遷失其正性豈復有明也故聞言而不能信者蓋其聰聽之不明也並易傳橫渠先生曰一隂在上衆陽爭趨三其正應已獨乘之故行止皆凶牽羊者必讓而先之則為力也易溺於所趨必不能用故曰聞言不信溺於心者聽必不聰易説白雲郭氏曰五剛之中九四獨非中正之位故為不明之象蓋有因循苟安之心且當三陽並進之時已獨居其上則不得其安矣故臀無膚初無果敢有為之志故其行次且能自勉以從陽亦可亡其悔以羊很而無知九四之象牽如牽復之牽勉強之意也然有見善不明聞言而不信者其悔亦未能亡也陽喜進而隂喜退其位不當則進退不一是以次且君子聽思聰故聞善言則信九四不足以為此易説九五莧陸夬夬中行無咎象曰中行無咎中未光也伊川先生曰五雖剛陽中正居尊位然切近於上六上六説體而卦獨一隂陽之所比也五為決隂之主而反比之其咎大矣故必決其決如莧陸然則於其中行之德為無咎也中行中道也莧陸今所謂馬齒莧是也曝之難乾感隂氣之多者也而脆易折五若如莧陸雖感於隂而決斷之易則於中行無過咎矣不然則失其中正也感隂多之物莧陸為易斷故取為象卦辭言夬夬則於中行為無咎矣象復盡其義云中未光也夫人心正意誠乃能極中正之道而充實光輝五心有所比以義之不可而決之雖行於外不失中正之義可以無咎然於中道未得為光大也蓋人心一有所欲則離道矣夫子於此示人之意深矣並易傳橫渠先生曰陽近於隂不能無纍故必正其行然後免咎易説龜山楊氏曰周公東征邦君御事皆以為不可周公徒得十夫之助決意征之禹征有苖會羣后誓之既已出師朝廷上下宜無不以為當者而益以一言贊之禹遂振旅而還而苖亦隨格豈周公之德不逮禹乎蓋舜之時在廷莫非君子而天下已大治矣其敢逆命者獨有苖而已縱而不治未足為害如必欲誅之則太平之民自受其病矣故與其勤師逺伐不若修德以待其來之為愈也若夫三監之叛其變起王室非可以夷狄待之也況又成王幼沖涖政之初君子之道不勝小人不誅而縱之其禍將不勝救矣當是之時雖無十夫之助周公亦不可已此所以必征之也易曰莧陸夬夬中行無咎其舜之事乎語録白雲郭氏曰剛長至於五所謂可決之時矣君子於是決之如決莧陸之易無所用力焉故曰莧陸夬夬也初之為咎三之有凶皆非知時者也九五得其時得其位用衆剛之力有決之過無不及焉是以用中行之道則無咎過則咎也然九五尊位大中居光宅天下之任其道豈決小人而已哉決小人臣下之事也雖得中道亦未光也未光有終光之義能充其道則光矣取象於莧陸二物者如言摧枮拉朽之易也易説上六無號終有凶象曰無號之凶終不可長也伊川先生曰陽長將極隂消將盡獨一隂處窮極之地是衆君子得時決去危極之小人也其勢必須消盡故云無用號咷畏懼終必有凶也陽剛君子之道進而益盛小人之道既已窮極自然消亡豈復能長久乎雖號咷無以為也故云終不可長也先儒以卦中有孚號惕號欲以無號作去聲謂無用更加號令非也一卦中適有兩去聲字一平聲字何害而讀易者率皆疑之或曰聖人之於天下雖大惡未嘗必絶之也今直使之無號謂必有凶可乎曰夬者小人之道消亡之時也決去小人之道豈必盡誅之乎使之變革乃小人之道亡也道亡乃其凶也並易傳白雲郭氏曰伊川曰夬者小人之道消亡之時也決去小人之道豈盡誅之乎使之變革乃小人之道亡也道亡乃其凶也雍曰上六之凶適當五剛進決之時不可苟免故言無號終有凶也不可長者又言終凶之速也然號有哀號之意卦有三號字王氏以一為號令二為號呼或皆為號令字獨伊川以二為號令上六為號咷字為當理易説大易粹言卷四十三
