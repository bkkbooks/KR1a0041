body:
  text: 大易粹言卷三十四宋方聞一編乾下震上伊川先生曰序卦遁者退也物不可以終遁故受之以大壯遁為違去之義壯為進盛之義遁者隂長而陽遁也大壯陽之壯盛也衰則必盛消息一作長相須故既遁則必壯大壯所以次遁也為卦乾下震上乾剛而震動以剛而動大壯之義也剛陽大也陽長己過中矣大者壯盛也又雷之威震而在天上亦大壯之義也易傳大壯利貞伊川先生曰大壯之道利於貞正也大壯而不得其正强猛之為耳非君子之道壯盛也易傳白雲郭氏曰泰之辭言小往大來而彖則言天地上下隂陽健順君子小人以極大小之類大壯之象四陽過中名卦之義實取於大也雖天地亦大者之壯非獨人事而已與泰言大來無以異也故彖曰正大而天地之情可見矣易說彖曰大壯大者壯也剛以動故壯大壯利貞大者正也正大而天地之情可見矣伊川先生曰所以名大壯者謂大者壯也隂為小陽為大陽長已盛是大者壯也下剛而上動以乾之至剛而動故為大壯為大者壯與壯之大也大者既壯則利於貞正正而大者道也極正大之理則天地之情可見矣天地之道常久而不已者至大至正也正大之理學者默識心通可也不云大正而云正大恐疑為一事也並易傳龜山楊氏曰剛以動大者之壯也壯而弗正則為暴而已故利貞易說白雲郭氏曰凡天地萬物大者之壯俱為大壯徒用壯而已非大壯也德之大者無踰於天自人道言之人得天德而動壯之所以大也且强梁以動者雖無不壯其或窮人欲而滅天理則性善梏亡天德於是失之矣雖壯而非大也故必得天之剛德而動而後謂之大壯大壯利貞者大者之正也大者天也正則天之德也天地之情於斯可見況人道乎孟子謂齊宣王曰王請無好小勇夫撫劔疾視曰彼惡敢當我哉此匹夫之勇敵一人者也王請大之唯孟氏深明大小之義諸子未之或知也故言文武一怒而安天下之民豈所謂大者之壯歟若匹夫匹婦自經於溝瀆何其小哉聖人以羊譬壯深見小人之情矣易說象曰雷在天上大壯君子以非禮弗履伊川先生曰雷震於天上大而壯也君子觀大壯之象以行其壯君子之大壯者莫若克己復禮古人云自勝之謂强中庸於和而不流中立而不倚皆曰强哉矯赴湯火蹈白刃武夫之勇可能也至於克己復禮則非君子之大壯不可能也故云君子以非禮弗履易傳橫渠先生曰克己反禮壯莫甚焉故易於大壯之用見之克己下學上達交相養也下學則必達達則必上蓋不行則終何以成德明則誠矣誠則明矣克己要當以理義戰退私已蓋理乃天德克己者必有剛强壯健之德乃勝已雷在天上大壯君子以非禮弗履夫酒清人渴而不敢飲肴乾人飢而不敢食非强有力者不能人所不能人所以不能行已者於其所難者則惰其異俗者雖易而羞縮惟心𢎞則不顧人之非笑所趨義理耳視天下莫能移其道然為之人亦未必怪正以在已者義理不勝惰與羞縮之病消則有長不消則病常在消盡則是大而化之之謂聖意思齷齪無由作事在古氣節之士冒死以有為於義未必中然非有志槩者莫能況吾於義理已明何為不為正以不剛惟大壯乃能克己蓋君子欲身行之為事業以教天下今夫為長者折枝非不能也但耻以為屈而不為耳不顧義理之若何也並易說龜山楊氏曰君子之壯壯於禮而已行有不慊於心則餒矣尚能壯乎哉易說白雲郭氏曰天下雷行為無妄雷在天上為大壯無妄之動以天則天德及物之時故象言茂對時育萬物大壯先天而後動在人則盡心知性則知天之時期不失中庸所謂天命之性者故象以非禮弗履為言也且壯者君子所以勝已而小人所以勝人孔子告顔淵以克己復禮勝已之道也既勝已之私則無適而非天矣是為壯之大者也小人不知勝已至於窮人欲而滅天理何大之有是以九三秪以用壯言之然有大壯之弗履以成已然後有無妄之育物以成物二者之道相為終始亦猶中庸言天命之謂性率性之謂道而後曰修道之謂教蓋性與道成已也而教所以成物也易說初九壯于趾征凶有孚象曰壯于趾其孚窮也伊川先生曰初陽剛乾體而處下壯于進者也在下而用壯壯于趾也趾在下而進動之物九在下用壯而不得其中夫以剛處壯雖居上猶不可行況在下乎故征則其凶有孚孚信也謂以壯往則得凶可必也壯于趾在最下而用壯以行可必信其窮困而凶也並易傳龜山楊氏曰剛健而在下壯于趾者也在下未足以有行故征凶上無應焉雖剛實而有孚其孚不逺矣故曰其孚窮也易說白雲郭氏曰壯于趾者用壯之始也始而用壯必終於凶矣有孚者信其必以凶窮也凡爻辭獨言壯者謂小人之壯皆非大者壯也易說九二貞吉象曰九二貞吉以中也伊川先生曰二雖以陽剛當大壯之時然居柔而處中是剛柔得中不過於壯得貞正而吉也或曰貞非以九居二為戒乎曰易取所勝為義以陽剛健體當大壯之時處得中道無不正也在四則有不正之戒人能識時義之輕重則可以學易矣九二所以貞正而吉者以其得中道也中則不失正況陽剛一有壯字而乾體乎並易傳龜山楊氏曰居大壯之時而剛得中故為吉蓋大者之正惟有九二盡之故曰貞吉而已易說白雲郭氏曰卦辭言利貞然得其貞者九二也九二之貞謂固守大壯之道也天之德以剛中為正九二以剛居中是以能固守而貞吉也居卦之下位為不足未能究天德之用故特曰貞吉而已蓋非禮弗履之士也易說九三小人用壯君子用罔貞厲羝羊觸藩羸其角象曰小人用壯君子罔也伊川先生曰九三以剛居陽而處壯又當乾體之終壯之極者也極壯如此在小人則為用壯在君子則為用罔小人尚力故用其壯勇君子志剛故用罔罔無也猶云蔑也以其至剛蔑視於事而無所忌憚也君子小人以地言如君子有勇而無義為亂剛柔得中則不折不屈施於天下而無不冝苟剛之太過則無和順之德多傷莫與貞固守此則危道也凡物莫不用其壯齒者囓角者觸蹄者踶羊壯於首羝為喜觸故取為象羊喜觸藩籬以藩籬當其前也蓋所當必觸喜用壯如此必羸困其角矣猶人尚剛壯所當必用必至摧困也三壯甚如此而不至凶何也曰如三之為其往足以致凶而方言其危故未及於凶也凡可以致凶而未至者則曰厲也在小人則為用其强壯之力在君子則為用罔志氣剛强蔑視於事靡所顧憚也並易傳橫渠先生曰以陽居陽正也然乘下之剛故危小人用此而進如羝羊觸藩以為壯故多見困君子知幾則否藩以喻四三有應所之在進而位正理直小人處之必以剛動易說龜山楊氏曰至剛而不中非大者正也小人則用壯而已在君子則罔也焉有仁人在位罔人而可為乎故雖正亦厲剛雖不中未足以極其壯故羝羊觸藩羸其角易說白雲郭氏曰剛至三而壯矣小人務勝人故喜壯而用之君子務在勝已之私不失天命之性是以勿用壯於外也以用壯為正則危矣羊狠而喜觸用壯之象也觸藩羸其角用壯而厲也其厲如此凡以小人不知壯有天道之大故也君子用罔者君子罔以壯為用也先儒為羅罔之罔失之矣易說九四貞吉悔亡藩決不羸壯于大輿之輹象曰藩決不羸尚往也伊川先生曰四陽剛長盛壯已過中壯之甚也然居四為不正方君子道長之時豈可有不正也故戒以貞則吉而悔亡蓋方道長之時小失則害亨進之勢是有悔也若在它卦重剛而居柔未必不為善也大過是也藩所以限隔也藩籬決開不復羸困其壯也髙大之車輪輹强壯其行之利可知故云壯于大輿之輹輹輪之要處也車之敗常在折輹輹壯則車强矣云壯于輹謂壯於進也輹與輻同剛陽之長必至於極四雖已盛然其往未上也以至盛之陽用壯而進故莫有當之藩決開而不羸困其力也尚往其進不已也並易傳橫渠先生曰乘剛本有悔不用其壯故貞吉三以四為藩九四上無陽爻故曰藩決壯輿之輹往無咎也四能不為隂纍守己以正則吉而無乘剛之悔且得衆陽之助以銷隂慝易說龜山楊氏曰剛以動吉凶悔吝之所生也唯貞吉乃悔亡隂在前不足以禦其壯也故藩決不羸有剛動之才故壯于大輿之輹輹車之軸傳也易說白雲郭氏曰剛至四而愈壯而曰貞吉悔亡何哉蓋四居上體之下能捨衆剛而與上有承柔戴上之志是以貞吉悔亡藩決不羸壯于大輿之輹也然九四之壯雖非大壯特用得其宜耳輿輹當用壯之物也又況大輿之輹乎壯于大輿之輹是為得其宜也得其宜故貞吉悔亡藩決不羸君子之所以能任重者以此伊川曰輹與輻同虞翻為腹非也易說六五喪羊于易無悔象曰喪羊于易位不當也伊川先生曰羊羣行而喜觸以象諸陽並進四陽方長而並進五以柔居上若以力制則雖勝而有悔唯和易以待之則羣陽無所用其剛是喪其壯于和易也如此則可以無悔五以位言則正以德言則中故能用和易之道使羣陽雖壯無所用也所以必用柔和者以隂柔居尊位故也若以陽剛中正得一作居尊位則下無壯矣以六五位不當也故設喪羊于易之義然大率治壯不可用剛夫君臣上下之勢不相侔也苟君之權足以制乎下則雖有强壯跋扈之人不足謂之壯也必人君之勢有所不足然後謂之治壯故壯之道不可以剛也並易傳喪羊于易羊羣行而觸物大壯衆陽並進六五以隂居位惟和易然後可以喪羊易非難易之易乃和易樂易之易楊遵道録橫渠先生曰羊外柔而內狠六五以隂處陽羊喪之象也能去其內剛不拒來者則無悔故曰喪羊于易無悔履柔危之地乘壯動之剛固之必悔者位非其所堪也易說龜山楊氏曰居得尊位而下乘四剛其用壯也物孰禦之可謂無難矣而不用所謂喪羊于易也莊子曰於羊弃意喪羊之謂也易說白雲郭氏曰羊之用壯無異於小人不務勝已於內而欲觸物於外一往若此其害深矣是以非禮弗履之人務在克己而喪其羊也克己喪羊亦人之難能而六五初無甚難則其無悔冝矣位不當者才不足而位有餘不能究天德之大以成堯舜三王之治徒喪羊無悔僅能成已而已易說上六羝羊觸藩不能退不能遂無攸利艱則吉象曰不能退不能遂不詳也艱則吉咎不長也伊川先生曰羝羊但取其用一無用字壯故隂爻亦稱之六以隂處震終而當壯極其過可知如羝羊之觸藩籬進則礙身退則防角進退皆不可也才本隂柔故不能勝已以就義是不能退也隂柔之人雖極用壯之心然必不能終其壯有摧必縮是不能遂也其所為如此無所往而利也隂柔處壯不能固其守若遇艱困必失其壯失其壯則反得一有其字柔弱之分矣是艱則得吉也用壯則不利知艱而處柔則吉也居壯之終有變之義也非其處而處故進退不能是其自處之不詳慎也艱則吉柔遇艱難又居壯終自當變矣變則得其過咎不長乃吉也並易傳橫渠先生曰剛兢用觸則進退皆凶危懼求全則咎有時而息也然上六以隂居上不詳事冝用壯而觸故進退不能易說白雲郭氏曰居動之極以柔用壯雖無羸角之厲而進退不能何所利哉不能遂者進不足以勝人也不能退者退不足以自勝也此豈不能慎於度德量力之事者歟故曰不詳也聖人兢兢業業其難其慎以不矜不伐為己任又安有用壯之厲乎是以艱則吉也易說大易粹言卷三十四
