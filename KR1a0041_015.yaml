body:
  text: 大易粹言卷十五宋方聞一編艮下坤上伊川先生曰謙序卦有大者不可以盈故受之以謙其有既大不可至於盈滿必在謙損故大有之後受之以謙也為卦坤上艮下地中有山也地體卑下山髙大之物而居地之下謙之象也以崇髙之德而處卑之下謙之義也易傳謙亨君子有終伊川先生曰謙有亨之道也有其德而不居謂之謙人以謙巽自處何往而不亨乎君子有終君子志存乎謙巽逹理故樂天而不競內充故退讓而不矜安履乎謙終身不易自卑而人益尊之自晦而德益光顯此所謂君子有終也在小人則有欲必競有德必伐雖使勉慕於謙亦不能安行而固守不能有終也易傳它卦皆有悔凶咎唯謙未嘗有它卦有待而亨唯謙則便亨羅氏拾遺白雲郭氏曰繫辭曰勞而不伐有功而不德厚之至也故謙為不居其德之稱德且不居則冨貴崇髙皆餘事矣孔子不居聖顔淵願無伐善無施勞之謂也然有德而不居亨在其中矣小人矜能伐功日損之道君子德日進而謙不已是有終也然一盈而有四害一謙而有四益是以君子拳拳而弗失之矣易說彖曰謙亨天道下濟而光明地道卑而上行天道虧盈而益謙地道變盈而流謙鬼神害盈而福謙人道惡盈而好謙謙尊而光卑而不可踰君子之終也明道先生曰易言天亦不同如天道虧盈而益謙此通上下理亦如此天道之運亦如此如言天且不違況於人乎況於鬼神乎此直謂形而上者言以鬼神為天地矣謝顯道録伊川先生曰濟當為際此明謙而能亨之義天之道以其氣下際故能化育萬物其道光明下際謂下交也地之道以其處卑所以其氣上行交於天皆以卑降而亨也以天行而言盈者則虧謙者則益日月隂陽是也以地勢而言盈滿者傾變而反陷卑下者流注而益增也鬼神謂造化之跡盈滿者禍害之謙損者福祐之凡過而損不足而益者皆是也人情疾惡於盈滿而好與於謙巽也謙者人之至德故聖人詳言所以戒盈而勸謙也謙為卑巽也而其道尊大而光顯自處雖卑屈而其德實髙不可加尚是不可踰也君子至誠於謙恆而不變有終也故尊光並易傳橫渠先生曰止於下故光明人樂尊之故光而不掩志下於人故人不能加天以廣大自然取貴人自要尊大須意我固必欲順己尊己又說己之情此所以取辱取怒也謙尊而光卑而不可踰夫尊者謙則更光卑者己謙又如何踰之此天德至虛者焉以其能謙故尊而益光卑又無人可踰蓋己謙矣復如何踰越也謙天下之良德並易說龜山楊氏曰謙也者致恭以存其位也故髙而不危滿而不溢君子所以有終也自天道下濟而下謙亨之道也夫謙德之柄也君子執之以為禮德盛道尊而不居厚之至也故自下而人髙之自後而人先之所以尊而光卑而不可踰也易說兼山郭氏曰山非不髙也地非不卑也髙者下下卑者上行謙之道也山在地上則為剝殺瘦之象也山在地中則為謙畜德之象也是故滿則招損謙則得益自然之理也天道下濟而光明者艮也地道卑而上行者坤也天之虧益日月是也地之變流山河是也鬼神害福吉凶是也人之好惡得失是也故勞而不伐有功而不德有若無實若虛其謙亨之謂乎故在尊而光在卑而不可踰惟君子能終之易說白雲郭氏曰先人曰天之虧盈日月是也地之變流山河是也鬼神害福吉凶是也人之好惡得失是也以此居尊則益光以此居卑則不可踰故惟有德君子能終之伊川曰以地勢而言則盈滿者傾變而反陷卑下者流注而益增也雍曰四者非天地鬼神人有心如是其道自然如此故皆曰道艮之一陽即有天道下濟之象易說象曰地中有山謙君子以裒多益寡稱物平施明道先生曰謙者治盈之道故曰裒多益寡稱物平施劉絢師訓伊川先生曰地體卑下山之髙大而在地中外卑下而內藴髙大之象故為謙也不云山在地中而曰地中有山言卑下之中藴其崇髙也若言崇髙藴於卑下之中則文理不順諸象皆然觀文可見君子以裒多益寡稱物平施君子觀謙之象山而在地下是髙者下之卑者上之見抑髙舉下損過益不及之義以施於事則裒取多者增益寡者稱物之多寡以均其施與使得其平也易傳謙君子所以自終故不言吉裒取其多而增益其寡天理也羅氏拾遺橫渠先生曰隱髙於卑謙之象也易大象皆是實事卦爻小象則容有寓意而已言風自火出家人家人之道必自烹飪始風風也教也蓋言教家人之道必自此始也又如言木上有水井則明言井之實事也又言地中有山謙夫山者崇髙之物非謙而何多者寡者皆量冝下之並易說龜山楊氏曰地中有山謙髙者下之謙之象也多者裒之寡者益之是謂稱物均一無偏陂之私是謂平施蓋取虧盈益謙之義易說理一而分殊故聖人稱物平施兹所以為仁之至義之盡也歟何謂稱物逺近親踈各當其分所謂稱也何謂平施所以施之其心一焉所謂平也與伊川書附西銘解兼山郭氏曰象天之道其猶張弓乎髙者抑之下者舉之有餘者損之不足者補之天之道損有餘補不足人之道損不足以奉有餘故非謙也裒多益寡德之盛也稱物平施禮之恭也故孔子曰德言盛禮言恭謙也者致恭以存其位者也易說白雲郭氏曰謙地類也故象以地見其義地卑而山髙理之常也今地在上益之也山在下損之也非以山居地中為山謙也乃以地謙而致益也是為變盈流謙之義裒多益寡者損有餘補不足之道也稱物平施者裒多益寡之道也裒多益寡見於彼者也稱物平施行乎此者也天地鬼神莫不皆然故君子法之以此此君子有為之道易說初六謙謙君子用涉大川吉象曰謙謙君子卑以自牧也伊川先生曰初六以柔順處謙又居一卦之下為自處卑下之至謙而又謙也故曰謙謙能如是者君子也自處至謙衆所共與也雖用涉險難亦無患害況居平易乎何所不吉也初處謙而以柔居下得無過於謙乎曰柔居下乃其常也但見其謙之至故為謙謙未見其失也謙謙謙之至也謂君子以謙卑之道自牧也自牧自處也詩云自牧歸荑並易傳自牧歸荑卑以自牧之意荑柔順意朱公掞拾遺橫渠先生曰牧逸也易說龜山楊氏曰以柔順之資居一卦之下謙之至也故曰謙謙君子卑以自牧也謙之為德天地神人之所共與用是而往雖涉險難無不濟矣故吉易說恂恂一於誠也與國人交止於信故在鄉黨所先如此似不能言者以卑自牧不以賢知先人也蓋鄉黨尚齒故其自牧如此語解兼山郭氏曰初六謙之言虛也中虛以涉難庸有不濟者乎易說白雲郭氏曰卦之六爻三言吉三言利是知謙之為道天地人鬼之所貴也謙謙者謙而又謙也謙而又謙是為有終君子能之昔舜戒禹臼汝惟不矜天下莫與汝爭能汝惟不伐天下莫與汝爭功曾子稱顔淵曰有若無實若虛是知謙謙非君子不能也書曰滿招損謙受益是謙為滿之反亦有虛之象也乘木舟虛故用涉大川吉易於乾健之才多言利涉大川如謙與中孚皆以虛而有濟耳卑則謙之道也卑以自牧言又能自養其謙以至於謙謙也易說六二鳴謙貞吉象曰鳴謙貞吉中心得也伊川先生曰二以柔順居中是為謙德積於中謙德充積於中故發於外見於聲音顔色故曰鳴謙居中得正有中正之德也故云貞吉凡貞吉有為貞且吉者有為得貞一有正字則吉者六二之貞吉所自有也二之謙德由至誠積於中所以發於聲音中心所自得也非勉一有強字為之也並易傳六二鳴謙處中得正而有德者故鳴謙者乃中心得也羅氏拾遺橫渠先生曰體柔居正故以謙獲譽與上六之鳴異矣故曰貞吉易說龜山楊氏曰六二柔履中正謙德之盛也故和順積中而英華發外其鳴也出於中心之自得與鳴豫之鳴異矣是以貞吉易說白雲郭氏曰詩曰鶴鳴于九臯聲聞于天則鳴者聲之逺聞也易曰鳴鶴在隂其子和之則聲之有聞必有應焉六二得位得中謙德著聞而貞吉者得位得中則非在隂之幽近於九三又非于天之逺況九三方以功下人如謙之近而有聞者無不應矣中心得者非有心於鳴以感人於外者也蓋修德於內而自然有聞者其得自於中心故也易說九三勞謙君子有終吉象曰勞謙君子萬民服也伊川先生曰三以陽剛之德而居下體為衆隂所宗履得其一作正位為下之上是上為君所任下為衆所從有功勞而持謙德者也故曰勞謙古之人有當之者周公是也身當天下之大任上奉幼弱之主謙恭自牧夔夔如畏然可謂有勞而能謙矣既能勞謙又須君子行之有終則吉夫樂髙喜勝人之常情平時能謙固已鮮矣況有功勞可尊乎雖使知謙之善勉而為之若矜負之心不忘則不能常久欲其有終不可得也唯君子安履謙順乃其常行故久而不變乃所謂有終有終則吉也九三以剛居正能終者也此爻之德最盛故象辭特重能勞謙之君子萬民所尊服也繫辭云勞而不伐有功而不德厚之至也語以其功下人者也德言盛禮言恭謙也者致恭以存其位者也有勞而不自矜伐有功而不自以為德是其德𢎞厚之至也言以其功勞而自謙以下於人也德言盛禮言恭以其德言之則至盛以其自處之禮言之則至恭此所謂謙也夫謙也者謂致恭以存其位者也存守也致其恭巽以守其位故髙而不危滿而不溢是以能終吉也夫君子履謙乃其常行非為保其位而為之也而言存其位者蓋能致恭所以能存其位言謙之道如此如言為善有令名君子豈為令名而為善也哉亦言有令名者為善之故一作效也並易傳橫渠先生曰中心安之也有終則吉人所難能易說龜山楊氏曰卦惟一陽衆隂宗之止於下體而不過勞謙君子也禹之不矜不伐而天下莫與之爭此勞而謙君子所以有終而萬民服也易說白雲郭氏曰九三以一陽而為衆隂之主衆隂宗之而俱與之有終則其為勞也大矣勞而不伐是曰勞謙非君子能之乎故唯君子有終吉唐虞之際能盡勞謙之道者其禹歟克勤于邦而至於九功惟叙所謂勞也不自滿假而拜昌言所謂謙也至於詢謀僉同鬼神其依則天地人鬼莫不從有終之吉大矣萬民服者特其一而已然卦以一隂為主者難以一陽為主者易隂常失之不足非有至明之德不能也大有同人是也陽常失之太過非有至中之德不能也師比是也謙豫近師比而德不同者非中故也故謙以德下人則民服豫以順合衆則得志皆不失損剛從柔之道於中為近矣易說六四無不利撝謙象曰無不利撝謙不違則也伊川先生曰四居上體切近君位六五之君又以謙柔自處九三又有大功德為上所任衆所宗而已居其上當恭畏以奉謙德之君卑巽以讓勞謙之臣動作施為無所不利於撝謙也撝施布之象如人手之撝也動息進退必施其謙蓋居多懼之地又在賢臣之上故也凡人之謙有所冝施不可過其冝也如六五或用侵伐是也唯四以處近君之地據勞臣之上故凡所動作靡不利於施謙如是然後中於法則故曰不違則也謂得其冝也並易傳橫渠先生曰裒多益寡無不盡道舉措皆謙易說龜山楊氏曰六四履近尊之位上承下比無所不用其謙則不違則矣蓋物各有則或過或不及皆違則也故曰無不利撝謙撝言發撝也初六處一卦之下自牧而已二則中心得而已三之勞謙不伐而已四則異於是上承柔巽之君下比勞謙之臣非撝謙不足以存其位也易說白雲郭氏曰六四以柔順之德兼四益之道天地人鬼何所不利哉故曰無不利然四有近君之權能撝而不有以尊勞謙之臣可謂得謙之道者矣合謙之道而無過焉故曰不違則也觀帝堯曰汝能庸命巽朕位嶽曰否德忝帝位有鰥在下曰虞舜若四嶽者可謂撝謙矣伊川曰撝如手之撝也易說六五不冨以其鄰利用侵伐無不利象曰利用侵伐征不服也伊川先生曰冨者衆之所歸唯財為能聚人五以君位之尊而執謙順以接於下衆所歸也故不以冨而能有其鄰也鄰近也不冨而得人之親也為人君而持謙順天下所歸心也然君道不可專尚謙柔必須威武相濟然後能懷服天下故利用行侵伐也威德並著然後盡君道之冝而無所不利也蓋五之謙柔當防於過故發此義征其文德謙巽所不能服者也文德所不能服而不用威武何以平治天下非人君之中道謙之過也並易傳龜山楊氏曰六五柔得尊位大中處謙之時以謙接下者也謙德之光而人之從之也輕故能不冨以其鄰不冨言以德而不以利合也夫侵伐先王不得已而用之非治世之利也然人君執謙以蒞下不冨而以其鄰冝無不從矣而猶有不服者焉縱而不治則亂羣必矣故利用侵伐征不服也以侵伐為利惟謙之時為然易說兼山郭氏曰六五尊位大中而謙以處之德盛禮恭統和天人而無間者也孟子曰得道者多助失道者寡助寡助之至親戚畔之多助之至天下順之以天下之所順攻親戚之所畔故君子有不戰戰必勝矣不冨以其鄰利用侵伐無不利其理如是也孔子曰利用侵伐征不服也猶曰不服而後征蓋無不服無征可也六五全德之爻故戒之其詳如此益贊於禹曰惟德動天無逺弗届滿招損謙受益時乃天道其斯之謂歟易說白雲郭氏曰先人曰孟子有言得道者多助失道者寡助寡助之至親戚畔之多助之至天下順之以天下之所順攻親戚之所畔故君子有不戰戰必勝矣雍曰謙之為卦五隂一陽隂虛之象以乾坤之䇿言之亦已耗矣故為不冨不冨非足也與泰之六四同義而六五尊位大中謙以居之德盛禮恭之主是以為衆所歸而能有其鄰也以其鄰故多助多助則戰必勝故利用侵伐也征不服者蓋有不服則征無不服則勿征也昔禹之徂征苖民逆命益贊于禹曰惟德動天無逺弗届滿招損謙受益時乃天道蓋謙以德為主有謙之德則無不利其於侵伐用與不用在上之人耳非必於用師也六五坤道不足而不冨故容有不服之征九三陽道有餘而有終故萬民無不服也易說上六鳴謙利用行師征邑國象曰鳴謙志未得也可用行師征邑國也伊川先生曰六以柔處柔順之極又處謙之極極乎謙者也以極謙而反居髙未得遂其謙之志故至發於聲音又柔處謙之極亦必見於聲色故曰鳴謙雖居無位之地非任天下之事然人之行己必須剛柔相濟上謙之極也至於太甚則反為過矣故利在以剛武自治邑國已之私有行師謂用剛武征邑國謂自治其私謙極而居上欲謙之志未得故不勝其切至於鳴也雖不當位謙既過極冝以剛武自治其私故云利用行師征邑國也並易傳上六鳴謙乃有求者也有求之小止於征國邑而已故曰志未得也羅氏拾遺橫渠先生曰下應於三其迹顯聞故曰鳴謙最上用謙為衆所服故利用行師然聲鳴其謙必志有求焉非如六二之正也三止於下如邑國之末賔也一云鳴謙則師有名易說龜山楊氏曰上六處謙之極過乎謙者也在一卦之外髙而無民雖鳴而天下無應之者與鳴鶴在隂異矣故曰志未得也然君子行有不得則反求諸已而已故曰利用行師征邑國邑國私於已者也征邑國自治也不用剛克而能勝已之私者未之有也故利用行師征邑國易說白雲郭氏曰上六之鳴異乎六二之鳴也六二之鳴非有求於應而欲人之聞之也其聲之自聞而人自應之也所謂聲無逺而弗聞行無隱而弗彰者也上與三為應也有應而鳴以聲感三也九三止而不求又且為衆隂之主而無私焉此上六所以志未得也終以其應而有助故可用行師征邑國而已邑國小也非無不利之師也可者僅辭也謙道本亨六爻無凶咎悔吝危厲之變以此知德盛禮恭之事天地人鬼無不冝者矣然謙之為德非有挾太山超北海之難能而人每患其不能行者此君子小人所以分也故卦皆以君子為言君子無大過人者特能行之耳易說大易粹言卷十五
