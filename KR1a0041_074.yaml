front:
  text: 大易粹言跋右大易粹言前太守曾君穜命郡博士方聞一所裒輯者也雖七家之書不無深淺異同之論然考其師友淵源則皆自伊洛中來學者得此書而萃觀之則淺深異同之際乃吾所用力之地苟能窮其所已言以求乎至是之歸體其所未言以造乎自得之實則知隂陽五行升降上下無非天理流行之妙而畫前之易當在吾心而不在書矣豈徒以廣耳目聞見而已哉嵗久板漫滅不可讀因念刋書之難復為之修改七百三十有六板凡二十六萬一千五百九十有四字以與學者共之亦以無忘曾君之美意云嘉定癸酉五月望真寧張嗣古跋粹言載諸公所得深者參舉而互備此板在舒州已就漫漶豫修之遂為佳本陳造跋右大易粹言一編太守曽公所裒集也始公欲刋是書集僚屬語之於是門下士程九萬欣然前曰是書之成所惠於後學多矣夫學莫不有宗後之學者皆失之學琴有譜學奕有數彼業一技者且然而况於學道者乎吾聖人闡道之微以詔後學悉具於六藝煨燼之餘唯易為全書故昔人號易為六藝之原有志於道德性命之學者可不出入其門而探其奧乎捨是不用吾力而欲求夫徑造頓悟之說幾何而不胥為異端也蓋自胚腪於羲發露於文而大彰明於夫子道妙所在內外之不偏廢終始之無有二致由是而充之可以處貴賤可以逹死生漢儒休咎災異之證最害道之甚者寥寥千百載間有伊川二程先生者探三聖之用心與一時諸公講䆒至到可為學者據依然猶病其文字之間見帙籍之散漫今公會而通之貫而一之誠有功於聖門端不止於裒集而已學者於是而得其所宗矣書成遂述前日語以書於末云淳熙四年正月日門生迪功郎舒州望江縣主簿主管學事程九萬謹跋昔伊川先生發揮大易之㫖獨止于六十四卦而繫辭無傳學者惜之惟當時諸公之所講究間見層出亦足以補其遺闕然編帙散漫猶病焉祐之蚤獲遊溫陵曾公之門公平居議論必及於易而伊川之學尤所篤好故嘗以親受白雲之說合伊川兄弟而下共為七家欲鑱之而未能也洎來羣舒出以相示且俾訂證其非是期與同志共之凡涉書七十有五種為字四十五萬有竒義多互見辭或重出而後伊川之易無遺恨之歎噫公之用心也蓋深而人之獲利也亦溥矣於是乎書門人西秦李祐之謹跋
