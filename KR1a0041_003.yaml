body:
  text: 大易粹言卷三宋方聞一編震下坎上伊川先生曰屯序卦曰一無曰字有天地然後萬物生焉盈天地之間者唯萬物故受之以屯屯者盈也屯者物之始生也萬物始生鬱結未通故為盈塞於天地之間至通暢茂盛則塞意亡矣天地生萬物屯物之始生故繼乾坤之後以二象言之雲雷之興隂陽始交也以二體言之震始交於下坎始交於中隂陽相交乃成雲雷隂陽始交雲雷相應而未成澤故為屯若已成澤則為解也又動於險中亦屯之義隂陽不交則為否始交而未暢則為屯在時則天下屯難未亨泰之時也易傳白雲郭氏曰易為三才之書其言道則三才之道也天地人雖均為三才獨人道雜而多端無天地之純全故純剛為乾而盡天道純柔為坤而盡地道至於人事不齊一卦不足以盡故自屯至未濟共為人道以配乾坤是以諸卦所載人事為多而人道自此明矣然則人道以六十二卦而後能配乾坤所謂乾以易知坤以簡能歟易説屯元亨利貞勿用有攸往利建侯伊川先生曰屯有大亨之道而處之利在貞固非貞固何以濟屯方屯之時未可有所往也天下之屯豈獨力所能濟必廣資輔助故利建侯也易傳處屯難而有致亨之道其唯貞固乎然能守正不變者鮮矣師説雜編橫渠先生曰勿用有攸往往則失其居矣易説龜山楊氏曰屯極必亨故屯有亨之道元亨大亨也利貞利在正也與乾四德異矣勿用有攸往以初爻言也險在前屯難方生也遽而往則行險而犯難矣故曰勿用有攸往易説白雲郭氏曰天地無屯人與萬物皆有之物之始生及其未亨之時皆屯也故為人道之始乾坤之四德所以生萬物而康屯者故屯有得於乾坤之四德也然四德非一於屯也屯之所得者屯之時屯之事而已觀乾之彖萬物資始元也品物流形亨也各正性命保合太和利貞也是則天地之道始終在於萬物而萬物以人為首故屯為人道之始具四德而繼乾坤也人道始生而未成未可用有所往先於建侯者聖人配天地之德生萬物而康屯莫先此大公之道故也易説彖曰屯剛柔始交而難生動乎險中大亨貞雷雨之動滿盈天造草昧宜建侯而不寧伊川先生曰以雲雷二象言之則剛柔始交也以坎震二體言之動乎險中也剛柔始交未能通暢則艱屯故云難生又動於險中為艱屯之義所謂大亨而貞者雷雨之動滿盈也隂陽始交則艱屯未能通暢及其和洽則成雷雨滿盈於天地之間生物乃遂屯有大亨之道也所以能大亨由夫一無夫字貞也非貞固安能出屯人之處屯有致大亨之道亦在夫一無夫字貞固也上文一有既字言一有夫字天地生物之義一有是以字此言時事天造謂時運也草草亂無倫序昧冥昧不明當此時運所宜建立輔助則可以濟屯雖建侯自輔又當憂勤兢畏不遑寧處聖人之深戒也並易傳廣平遊氏曰屯宜建侯而不寧何也蓋屯難未解方且急賢才以自助故分土錫圭以報有功而崇有德又且與之戮力以𢎞濟艱難故雖建侯而不寧也若豫之建侯則四方無虞五刑不用要當建諸侯以蕃屏王室而已以是建侯則寧矣武王歸馬放牛何不寧之有易説龜山楊氏曰乾一索而得震隂陽始交也坎在上難生也隂陽始交而未成澤坎之所以為難也震動而坎險動乎險中合二體言之也止乎險則蹇動乎險中則亨動有亨之道也蓋險非可止之地止則終於陷而已矣故動乃亨也夫屯難之初上下無常分貴賤無定位非正也屯難平而後君君臣臣而天下治故曰大亨貞言亨而後貞也雷雨之動滿盈則屯解而澤下流矣天造草昧非寧居之時故宜建侯而不寧建侯所以自輔也使人各有主而天下定矣並易説兼山郭氏曰屯者物之始生也草者之未齊昧者之未明勾者之未伸萌者之未達而有動乎險中之象終至於大亨貞也是以草者齊之昧者明之造物之始也建侯而不寧人倫之始也厥初生民無羽毛以蔽其身無爪牙以充其欲則必求其羣而比焉勢又不足則必求其強且大者而比焉此后王君公之所由立也故後世有天下者必思屯之所以利建侯而不寧則知所以為治矣易説白雲郭氏曰乾剛坤柔至屯而始交交則人道乃著然純隂疑於陽則戰況剛柔之交能無難乎以是知人道之患與天地異故繫辭言鼓萬物而不與聖人同憂是聖人不能無憂也屯之時處險而不可動故言勿用有攸往屯者也而天下草昧聖人不得不動之時故言利建侯康屯之主也利建侯則動乎險中亦聖人所不得已也唯動則得天地大亨萬物之貞道苟一於勿用有攸往則非康屯之主也雷雨之動滿盈乎天地之間此天造草昧也建侯而不寧聖人法天而造草昧也聖人法天繼天而造草昧此屯所以繼乾坤之道也易説象曰雲雷屯君子以經綸伊川先生曰坎不云雨而云雲者雲為雨而未成者也未能成雨所以為屯君子觀屯之象經綸天下之事以濟於屯一無屯字難經緯綸緝謂營為也易傳橫渠先生曰雲雷皆是氣之聚處屯聚也易説廣平遊氏曰經綸者因性循理而治之無汨其序之謂也易於屯曰君子以經綸言所以濟難當如此也中庸解龜山楊氏曰雷雨之動滿盈則屯解矣雲雷而不雨卦之所以為屯也屯難未亨君子經綸之時也易説兼山郭氏曰象在天成象在地成形事象之宜也在上則為雲在下則為雨亦事象之宜也易説白雲郭氏曰坎在上為雲故雲雷屯坎在下為雨故雷雨作解雲而未雨所以為屯經綸者經綸天下之事建侯而不寧之謂也易説初九磐桓利居貞利建侯象曰雖磐桓志行正也以貴下賤大得民也伊川先生曰初以陽爻在下乃剛明之才當屯難之世居下位者也未能便往濟屯故磐桓也方屯之初不磐桓而遽進則犯難矣故宜居正而固其志凡人處屯難則鮮能守正苟無貞固之守則將失義安能濟時之屯乎居屯之世方屯於下所宜有助乃居屯濟屯之道也故取建侯之義謂求輔助也賢人在下時苟未利雖磐桓未能遂往濟時之屯然有濟屯之志與濟屯之用志在行其正也九當屯難之時以陽而來居隂下為以貴下賤之象方屯之時隂柔不能自存有一剛陽之才衆所歸從也更能自處卑下所以大得民也或疑方屯于下何有貴乎夫以剛明之才而下於隂柔以能濟屯之才而下於不能乃以貴下賤也況陽之於隂自為貴乎並易傳橫渠先生曰磐桓猶言柱石磐磐石也桓桓柱也謂利建侯如柱石在下不可以動然志在行正也易説廣平遊氏曰夫建侯王者事也而於初九言之者以剛動之而不失其正其自任以天下之重蓋王佐才也象所謂君子以經綸者非初九其誰耶故其體國致君宜以協濟為意其曰利建侯者乃代天理物之職也易説龜山楊氏曰得天下有道得其民斯得天下矣初以剛明之才處羣隂之下能以貴下賤也其才足以濟時之屯又能以貴下之宜其得民矣然猶盤旋未進者志行正故也行一不義殺一不辜得天下不為所謂正也文王三分天下有其二可謂大得民也而猶服事商者亦行正而已矣故曰利居貞髙明柔克利居貞者待時而動不失正也聖人之有天下非私之也四海之內共利之之為説共給之之為安故利建侯武王克商有未及下車而封者用此道也易説兼山郭氏曰初九剛柔始交故稱磐桓時止則止時行則行理之常也時有不得行是以宜待也陽上而隂下上貴而下賤亦理之常也其或以陽下隂以貴下賤者適時之變也是以康屯之道在於得民得民之道在於下下老子曰江海為百谷王以其下之也易説白雲郭氏曰屯之時興事皆當磐旋磐旋未決也居屯之道則當居貞建侯如是之利可免磐旋矣剛柔始交而難生則居屯者有不可動之勢而天下萬物方資於濟屯之才則濟屯者為不可不動之時以不可動之勢而遇不可不動之時此其所以磐旋也初九以剛明之才濟屯之難居正而靜不違勢建侯而動不違時其於屯也何不利之有故雖磐旋而不失康屯之道故曰志行正也況以陽下隂大得民乎聖人經綸建侯非自為也為民而已為民而得民其難濟矣夏商之季湯武其盡之並易説六二屯如邅如乘馬班如匪寇婚媾女子貞不字十年乃字象曰六二之難乘剛也十年乃字反常也伊川先生曰二以隂柔居屯之世雖正一作五應在上而逼於初剛故屯難邅回如辭一有助字也乘馬欲行也欲從正應而復班如不能進也班分布之義下馬為班與馬異處也二當屯世雖不能自濟而居中得正有應在上不失義者也然逼近於初隂乃陽所求柔者剛所陵柔當屯時固難自濟又為剛陽所逼故為難也設匪逼於寇難則往求於婚媾矣婚媾正應也冦非理而至者二守中正不苟合於初所以不字苟貞固不易至于十年屯極必通乃獲正應而字育矣以女子隂柔苟能守其志節久必獲通況君子守道不回乎初為賢明剛正之人而為冦以侵逼於人何也曰此自據二以柔近剛而為義更不計初之德如何也易之取義如此六二居屯之時而又乘剛為剛陽所逼是其患難也至於十年則難久必通矣乃得反其常與正應合也十數之終也並易傳橫渠先生曰班布不進之貌易説龜山楊氏曰六二以隂柔乘剛故屯如邅如乘馬班如下馬為班言此屯而不能有行也初以陽下隂婚媾之象匪寇也二以柔順中正之資守常待應而不從女子貞也與天下之大老異矣蓋初雖有剛明之才足以濟難而亨屯以之為君則未也守女子之貞宜其不字矣至其數極而反常則君臣之分正故十年乃字十數之終也君先而臣從君唱而臣和所謂常若綺里之徒漢初求之不可得而臣女子貞也晚出從太子遊反常故也易説兼山郭民曰六二召雲者龍命吕者律其聽者非苟合而已也以位則配以居則正而不偶焉屯故也至於天道反常則應之禮曰國有道不變塞焉國無道至死不變其六二之謂乎易説白雲郭氏曰屯之世動在險中非隂柔之所宜也況六爻之中莫柔弱於六二故為在屯之邅者而有女子之象焉馬班如欲應五而不能進也初九之剛進而見逼非為寇則婚媾耳六二居中待應不為苟合寇婚不從故云不字至於十年屯難反常終從正應則六二之處屯可謂女子之貞者矣伊川曰此自據二以柔近剛為義不計初之德為如何也易之取義如此所謂假初以明二非在二以明初也班如者舊以謂相牽不進或謂班旋不進伊川謂班分布之義與馬異處要之班如為列而未進又不欲退處也易説六三即鹿無虞唯入于林中君子幾不如舍往吝象曰即鹿無虞以從禽也君子舍之往吝窮也伊川先生曰六三以隂一無隂字柔居剛柔既不能安屯居剛而不中正則妄動雖貪於所求既不足以自濟又無應援將安之乎如即鹿而無虞人也入山林者必有虞人以導之無導之者則唯陷入于林莽中君子見事之幾微不若舍而勿逐往則徒取窮吝而已事不可而妄動以從欲也無虞而即鹿以貪禽也當屯之時不可動而動猶無虞而即鹿以有從禽之心也君子則見幾而舍之不從若往則可吝而困窮一作窮困也並易傳橫渠先生曰處非其地故曰入于林中虞防禁也二以乘剛有冦故五若可親五屯其膏故不若捨之易説龜山楊氏曰六三居動之極而不中正非居正者也待時而動動而不括故其出有獲當屯難草昧之時動不以正而上無應以之濟屯是從禽而已即鹿無虞唯入于林中者也古者無事嵗三田非以為遊豫也必有山澤之虞以菜其野蓋菜其野而後禽可即田而無虞是從禽而已林中非即鹿之所君子見幾不如舍之往斯吝窮矣易説兼山郭氏曰六三在屯之時居動之極貪於有獲肆欲從禽昧道而行以臨險阻始求有得往益屯也不知所謂得人者昌失人者亡故也六三互體有艮庶幾有知止之心故曰君子幾不如舍也即鹿無虞以從禽也何必黔喙之謂乎其卦則屯其體則震其互體則止動而求獲不知其向是以不如止也虞翻變文為麓或謂於義為贅且鹿之已即何必虞乎謂為贅辭則巨鹿沙鹿皆當同義故知從禽非專鹿也易説白雲郭氏曰虞翻王肅以鹿為麓先人曰如巨鹿沙鹿之鹿故知從禽非專鹿也雍曰孟子言從禽獸而無厭書言外作禽荒則從禽禽荒皆謂田獵則此不止於鹿明矣六三以隂柔之才非中正之位居動之極貪於有獲非處險之道也曽不自度可動之利雖即鹿也不過入于林中而已豈能有濟哉唯君子知幾不如舍之為得矣往則遇險其道窮也易説六四乘馬班如求婚媾往吉無不利象曰求而往明也伊川先生曰六四以柔順居近君之位得於上者也而其才不足以濟屯故進而復止乘馬班如也已既不足以濟時之屯若能求賢以自輔則可濟矣初陽剛一作剛陽之賢乃是正應己之婚媾也若求此陽剛一作剛陽之婚媾往與共輔陽一無陽字剛中正之君濟時之屯則吉而無所不利也居公卿之位己之才雖不足以濟時之屯若能求在下之賢親而用之何所不濟哉知己不足求賢自輔而後往可謂明矣居得致之地一作位已不能而遂已至暗者也並易傳橫渠先生曰六四待求而往易説龜山楊氏曰六四靜而正居險而不妄動者也故曰乘馬班如班如者有待而行也夫初以陽下隂求婚媾者也而四應之求而往者也屯難之時智者以其謀勇者以其力競時赴功者皆是也而四獨居險而不為難待求而後往非擇義之明疇克耳故往吉無不利而孔子曰求而往明也若諸葛孔明之於先主其幾是乎易説兼山郭氏曰六四屯雖可以有為之時又惡不由其道故志士不忘在溝壑勇士不忘喪其元取非其招不往也如不待招而往何哉易説白雲郭氏曰居屯之時有濟難之志而無濟難之才者六四也無其才則必資剛明之才與共濟難此所以班如有待於初九也初九正應以陽下隂得婚媾之義彼求而我往是以吉無不利也六二不與初九而待正應是之謂貞貞則正道存焉六四不近比九五下待初九求而後往是之謂明明則事業興焉此伊尹伯夷之所以辨也易説九五屯其膏小貞吉大貞凶象曰屯其膏施未光也伊川先生曰五居尊得正而當屯時若有剛明之賢為之輔則能濟屯矣以其無臣也故屯其膏人君之尊雖屯難之世於其名位非有損也唯其施為有所不行德澤有所不下是屯其膏人君之屯也既膏澤有所不下是威權不在己也威權去已而欲驟正之求凶之道魯昭公髙貴鄉公之事是也故小貞則吉也小貞則漸正之也若盤庚周宣修德用賢復先王之政諸侯復朝謂以道馴致為之不暴也又非恬然不為若唐之僖昭也不為則常屯以至於亡矣膏澤不下及是其德施未能光大也人君之屯也並易傳龜山楊氏曰屯難之世履尊位而陷乎險中乘隂而無輔欲有為而力不足者也此人君之屯也人君之屯於其名位非有加損也膏澤不下於民力不足以有為而已若唐之文宗是也故曰屯其膏言澤不下流也以其欲有為而力不足故戒之曰小貞吉大貞凶小貞若武宗用李德裕之謀先取澤潞河北諸鎮置而不問是也故唐之威令幾於復振大貞若魯昭公髙貴鄉公是也易説易曰屯其膏小貞吉大貞凶方屯難之時膏澤不敷權移於下政非己出人君之屯也權移於下而欲驟正之取凶之道也故大貞凶小貞漸而正之也孔子欲旅泰山者姑小貞之而已其後昭公卒至敗亡失此故也語解兼山郭氏曰九五尊位大中慶賞之可行而時則屯也彼剛中之質見掩於二隂膏澤不得下于民之象也坎雖潤下特私其應而已故小貞則吉也貞者事之幹也方屯之未寧而下有分民之臣上無蓼蕭之澤以及四海故大貞則凶也或以況魏晉之初蓋大器已移夫何屯膏之有易説白雲郭氏曰伊川先生曰人君之尊雖屯難之世於其名位非有損也唯其施為有所不行德澤有所不下是屯其膏人君之屯也既膏澤有所不下是威權不在己也威權去已而欲驟正之求凶之道魯昭公髙貴鄉公之事是也故小貞則吉也小貞則漸正之也若盤庚周宣修德用賢復先王之政諸侯復朝以道馴致為之不暴也又非恬然不為若唐之僖昭也不為則常屯以至於亡矣雍曰九五位非不尊也處非不正也德非不中也見掩於二隂而有屯膏之象者蓋五方自屯於險中豈能膏澤下於民哉然女子小人皆隂之類也能掩君之德者也能屯君之澤者也人君惑而好之乃所以自致其屯也易説上六乘馬班如泣血漣如象曰泣血漣如何可長也伊川先生曰六以隂柔居屯之終在險之極而無應援居則不安動無所之乘馬欲往復班如不進窮厄之甚至於泣血漣如屯之極也若陽剛而有助則屯既極可濟矣屯難窮極莫知所為故至泣血顛沛如此其能長久乎夫卦者事也爻者事之時也分三而又兩之足以包括衆理引而伸之觸類而長之天下之能事畢矣並易傳龜山楊氏曰險難之極以隂柔居之乘剛而無輔無有為之資也乘馬班如泣血漣如而已班而不能有行也漣如傷之至也若唐之昭宣是已其危亡立至又何可長者然則時終不可為歟曰有剛健之才尊德樂義擇賢而用之何不可之有易説兼山郭氏曰上六易窮則變變則通通則久處屯之極不能變屯以求通雖曰加憂何可濟也是由寢積薪之上自謂曰安其能久乎二與四為不及上為過過而不知變是以及此易説白雲郭氏曰康屯之道莫大於建侯不寧非優柔不斷之所能濟也上六處屯之極乘馬班如同二四之道可謂優柔不知變者矣故進退猶豫終以自傷非可久之道也二之班如待正應也四之班如待求而往也上六班如獨無所待進退不決而自傷耳屯為柔弱待濟之時故乘馬班如皆欲待而有所之也易説大易粹言卷三
