body:
  text: 大易粹言卷四十二宋方聞一編震下巽上伊川先生曰益序卦損而不已必益故受之以益盛衰損益如循環損極必益理之自然益所以繼損也為卦巽上震下雷風二物相益者也風烈則雷迅雷激則風怒兩相助益所以為益此以象言也巽震二卦皆由下變而成陽變而為隂者損也隂變而為陽者益也上卦損而下卦益損上益下所以為益此以義言也下厚則上安故益下為益易傳益利有攸往利涉大川伊川先生曰益者益於天下之道也故利有攸往益之道可以濟險難利涉大川也易傳白雲郭氏曰損益實一道相須以成德有損而後有益故聖人先求損修德之序也損而致益損之得也損而無益損之失也得則為善為君子失則為惡為小人此損之道有二也益一而已然損主止益主動止故有孚元吉無咎而後利有攸往益繼止以動故利有攸往而利涉大川也益象虛中而上下二卦皆木所以利涉大川損益之道相為終始故二卦之辭其義相繼易說彖曰益損上益下民說無疆自上下下其道大光利有攸往中正有慶利涉大川木道乃行益動而巽日進無疆天施地生其益無方凡益之道與時偕行伊川先生曰以卦義與卦才言也卦之為益以其損上益下也損於上而益下則民說之無疆謂無窮極也自上而降已以下下其道之大光顯也陽下居初隂上居四為自上下下之義五以剛陽中正居尊位二復以中正應之是以中正之道益天下天下受其福慶也益之為一無為字一作於道於平常無事之際其益猶小當艱危險難則所益至大故利涉大川也於濟艱險乃益道大行之時也益誤作木或以為上巽下震故云木道非也又以二體言卦才下動而上巽動而巽也為益之道其動巽順於理則其益日進一本益字在日進下廣大無有疆限也動而不順於理豈能成大益也以天地之功言益道之大聖人體之以益天下也天道資始地道生物天施地生化育萬物各正性命其益可謂無方矣方所也有方所一無所字則有限量無方謂廣大無窮極也天地之益萬物豈有窮際乎天地之益無窮者理而已矣聖人利益天下之道應時順理與天地合與時偕行也並易傳橫渠先生曰上巽下動者損上益下之道木以動而巽故利涉大川否卦九四下而為初九故曰天施地生又曰損上益下又曰自上下下易說白雲郭氏曰益自否來乾之九四損而成巽坤之初六益而為震是損上之四益下之初也民說無疆者言其為君而厚下也損不以君民為言者蓋其所損或善或惡其道皆上行耳損惡而上行則德日進矣損善而上行是自厚私己之道也故與益為異也然自修德言之則先損以逺害後益以興利是以其道大光也利有攸往言往而興利是以中正之道益天下斯天下有慶矣木道乃行者益之卦象與中孚相類中孚之利涉大川以乘木舟虛也益之震巽皆為木道雖未若中孚之舟虛亦木道行而利涉矣神農氏斫木為耜揉木為耒耒耨之利以教天下取諸益者亦木道之行也益動而巽則無盈滿之纍故日進無疆顔淵有若無實若虛終日不違如愚所以見其進未見其止也孔子曰益長裕而不設故益裕道也雖天施地生其益無方亦長裕不設之大者耳聖人法天地是以中正有慶也損言損益盈虛與時偕行則并損益言之益言凡益之道至是損為己事則無損矣惟有益而已與時偕行以言其日進而不已也易說象曰風雷益君子以見善則遷有過則改伊川先生曰風烈則雷迅雷激則風怒二物相益者也君子觀風雷相益之象而求益於己為益之道無若見善則遷有過則改也見善能遷則可以盡天下之善有過能改則無過矣益於人者無大於是易傳白雲郭氏曰子夏傳曰雷以動之風以散之萬物皆益也天施地生所以益萬物者莫盛於雷風也損之象言懲忿窒欲蓋言修德之始務損去其惡也其惡既損則見善自遷矣然猶曰有過則改者非謂懲窒忿欲之未盡也蓋遷善之際猶或有失焉有之又當不憚改也過謂過失耳非若忿欲之為惡也顔子三月不違仁則亦有違矣不逺復則亦有未復之時矣所謂過也是以顔子克己之始於視聽言動之非禮者皆勿而絶之所謂懲忿窒欲也及其得一善則拳拳服膺而又弗失所謂見善則遷也有不善未嘗不知知之未嘗復行孔子以謂殆庶幾所謂有過則改也語亦以不遷怒不二過言之不遷怒則所遷者善矣故懲忿窒欲始也見善則遷中也有過則改終也知此則損益之道盡矣易說初九利用為大作元吉無咎象曰元吉無咎下不厚事也伊川先生曰初九震動之主剛陽之盛也居益之時其才足以益物雖居至一無至字下而上有六四之大臣應於己四巽順之主上能巽於君下能順一作巽於賢才也在下者不能有為也得在上者應從之則冝以其道輔於上作大益天下之事利用為大作也居下而得上之用以行其志必須所為大善而吉則無過咎不能元吉則不惟在已有咎乃纍乎上為上之咎也在至下而當大任小善不足以稱也故必元吉然後得無咎在下者本不當處厚事厚事重大之事也以為在上所任所以當大事必能濟大事而致元吉乃為無咎能致元吉則在上者任之為知人已當之為勝任不然則上下皆有咎並易傳橫渠先生曰以剛陽之德施益於下故利用大作然必元吉乃無咎也易說白雲郭氏曰損為益之始益為損之終損益者始終之道也在損之初言當已事至益之初則遄往之時矣故言利用為大作而繫辭言益以興利其義一也自益之一卦言之則初九為益之始自損而至於益言之則初九道已成矣先難之事已矣言乎得失則元吉論其修德則無咎當興利之初故利為大作也損益二卦終始相通故其辭意相接損之上九曰弗損益之無咎貞吉利有攸往得臣無家而象言大得志益之初九言利用為大作元吉無咎蓋所以終利有攸往之辭亦知其大得志也猶之卦辭損自有孚終於利有攸往而益之卦辭以利有攸往為始也下不厚事者益之初九非先難之時故雖在下而不必厚於事是以直以長裕之道大有為以益天下自然元吉無咎也事如懲忿窒欲損惡之事固當厚而不敢忽然德既有成當利澤天下非厚事之時也何以知其德之成蓋方忿未懲欲未窒之時非獨無以致元吉亦且未能補過而無咎矣易說六二或益之十朋之龜弗克違永貞吉王用享于帝吉象曰或益之自外來也伊川先生曰六二處中正而體柔順有虛中之象人處中正之道虛其中以求益而能順從天下孰不願告而益之孟子曰夫苟好善則四海之內皆將輕千里而來告之以善夫滿則不受虛則來物理自然也故或有可益之事則衆朋助而益之十者衆辭衆人所是理之至當也龜者占吉凶辨是非之物言其至是龜不能違也永貞吉就六二之才而言二中正虛中能得衆人之益者也然而質本隂柔故戒在常永貞固則吉也求益之道非永貞則安能守也一作之損之六五十朋之則元吉者蓋居尊自損應下之剛以柔而居剛柔為虛受剛為固守求益之至善故元吉也六二虛中求益亦有剛陽之應而以柔居柔疑從益之未固也故戒能常永貞固則吉也王用享于帝吉如二之虛中而能永貞用以享上帝猶當獲吉況與人接物其意有不通乎求益於人有不應乎祭天天子之事故云王用也既中正虛中能受天下之善而固守則有有益之事衆人自外來益之矣或曰自外來豈非謂五乎曰如二之中正虛中天下孰不願益之五為正應固在其中矣並易傳橫渠先生曰或益之十朋之龜弗克違言損上益下之道理不可易人皆信之雖十朋之龜亦不能違此道也往見損九五居中體柔蒙上之益修報於下享帝之美莫盛於此焉或益之必有自外來而益之者也易說白雲郭氏曰損益本一道相須以相成以二卦反對言之則損之上益之初損之五益之二也故損上益初其辭相屬而損五益二又大同矣自損五之下去益既逺於益為不及自益二之上去損復逺其辭為已過矣六二柔順中正人之所與故或益之十朋之龜弗克違也或者來益而不一之辭損之六五曰元吉自然之吉也此曰永貞吉久而有守斯為吉也君臣之道不同故其為吉亦異或益之人益之也十朋之龜弗克違鬼神益之也王用享于帝吉天益之也益象虛中而六二謙以居之是以致益之多天且弗違況於人與鬼神乎在謙之彖言天道益謙鬼神福謙人道好謙益之六二皆得之伊川曰人之為善則千里之外應之六二中正虛己而益之者自外來是也苟為不善則千里之外違之上九求益之極擊之者自外來是也易說六三益之用凶事無咎有孚中行告公用圭象曰益用凶事固有之也伊川先生曰三居下體之上在民上者也乃守令也居陽應剛處動之極居民上而剛決果於為益者一無者字也果於為益用之於凶事則無咎凶事謂患難非常之事三居下之上在下當承禀於上安得自任擅為益乎惟於患難非常之事則可量冝應卒奮不顧身力庇其民故無咎也下專自任上必忌疾雖當凶難以一無以字義在可為然必有其孚誠而所為合於中道則誠意通於上而上信與之矣專為而無為上愛民之至誠固不可也雖有誠意而所為不合中行亦不可也圭者通信之物禮云大夫執圭而使所以申信也凡祭祀朝聘用圭玉所以通逹誠信也有誠孚而得中道則能使上信之是猶告公上用圭玉也其孚能通逹於上矣在下而有為之道固當有孚中行又三隂爻而不中故發此義或曰三乃隂柔何得反以剛果任事為義曰三質雖本隂然其居陽乃自處以剛也應剛乃志在乎剛也居動之極剛果於行也以此行益非剛果而何易以所勝為義故不論其本質也六三益之獨可用於凶事者以其固有之也謂專固自任其事也居下當禀承於上乃專任其事惟救民之凶災拯時之艱急則可也乃處急難變故之權冝故得無咎若平時則不可也並易傳橫渠先生曰中行者不私於應無所偏係也用心不私以拯凶難雖非王者之佐可以用之牧伯以為藩屏之臣矣體躁居陽上有剛應持此施益用拯凶難乃其固能也故無咎可必然亦須執禮告上公而行方合中道其曰告公者未足專進為王者之佐也易說廣平游氏曰益則吉矣而用凶事者所謂吉人凶其吉也三居下體之上當震動之極不用凶事則髙而危滿而溢矣非固有之道也所謂凶事者非必衣帛冠布挹而損之行恭而用儉所以固有之也三本剛體而以柔居之故有用凶事之象易說白雲郭氏曰六三居動之極為益之過者過於益下雖不為凶而用於患難之際則得其冝而無咎也有孚中行告公用圭者信以行之貴於得中而後可以告公用圭也告公用圭治世之禮也益之過厚用於患難則可固有苟欲用之平世非有孚以中道行則不能固有矣此明時有不同其用亦異也伊川曰凶事謂患難非常之事然則孟子謂拯民於水火之時也易說六四中行告公從利用為依遷國象曰告公從以益志也伊川先生曰四當益時處近君之位居得其正以柔巽輔上而不順應於初之剛陽如是可以益於上也惟處不得其中而所應又不中是不足於中也故云若行得中道則可以益於君上告於上而獲信從矣以柔巽之體非有剛特之操故利用為依遷國為依依附於上也遷國順下而動也上依剛中之君而致其益下順剛陽之才以行其事利用如是也自古國邑民不安其居則遷遷國者順下而動也爻辭但云得中行則告公而獲從象復明之曰告公而獲從者告之以益天下之志也志苟在於益天下上必信而從之事君者不患上之不從患其志之不誠也並易傳橫渠先生曰以隂居隂體巽應卑持此施益可以為依遷之國純用卑柔仍告上公見從方可用事無剛故也不足告王故曰告公本為初六寄位於四居隂體巽所趨在下以為依遷之國人所容信然必中行不私然後可告必見從蓋上以益下為心也易說白雲郭氏曰三四失中故皆以中行戒之非有為之地居巽之下不能自動以益人故欲有行也告公而已欲遷國也依人而已不能自用也告公者以益天下之志告之也易說九五有孚惠心勿問元吉有孚惠我德象曰有孚惠心勿問之矣惠我德大得志也伊川先生曰五剛陽中正居尊位又得六二之一無之字中正相應以行其益何所不利以陽實在中有孚之象也以九五之德之才之位而中心至誠在惠益於物其至善大吉不問可知故云勿問元吉人君居得致之位操可致之權苟至誠益於一作於益天下天下受其大福其元吉不假言也有孚惠我德人君至誠益於一作於益天下天下之人無不至誠愛戴以君之德澤為恩惠也人君有至誠惠益天下之心其元吉不假言也故云勿問之矣天下至誠懷吾德以為惠是其道大行人君之志得矣並易傳白雲郭氏曰天下之能致益者君也而其求益者天下之民也有孚惠心則所以致益者有至誠之道焉此其所以元吉也有孚惠我德則天下之民求益而得益志誠懷我之德矣此其所以大得志也益之道於是為至損之上九言大得志蓋自損得益而為得志也此言大得志蓋君有惠天下之志至於天下信而懷其德是為大得志之時也孔子曰老者安之朋友信之少者懷之九五之謂也勿問者有孚惠心無所擇也猶彖言天施地生而曰無方繫辭言益之長裕而曰不設皆無限極之意易說上九莫益之或擊之立心勿恆凶象曰莫益之偏辭也或擊之自外來也伊川先生曰上居無位之地非行益於人者也以剛處益之極求益之甚者也所應者隂非取善自益者也利者衆人所同欲也專欲益己其害大矣欲之甚則昏蔽而忘義理求之極則侵奪而致仇怨故夫子曰放於利而行多怨孟子謂先利則不奪不饜聖賢之深戒也九以剛而求益之極衆人所共惡故無益之者而或攻擊之矣立心勿恆凶聖人戒人存心不可專利云勿恆如是凶之道也所一作謂當速改也理者天下之至公利者衆人所同欲苟公其心不失其正理則與衆同利無侵於人人亦欲與之若切於好利蔽於自私求自益以損於人則人亦與之力爭故莫肯益之而有擊奪之者矣云莫益之者非其偏已之辭也苟不偏已合於公道則人亦益之何為擊之乎既求益於人至於甚極則人皆惡而欲攻之故擊之者自外來也人為善則千里之外應之六二中正虛已益之者自外而至是也苟為不善則千里之外違之上九求益之極擊之者自外而至是也繫辭曰君子安其身而後動易其心而後語定其交而後求君子修此三者故全也危以動則民不與也懼以語則民不應也無交而求則民不與也莫之與則傷之者至矣易曰莫益之或擊之立心勿恆凶君子言動與求皆以其道乃完善也不然則取傷而凶矣並易傳橫渠先生曰未嘗損己而云莫益之作易者因益卦而言爾體剛質巽志應在下位亢於上故立心勿恆或擊之反或益之之義為文故又云自外來也並易說白雲郭氏曰天下之理髙極者必危滿極者必溢是以益贊于禹曰滿招損謙受益詩人美成王言能持盈守成則知盈滿之戒古人深慎之也益之上九益道既極其損將至故莫益之莫益之者莫之與益也莫之與益則惟傷之者至是以至於或擊也夫以乾之健猶有姤以坤之順猶有復物之所不能免者當是時也戰戰兢兢如臨深淵如履薄氷尚懼不免於擊況立心勿恆之人乎其凶冝矣偏辭者言莫益之之辭謂一偏益不已不知持滿之戒故至於極而莫之與是所以謂之偏也持滿之道何如孔子所謂安其身易其心定其交是也且方益之時天地人鬼無或不致益焉及其極也外來之擊斯亦衆矣謙言天道虧盈鬼神害盈人道惡盈益而至於盈其害必至與豐之上六窺其户閴其無人三歲不覿凶其義皆同易說大易粹言卷四十二
