body:
  text: 大易粹言卷七十宋方聞一編繫辭下二子曰乾坤其易之門邪乾陽物也坤隂物也隂陽合德而剛柔有體以體天地之撰以通神明之德其稱名也雜而不越於稽其類其衰世之意邪伊川先生曰或曰乾坤易之門其義難知餘卦則易知也曰乾坤天地也萬物烏有出天地之外者乎知道者統之有宗則然也而在卦觀之乾坤之道簡易故其辭平直餘卦隨時應變取捨無常尤為難知也知乾坤之道者以為易則可也經説橫渠先生曰推而行之存乎通所謂合德隤然確然所謂有體乾於天為陽於地為剛於人為仁坤於天則隂於地則柔於人則義先立乾坤以為易之門戶既定剛柔之體極其變動以盡其時至于六十四此易之所以教人也其文詞錯綜而條理不雜世衰則天人交勝其道不一易之情也人一作理並易説龜山楊氏曰問易曰乾坤其易之門耶所謂門莫是學易自此入否曰不然今人多如此説故有喻易為屋室謂其入必有其門則乾坤是也為此言者只為元不曉易夫易與乾坤豈有二物孰為內外謂之乾坤者因其健順而命之名耳乾坤即易易即乾坤故孔子曰乾坤毁則無以見易蓋無乾坤則不見易非易則無乾坤謂乾坤為易之門者隂陽之氣有動靜屈伸爾一動一靜或屈或伸闔闢之象也故孔子又曰闔户謂之坤闢户謂之乾所謂門者如此老子曰天地之間其猶槖籥乎夫氣之闔闢往來豈有窮哉有闔有闢變由是生其變無常非易而何大抵看易須先識他根本然後有得夫易求之吾身斯可見矣豈應外求張橫渠於正蒙中曽略説破云乾坤之闔闢出入息之象也非見得徹言不能及此某舊曽作明道哀詞云通闔闢於一息兮尸者其誰蓋言易之在我也人人有易不知自求只於文字上用功要作何用問乾坤即隂陽之氣否曰分明説乾陽物坤隂物既是隂陽又曰乾坤何也曰乾坤止言其健順爾欲識本根須是知體同名異自然意義曉然並語録白雲郭氏曰此章論易之為書也乾坤二卦在易之書猶易之門學者首當明乾坤之義也自道言之三才之內無非物乾坤雖非天地萬物以類言之亦陽物隂物也況在易之乾坤見於卦象者乎乾坤合隂陽之德而後有剛柔之體蓋言先得乾坤隂陽之道而後見於象者剛柔之體具焉剛柔之體具則六十四卦由之而生故觀其象則可以體天地之撰明其義則可以通神明之德矣六十四卦稱名雖雜而不越乎乾坤剛柔之一道也稽其言之類不過於幾微禍福吉凶悔吝豈皆衰世之意邪是亦聖人之情見乎辭也易説夫易彰往而察來而微顯闡幽開而當名辨物正言斷辭則備矣其稱名也小其取類也大其旨遠其辭文其言曲而中其事肆而隱因二以濟民行以明失得之報橫渠先生曰夫易彰往察來而微顯闡幽如坤初六驗履霜於已然察堅冰於將至之類一云數往知來其義一也顯者則微之使求其原幽者則闡之使見其用故曰其事肆而隱天下之理既已思盡思易之道百八十四爻變動以寓之人事告人以當如何時如何事若其應也如何則吉如何則凶冝動冝靜丁寧以為告戒此因二以濟民行也並易説白雲郭氏曰易之為書也所以彰往聖之道察方來之變而垂教於無窮其微顯闡幽所謂顯道神德行也開明大道至于六十四其當名辨物正言斷辭無或不備雖其稱名小者其取類大也旨遠者道具於旨也辭文者道顯於辭也其言屈曲而發無不中其事肆直而理無不精開明失得之報以濟民之所行故曰因二二者失得也斯道得則吉報之斯道失則凶報之故吉凶所以為失得之報也前言當名謂卦也辨物謂象也正言爻彖之辭也斷辭繫之以吉凶者也易説易之興也其於中古乎作易者其有憂患乎伊川先生曰如言仁者不憂又却言作易者其有憂患須要知用處各别也天下只有一箇憂字一箇怨字既有此二字聖人安得無之劉元承手編橫渠先生曰諳識情偽吉凶之變故能體盡性命易説白雲郭氏曰易始於包犧而興於文王故曰中古作易者其有憂患乎蓋謂文王也説者謂既有憂患則須修德以避患故明九卦為德之所用誤矣夫聖人修德又豈係於憂患乎而孔子言此者蓋以聖人居崇髙之位道行於天下為帝為王參天地贊化育則易行乎其中矣固不必有作也及其道不行於天下而憂患天下後世之深欲力以斯文昭示來世則不得不作矣此文王所以蒙大難而作易也然則孔子道不行而繫易其亦所謂憂患者乎故憂患者蓋憂患後世之不復與聞斯道也易説是故履德之基也謙德之柄也復德之本也恆德之固也損德之修也益德之裕也困德之辨也井德之地也巽德之制也橫渠先生曰巽德之制者量冝接物故曰制也易説白雲郭氏曰聖人用易上篇言之詳矣而修德之事或未盡也故舉九卦以明之夫擇可履而履之故為德之基謙以持之為德之柄復以反之為德之本恆以可久為德之固損其害己之欲故為德之修遷其益己之善故為德之裕困而不失其所亨故為德之辨改邑不改井井猶性也故為德之地巽以申命行事故為德之制此聖人以九卦成德於內也易説履和而至謙尊而光復小而辨於物恆雜而不厭損先難而後易益長裕而不設困窮而通井居其所而遷巽稱而隱伊川先生曰益長裕而不設謂固有此理而就上充長之設是撰造也撰造則為偽也周行已録橫渠先生曰履和而至和必以禮莭之注意極佳益必實為有益如天之生物長必裕之非虛設也益長裕而不設益以實也妄加以不誠之益非益也巽稱而隱順以逹志故事舉而意隱並易説益物必誠如天之生物日進日息自益必誠如川之方至日增日得施之妄學之不勤欲自益且益人難矣哉易曰益長裕而不設信夫銘諸牖以自詔正蒙白雲郭氏曰説而應乎乾和也辨上下定民志至也尊而謙益光之道也復之早辨不逺復也剛柔皆應恆是以雜而不厭也懲忿窒欲先難後易也天施地生其益無方長裕不設也不設者不居於一方也困窮而通人窮而道亨也井居其所而能遷其不窮之養也巽之申命其稱也順而入之其隱也此九卦之性情也易説履以和行謙以制禮復以自知恆以一德損以遠害益以興利困以寡怨井以辨義巽以行權明道先生曰巽以行權義理所順處所以行權朱公掞問學拾遺橫渠先生曰稱物平施隨所求小大與之此辨義也巽以行權者不巽則失其冝也並易説白雲郭氏曰聖人因履之和以和行因謙之遜以制禮因復以自反於道因恆以不變其德因損以去其害己者因益以遷善因困而亨道則無怨尤於天人因井以辨勞民往來之有義因巽以行申命之權是皆聖人用九卦以見於有行也權者反於古而冝於今道之權也非小人之狙詐也堯舜傳賢而禹傳子權也夏尚忠商尚質周尚文亦權也易説易之為書也不可逺為道也屢遷變動不居周流六虛上下無常剛柔相易不可為典要唯變所適橫渠先生曰心不存之是逺也不觀其書亦是逺也蓋其為道屢遷易説白雲郭氏曰人之於道不可須臾離也故於易不可逺可離者非道可逺者亦非易也易之為道數遷而變變動未嘗止周流六爻或以下而升上或由上而降下以剛易柔以柔易剛不可以常道拘也唯變所適而已此之謂易之道也易説其出入以度外內使知懼又明於憂患與故無有師保如臨父母初率其辭而揆其方既有典常苟非其人道不虛行白雲郭氏曰人之學道能不逺易則出入行藏必謹其度外焉知懼則懼其失於有行內焉知懼則懼其失於修身憂患者一己之憂患也故者天下之務也明於憂患與故則自一身以及天下無或不明也人能明此以不逺易故也雖無師保教訓常如父母之臨豈無自而然哉知易之道須臾不可逺離而已如臨父母則敬易之心存焉易之言敬有二道有接物之敬需所謂敬之終吉是也有先物之敬坤所謂敬以直內是也接物之敬有作有輟直內之敬雖造次顛沛無時而非敬故常如父母之臨之也初率其辭而揆其方既有典常者聖人言學易之道也學者初循其辭以探其道而後可以得其典常典常大要也苟非其人能盡學易用易之道則易道安能有行於世哉然君子之於學也有二道有率其辭者自外入也故易之為書不可逺有率其性者由中出也故中庸之道不可須臾離書不可逺則道不可逺矣道不可離則書不可離矣明乎此然後善學易説易之為書也原始要終以為質也六爻相雜唯其時物也其初難知其上易知本末也初辭擬之卒成之終若夫雜物撰德辨是與非則非其中爻不備噫亦要存亡吉凶則居可知矣知者觀其彖辭則思過半矣橫渠先生曰於一卦之義原始要終究兩端以求其中六爻則各指所之非卦之質也故吉凶各類其情指其所之初上終始三四非貴要之用非內外之主中爻以要存亡吉凶如困卦正大人吉無咎蓋以剛中也小過小事吉大事凶以柔得中之類並易説易為君子謀不為小人謀故撰德於卦雖爻有小大及繫辭其爻必諭之以君子之義正蒙白雲郭氏曰前曰易之為書蓋明易之道此言易之為書蓋論卦爻之要皆終以學者之事且自一卦論之原始要終上下不遺為一卦之質也卦名之義名其質而已如乾之為乾也原始要終知乾之質為健故名其卦曰乾至於潛見飛躍則非質也六爻之義剛柔動靜吉凶悔吝之不同各從其時與物之異而已是則潛見飛躍之謂也此卦爻之義不能一也爻之初為難知及其上則易知者本末之不同也初者事之始事之微其辭則擬之而已故為難知上者事之終事之成其辭無隱故易知也若夫雜辨天下之物論撰衆人之德明二者之是非則非其中爻不能備矣蓋言初上本末不能具也説者以二五為中爻此章論六爻相雜之道既言初上本末於其上則下言中爻者二五三四皆是也蓋二五三四皆為人道雜物撰德辨是非人事也故中孚以三四為中而王輔嗣亦疑初上之無位此言雜物撰德則兼天下之物與德為言非止二五君臣而已故知捨初上之餘皆中爻也而其辭言不備者謂非此四者不能備天下之象也學者要中爻之存亡吉凶以考其所居得失皆可以自知此所以不可逺也彖辭明一卦之義物德是非存亡吉凶未能論辨者觀乎彖辭則思己過半矣此又言學易之要在夫彖也先儒或謂彖辭為文王卦下之辭非也直今之彖耳易説二與四同功而異位其善不同二多譽四多懼近也柔之為道不利逺者其要無咎其用柔中也三與五同功而異位三多凶五多功貴賤之等也其柔危其剛勝邪橫渠先生曰柔之為道不利逺者柔之用近也易説白雲郭氏曰二四隂也三五陽也隂陽之功同而位則異也二之多譽中也四之多懼近君也此其善之不同也二四冝以柔居之而柔之用近不利逺者則六二何其多譽乎然要其終所以無咎者六二之用柔中故也三之多凶五之多功其貴賤不同位有當不當也三五皆冝以剛居之而九三多凶者賤而失中也五則柔危而剛勝者貴而得中也上言中爻而此論二四三五蓋其同功而異位者皆中爻也王輔嗣不辨四者為中爻而反以初上為無位不知以六位言之則初上不得為無位以中爻言之自無初上也易説易之為書也廣大悉備有天道焉有人道焉有地道焉兼三才而兩之故六六者非它也三才之道也道有變動故曰爻爻有等故曰物物相雜故曰文文不當故吉凶生焉伊川先生曰惟人氣最清可以輔相裁成天地設位聖人成能直行乎天地之中所以為三才天地本一物地亦天也只是人為天地心是心之動則分了天為上地為下兼三才而兩之故六也附吕與叔東見録橫渠先生曰故曰爻爻者交雜之義易説白雲郭氏曰易之為書廣大無不備者蓋有三才之道焉故六畫非它也兼三材而兩之之道也一卦之道各有變動因其變動而别言之故為爻此言六位之辨也爻有貴賤上下之等故曰物物謂二四三五之類是也物雜無六則以剛柔相文故曰文文之當其位則吉九之於五六之於二是也文之不當其位則凶六之於三九之於四是也大致如此故曰吉凶生焉易説易之興也其當殷之末世周之盛德邪當文王與紂之事邪是故其辭危危者使平易者使傾其道甚大百物不廢懼以終始其要無咎此之謂易之道也橫渠先生曰剛柔錯雜美惡渾淆文王與紂當之矣百物不廢細無不察也並易説顯道者危使平易使傾懼以終始其要無咎之道也正蒙白雲郭氏曰文王遭紂之世蒙大難而演易是故其辭危危懼也懼斯道之不聞於天下後世也後世得其言則危者可平失其言則易者可傾其道甚大天地之間無不備是以天下無廢物懼人以終始則使人慎終如始安不忘危存不忘亡要其歸終使無咎而已此所謂易之道也説者或以危為述憂危之事使後世危懼避患或以危為微不正之辭二者皆非聖人之道也易説夫乾天下之至健也德行恆易以知險夫坤天下之至順也德行恆簡以知阻能説諸心能研諸侯之慮定天下之吉凶成天下之亹亹者橫渠先生曰擬議云為非乾坤簡易以立本則易不可得而見也簡易故能悅諸心知險阻故能研諸慮簡易然後知險阻簡易理得然後一以貫天下之道繫辭言能研諸慮止是剩侯之二字説者就而解諸侯有為之主若是者即是隨文耳太虛之氣隂陽一物也然而有兩健順而已又不可謂天無意陽之健不耳何以發散並易説至健以易至順而簡故其險其阻不可階而升不可勉而至仲尼猶天九五飛龍在天其致一也正蒙白雲郭氏曰橫渠曰恆易故知險恆簡故知阻又曰易簡故能悅諸心險阻故能研諸慮或者言亹亹勉也以意逆之則謂天下之事功也定吉凶成亹亹皆由乾坤之易簡故也諸侯之慮侯之為衍字故王輔嗣曰能説諸心能研諸慮易説是故變化云為吉事有祥象事知器占事知來天地設位聖人成能人謀鬼謀百姓與能橫渠先生曰言易於人事終始悉備行善事者易有祥應之理萌兆之事而易具著見之器疑慮而占則易示將來之驗有以見天地之間成能者聖人而已能畏信於易者雖百姓之愚能盡人鬼幽明之助天能為性人謀為能大人盡性不以天能為能而以人謀為能故曰天地設位聖人成能天人不須強分易言天道則與人事一衮論之若分别則是薄乎云耳自然人謀合蓋一體也人謀之所經畫亦莫非天理耳並易説兼山郭氏曰易曰天地設位聖人成能與天地參之謂也中庸解白雲郭氏曰凡人道變化云為之間吉事則先見其祥象事則先知其器占事則知方來皆言人事不能先易是以定天下之吉凶成天下之亹亹也天地設位於上下而已不能自成其能也唯聖人成其能以備三才之道此所以參天地而贊化育也聖人亦豈自謂其能哉人謀鬼謀百姓與其能而已所以致是者有道存焉道者易也既曰人謀又言百姓者猶洪範之言卿士庶民也易説八卦以象告爻彖以情言剛柔雜居而吉凶可見矣變動以利言吉凶以情遷橫渠先生曰八卦有體故象在其中錯綜為六十四爻彖所趨各異故曰情言能變通則盡利纍於其情則陷於吉凶矣並易説辭各指其所之聖人之情也指之以趨時盡利順性命之理臻三極之道也能從之則不陷於凶悔矣所謂變動以利言者也然爻有攻取愛惡本情素動因生吉凶悔吝而不可變者乃所謂吉凶以情遷者也能深存繫辭所命則二者之動見矣正蒙白雲郭氏曰八卦有象而未有言故以象告六十四卦之後有爻彖之辭故曰以情言剛柔相雜而後有得失故吉凶可見是三者皆卦所具之情也變動以利言者聖人變而通之以盡利故變動主於利也吉凶以情遷者卦之吉凶因人善惡而遷也易説是故愛惡相攻而吉凶生逺近相取而悔吝生情偽相感而利害生伊川先生曰易爻應則有時而應又逺近相取悔吝生遊定夫録橫渠先生曰凡卦之所利與爻之所利皆變通之冝也如利建侯利艱貞誠則順理而利偽則不循理而害易言情偽相感而利害生則是専以人事言故有情偽利害也屈伸相感而利生此則是理也惟以利言易説白雲郭氏曰六爻剛柔各因其愛惡相攻而後有吉凶逺或相應近或不相得則有悔吝此皆言爻之情也亦猶在人情偽相感而生利害與爻一也易説凡易之情近而不相得則凶或害之悔且吝白雲郭氏曰凡易之情與人之情何以異哉自六爻觀之相近而不相得則凶矣雖無不相得或少害之亦悔且吝也人之情蓋亦猶是此蓋重釋上言吉凶悔吝利害之説以先言人之情偽相感故此復言几易之情易説將叛者其辭慙中心疑者其辭枝吉人之辭寡躁人之辭多誣善之人其辭遊失其守者其辭屈白雲郭氏曰六者之辭冝無與於易焉然由六者觀之則易之辭蓋無是也然聖人作易所以無是六者之辭者以聖人之辭出於道未嘗出於胸中之私也六者之人所以有六者之辭者各因其心之私而不自知其為是言也以是知衆人之所任者心而聖人之所任者道也凡心善惡皆私也惟道為天下之大公故足以洗心易説大易粹言卷七十
