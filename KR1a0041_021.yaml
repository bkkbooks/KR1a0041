body:
  text: 大易粹言卷二十一宋方聞一編震下離上伊川先生曰噬嗑序卦可觀而後有所合故受之以噬嗑嗑者合也既有可觀然後有合之者也噬嗑所以次觀也噬齧也嗑合也口中有物間之齧而後合之也卦上下二剛爻而中柔外剛中虛人頥口之象也中虛之中又一剛爻為頥中有物之象口中有物則隔其上下不得嗑必齧之則得嗑故為噬嗑聖人以卦之象推之於天下之事在口則為有物隔而不得合在天下則為有強梗或讒邪間隔於其間故天下之事不得合也一無也字當用刑法小則懲誡大則誅戮以除去之然後天下之治得成矣凡天下至於一國一家至於萬事所以不和合者皆由有間也無間則合矣以至天地之生萬物之成皆合而後能遂凡未合者皆為間也若君臣父子親戚朋友之間有離二怨隙者蓋讒邪間於其間也除去之則和合矣故間隔者天下之大害也聖人觀噬嗑一作齧合之象推之於天下萬事皆使去其間隔而合之則無不和且治一作洽矣噬嗑者治天下之大用也去天下之間在任刑罰故卦取用刑為義在二體明照而威震乃用刑之象也易傳噬嗑亨利用獄伊川先生曰噬嗑亨卦自有亨義也天下之事所以不得亨者以有間也噬而嗑之則亨通矣利用獄噬而嗑之之道冝用刑獄也天下之間非刑獄何以一作不可以去之不云利用刑而云利用一無利用字獄者卦有明照之象利於察獄也獄者所以究察情偽得其情則知為間之道然後可以設防與致刑也易傳橫渠先生曰子路禮樂文章未足盡為政之道以其重然諾言為衆信故片言可以折獄如易所謂利用折獄利用刑人皆非卦爻盛德適能是而已焉正蒙白雲郭氏曰噬嗑之名有二義合而言之則噬而後合嗑而後亨事之序也别而言之則方噬者未合既嗑者不噬噬為始也嗑為終也終始之義分焉文王之辭兼始終故言亨謂嗑之終也言利用獄謂噬之始也噬之始立卦之義也嗑之終卦成之義也周公論立卦之始故爻辭言噬而不言嗑非無嗑義也舉一以明之耳孔子於彖從文王蓋釋文王之辭也於象從周公蓋釋周公之辭也於繫辭極其終蓋明文王周公之所未言也故言日中為市致天下之民聚天下之貨又曰嗑者合也物不可以苟合而已皆以嗑為義而不及噬也如是則知方立卦之始主於噬而卦成之後主於嗑矣主於噬故利用獄嗑亨之時非利用矣是以聖人於道德仁義無時不用刑獄雖設而其用有時者蓋本噬嗑之義故也唐虞之民不犯成周刑措不用方是時則不以用獄為利也故知利用特在於有間之時易之為辭其旨逺哉然頥中有物事之至小者也而名卦之義有取於此者蓋易之道觸類而長之雖大而天下莫能載小而物莫能破者其道皆一也又況頥中至小猶須震之動離之明而後可斷矧有大於此者乎是以聖人欽愼之而不忽也易説彖曰頥中有物曰噬嗑噬嗑而亨剛柔分動而明雷電合而章柔得中而上行雖不當位利用獄也伊川先生曰頥中有物故為噬嗑有物間於頥中則為害噬而嗑之則其害亡乃亨通也故云噬嗑而亨剛柔分以卦才言也剛爻與柔爻相間剛柔分而不相雜為明辨之象明辨察獄之本也動而明下震上離其動而明也雷電合而章雷震而電耀相須並見合而章也照與威並行用獄之道也能照則無所隱情有威則莫敢不畏上既以二象言其動而明故復言威照並用之意六五以柔居中為用柔得中之義上行謂居尊位雖不當位謂以柔居五為不當而利於用獄者治獄之道全剛則傷於嚴暴過柔則失於寬縱五為用獄之主以柔處剛而得中得用獄之冝也以柔居剛為利用獄以剛居柔為利否曰剛柔質也居用也用柔非治獄之冝也並易傳電者隂陽相軋雷者隂陽相擊也軋者如石相磨而火光出者電便有雷擊者是也吕與叔録橫渠先生曰九五分而下初六分而上故曰剛柔分合而章合而成文也六自初而進之於五故曰上行並易説龜山楊氏曰上麗而下動一剛間之頥中有物之象也噬而嗑則間去矣故噬嗑而亨也夫噬嗑者除間之卦也除間以刑為用故利用獄獄者所以治間而求其情也治而得其情則刑之而天下服矣故不言利用刑而曰利用獄也夫剛柔分以爻言也動而明雷電合而章以二體言也繫辭曰爻有等故曰物物相雜故曰文剛柔分而不相雜非文也用文非所以治獄故也動而明雷電合而章則威明並著而無留獄矣此治獄之道也六五柔得中而上行用獄之主也人君阻法度之威而濟之以剛果則片言折之可也然刑者侀也一成而不可變則人君所冝恤也故古之治獄者吏以獄成告于正正聽之正以獄成告于大司寇司寇聽之棘木之下大司寇以獄之成告于王王命三公參聽之三公以獄成告于王王三宥之而後制刑此以柔用刑不以剛決之意也人君以剛健為德五君位也而柔居之不當位也故所利惟用獄而已自噬嗑亨至此易説兼山郭氏曰噬嗑自否出者也否乾上而坤下乾剛而坤柔初六一變而為六五離柔也九五一變而為初九震剛也昔之剛者今則分而下為柔昔之柔者今則分而上為剛故曰剛柔分剛在下則動柔在上則明動而明初未章也合而後章而六五居上無剛健之材利獄除間而已老子曰天地之道虛而不屈動而愈出此間之不可不除而利獄以除間者人事也易説白雲郭氏曰先人曰噬嗑自否來否乾剛而坤柔初六升而為離柔也九五降而為震剛也雍曰剛柔之分蓋以乾之三剛分一以成震坤之三柔分一以成離也否泰二體乾坤之純故噬嗑與賁皆稱分焉噬嗑之彖蓋具三義自己成一體論之合六爻而言有頥中有物之象自乾坤之變論之則有剛柔分之義自震離二體而言故曰動而明雷動也電明也雷與電合則天威於是乎章動而且明則聖人之威於是乎立此聖人法天之道而用獄也柔得中六五也上行則法天動而必明之意也故雖無剛健之才以當其位亦可為噬嗑之主而用獄矣由是知聖人用獄無私情一本天道而已然則漢唐之興卒無三代之治者不明法天故也其惡之大尤見於用獄之際不知雷電之必合以盡動而明之義復蹈秦皇慘毒之政其傳祀數百年亦已幸矣是以遊聖門者羞稱之易説象曰雷電噬嗑先王以明罰勑法伊川先生曰象無倒置者疑此文誤也雷電相須並見之物亦有嗑象電明而雷威先王觀電雷之象法其明與威以明其刑罰飭其法令者明事理而為之防者也易傳龜山楊氏曰先王觀雷電威明之象而致愼焉故明罰勑法明則不濫勑則不苛易説兼山郭氏曰象春秋書震夷伯之廟左氏曰展氏有隱慝焉書之金縢曰今天動威以彰周公之德故知雷電之威無隱而弗及也易之取象噬嗑與豐無以異此噬嗑者先動而後明初未明也故不敢折獄政刑豐則先明而後動初已明也故不待明罰勑法而後用也天之動威其行如此則先王之用刑其有不愼者乎故書曰欽哉欽哉惟刑之恤哉於此可見矣然則噬嗑與豐施設之序何異也曰猶之天也將先春而後秋乎將先秋而後春乎故折獄致刑蓋有不得已而然矣易説白雲郭氏曰先人曰噬嗑先動而後明初未明也故不敢折獄致刑豐則先明而後動初已明也故不待明罰勑法而後用也雍曰二卦先後之象盡於此矣然噬嗑方動以期於明必先明其罰勑其法以示天下使天下知所避然後犯于有司者可以麗其罪若周官大司寇縣刑象之法于象魏小司寇令以木鐸曰不用法者國有常刑令羣士乃宣布于四方憲刑禁至於士師又憲禁令于國及郊野此之謂明罰勑法也豐則已明而動是已布刑也已令憲也動則麗之刑矣若大司寇邦典定之邦法斷之邦成弊之小司寇以五刑聽萬民之獄訟附于刑用情訊之至于旬乃弊之士師察獄訟之辭以詔司寇斷獄弊訟致邦令此之謂折獄致刑也是皆聖人之政見於有迹者也若其至仁內充推恩四海蓋不可得而見焉特於聖人之言得其大槩而已觀舜戒羣后曰欽哉欽哉惟刑之恤哉其戒臯陶曰惟明克允又曰明于五刑以弼五教又曰刑期于無刑而臯陶稱舜亦曰好生之德洽于民心兹用不犯于有司知此則盡噬嗑之用獄矣然舜之命臯陶必先曰蠻夷猾夏寇賊姦宄然後曰汝作士蓋蠻夷猾夏寇賊姦宄利用獄之時也由是知非噬嗑之時聖人未嘗以用獄為利也易説初九屨校滅趾無咎象曰屨校滅趾不行也伊川先生曰九居初最在下無位者也下民之象為受刑之人當用刑之始罪小而刑輕校木械也其過小故屨之於足以滅傷其趾人有小過校而滅其趾則當懲懼不敢進於惡矣故得無咎繫辭云小懲而大誡此小人之福也言懲之於小與初故一有後字得無咎也初與上無位為受刑之人餘四爻皆為用刑之人初居最下無位者也上處尊位之上過於尊位亦無位者也王弼以為無隂陽之位隂陽繫於竒偶豈容無也然諸卦一作爻初上不言當位不當位者一作不言位當不當者蓋初終之義為大臨之初九則以位為正若需上六云不當位乾上九云無位爵位之位非隂陽之位也屨校而滅傷其趾則知懲誡而不敢長其惡故云不行也古人制刑有小罪則校其趾蓋取禁止其行使不進於惡也並易傳橫渠先生曰戒之在初小懲可止故無咎易説龜山楊氏曰先王之用刑期於無刑而已當用獄之初未至於惡積而罪大猶足以遷善也故屨校滅趾使不進於惡而已所以小懲而大誡也易説白雲郭氏曰伊川曰初最下上過尊位皆無位也無位受刑者也王弼謂無隂陽之位非也雍曰觀輔嗣傳文曰無位而已伊川謂無隂陽之位者以略例言初上無隂陽定位故也易之於爻以二三四五為人道之著初上雖為始終然既居六畫之內安得謂之無位若謂非有位用事之象則可也是以在噬嗑為受刑之人夫以聖人仁覆天下於小罪輕刑固冝赦宥而此初九屨校滅趾不以為過何哉蓋小懲於早所以大誡於後使惡不進是為無刑之本此聖人之大仁也不然姑息不忍長惡孰甚焉校者械之通名在足之校屨之而沒其趾大其校也使之不能行也乃所以戒其惡之不行也易説六二噬膚滅鼻無咎象曰噬膚滅鼻乘剛也伊川先生曰二應五之位用刑者也四爻皆取噬為義二居中得正是用刑得其中正也用刑得其中正則罪惡者易服故取噬膚為象噬齧人之肌膚為易入也滅沒也深入至沒其鼻也二以中正之道其刑易服然乘初剛是用刑於剛強之人刑剛強之人必須深痛故至滅鼻而無咎也中正之道易以服人與嚴刑以待剛強義不相妨深至滅鼻者乘剛故也乘剛乃用刑於剛強之人不得不深嚴也深嚴則得冝乃所謂中也並易傳橫渠先生曰六三居有過之地而已噬之乘剛而動為力不勞動未過中故無咎易説龜山楊氏曰六二以中正之德處用獄之時則刑當而罪得矣故有噬膚之象焉膚言噬之易也鼻者息之出入往來而不窮也九四為間者也而初應之二剛合則為間大而難噬矣故乘之絶其往來乃無咎易説兼山郭氏曰六二噬嗑柔得中而上行蓋才不足而資物以為用者也柔順中正裕於矜恤之仁而略於剛斷之義然而噬膚之易有滅鼻之深蓋乘剛之過也六二且以為戒況其它乎易説白雲郭氏曰二三四五皆言噬蓋用刑除間之爻也膚柔脆之物易噬也夫六二柔順中正之德冝其用刑無過舉矣今噬膚之易而有滅鼻之深者蓋六二以柔乘剛患在不及能勉於用剛焉乃能乘剛故此噬深亦無咎也古者刑亂國用重典豈非噬膚乘剛之義乎四爻必假膚臘胏肉見義者以噬嗑之名本取頥中之象故也易説六三噬臘肉遇毒小吝無咎象曰遇毒位不當也伊川先生曰三居下之上用刑者也六居三處不當位自處不得其當而刑於人則人不服而怨懟悖犯之如噬齧乾臘堅韌之物而遇毒惡之味反傷於口也用刑而人不服反致怨傷是可鄙吝也然當噬嗑之時大要噬間而嗑之雖其身處位不當而強梗難服至於遇毒然用刑非為不當也故雖可吝而一無而字亦小噬而嗑之非有咎也六三一無三字以隂居陽處位不當自處不當故所刑者難服而反毒之也並易傳橫渠先生曰所間在四四為剛陽故曰臘肉非禮傷義故曰遇毒能以為毒而舍之雖近不相得小有吝而無咎也易説龜山楊氏曰頥中有物謂九四也則噬嗑之為間惟九四而已故有臘肉之象焉臘肉物之全體也六三柔不當位而居動之極上當九四之剛故噬臘肉而遇毒也噬臘肉而遇毒故可吝然噬終必合故無咎易説白雲郭氏曰六二雖乘剛而能噬深者中正故也六三之柔又非中正其噬難矣而能擇乾物之小者噬之猶如治小獄決小罪可謂度德而量力者也然其威德終不足以服人適足以招怨懟而致悔吝以其刑既小是以止於小吝而無大咎也鄭氏周官注以小物全乾為臘馬氏以有骨謂之胏其義最得之毒害也猶人不勝其噬而疾作也易説九四噬乾胏得金矢利艱貞吉象曰利艱貞吉未光也伊川先生曰九四居近君之位當噬嗑之任者也四己過中是其間愈大而用刑愈深也故云噬乾胏胏肉之有聮一無聮字骨者乾肉而兼骨至堅難噬者也噬至堅而得金矢金取剛矢取直九四陽德剛直為得剛直之道雖用剛直之道利在克艱其事而貞固其守則吉也九一無九字四剛而明體陽而居柔剛明則傷於果故戒以知難居柔則守不固故戒以堅貞剛而不貞者有矣凡失剛者皆不貞也在噬嗑四最為善凡言未光其道未光大也戒於一作以利艱貞蓋其所不足也不得中正故也並易傳橫渠先生曰五為隂柔故喻乾胏能守正得剛直之義故艱貞吉其德光大則其貞非艱也易説龜山楊氏曰九四合一卦言之則為間者也以爻言之則居大臣之位任除間之責者也易之取象不同類如此夫處羣隂之中當除間之責其任難勝矣故有噬乾胏之象焉胏肉之有骨者堅而難噬也噬胏而得金矢以剛克遇之也蓋剛過中故有金矢之象焉夫用獄之道君子所冝盡心也一之以剛直則獄有不得其情者故利艱貞吉孔子曰聽訟吾猶人也必也使無訟乎雖利艱貞未能使無訟也故曰未光也易説兼山郭氏曰九四胏骨之堅強而難噬者也噬嗑皆以柔而四為頥中之間上下二隂三五之所同欲以噬者也故在訟則為難聽之訟在獄則為難折之獄而九四以剛明而聽之能得其情者也古者以兩造禁民訟以兩造聽之而無所偏受則不直自反而民訟禁矣入束矢於朝不直則入其矢所以懲不直也以兩劑禁民獄而無偏信則不信者自反而民獄禁矣入鈞金三日乃致於朝不信則入其金所以懲不信也方九四之聽訟也既得其矢則不直者自反而服其非又得其金則不信者自反而服其罪則難折之獄既折而得其情矣尚且曰利艱貞吉則先王之於獄訟其可易言之哉故曰刑者侀也侀者成也死者不可復生刑者不可復續言一成而不可變也故於聽之始也如此之愼於其成也則又可知矣易説白雲郭氏曰先人曰胏骨之乾堅強難噬者也噬嗑皆以柔而四為頥中之間上下二隂三五之所同欲以噬者也故在訟則為難聽之訟在獄則為難折之獄而九四以剛明而聽之能得其情者也古者以兩造禁民訟以兩造聽之而無所偏受則不直自反而民訟禁矣入束矢於朝不直則入其天所以懲不直也以兩劑禁民獄而無偏信則不信者自反而民獄禁矣入鈞金三日乃致於朝不信則入其金所以懲不信也方九四之聽訟也既得其矢則不直者自反而服其非又得其金則不信者自反而服其罪則難折之獄既折而得其情矣尚且曰利艱貞吉則人之於獄訟其可易言之哉故曰刑者侀也侀者成也死者不可復生刑者不可復續言一成而不可變也故於聽之始也如此之愼於其成也則又可知矣雍曰九四有至難之噬而得束矢鈞金猶曰利艱貞吉者曾子所謂如得其情則哀矜而勿喜蓋聖人明愼欽恤之意也雖然刑期於無刑必也使無訟如是則得金矢亦安足以為聖人之光哉所謂聽訟猶人者也帝堯之光被四表文王之光于四方其道有大於此者矣故孔子之象以九四為未光也易説六五噬乾肉得黃金貞厲無咎象曰貞厲無咎得當也伊川先生曰五在卦愈上而為噬乾肉反易於四之乾胏者五居尊位乘在上之勢以刑於下其勢易也在卦將極矣其為間甚大非易嗑也故為噬乾肉也得黃金黃中色金剛物五居中為得中道處剛而四輔以剛得黃金也五無應而四居大臣之位得其助也貞厲無咎六五雖處中剛然實柔體故戒以必貞固而懷危厲則得無咎也以柔居尊而當噬嗑一作堅之時豈可不貞固而懷危懼哉一作忘危懼也貞厲所以能無咎者以所為得其當也所謂當居中用剛而能守正慮危也並易傳橫渠先生曰九四上九難於屈服故曰乾肉得居中持堅之義貞而危則得無咎也易説龜山楊氏曰人君任天下之重而以柔居之欲除天下之間噬之亦難矣故有乾肉之象焉然據天下之利勢噬之雖難與噬乾胏則異矣居中而處剛得黃金也噬乾肉得黃金雖不當位而居中則不過處剛則不茹得當也其除間也能勝其任矣故於貞厲而無咎易説兼山郭氏曰六五聽獄之道兩造具備師聽五辭五辭簡孚正于五刑五刑不簡正于五罰五罰不服正于五過五過之疵惟官惟反惟內惟貨惟來然噬嗑之義有審克之斷無五過之疵可以明于刑之中率乂于民棐彛者也故噬嗑乾肉得黃金亦庶幾居中之得也尚且曰貞厲無咎何也曽子曰上失其道民散久矣如得其情則哀矜而勿喜孔子曰聽訟吾猶人也必也使無訟乎故六五之貞厲才得當而已質之虞芮質厥成其亦未優乎易説白雲郭氏曰先人曰噬嗑之義有審克之斷無五過之疵可以明于刑之中率乂于民棐彛者也故噬乾肉得黃金亦庶幾居中之得也又曰六五之貞厲才得當而已質之虞芮質厥成其亦未優乎雍曰乾肉之噬易於乾胏六五柔而用中有可噬之道故得黃金然猶貞厲者蓋未能盡為君之道故也觀舜命臯陶作士而戒以無刑孔子豫仲由折獄而自任以無訟蓋君道無事於獄不必有乾肉之噬矣易説上九何校滅耳凶象曰何校滅耳聰不明也伊川先生曰上過乎尊位無位者也故為受刑者居卦之終是其間大噬之極也繫辭所謂惡積而不可掩罪大而不可解者也故何校而滅其耳凶可知矣何負也謂在頸也人之聾暗不悟積其罪惡以至於極古人制法罪之大者何之以校為其無所聞知積成其惡故以校而滅傷一無傷字其耳誡聰之不明也並易傳龜山楊氏曰為間之極至於惡積而罪大以其聰不明也使之聞過而改寧至是夫易説白雲郭氏曰小人不積小善不去小惡終至於不可掩不可解之際故有何校滅耳之凶則其聰之不明可知也蓋能明善惡安危之戒必無是凶矣然初六滅鼻上九滅耳或以滅為刑而疑之獨孔氏以謂滅沒也蓋屨校何校則刑也屨校桎其足也桎大而沒趾也何校械其首也械大而沒耳也噬膚之易而深噬焉自沒其鼻用力之過也此皆沒之義也若以滅耳為刵滅鼻為劓滅趾為剕則上九復不為凶而初二又不為無咎也書注劓刵輕刑也考之吕刑剕辟為重故漢重斬趾同於棄市方初六小懲固不當斷趾上九罪大復不當輕刑以是知三者言滅皆非刑也初二無咎上九則凶蓋戒之於早故終為無咎上九己極雖戒亦晚矣然則械其首者安知終不麗於大辟乎故為重刑也易説大易粹言卷二十一
