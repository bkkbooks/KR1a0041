body:
  text: 大易粹言卷六十八宋方聞一編繫辭上四天一地二天三地四天五地六天七地八天九地十伊川先生曰自天一至地十合在天數五地數五上簡編失其次也天一生數地六成數才有上五者便有下五者二五合而成隂陽之功萬物變化鬼神之用也經説或問張橫渠有云隂陽之精互藏其宅此説然否曰此兩句甚有味由人怎生看水離物不得故水有離之象火能入物故火有坎之象凡物之生各隨氣勝處化曰何以見得曰如木之生根既長大土却何處去曰克也曰既克則是土化為木矣曰不是化只是克五行只古人説迭王字説盡了只是一箇盛衰自然之理也人多言木得土方得生火火得土方得生金某以為不然木生火火生土土生金金生水只是迭盛衰也或曰五行是一氣曰人以為一物某道是五物既謂之五行豈不是五物也五物備然後能生且如五常人誰不知是一箇道理既謂之五常安可混而為一也天之生數地之成數才有上五者便有下五者語録橫渠先生曰此語恐在天數五地數五處然聖人之於書亦有不欲併一説盡慮易知後則不復研究故有易有難或在此説或在彼説然要終必見但俾學者潛心易説白雲郭氏曰前言天數五地數五者此也漢志言天以一生水地以二生火天以三生木地以四生金天以五生土故或謂天一至天五為五行生數地六至地十為五行成數雖有此五行之説而於易無所見故五行之説出於歷數之學非易之道也此二十字當在天數五之上錯簡於此易説子曰夫易何為者也夫易開物成務冒天下之道如斯而已者也明道先生曰開物成務有濟時之才遊定夫所録橫渠先生曰開物成務物凡物也務事也開明之也成處之也事無大小不能明何由能處雖至粗至小之事亦莫非開物成務譬如不深耕易耨則稼穡烏得而立唯深也故能通天下之志唯幾也故能成天下之務是則開物成務者必也有濟時之才易説白雲郭氏曰易之道難窮不可以一言盡故此章又明其開物成務冒天下之道也以言乎天地之間則易無不備故能冒天下之道蓋言天下之道無不具於其中也易説是故聖人以通天下之志以定天下之業以斷天下之疑橫渠先生曰能通天下之志者為能感人心易説白雲郭氏曰孔子言易道於上必繼以聖人用易於下以見聖人無適而非易也此章先言開物成務冒天下之道繼之以通天下之志本乎易之開物也以定天下之業本乎易之成務也以斷天下之疑本乎易之冒天下之道也故聖人有為有行未嘗不本於易易説是故蓍之德圓而神卦之德方以知六爻之義易以貢橫渠先生曰圓神故能通天下之志方知故能定天下之業爻貢所以斷天下之疑易書成三者備民患明聖人得以洗濯其心而退藏於密矣易説白雲郭氏曰蓍卦六爻各言其德固非易道之大全聖人用之亦所以通志定業斷天下之疑也圓而神故能通志方以知故能定業易以貢故能斷疑聖人之於易也取而用之左右逢其原矣易説聖人以此洗心退藏於密吉凶與民同患神以知來知以藏往其孰能與於此哉古之聰明睿智神武而不殺者夫伊川先生曰安有識得易後不知退藏於密密是用之源聖人之妙處河南語録離了隂陽更無道所以隂陽者是道也隂陽氣也氣是形而下者道是形而上者則是密也退藏於密密是甚知不專為藏往知來藏往主蓍卦而言並入關語録橫渠先生曰吉凶可以正勝非聖人之患也開物於幾先故曰知來明憂患而弭其故故曰藏往示人吉凶其道顯矣知來藏往其德行神矣語蓍龜之用也神武不殺神知之大者使知懼而不犯神武者也並易説龜山楊氏曰六經不言無心惟佛氏言之亦不言修性惟揚雄言之心不可無性不假修故易止言洗心盡性記言正心尊德性孟子言存心養性語録白雲郭氏曰以此洗心者以易洗心也聖人之用易也隨用隨取隨取隨足故能無思無慮以滌其心蓋其酬酢應變在易不在心則心無留事亦無應變之方非洗心而何故其修身齊家治國治天下之道莫不一本於易微而至於耒耜舟楫臼杵弧矢之用亦必取諸益取諸渙取諸小過取諸睽聖人皆無容心焉是所以能洗心而退藏於密也彼愚而好自用者雖竭精神逞智力而天下之志未必能通天下之業未必能定天下之疑未必能斷又安知聖人通天下之志者用易開物之道也定天下之業者用易成務之道也斷天下之疑者用易冒天下之道也天下之事不過於志業疑三者而已聖人用易亦不過三者之道也所謂洗心用易者如此雖聖人吉凶之患不得不與民同然無心受之亦無妄之道也夫何患焉若是者非神之妙足以知方來非知之崇足以藏已往又安能與於洗心之道哉古之聰明睿知之君神武不殺而天下治者蓋得洗心退藏之道也是知心之為物用之則塵滓不用則清明衆人不知不用之術而聖人獨明不用之道故聖人洗心在此而衆人莫之知也易説是以明於天之道而察於民之故是興神物以前民用聖人以此齊戒以神明其德夫明道先生曰聖人齊戒敬也以神明其德惡人齊戒亦敬也故可事上帝朱公掞問學拾遺易要玩索齊戒以神明其德夫劉絢師訓橫渠先生曰言天之變遷禍福之道由民之逆順取捨之故故作易以先之民患除憂疑亡用利身安故可退藏於密窮神知化以崇髙其德也自此而下又歷言其德之出而異名也並易説白雲郭氏曰聖人明天之道察民之故無或不通故興神物以前民用則無有逺近髙深遂知來物聖人初無與焉是以能齊戒其心休休然以神明其德也神物易也前言聖人用易而不自用其心故曰洗心此又追本而言聖人作易之時亦無容心焉因神物固有獨能興之而已故既興神物以前民用是乃所以齊戒神明其德夫齊戒所以洗心也洗心所以神明其德也易説是故闔户謂之坤闢户謂之乾一闔一闢謂之變往來不窮謂之通見乃謂之象形乃謂之器制而用之謂之法利用出入民咸用之謂之神明道先生曰闔闢便是易一闔一闢謂之變羅氏拾遺伊川先生曰凡物之散其氣遂盡無復歸本原之理天地間如洪爐雖生物銷鑠亦盡况既散之氣豈有復在天地造化又焉用此既散之氣其造化者自是生氣至如海水潮日出則水涸是潮退也其涸者己無也月出則潮水生也却非是將己涸之水為潮此是氣之終始闔闢便是易一闔一闢謂之變入關語録橫渠先生曰闔户靜密也闢戶動逹也形開而目覩耳聞受於陽也一動一靜是道之常専於動靜則偏也一闔一闢謂之變人之有息蓋剛柔相摩乾坤闔闢之象也因其變而裁制之以教天下聖人之法也用之不窮莫知其鄉故名之曰神並易説物之所以相感者利用出入莫知其鄉一萬物之妙者歟虛明一作靜照鑒神之明也無逺近幽深利用出入神之充塞也並正蒙白雲郭氏曰繫辭論變通最為易之要道而人多略之變通者易之道也用易之道也故孔子於繫辭三致意焉蓋其義微而難知也因其微而難知故以闔户闢户言之蓋聖人舉近人而易曉者莫若户之為用也固非乾坤之道止於闔户闢户而己也因闔戶闢户以明變通則又並及象器法神而言者以見乾坤變通以至制法盡神之妙舉一户之義足以兼明之則聖人所以探賾索隱鈎深致逺者如是其至也然一户至末也猶必盡此道而後可用於天下後世則聖人所以治天下者其可不盡變通之道乎故易曰神農氏沒黃帝堯舜氏作通其變使民不倦神而化之使民宜之易窮則變變則通通則久是以自天祐之吉無不利然則變通之道是乃黃帝堯舜氏得之以治天下者也可不務乎且坤隂物也故有闔戶之象乾陽物也故有闢戶之象既能闔復能闢是所謂變也朝闢之暮闔之日復一日往來闔闢不窮是所謂通也通也者通其變也至於其户之可見則曰象也其有形則曰器也制而用此者則曰法也利於出入之用而天下之民無不用之者又其所以為神也如是則一戶之設豈偶然哉故治天下之道無它焉如制一户之法使之變通可久斯得之矣雖黃帝堯舜之治不過於此易説是故易有太極是生兩儀兩儀生四象四象生八卦八卦定吉凶吉凶生大業伊川先生曰范文甫問四象曰左右前後楊中立問四象曰四方時氏拾遺橫渠先生曰四象即乾之四德四時之象故下文云變通莫大乎四時盡吉凶之理則能盡天人之助而成位乎其中矣故下云崇髙莫大乎富貴有吉凶利害然後人謀作大業生若無施不宜則何業之有易説龜山楊氏曰問易有太極莫便是道之所謂中否曰然若是則本無定位當處即是太極耶曰然兩儀四象八卦如何自此生曰既有太極便有上下有上下便有左右前後四方有左右前後四方便有四維皆自然之理也語録白雲郭氏曰太極者三才未分之名統三才之道者也兩儀猶曰二象也謂有乾坤天地之二象而未為乾坤天地也四象者九八七六隂陽老少之象此與大衍之序同大衍太極也分而為二兩儀也揲之以四四象也四象既生然後太極分而為三才兩儀定而名乾坤八卦以成吉凶以定而大業生焉吉凶者八卦之所有而非八卦之所生大業者聖人之所造吉凶定則易道成矣易道成故聖人用之以崇德廣業也易説是故法象莫大乎天地變通莫大乎四時縣象著明莫大乎日月崇髙莫大乎富貴備物致用立成器以為天下利莫大乎聖人探賾索隱鈎深致逺以定天下之吉凶成天下之亹亹者莫大乎蓍龜白雲郭氏曰自論乾坤變通至天生神物四事皆首以是故為言蓋因洗心齊戒用易而有是四事明文義相屬也聖人洗心齊戒用易以應天下之務蓋用易不用心故用乾坤變通而至於利用出入之神用太極兩儀之道而至於生大業由聖人用易備物致用為天下利故與天地四時日月蓍龜同為莫大神明之德終言聖人效象天地神物皆不自用其心皆有所則象亦洗心用易之道也且天下物理有形名氣象者固不可概舉也然有法象者非一而莫大於天地變通者非一而莫大於四時縣象著明者非一而莫大於日月崇髙者非一而莫大於富貴備物致用者非一而莫大於聖人探賾索隱者非一而莫大於蓍龜富貴者人君之勢位道必假此而後行也故位為大寶聖人亦人也以能用易故莫大也然法象變通著明崇髙備物致用探賾索隱皆易之道而天地四時日月富貴者與聖人蓍龜得之皆成莫大之德又以見易之開物成務冒天下之道無乎不備如是之大也易説是故天生神物聖人則之天地變化聖人效之天垂象見吉凶聖人象之河出圖洛出書聖人則之伊川先生曰孔子感麟而作春秋然麟不出春秋豈不作大抵須有發端處如畫八卦因見河圖洛書果無河圖洛書八卦亦須作入關語録因見賣兔者曰聖人見河圖洛書而畫八卦然何必圖書只看此兔亦可作八卦數便此中可起古聖人只取神物之至著耳劉元承手編橫渠先生曰天生蓍龜聖人則之以占兆一云占之以兆天地變化聖人作易以著效之故曰聖人效之作易以示人猶天垂象見吉凶作書契效法猶地出圖書一云猶河洛出圖書易説造化所成無一物相肖者以是知萬物雖多其實一物無無隂陽者以是知天地變化二端而己萬物形色神之糟粕性與天道云者易而已矣正蒙白雲郭氏曰聖人用易無它焉欲不自用其心耳蓋自用其心則是有心於成敗好惡皆私心也不自用其心則酬酢萬變皆取諸易成敗好惡聖人無容心焉此所謂洗心也聖人不獨用易以酬酢萬變也凡天地萬物可則象者皆則而象之故天生神物則則之天地變化則效之天垂象則象之河圖洛書則則之以見洗心之道皆有則象未嘗自用其私智如此河圖洛書先儒之説多不同至於取緯為證者尤非學易之事也然河出圖而後畫八卦洛出書而後定九疇故河圖非卦也包羲畫而為卦洛書非字也大禹書而為字亦猶箕子因九疇而陳洪範文王因八卦而演周易其始則肇於河圖洛書書畫於八卦九疇成於洪範周易其序如此易説易有四象所以示也繫辭焉所以告也定之以吉凶所以斷也白雲郭氏曰四象所以示變繫辭所以告得失吉凶所以斷行事自易有四象以下與前文不相屬又非别章疑其錯簡易説易曰自天祐之吉無不利子曰祐者助也天之所助者順也人之所助者信也履信思乎順又以尚賢也是以自天祐之吉無不利也伊川先生曰履信謂履五五虛中信也思順謂謙退不居尚賢謂志從於五大有之世不可以盈豐而復處盈焉非所宜也六爻之中皆樂據權位惟初上不處其位故初九無咎上九無不利上九在上履信思順故在上而得吉蓋自天祐也易傳橫渠先生曰自易曰自天祐之此篇宜在立心勿恆凶下蓋上言莫益之故此言多助也易説白雲郭氏曰已順故天助之以順已信故人助之以信大有之君履不失信下足以感人思不失順上足以動天又以尚賢是以吉無不利也橫渠張先生謂此章宜在立心勿恆凶之下亦疑與前文義不相屬也若然則當在易曰憧憧往來之前蓋自易者象也至小人之道也結句助辭多稱也與所以示也所以告也所以斷也皆相類自憧憧往來困于石公用射隼皆稱易曰故自天祐之宜在其前也上篇擬議七爻自鳴鶴在隂皆不稱易下篇十一爻自憧憧往來皆稱易曰與自天祐之同易説子曰書不盡言言不盡意然則聖人之意其不可見乎子曰聖人立象以盡意設卦以盡情偽繫辭焉以盡其言變而通之以盡利鼓之舞之以盡神明道先生曰鼓動萬物聖人之神知則不可名遊定夫所録橫渠先生曰理勢既變不能與時順通非盡利之道鼓天下之動者存乎神神一作詞天下之動神鼓之也神則主於動故天下之動皆神為之也詞不鼓舞則不足以盡神詞謂易之詞也於象固有此意矣又繫之以詞因而駕説使人向之極盡動之義也歌舞為巫風言鼓舞之盡神者與巫之為人無心若風狂然主於動而已故以好歌舞為巫風猶之如巫也巫主於動以至于鼓舞之極也故曰盡神因説鼓舞之義故取巫以為言語其動而已並易説白雲郭氏曰聖人作易所以盡言意易之一書為言亦備矣為意亦盡矣猶曰書不盡言言不盡意者言意豈苟然哉所以明乎道于以見道之難明也如此若是則聖人之意其不可見乎蓋夫子又欲明言意之盡也且意不可以言盡也故立象以盡之情偽不可以遍舉也故設卦以盡之言非一説可盡也故卦彖象文言互為之辭以盡之若是則易道明矣於是乎極其變通又盡其美利窮其鼓舞又盡其至神則易之為道無遺藴矣然立象設卦繫辭皆聖人作易以盡道者也變通鼓舞又明聖人用易之盡其道者也變而通之則經所謂通其變使民不倦之意鼓之舞之所謂神而化之使民宜之也聖人以書必不能盡其所欲言言必不能盡聖人之意故立象擊辭智者觀之則見其可盡也昧者亦未之知易説乾坤其易之緼耶乾坤成列而易立乎其中矣乾坤毁則無以見易易不可見則乾坤或幾乎息矣明道先生曰易是箇甚易又不只是這一部書是易之道也不要將易又是一箇事即事盡天理便是易也吕與叔東見録生生之謂易天地設位而易行乎其中矣乾坤毁則無以見易易不可見則乾坤或幾乎息矣易畢竟是甚李籲所録橫渠先生曰隂陽剛柔仁義之本立而後知趨時應變故乾坤毁則無以見易感而後有通不有兩則無一故聖人以剛柔立本乾坤毁則無以見易乾坤既列則其間六十四卦爻位錯綜以為變易苟乾坤不列則何以見易易不見則是無乾坤乾坤天地也易造化也聖人之意莫先乎要識造化既識造化然後有理可窮彼惟不識造化以為幻妄也不見易則何以知天道不知道則何以語性並易説見易則神其幾矣正蒙龜山楊氏曰因問乾坤毁則無以見易如此則易不屬無矣曰易固非無張橫渠深闢老子有無之論莫有見於此否曰然才説無便成斷滅去如釋氏説空又曰非空到了費力聖人只説易最為的當因言孟子論養氣到此方見有功於前聖曰如孟子者方是能曉易如説必有事焉非見得分明此説如何撰得語録白雲郭氏曰乾坤與易其名雖異其道一也易之道緼於乾坤故易之書成則乾坤成列而易立乎其中如是則乾坤有體而易無體也有體則成毁從之故上言成列下言乾坤毁易以無體託於乾坤故乾坤之卦毁則無以見易易不可見則乾坤之道亦因以息矣此蓋言易之道固不係於有書無書而無書則易不可見而乾坤之道亦息以明聖人不得不作易之意也易説是故形而上者謂之道形而下者謂之器化而裁之謂之變推而行之謂之通舉而錯之天下之民謂之事業明道先生曰如形而上者謂之道不可移謂字在之字下此孔子文章朱公掞問學拾遺灑掃應對便是形而上者理無大小故也故君子只在慎獨佛氏不識隂陽晝夜死生古今安得謂形而上者與聖人同乎並劉絢所録形而上為道形而下為器須著如此説器亦道道亦器但得道在不係今與後已與人李籲師説氣形而下者謝顯道記平日語形而上者謂之道形而下者謂之器若如或者以清虛一大為天道則乃以器言而非道也有形皆器也無形為道繫辭曰形而上者謂之道形而下者謂之器又曰立天之道曰隂與陽立地之道曰柔與剛立人之道曰仁與義又曰一隂一陽之謂道隂陽亦形而下者也而曰道者惟此語截得最分明元來只是道要在人默而識之也並劉絢師説橫渠先生曰一隂一陽不可以形器拘故謂之道乾坤成列而下皆易之器乾坤交變因約裁其變而别之故謂之變推而行其變盡利而不遺遺一作匱可謂通矣舉盡利之道而錯諸天下之民以行其典禮易之事業也運於無形之謂道形而下者不足以言之形而上是無形體者也故形以上者謂之道也形而下是有形體者故形以下者謂之器無形迹者即道也如大德敦化是也有形迹者即器也見於事實如禮義是也凡不形以上者皆謂之道惟是有無相接與形不形處知之為難須知氣從此首蓋為氣能一有無無則氣自然生是道也是易也約裁其化而指别之則名體各殊故謂之變聖人因天地之化裁節而立法使民知寒暑之變故謂之春夏秋冬亦化而裁之一端耳並易説變則化由粗入精也化而裁之謂之變以著顯微也谷神不死故能微顯而不掩正蒙白雲郭氏曰道無形故言形而上器有形故言形而下形而上者杳然而難知形而下者炳然而易見其不同如是其為變通則一也化而裁之謂如一闔一闢不執一也推而行之謂可運行無窮也如是則可以舉而錯之天下矣前言乾坤變通自言易道之變通也此言道器變通言聖人用易道之變通也曰化而裁之推而行之聖人之事也下言象爻卦辭言易書之中象爻卦辭各有變通也其化而裁之推而行之言用易之象爻卦辭亦存乎聖人之變通也且大而天地細而萬物物物各具變通之理天地不變通則不能長且久人與萬物不變通則死矣故舉人而言之朝而作闢之道也暮而息闔之道也一作一息變也與日無窮通也苟朝而不能作暮而不能息非死則病矣然則聖人尚象制器制法以利天下不知變通之道其可乎故包羲神農黃帝堯舜之王天下所以大過人者無它焉能通其變而已是以聖人以此洗心不敢自用其私智也易説是故夫象聖人有以見天下之賾而擬諸其形容象其物宜是故謂之象聖人有以見天下之動而觀其會通以行其典禮繫辭焉以斷其吉凶是故謂之爻極天下之賾者存乎卦鼓天下之動者存乎辭化而裁之存乎變推而行之存乎通神而明之存乎其人默而成之不言而信存乎德行明道先生曰易因爻象論變化因變化論神因神論人因人論德行大體通論易而終于默而成之不言而信存乎德行大全集拾遺佛有一箇覺之理可以敬以直內矣然無義以方外其直內者要之其本亦不是譬之贊易前後貫穿却説得是有此道理然須默而成之不言而信存乎德行處是所謂自得也吕與叔東見録伊川先生曰學者要得不錯須是學顔子學顔子便有凖的參也魯竟以魯得之默而成之不言而信存乎德行也子貢之智亞於顔子知至而未至之者也要語或問繫辭自天道言中庸自人事言似不同曰同繫辭雖從天地隂陽鬼神言之然卒曰默而成之不言而信存乎德行中庸亦曰鬼神之為德其盛矣乎視之而不見聽之而不聞體物而不可遺使天下之人齊明盛服以承祭祀洋洋乎如在其上如在其左右詩曰神之格思不可度思矧可射思夫微之顯誠之不可掩如此夫是豈不同劉絢所録橫渠先生曰化而裁之存乎變存四時之變則周嵗之化可裁存晝夜之變則百刻之化可裁推而行之存乎通推四時而行則能存周嵗之通推晝夜而行則能存百刻之通上天之載無聲臭可象惟儀刑文王當冥契天德而萬邦信悅故易曰神而明之存乎其人不知上天之載當存文王默而成之存乎德行學者常存德行則自然默成而信矣神而明之存乎其人道至有難明處而能明之此則在人也凡言神亦必待形而後著不得形神何以見神而明之存乎其人然則亦須待人而後能明乎神並易説天下之動神鼓之也辭不鼓舞則不足以盡神易謂不言而信存乎德行又以尚辭為聖人之道非知德達乎是哉並正蒙觀其會通以行其典禮此方是真義理也行其典禮而不逹會通則有非時中者矣今學者則須是執禮蓋禮亦自是會通制之者語録廣平遊氏曰非思非慮非視非聽了然遺照而獨存者神而明之之謂也神存而明之非有心之所能知也此道之所以明無處無服無從無道確乎其能事者默而成之之謂也性成而成之非有為之所能得也此道之所以行易説龜山楊氏曰子貢能言者也而天下之理有言之不能論者故子曰豫欲無言以發之易曰默而成之不言而信存乎德行記曰天道至教聖人至德其斯之謂乎語解白雲郭氏曰象爻卦辭易之書也化而裁之推而行之神而明之默而成之皆聖人用易也易之道知之則可用故直曰謂之變謂之通易之書擬議而後可用故言存乎變存乎通雖存乎此不思則不得耳觀夫子之辭自繫辭首章以及於此莫不以用易之道終之以是知易之為書用道之書也然易道廣大以言乎天地之間無不備故聖人修身齊家治國治天下皆可取而用之以成日新之德富有之業又何必焦心勞思任一己之獨智而後可以有為於天下乎夫是之謂洗心易説大易粹言卷六十八
