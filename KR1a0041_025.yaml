body:
  text: 大易粹言卷二十五宋方聞一編震下乾上明道先生曰無妄震下乾上聖人之動以天賢人之動以人若顔子之有不善豈如衆人哉惟只在於此間爾蓋猶有己焉至於無我則聖人也顔子切於聖人未達一息爾不遷怒不二過無伐善無施勞三月不違仁者此意也劉絢師訓伊川先生曰無妄序卦復則不妄矣故受之以無妄復者反於道也既復於道則合一無合字正理而無妄故復之後受之以無妄也為卦天上震下震動也動以天為無妄動以人欲則妄矣無妄之義大矣哉易傳兼山郭氏曰無妄即誠也在易曰無妄至孔子文言及中庸而後言誠又至孟子則曰性善皆一也然無妄有動象故又為誠之見於有為者如是則誠然後無妄矣以其本善故誠以其誠故無妄又為三者之序不誠則妄矣天人之分其間不能以寸伊川曰動以天則故無妄動以人欲則妄矣無妄圖無妄元亨利貞其匪正有眚不利有攸往伊川先生曰無妄者至誠也至誠者一無者字天之道也天之化育萬物生生不窮各正其性命乃無妄也人能合無妄之道則所謂與天地合其德也無妄有大亨之理君子行無妄之道則可以致大亨矣無妄天之道也卦言人由無妄之道也一無也字利貞法無妄之道利在貞正失貞正則妄也雖無邪心苟不合正理則妄也乃邪心也故有一作其匪正則為過眚既已無妄不宜有往往則妄也易傳橫渠先生曰無妄四德無妄而後具四德也其曰匪正有眚對無妄雷行天動也天動不妄故曰無妄天動不妄則物亦無妄易說白雲郭氏曰自太極函三論之則無有妄無妄之别自三才之别論之然後有妄無妄分焉天之於覆地之於載皆無妄也聖人所以成天地之能者亦無妄也無妄天道也盡天道故具元亨利貞也諸卦具四德者各見其義無妄則以天道得之也匪正則妄矣妄故招眚匪正而有眚非無妄之災也災眚之義其說不一以無妄觀之則自天至者為災由人自致者為眚無妄之動貴其止於天道不知所止而往是以窮人欲而滅天理也故不利有攸往易說彖曰無妄剛自外來而為主於內動而健剛中而應大亨以正天之命也其匪正有眚不利有攸往無妄之往何之矣天命不祐行矣哉伊川先生曰謂初九也坤初爻變而為震剛自外而來也震以初爻為主成卦由之故初為無妄之主動以天為無妄動而以天動為主也以剛變柔為以正去妄之象又剛正為主於內無妄之義也九居初正也下動而上健是其動剛健也剛健無妄之體也剛中而應五以剛居中正二復以中正相應是順理而不妄也故其道大亨通而貞正乃天之命也天命謂天道也所謂無妄也所謂無妄正而已小失於正則為有過乃妄也所謂匪正蓋由有往若無妄而不往何由有匪正乎無妄者理之正也更有往將何之矣乃入於妄也往則悖於天理天道所不祐可行乎哉並易傳橫渠先生曰天動不妄則物亦無妄乾道變化各正性命也易說兼山郭氏曰老子曰人法地地法天天法道道法自然故天無私覆地無私載日月無私照率歸之自然而已聖人之與天合德觀天之道執天之行不先時而起不後時而縮因循故常依于天理無思無為亦歸之自然而已此無妄之本也以其卦言之震剛自外來而為主於內以才言之動而健以其位言之二五得位剛中而應所以為元亨利正也乾者大也大亨以正其夭之命乎且天下雷行其動以時故自春分而出萬物從之而出秋分而入萬物從之而入莫之令而常自然豈物物而賦之此以亨正而出彼以亨正而受此以無妄而感彼以無妄而應故能自智自力自形自色者也故曰乾道變化各正性命於此可見矣其或感之有正有不正養之或得或失所以為夭為壽為災為眚是謂匪正有眚之理也然則匪正有眚又何之矣故知有妄之行天之所不祐也易說龜山楊氏曰震一索而得男剛自外來也震下而乾上動而健也動而健則動為主矣故曰剛自外來而為主於內也雷動而天行則其誠無息卦之所以為無妄也動而以人為則妄矣剛中而應謂二五也五以剛健中正而位乎上二以柔順中正而應於下上下相與以正故其大亨也以正而已大亨以正非人之私智所能為也循天理而已故曰天之命也詩曰維天之命於穆不已所謂命者亦誠而已矣大亨以正則亨以正為體匪正則有眚非順理也故天命不祐欲往安之乎故不利有攸往自無妄元亨利貞至此易說白雲郭氏曰剛自外來而為主於內論卦之所以成無妄者主於震也動而健者動以天不以人也剛中而應九五也大亨以正無妄之道也無妄之道天也非人也故言天之命與中庸言天命之謂性孟子言有命焉君子不謂性之義皆同然止於無妄而不往則天道常存不止於無妄而有攸往者是以人而滅天者也故彖之意以謂捨無妄而往者又何之焉一捨無妄而往則為匪正矣是以人滅天以僞喪誠乖於天道此天命所以不祐也天非有心於祐不祐之間蓋其道不與天合天何由而助之故孟子言盡心知性則知天存心養性所以事天蓋知天事天為天所祐皆必與天合德也曰動而健則動而與天合德矣不與天合德則與天非其類故非天之所助如是行而有往又何之乎蓋聖人欲人之著誠去僞而明其天也伊川曰動以天故無妄動以人欲則妄矣此之謂也輔嗣於此卦尤不曉聖人之㫖易說象曰天下雷行物與無妄先王以茂對時育萬物明道先生曰天下雷行物與無妄天下雷行付與無妄天性豈有妄耶聖人以茂對時育萬物各使得其性也無妄則一毫不可加安可往也往則妄矣無妄震下乾上動以天安有妄乎動以人則有妄矣劉絢師訓聖人之於天下事自不合與只順它天理茂對時育萬物而已無妄災也敢問其故曰妄則欺也得之必有禍斯有妄也順天而動有禍及者非禍也猶農之有田而不勤稼穡者荒也不亦禍乎農有勤於稼穡而復敗諸水旱其荒不亦災乎故象言先王以茂對時育萬物貴不妄也並語録伊川先生曰雷行於天下隂陽交和相薄而成聲於是驚蟄藏振萌芽發生一作育萬物其所賦與洪纎髙下各正其性命無有差妄一作忒物與無妄也先王觀天下雷行發生賦與之象而以茂對天時養育萬物使各得其宜如天與之無妄也茂盛也盛對之為言猶盛行永言之比對時謂順合天時天道生萬物各正其性命而不妄王者體天之道養育人民以至昆蟲草木使各得其宜乃對時育物之道也易傳天下雷行物與無妄先天後天皆合于天理者也人欲則僞矣鄒德久本無妄之謂誠不偏之謂中又曰誠然後敬未及誠時却須敬而後誠無妄之謂誠不欺其次矣語録盡己為忠盡物為信極言之則盡己者盡己之性也盡物者盡物之性也信者無僞而已於天性有所損益則為僞矣易無妄曰天下雷行物與無妄動以天理故也其大略如此更須研究之則自有得處時氏拾遺橫渠先生曰物因雷動不妄則物亦不妄故曰物與無妄育物不以時害莫甚焉易說龜山楊氏曰天下雷行天之所以鼓萬物也物斯應之故曰物與無妄先王所以對時育萬物亦因天而已矣所以無妄也易說兼山郭氏曰物之生也本乎一氣氣之運也本乎隂陽天地者氤氲以感之爾何與於人乎曰天非人不因人非天不成先王之仁得被萬物者在對時而已且日中星鳥以正仲春於是乎平秩東作宵中星虛以正仲秋於是乎平秩西成東作西成蒸民乃粒萬邦作乂先王之政也國君春田不圍澤大夫不掩羣士不取麛卵則仁及於禽獸草木黃落然後斧斤入山林則仁及於草木獺祭魚然後漁人入澤梁則仁及於魚鱉先王之仁有及於蒸民有及於禽獸有及於草木魚鱉故能如魚麗之盛多凡以對時育物而已詩云麀鹿濯濯白鳥翯翯王在靈沼於牣魚躍故古之興王莫不皆然亦曰則天之明因地之利率歸之無妄而已易說白雲郭氏曰天運乎上雷行於下無適而非天故為無妄然雷之收發有時疑其有妄也蓋收發非雷也天之所運是雷為無妄也物之生死又應乎雷以從天之所運則物亦無妄矣故曰天下雷行物與無妄茂對時育萬物者聖大以至誠任天道而贊天地之化育與天地參於無妄者也其茂對也育物也自然馴致之耳聖人初無容心焉易說初九無妄往吉象曰無妄之往得志也伊川先生曰九以剛陽為主於內無妄之象以剛實一無實字變柔而居內中誠不妄者也以無妄而往何所不吉卦辭言不利有攸往謂既無妄不可復有往也過則妄矣爻言往吉謂以無妄之道而行則吉也以無妄而往無不得其志也蓋誠之於物無不能動以之修身則身正以之治事則事得其理以之臨人則人感而化無所往而不得其志也並易傳橫渠先生曰易所謂得志者聖賢獲其願欲者也得臣無家堯之志也貞吉升階舜之志也易說龜山楊氏曰陽自外來而為主於內其動以天則無往而不得志矣故吉居無妄之時利在正而已往則則匪正故曰不利有攸往各有所當也易說白雲郭氏曰伊川先生曰卦辭言不利有攸往者謂既無妄則不可復往過則妄矣爻言往吉謂以無妄之道而行則吉也以是知伊川之得於無妄也深矣蓋卦之辭以天下之誠未有不以僞喪者故欲守正而不往顔子拳拳服膺弗失之義也爻之辭欲以無妄之道見於有行既盡己之性又盡人之性盡物之性如是而往其為得志大矣是以吉也言於初者初震也震之動以天故也卦爻之言相為終始與中庸天命之性率性之道修道之教及成已成物之義皆同易說六二不耕穫不菑畬則利有攸往象曰不耕穫未富也伊川先生曰凡理之所然者非妄也人所欲一作欲所為者乃妄也故以耕穫菑畬譬之六二居中得正又應五之中正居動體而柔順為動能順乎中正乃無妄者也故極言無妄之義耕農之始穫其成終也田一歲曰菑三歲曰畬不耕而穫不菑而畬謂不首造其事因其事理所當然也首造其事則是人心所作為乃妄也因事之當然則是順理應物非妄也穫與畬是也蓋耕則必有穫菑則必有一作為畬是事理之固然非心意之所造作也如是則為無妄不妄則所往利而無害也或曰聖人制作以利天下者皆造端也豈非妄乎曰聖人隨時制作合一作因乎風氣之宜未嘗先時而開之也若不待時則一聖人足以盡為矣豈待纍聖繼作也時乃事之端聖人隨時而為也未者非必之辭臨卦曰未順命是也不耕而穫不菑而畬因其事之當然既耕則必有穫既菑則必成畬非必以一無以字一無必字穫畬之富而為也其始耕菑乃設心在於求一無求字穫畬是以其富也心有欲而為者則妄也並易傳橫渠先生曰柔之為道不利逺者能逺利不為物首則可乘剛處實則凶易說廣平游氏曰無妄之六二不耕而穫不菑而畬以明君子之於物也應而不唱其於事也述而不作非樂通物也樂循理而已矣循理而已則有行有為皆天命也何妄之有焉雖然六二得位矣而非尊位故其勢不得以始事得中矣而非大中故其才不足以創物是故象以為未富若夫通其變使民不倦神而化之使民宜之應時而造以每成功其為無妄孰大於此易說龜山楊氏曰不耕而穫不菑而畬皆行其所無事也行其所無事則無妄矣若禹之行水是也雖排淮決泗濬川刋木無往不濟矣故利有攸往易說白雲郭氏曰無妄之卦不利有攸往而六二利有攸往何哉蓋盡天理而動則利有攸往與無妄往吉之義同其匪正則不利有攸往也且耕而穫菑而畬天之理也苟不耕可穫乎不菑可畬乎以是為思而後動則利有攸往矣未富者未能足乎已也誠欲不耕而穫不菑而畬是未能成已之事而遂欲及物非無妄之道也無妄與中庸同必先成已而後成物爻象之辭互為發明蓋非一意禮於坊記稱易曰不耕穫不菑畬凶其辭義皆異蓋果欲不耕而穫不菑而畬皆妄也故凶既云凶矣何利有攸往之有而象亦不當言未富也蓋不耕穫不菑畬之義自昔難通故當時傳授有如是之異者然爻辭言利有攸往必曰則利有攸往象不曰不富而曰未富觀此二者然後得聖人之㫖乃知不當有凶字也易說六三無妄之災或繫之牛行人之得邑人之災象曰行人得牛邑人災也伊川先生曰三以隂柔而不中正是為妄者也又志應於上欲也亦妄也在無妄之道為災害也人之妄動由有欲也妄動而得亦必有失雖使得其所利其動而妄失已大矣況復凶悔隨之乎知者見妄之得則知其失必與稱也故聖人因六三有妄之象而發明其理云無妄之災或擊之牛行人之得邑人之災言如三之為妄乃無妄之災害也設如有得其失隨至如或擊之牛或謂設或也或擊得牛行人得之以為有得邑人失牛乃是災也借使邑人擊得馬則行人失馬乃是災也言有得則有失不足以為得也行人邑人但言有得則有失非以為彼己也妄為之福災亦隨之妄得之得失亦稱之固不足以為得也人能知此則不為妄動矣行人得牛乃邑之災也有得則有失何足以為得乎並易傳橫渠先生曰妄災之大莫大於妄誅於人以隂居陽體躁而動遷怒肆暴災之甚者繫牛為說緣耕穫生詞易說龜山楊氏曰牛順物也耕穫所資以為用也六二以中順應乎上行人之象也而三據其前而不得進故曰或繫之牛順而見繫無妄之災也然五以中正在上而二以中正應之非三之所能間乃三自為災耳故曰行人之得邑人之災邑所居之邑三之謂也易說白雲郭氏曰關子明曰無妄而災者災也有妄而災則其所也非災之也運數適然非已妄致乃無妄之災自妄召災所宜也災亦不能妄近人也子明之言無妄之災最近之然曰運數適然又非也無妄無運且無數也輔嗣以六三行違謙順為無妄之災失之矣行既違則非無妄況六三有妄乎何則六三非中正之位居震動之極不知過於動而求止反欲應於上九妄行窮災之爻是亦妄行之人也匪正有眚之道也然亦有行之而無災者孔子所謂罔之生也幸而免者也爻辭因六三有眚之道而無眚因以明無妄無致災之道而有災也故於無妄之災之後以繫牛行人邑人重明之行人六三也妄行之人也邑人止其所者也止其所者知不利有攸往故也孟子所謂不失赤子之心者也六三知初之往吉二之利有攸往而以動為利不知初往之吉二往之利蓋有無妄之道存諸已而六三獨欲以妄得之是窮人欲而滅天理小人徼幸之道也雖得之君子不貴蓋其所得不過於物之利而已於道無有焉殆不若邑人寧災而其得多矣故有或繫之牛者為行人之得而邑人受其災夫行人得牛則所得者牛而所失者無妄是得於人而失於天也邑人之災則所受者災而所守者無妄則得失一於天矣中庸曰君子居易以俟命邑人也小人行險以徼幸行人也行人雖得牛驅而納諸罟擭陷阱之中矣可不慎哉六爻無邑人之象能與行人之道相反者皆邑人也故因行人而邑人可明焉然由其小者言之則得失一牛耳由其大者言之則堯湯水旱皆無妄之災也於道何損焉易說九四可貞無咎象曰可貞無咎固有之也伊川先生曰四剛陽而居乾體復無應與無妄者也剛而無私豈有妄乎可貞固守此自無咎也九居隂得為正一作貞乎曰以陽居乾體若復處剛則為一無為字過矣過則妄也居四無尚剛之志也可貞與利貞不同可貞謂其所處可貞固守之利貞謂利于貞也貞固守之則無咎也並易傳龜山楊氏曰九四以剛居隂能固有之也無應於上下無妄者也故可貞無咎易說白雲郭氏曰九四為乾體之下震動之象革矣動革則止止則能固守天道而不失是可固有無妄者也於道何咎之有孔子曰以約失之者鮮矣顔子拳拳服膺而弗失皆九四之謂也易說九五無妄之疾勿藥有喜象曰無妄之藥不可試也伊川先生曰九以中正當尊位下復以中正順應之可謂無妄之至者也其道無以加矣疾為之病者也以九五之無妄如其有疾勿以藥治則有喜也人之有疾則以藥石攻去其邪以飬其正若氣體平和本無疾病而攻治之則反害其正矣故勿藥則有喜也有喜謂疾自亡也無妄之所謂疾者謂若治之而不治率之而不從化之而不革以妄而為無妄之疾舜之有苗周公之管蔡孔子之叔孫武叔是也既己無妄而有疾之者則當自如無妄之疾不足患也若遂自攻治乃是渝其無妄而遷於妄也五既處無妄之極故惟戒在動動則妄矣人之有妄理必修改既無妄矣復藥以治之是反為妄也其可用乎故云不可試也試暫用也猶曰少嘗之也並易傳龜山楊氏曰五以剛健中正而履尊位二以中順應之無妄之至不可有加矣而下猶有弗率者蓋無妄之疾也以藥治之則反傷其平矣此無妄之藥所以不可試也舜之時苖民逆命所謂無妄之疾也禹之徂征用益贊之言而班師知藥之不可試也禹乃班師則順命之民必有被其毒者其可乎故舞干羽而有苖格勿藥之喜也然周公東征邦君越庶七御事罔不反曰艱大以為考翼不可征非一人而已而周公必征之何也蓋當是時外則淮夷叛內則群叔流言乃欲反鄙我周邦非無妄之時也與益贊之言異矣此周公所以必征也易說橫渠先生曰體健居尊得行其志故以無妄為疾無妄之疾疾無妄之謂也欲妄動而不敢妄是則以無妄為疾者也如孟子言有法家拂士是疾無妄者也以無妄為病而醫之則妄之意遂矣故曰勿藥有喜又曰不可試也言不可用藥治之並易說白雲郭氏曰易以乘剛為疾豫之六五是也乘剛之疾自取之也非無妄也九五以剛乘剛居中得正無自取之道故為無妄之疾也人之有疾也或以藥石攻去其邪而復其正或損益有餘不足以適其平然此治豫之貞疾則可治無妄之疾則不可蓋疾以無妄而攻我我以有妄治之則天理滅矣是所以勿藥有喜藥者有妄之物也而孔子又言不可試者蓋深絶之戒其必不可用有妄之藥也災與疾其理相類無妄雖有災而有有妄無災者幸也無妄雖勿藥而有有妄勿藥者亦幸也皆小人之道也凡足以害無妄者皆謂之疾易說上九無妄行有眚無攸利象曰無妄之行窮之災也伊川先生曰上九居卦之終無妄之極者也極而復行過於理也過於理則妄也一作矣故上九而行則有過眚而無所利矣無妄既極而復加進乃為妄矣是窮極而為災害也並易傳橫渠先生曰進而過中是無妄而行也易說龜山楊氏曰無妄之終居乾道上行之極不可往往斯過矣故戒之以行有眚無攸利易說白雲郭氏曰上九居卦之極而不知止於是猶欲行焉行則失無妄之道所謂無妄之往者也是為有眚之道也何利之有初之往吉未過也二之攸利得中也三之行人之得幸免也上九有眚窮行之災也窮之災自取也非無妄也易說大易粹言卷二十五
