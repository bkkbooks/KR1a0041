body:
  text: 大易粹言卷三十二宋方聞一編巽下震上伊川先生曰序卦夫婦之道不可以不久也故受之以恆恆久也咸夫婦之道夫婦一有之道字終身不一有可字變者也故咸之後受之以恆也咸少男在少女之下以男下女是男女交感之義恆長男在長女之上男尊女卑夫婦居室之常道也論交感之情則少為深切論尊卑之敘則長當謹正故兊艮為咸而震巽為恆也男在女上男動于外女順于內人理之常故為恆也又剛上柔下雷風相與巽而動剛柔相應皆恆之義也易傳咸恆體用也體用無先後劉詢師訓恆亨無咎利貞利有攸往伊川先生曰恆者常久也恆之道可以亨通恆而能亨乃無咎也恆而不可以亨非可常之道也為有咎矣如君子之常於善可常之道也小人常於惡失可常之道也恆所以能亨由貞正也故云利貞夫所謂恆謂可常久之道非守一隅而不知變也故利於有往唯其有往故能恆也一定則不能恆矣又恆久之道何往不利易傳白雲郭氏曰咸恆二卦六爻剛柔皆應而名義不同者咸以男下女交感之義也恆男上女下夫夫婦婦之常道也交感時焉而已故曰取女吉夫夫婦婦可久之道也故曰恆久也其道可久斯無不通無不通則無過舉內利以固外利以行此其所以為常也王輔嗣曰恆而亨以濟三事也後之諸儒竟分三事其説不一然恆之卦辭止有二義輔嗣誤以為三以彖觀之恆亨無咎利貞一也久於其道之謂也利有攸往一也終則有始之義也久於其道天地同也終則有始日月四時同也是孔子以為二義也易説彖曰恆久也剛上而柔下雷風相與巽而動剛柔皆應恆恆亨無咎利貞久於其道也天地之道恆久而不已也利有攸往終則有始也日月得天而能久照四時變化而能久成聖人久於其道而天下化成觀其所恆而天地萬物之情可見矣伊川先生曰恆者常久之義也剛上而柔下雷風相與巽而動剛柔皆應卦才有此四者成恆之義也剛上而柔下謂乾之初上居於四坤之四下居於初剛爻上而柔爻下也二爻易處則成震巽震上巽下亦剛上而柔下也剛處上而柔居下乃恆道也雷風相與雷震則風發二者相須交助其勢故云相與乃其常也巽而動下巽順上震動為以巽而動天地造化恆久不已者順動而已巽而動常久之道也動而不順豈能常也剛柔皆應一有常字一卦剛柔之爻皆相應剛柔相應理之常也此四者恆之道也卦所以為恆也恆之道可致亨而無過咎但所恆宜得其正失正則非可常之道也故曰久於其道其道可常之正道也不恆其德與恆於不正皆不能亨而有咎也天地之所以不已蓋有恆久之道人能恆於可常之道則合天地之理也天下一作地之理未有不動而能恆者也動則終而復始所以恆而不窮凡天地所生之物雖山嶽之堅厚未有能不變者也故恆非一定之謂也一定則不能恆矣唯隨時變易乃恆道也故云利有攸往明理之如是懼人之泥於常也日月得天以下此極言常理日月隂陽之精一有二字氣耳唯其順天之道往來盈縮故能久照而不已得天順天理也四時隂陽之氣耳往來變化生成萬物亦以得天故恆久不已聖人以恆久之道行之有常而天下化之以成美俗也觀其所恆謂觀日月之久照四時之久成聖人之道所以能常久之理觀此則天地萬物之情理可見矣天地常久之道天下常久之理非知道者孰能識之並易傳橫渠先生曰觀書當不以文害辭如云義者出於思慮忖度易言天地之大義則天地固無思慮天地之情天地之心皆放此易説日月得天得自然之理也非蒼蒼之形也正蒙龜山楊氏曰男下女婚姻之始也男上而女下居室之常分也盡其常分而後有可久之道焉卦之所以為恆也中庸曰至誠無息不息則久故惟天下之至誠為能久恆久也夫婦之不可以不久也又曰維天之命於穆不已蓋曰天之所以為天也於乎不顯文王之德之純蓋曰文王之所以為文也純亦不已天之為天文之為文皆原於不已故曰天地之道恆久而不已也日月得天得其所以為天故代明不息而能久照四時變化終則有始故能久成聖人久於其道而天下化成如文王所以為文是也天人之道一於誠而已矣自恆亨至此易説天地之道恆久而不已者也惟不已故能久聖人久於其道亦為不已也故能天下化成中庸解有恆心然後可與為善苟無恆心放僻邪侈無不為己故善人不可得而見思見有恆者易曰恆久也以亡為有終亦必亡而已矣何可久也虛也約也亦然故曰難乎有恆矣語解兼山郭氏曰剛上而柔下剛柔之常也雷風相與二氣之常也剛柔皆應交感之常也恆亨無咎利貞可久之常也天地之道恆久而不已蓋言天之髙明地之博厚悠也久也故能常也日月得天故能生明四時變化故能成歲聖人久於其道故為忠為文相救而成道也故曰中者天下之大本和者天下之達道如是也然作易者專取配於夫婦何也言君子之道造端乎夫婦及其至也察乎天地者此也彼一以動一以靜或作之或止之謂曰我能常何足以語此易説白雲郭氏曰恆自泰來故伊川以乾之初上居於四坤之四下居於初二爻剛上柔下成為震巽蓋非謂震為剛而巽為柔也若以上下二卦為剛柔則易之柔上剛下剛上柔下之卦多矣不當獨於咸恆言之也是故剛上柔下言初四二爻成震巽之始也雷風相與言震巽可久之象也巽而動言震巽可久之才也剛柔皆應言六爻可久之道也有是四者是之謂恆恆亨無咎利貞此久於其道之所致也雖天地之大不能外此故必恆久不已然後為天地利有攸往者恆道無終窮無終窮則往無不利猶日月久照四時久成皆終則有始之道聖人之道天地恆久不已之道也其所以化成天下亦如日月四時是已使有終無始則日月亦不能久照變化亦不能久成聖人亦不能化成天下矣故彖言所以為恆者四剛上而柔下雷風相與巽而動剛柔皆應是也又言恆之所以為道者二久於其道也終則有始也久於其道雖天地亦如之終則有始雖日月四時亦如之此所以見天地萬物之情矣咸恆六爻之才皆不疑二卦之義非大故孔子於彖皆以天地萬物之情終之使後世學者不以小道觀之也易説象曰雷風恆君子以立不易方伊川先生曰君子觀雷風相與成恆之象以常久其德自立於大中常久之道不變易其方所也易傳龜山楊氏曰立不易方乃能常也易説兼山郭氏曰雷以動之風以散之此可以為常矣然君子何取於立不易方蓋君子敬以直內義以方外仁或有蔽焉義則無也故能窮則變變則通通則久始可以為常矣易説白雲郭氏曰方猶道也君子所立不可易易則不可常矣是以顔子拳拳服膺而弗失之也易説初六浚恆貞凶無攸利象曰浚恆之凶始求深也伊川先生曰初居下而四為正應柔暗之人能守常而不能度勢四震體而陽性以剛居髙志上而不下又為二三所隔應初之志異乎常矣而初乃求望之深是知常而不知變也浚深之也浚恆謂求恆之深也守常而不度勢求望於上之深堅固守此凶之道也泥常如此無所往而利矣世之責望故素而至悔咎一作吝者皆浚恆者也志既上求之深是不能常安其處者也柔微而不常安其處亦致凶之道凡卦之初終淺與深微與盛之地也在下而求深亦不知時矣居恆之始而求望於上之深是知常而不知一無知字度勢之甚也所以凶隂暗不得恆之冝也並易傳橫渠先生曰柔巽在下以應於上持用為常求之過深也故人道之交貴乎中禮且久漸而成也持一作特易説龜山楊氏曰昏義曰敬慎重正而後親之禮之大體而所以成男女之别立夫婦之義也初與四為正應而居一卦之初未及欽慎重正而遽親之是始求深也故曰浚恆貞凶浚者治而深之也雖貞亦凶矣夫何利之有詩曰未見君子憂心忡忡亦既見止亦既覯止我心則降則其始求可知矣易説以匹夫一日而見天子天子問焉盡所懷而陳之則事必有窒礙者不盡則為不忠如何曰事亦須量深淺子夏曰信而後諫未信則以為謗己也易之恆曰浚恆凶此恆之初也故當以漸而不可以浚浚則凶矣假如問人臣之忠邪其親信者誰歟遽為之辨别是非則有失身之悔君子於此但不可以忠為邪以邪為忠語言之間故不無委曲也語録兼山郭氏曰初六自上下下故曰浚恆恆非可以浚求也易説白雲郭氏曰進道有漸而後可久在恆之初浚而深求非其道也孔子曰欲速則不達孟子曰其進鋭者其退速是豈可久之道乎以是為貞則凶矣不達退速之道何所利哉易説九二悔亡象曰九二悔亡能久中也伊川先生曰在恆之義居得其正則常道也九陽爻居隂位非常理也處非其常本當有悔而九二以中德而應於五五復居中以中而應中其處與動皆得中也是能恆久於中也能恆久一無久字於中則不失正矣中重於正中則正矣正不必中也九二以剛中之德而應於中德之勝也足以亡其悔矣人能識重輕之勢則可以言易矣所以得悔亡者由其能恆久於中也人能常久於中豈止亡其悔德之善也並易傳橫渠先生曰以陽係隂用以為常不能無悔以其久中故免易説龜山楊氏曰處非其位宜有悔也然在下卦之中以陽居之能久其中也故悔亡易説兼山郭氏曰九二不當位悔也久中則可以亡也顔氏之子得一善則拳拳服膺而弗失夫何悔之有易説白雲郭氏曰可久之道無它焉中而已矣過猶不及皆非可久也故中庸曰中者天下之大本也九二位雖失正非無悔之象能久於中則其悔亡矣九二無它辭特曰悔亡蓋見止於守常無它事也易説九三不恆其德或承之羞貞吝象曰不恆其德無所容也伊川先生曰三陽爻居陽位處得其位是其常處也乃志從於上六不唯隂陽相應風復從雷於恆處而不處不恆之人也其德不常則羞辱或承之矣或承之謂有時而至也貞吝固守不常以為常豈不可羞吝乎人既無常何所當處之地既不能常處非其據豈能恆哉是不恆之人無所容處其身也並易傳橫渠先生曰進則犯上退則乘剛故動則招悔取辱唯常守一德庶幾取容故曰不恆其德則無所容也一有雖然貞吝德則可常也易説龜山楊氏曰九三處雷風相與之際雷動之風散之宜不能安其處也故曰不恆其德或承之羞或者疑之也蓋陽得位疑若能常者故稱或焉或者不必之辭也易説人無常心無不為己巫醫慎疾者所賴尤不可為也易曰不恆其德或承之羞夫君子之於易也居則觀其象而玩其辭動則觀其變而玩其占苟玩其占則不恆其德知其或承之羞必矣其為不恆也蓋亦不占而已矣語解兼山郭氏曰九三剛已過中而巽為不果進退無常不恆其德者也詩云豈弟君子民之父母不恆其德何所取容邪易説白雲郭氏曰人之於德也過中則不恆不恆則日入於小人之域是以為機變之巧無所用耻焉雖或承之羞亦忍而固守方自以為得計而不知耻是可鄙也孔子曰人而無恆不可以作巫醫蓋言不能容身於巫醫之賤況事君治民之職乎故曰無所容也伊川曰或承謂有時而至也易説九四田無禽象曰久非其位安得禽也伊川先生曰以陽居隂處非其位處非其所雖常何益人之所為得其道則久而成功不得其道則雖久何益故以田為喻言九之居四雖使恆久如田獵而無禽獸之獲謂徒用力而無功也處非其位雖久何所得乎以田為喻故云安得禽也並易傳橫渠先生曰田以時至則禽或可得處恆非位則功無以致故君子降志辱身不可常也易説兼山郭氏曰九四以不正之剛居不中之地其才其時不可以成功者也雖曰恆之時亦久非其位者也易説白雲郭氏曰居可久之地故能成可久之功居非其位而望其功是以沒世窮年而終不可得也其九四田無禽之謂歟初六以柔求深自用之過者也九四剛而不中居非其位不能自用以有獲者也皆非恆道語之聖人久於其道則失之逺矣易説六五恆其德貞婦人吉夫子凶象曰婦人貞吉從一而終也夫子制義從婦凶也伊川先生曰五應於二以隂柔而應陽剛居中而所應又中隂柔之正也故恆久則其德為貞也夫以順從為恆者婦人之道在婦人則為貞故吉若丈夫而以順從於人為恆則失其剛陽之正乃凶也五君位而不以君道言者如六五之義在丈夫猶凶況一作豈人君之道乎在它卦六居君位而應剛未為失也在恆故不可耳君道豈可以柔順為恆也如五之從二在婦人則為正而吉婦人以從為正以順為德當終守於從一夫子則以義制者也從婦人之道則為凶也並易傳龜山楊氏曰五以隂柔居中下應九二之剛而不失正故常其德貞然以隂柔居中下應九二以順為正也以順為正婦道也故婦人吉夫子從婦則失制義之道故凶易説兼山郭氏曰六五柔而在中位有餘而才不足稱也能常其德婦人則吉夫子則凶也何哉婦人從一而終可也夫子制義從婦之義可乎君子立不易方常而有變之義者也是以伯夷聖之清孟子謂之隘宋伯姬守禮而不去孔子取其恭於此可見也六五有震兊二體故有婦人夫子之義易説白雲郭氏曰先人曰柔而在中位有餘而才不足稱也能恆其德婦人則吉夫子則凶何也婦人從一而終可也夫子制義從婦之義可乎是以伯夷聖之清孟子謂之隘宋伯姬守禮而不去孔子取其恭於此可見也易説上六振恆凶象曰振恆在上大無功也伊川先生曰六居恆之極在震之終恆極則不常震終則動極以隂居上非其安處又隂柔不能堅固其守皆不常之義也故為振恆以振為恆也振者動之速也如振衣如振書抖擻運動之意在上而其動無節以此為恆其凶冝矣君上之道必有恆德乃能有功若躁動不常豈能有所成乎居上而不恆其凶甚矣象又言其不能有所成立故曰大無功也並易傳橫渠先生曰卦例於上爻多處之以貴而無位髙而無民至恆又不可以此處但見其不常在一故大無功也易道灼然義理分明自存乎卦惟要人玩之乃得易説龜山楊氏曰震之極也六以隂柔居動之極非安於常者也雖動而不息無功矣故振恆凶振者動之亟也易説兼山郭氏曰上六居震之極以動為常窮而不知變者也庸無失乎易説白雲郭氏曰先人曰居震之極以動為常窮而不知變者也是以言其得失則凶語其道則終無功矣易説大易粹言卷三十二
