body:
  text: 大易粹言卷五十七宋方聞一編巽下巽上伊川先生曰巽序卦旅而無所容故受之以巽巽者入也羇旅親寡非巽順何所取容苟能巽順雖旅困之中何往而不能入巽所以次旅也為卦一隂在二陽之下巽順於陽所以為巽也易傳巽小亨利有攸往利見大人伊川先生曰卦之才可以小亨利有攸往利見大人也巽與兊皆剛中正巽説一作兊義亦相類而兊則亨巽乃小亨者兊陽之為也巽隂之為也兊柔在外用柔也巽柔在內性柔也巽之亨所以小也易傳白雲郭氏曰伊川曰巽與兊皆剛中正巽兊義亦相類而兊則亨巽乃小亨者兊陽之為也巽隂之為也兊柔在外用柔也巽柔在內性柔也巽之亨所以小也雍曰巽入也故能亨然柔弱自居其小宜矣能入故利有攸往居柔小亨故利見大人聖人懼小其志而欲養其大體也是亦沈潛剛克之意與易説彖曰重巽以申命剛巽乎中正而志行柔皆順乎剛是以小亨利有攸往利見大人伊川先生曰重巽者上下皆巽也上順道以出命下奉命而順從上下皆順重巽之象也又重為重復之義君子體重巽之義以申復其命令申重復也丁寧之謂也剛巽乎中正以卦才言也陽剛居巽而得中正巽順於中正之道也陽性上其志在以中正之道上行也又上下之柔皆巽順於剛其才如是雖內柔可以小亨也巽順之道無往不能入故利有攸往巽順雖善道必知所從能巽順於陽剛中正之大人則為利故利見大人也如五二之陽剛中正大人也巽順不於大人未必不為過也並易傳白雲郭氏曰上下皆巽是為重巽上以巽入而化下下以巽順而從上是以命行無違也剛巽乎中正而志行者上以巽而化下是剛以巽而無太過也柔皆順乎剛者不以巽順而從上是柔以巽而無不及也上下之巽如此故亨而利也易説象曰隨風巽君子以申命行事伊川先生曰兩風相重一作從隨風也隨相繼之義君子觀重巽相繼以順之象而以申命令行政事隨與重上下皆順也上順下而出之下順上而從之上下皆順重巽之義也命令政事順理則合民心而民順從矣易傳白雲郭氏曰君子之德風也有風之德而下無不從然後具重巽之義故象言隨風巽則知重巽隨風之義皆繫乎上下而言也君子有是德下民如是而從其於申命行事也何有易於巽主教命猶詩之言風也故觀則省方觀民設教姤則施命語四方蠱則振民育德皆主巽而言也由是觀之則巽之命可順之命也命或不可順而欲以剛強知亦難矣哉易説初六進退利武人之貞象曰進退志疑也利武人之貞志治也伊川先生曰六以隂柔居卑巽而不中處最下而承剛過於卑巽者也隂柔之人卑巽太過則志意恐畏而不安或進或退不知所從其所利在武人之貞若能用武人剛貞之志則為宜也勉為剛貞則無過卑恐畏之失矣進退不知所安者其志疑懼也利用武人之剛貞以立其志則其志治也治謂修立也並易傳橫渠先生曰體柔居下在巽之始謙抑過中故施於武人之貞則適得其宜進退者柔不自決之象也易説白雲郭氏曰卦以居柔而不能大六二又以柔而不能決是以有進退之象武人三軍之勇者不膚撓不目逃其志決於進者也初六疑於申命行事之際則敗其志矣宜以武人之貞自治其志可也治已以武人之貞斯無進退之疑矣孔子語冉求以聞斯行諸是也然道雖不一於進而此利在行事是亦行權之義易説九二巽在牀下用史巫紛若吉無咎象曰紛若之吉得中也伊川先生曰二居巽時以陽處隂而在下過於巽者也牀人之所安巽在牀下是過於巽過所安矣人之過於卑巽非恐怯即諂説皆非正也二實剛中雖巽體而居柔為過於巽非有邪心也恭巽之過雖非正禮可以逺恥辱絶怨咎亦吉道也史巫者通誠意於神明者也紛若多也苟至誠安於謙巽能使通其誠意者多則吉而無咎謂其誠足以動人也人不察其誠意則以過巽為諂矣二以居柔在下為過巽之象而能使通其誠意者正多紛然由得中也陽居中為中實之象中既誠實則一無則字人自當信之以誠意則非諂畏也所以吉而無咎並易傳橫渠先生曰以陽居隂其志下比無應於上故曰巽在牀下然不失中道下為之用故史巫紛若樂為之使吉而無咎非如上九喪其資斧史巫諭虛華過實者言不失中道則樂盡其誠者衆矣易説白雲郭氏曰二有剛中之德巽無不行矣而猶過於恭巽有牀下不安之象者此其所以謂之巽也是道也雖神明可交而受福况人乎然過於巽在聖人之道疑若有咎矣而當巽之時九二以剛德能行巽之道是其所以無咎也故象言紛若之吉得中也然惟九二剛中故有巽在牀下之美不然殆且過矣易説九三頻巽吝象曰頻巽之吝志窮也伊川先生曰三以陽處剛不得其中又在下體之上以剛亢之質而居巽順之時非能巽者勉而為之故屢失也居巽之時處下而上臨之以巽又四以柔巽相親所乘者剛而上復有重剛雖欲不巽得乎故頻失而頻巽是可吝也三之才質本非能巽而上臨之以巽承重剛而履剛勢不得行其志故頻失而頻巽是其志困窮可吝之甚也並易傳橫渠先生曰三處陽剛失巽之道乘剛而動頻吝所宜志在比物故吝如復之六三志窮也白雲郭氏曰過於剛而不中是以或巽或失所謂既不能令又不受命者也非吝而何其志終不能以有行是以窮也六四悔亡田獲三品象曰田獲三品有功也伊川先生曰隂柔無援而承乘皆剛宜有悔也而四以隂居隂得巽之正在上體之下居上而能下也居上之下巽於上也以巽臨下巽於下也善處如此故得悔亡所以得悔亡以如田之獲三品也田獲三品及於上下也田獵之獲分三品一為乾豆一供賓客與充庖一頒徒御四能巽於上下之陽如田之獲三品謂遍及上下也四之地本有悔以處之至善故悔一無悔字亡而復有功天下之事苟善處則悔或可以成功也巽於上下如田之獲三品而遍及上下成巽之功也並易傳橫渠先生曰柔順之德以隂居位雖或乘剛悔終可亡近比於五不為諂妄而又二三并為所獲不私其纍而樂為己用田獲之類也使三陽見獲四之功也易説白雲郭氏曰六四近君志決於進無初六之疑既無羣疑則悔亡矣是以有田獲三品之功也六四至柔不當有田獲之功而此以順乎剛故得之由是觀之則剛以巽而無太過柔以巽而無不及則巽之道豈柔弱畏懦之義哉是其可與有行也易説九五貞吉悔亡無不利無初有終先庚三日後庚三日吉象曰九五之吉位正中也明道先生曰先甲三日以窮其所以然而處其事後甲三日以究其將然而為之防甲者事之始也庚者有所革也自甲至於戊已春夏生物之氣已備庚者秋冬成物之氣也故有所革别一般氣劉絢師訓伊川先生曰五居尊位為巽之主命令之所出也處得中正盡巽之善然巽者柔順之道所利在貞非五之不足在巽當戒也既貞則吉而悔亡無所不利貞正中也處巽出令皆以正中為吉柔巽而不貞則有悔安能無所不利也命令之出有所變更也無初始未善也有終更之始善也若已善則何用命也何用更也先庚三日後庚三日吉出命更改一作故之道當如是也甲者事之端也庚者變更之始也十干戊已為中過中則變故謂之庚事之改更當原始要終如先甲後甲之義如是則吉也解在蠱卦九五之吉以處正中也得正中之道則吉而其悔亡也正中謂不過無不及一作無過不及正得其中也處柔巽與出命令唯得中為善失中則悔也並易傳橫渠先生曰解見蠱卦志不以正則將有悔先庚三日讓始也後庚三日存終也雖體陽居尊無應於下故不可為事之唱乃吉不著於繇辭者巽非憂患之時故也易説白雲郭氏曰剛以巽而後貞吉柔以巽而後有功貞吉則無太過有功則無不及是以四五皆得巽道而悔亡也九五居尊中正為巽之主固守是道吉無不利猶曰無初有終者巽之為象以柔而用剛也唯以柔故有初六進退之疑唯用剛故有九五正中之德是為無初有終也先庚三日後庚三日吉者九五人君之位也出命人君之所先也慎乃出令君人之道也故必先後三日而申命之夫上有巽入之道下有巽順之義風行草偃莫易於斯時猶且先後三日而申命之者慎之至也慎之至者令出唯行弗唯反故也命令之出有必可行之善而無不可行復反之失是以吉也上曰貞吉九五之吉也下曰吉蓋命令以是為吉也庚即令也先庚謂未出令之前己申命後庚謂出令之後三日而後行事也伊川曰申者事之始也庚者變更之始也易説上九巽在牀下喪其資斧貞凶象曰巽在牀下上窮也喪其資斧正乎凶也伊川先生曰牀人所安也在牀下過所安之義也九居巽之極過於巽者也一尤者字資所有也斧以斷也陽剛本有斷以過巽而失其剛斷失其所有喪資斧也居上而過巽至於自失在正道為凶也巽在牀下過於巽也處卦之上巽至於窮極也居上而過極於巽至於自失得為正乎乃凶道也巽本善行故疑之曰得為正乎復斷之曰乃凶也並易傳橫渠先生曰柔巽過極難為之下物不為用故曰喪其資斧凶資斧尚喪餘用殫矣易説白雲郭氏曰九二有為之臣也以巽用剛者也上九巽之極者也巽極不知變而欲同九二之道則其過也甚矣過則失故喪其資斧貞凶也巽之道剛柔用之皆獲其利今喪其所資之利能無凶乎故巽在牀下無用於上窮之時喪其資斧殊乖悔亡之利彼以悔亡而吉則此以喪失正乎凶矣觀此則知謂之資斧者其行權之義乎是不可失者也易説大易粹言卷五十七
