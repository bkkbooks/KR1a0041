body:
  text: 大易粹言卷十二宋方聞一編坤下乾上伊川先生曰否序卦泰者通也物不可以終通故受之以否夫物理往來通泰之極則必否否所以次泰也為卦天上地下天地相交隂陽和暢則為泰天處上地處下是天地隔絶不相交通所以為否也易説兼山郭氏曰大道之行也天下為公故君子得以為君子小人不肯為小人君子則事道詘身而行道者有之矣小人則事事至於詘道而信身亦敢為也況乎天地不交否非惟敢詘道而信身又將惡直醜正協比讒言以陷人者多矣詩云為鬼為蜮則不可得有靦面目視人罔極是也故孔子稱商有三仁焉微子去之箕子為之奴比干諫而死然有貴戚之卿異姓之卿方其自靖人自獻于先王固有不可去之者而儉德辟難發於早辨與踈且逺者言也孟子曰我無官守我無言責也則吾進退豈不綽綽然有餘裕哉故醴酒不設楚穆生去之曰國人將鉗我於都市何必見否之已然而後避之不亦晚乎易説否之匪人不利君子貞大往小來伊川先生曰天地交而萬物生於中然後三才備人為最靈故為萬物之首凡生天地之中者皆人道也天地不交則不生萬物是無人道故曰匪人謂非人道也消長闔闢相因而不息泰極則復否終則傾無常而不變之理人道豈能無也既否則泰矣夫上下交通剛柔和會君子之道也否則反是故不利君子貞君子正道否塞不行也大往小來陽往而隂來也小人道君子道消之象故為否也並易傳彖曰否之匪人不利君子貞大往小來則是天地不交而萬物不通也上下不交而天下無邦也內隂而外陽內柔而外剛內小人而外君子小人道長君子道消也伊川先生曰夫天地之氣不交則萬物無生成之理上下之義不交則天下無邦國之道建邦國所以為治也上施政以治民民戴君而從命上下相交所以治安也今上下不交是天下無邦國之道也隂柔在內陽剛在外君子往居於外小人來處於內小人道長君子道消之時也易傳嘉仲問否之匪人曰泰之時天地交泰而萬物生凡生於天地之間者皆人道也至否之時天地不交萬物之不生無人道矣故曰否之匪人唐棣所編橫渠先生曰蓋言上下不交便天下無邦有邦而與無邦同以不成國體也在天下它國皆無道只一邦治亦不可言天下無道須是都不治然後是天下無道也於否之時則天下無邦也古之人一邦不治别之一邦直至天下皆無邦可之則止有隱耳無道而隱則惟是有朋友之樂而已子欲居九夷未敢必天下之無邦或夷狄有道於今海上之國儘有仁厚之治者易説廣平遊氏曰比之匪人言所比非其人也否之匪人言致否之因也君臣上下在朝者非其人則將引天下之叨懫姦回萃於朝此所以致否也羣小在上而衆邪逞故不利君子貞當是時非有大人之德則處否而未必亨非有大人之才一有則字不足以休否伊尹五就桀而當時羣小不能害焉非體道忘我孰足以與此以顔子之賢遊於人間世仲尼猶以心齋告之則為君子類者處否之時正當全身遠害而已有國家一無家字之道君臣而已傳曰不有君子其能國乎蓋惟君子在朝然後君臣各得其道上下合志而天下之情通此國之所以立也如君不君臣不臣則天下無邦矣猶之父不父子不子則無家矣無邦者其道亡也並易説龜山楊氏曰文明以健中正而應君子貞也唯君子為能通天下之志方上下不交之時而君子之貞足以通天下之志豈小人之利乎易説兼山郭氏曰天不人不因人不天不成古語曰天人合發萬變定機乃知天人之道率與時會故曰否之匪人也堯之命舜曰天之厯數在爾躬舜亦以命禹二者天之革命也天地革而四時成湯武革命順乎天而應乎人亦天之革命也然則一則為揖遜一則為干戈是之謂天人之合也故否之匪人舉其大者言之耳是以天地不交在時則否塞而成冬在道不通而成否生生之道絶凡泰之所冝舉與此相反矣易之辭舉天地為萬物言也舉上下為人道言也至於天下無邦人道絶矣易説白雲郭氏曰否閉也塞也天地閉塞而不通人道何從而立乎故否之時非人道也人道配天地而言聖人之道是也聖人之道絶故曰否是知城復于隍亦有未絶者存為否之始而未否也不利君子貞者非不利於固守已道蓋不利於固祿位也故象言不可榮以祿而初六言君子貞吉亨也大往小來皆反泰之道也天下所以為邦者以有君臣父子人倫之道上下不交則人倫之道絶謂之無邦可也此之謂匪人矣匪人猶曰無道也易説象曰天地不交否君子以儉德辟難不可榮以祿伊川先生曰天地不相交通故為否否塞之時君子道消當觀否塞之象而以儉損之德避免禍難不可榮居祿位也否者小人得志之時君子居顯榮之地禍患必及其身故冝晦處窮約也易傳龜山楊氏曰方小人不利居子貞之時惟約已自晦乃可以辟難也易説當儉德辟難之時而榮以祿非枉道從之其可得乎是足恥也語解兼山郭氏曰象禮曰歲凶年穀不登君膳不祭肺馬不食穀馳道不除祭事不縣大夫不食粱士飲酒不樂其殺禮也如此況儉德辟難之時乎孔子曰邦有道貧且賤焉恥也邦無道冨且貴焉恥也況否之時榮以祿乎易説白雲郭氏曰先人曰大道之行也天下為公故君子得以為君子小人不肯為小人君子則事道屈身而行道者有之小人事事屈道而信身無不為也況否之時小人非惟屈道信身又將惡直醜正協比讒言以害君子者多矣詩云為鬼為蜮則不可得有靦靣目視人罔極是也孔子稱商有三仁焉微子去之箕子為之奴比干諫而死方其自靖人自獻于先王固有不可去之者而儉德辟難發於早辨與踈且逺者言也孟子曰我無官守我無言責也則吾進退豈不綽綽然有餘裕哉故醴酒不設穆生去之曰國人將鉗我於都市何必見否之已然而後避之不亦晚乎雍曰禮言歲凶年穀不登君膳不祭肺馬不食穀馳道不除祭事不縣凶年尚殺禮如此況否之時乎此君子所以儉德辟難不可榮以祿也以無難言之邦無道穀為恥況有難之時乎故直曰不可也太公伯夷之避紂是也夫君子小人之際患亦多乎君子雖未嘗有意於害小人而小人嘗忍於害君子何哉蓋方泰之時君子彚進以小人亂邦必不容於其間不過逺而勿用也小人得志則以君子為害己者必欲窮其陷害務快私忿誅絶之而後已為之君子者可不避哉漢之黨錮雖有以致之在正人未為無罪然小人忍於誅戮一至是耶易説初六拔茅茹以其彚貞吉亨象曰拔茅貞吉志在君也伊川先生曰泰與否皆取茅為象者以羣陽羣隂同在下有牽連之象也泰之時則以同征為吉否之時則以同貞為亨始以內小人外君子為否之義復以初六否而在下為君子之道易隨時取義變動無常否之時在下者君子也否之三隂上皆有應在否隔之時隔絶不相通故無應義初六能與其類貞固其節則處否之吉而其道之亨也當否而能進者小人也君子則伸道免禍而已君子進退未嘗不與其類同也爻以六自守於下明君子處下一作否之道象復推明以盡君子之心君子固守其節以處下者非樂於不進獨善也以其道方否不可進故安之耳心固未嘗不在天下也其志常在得君而進以康濟天下故曰志在君也並易傳橫渠先生曰柔順處下居否以靜者也能以類正吉而必亨不事苟合志在得主者歟易説龜山楊氏曰泰之三陽否之三隂皆有應於上故皆有拔茅連茹之象居否之初雖上下不交而否猶未極也世雖否矣君子蓋未嘗一日忘天下而志不在君也上有悔禍願治之誠心則亦如拔茅連茹而出矣孔子當衰周之際佛肸以中牟叛召之猶欲往焉夫豈為利哉志在君故也然而卒不往者要之不失正而已孟子千里而見王是其欲也不遇故去豈其所欲哉然猶三宿而後出晝又曰豫豈舍王哉則其志可知矣此聖賢所以處否之道而吉亨易説兼山郭氏曰初六先大夫有言居廟堂則憂其民處江湖則憂其君蓋泰言志在外否言志在君之意也或引考槃之詩誤矣易説白雲郭氏曰先人曰先大夫有言曰居廟堂之髙則憂其民處江湖之遠則憂其君蓋泰言志在外否言志在君之意也雍曰君子當否之時有止無進固守且吉而道不廢於自亨也亨如顔氏之樂是也卦象以內為小人而爻以初為君子伊川所謂隨時取義變動無常也志在君者君子儉德辟難豈忘君者哉如伊尹樂堯舜之道其愛君至矣君臣之義如之何其廢之故荷蓧之徒聖人無取焉易説六二包承小人吉大人否亨象曰大人否亨不亂羣也伊川先生曰六二其質則隂柔其居則中正以隂柔小人而言則方否於下志所包畜者在承順乎上以求濟其否為身之利小人之吉也大人當否則以道自處豈肯枉已屈道承順於上唯自守其否而已身之否乃其道之亨也或曰上下不交何所承乎曰正則否矣小人順上之心未嘗無也大人於否之時守其正節不雜亂於小人之羣類身雖否而道之亨也故曰否亨不以道而身亨乃道否也不云君子而云大人能如是則一無則字其道大也並易傳橫渠先生曰處二隂之間上順下容衆不可異故其道否乃亨易説廣平遊氏曰否之六二下乘初六上承六三二隂皆小人之象二不包初則小人畜忿而陷我矣不承三則小人依勢而藉我矣故曰包承小人吉此言君子一作善字之居中守正者全身逺害當如是也若夫至中至正之大人則不然體道虛已以遊人間或不言而飲人以和與人一無人字並立而使人化蓋嘗入獸不亂羣矣況於人羣乎故能處否而亨也若伊尹五就桀而羣凶不能以害之是也楊子以不離於羣為聖人蓋知不亂羣之説也易説龜山楊氏曰上下不交而小人道長極矣故包承之吉若子見南子是也其為言也曰豫所否者天厭之則其見南子也是豈得已哉此大人處否而亨之道也然非居中履正則堅白不足而磨涅之其磷淄必矣又何吉之有若夫居否之時揚已矜衆以自暴白昭昭如揭日月而行則其能不亂羣矣乎夫如是鮮不及矣此東漢之君子所以俱陷於黨錮也惟陳實獨免其庶幾乎易説兼山郭氏曰六二柔順中正然以隂居下當否之時故有包有承有大人小人之象大人否亨非能亨否也處否而亨者也於此而不亂羣非大人孰能為之易説白雲郭氏曰大人與天地合德其於含容固有餘矣然六二之包承則異於是蓋枉已屈道以承媚於人小人固能之非大人之事也故大人否亨否者身之否而道則亨矣孔子曰獲罪於天無所禱也孟子曰臧氏之子焉能使豫不遇哉大人之不能包承也如此不亂羣者如鷹鸇鳥雀必不可同羣伯夷不立於惡人之朝不與惡人言是也易説六三包羞象曰包羞位不當也伊川先生曰三以隂柔不中不正而居否又切近於上非能守道安命窮斯濫矣極小人之情狀者也其所包畜謀慮邪濫無所不至可羞恥也隂柔居否而不中不正所為可羞者處不當故也處不當位所為不以道也並易傳橫渠先生曰處否而進履非其位非知恥者也易説廣平遊氏曰六三在下體之上位浸顯矣而當否之世不能去又以隂柔處之是可羞也世之寡廉鮮耻苟賤之士處顯位以播惡於衆而自不一作不自知其醜者多矣六三與中正剛明者為鄰則見聞所漸亦知其可羞矣惟以資質隂柔不能行其所知至於忍耻而冒處故謂之包羞易説龜山楊氏曰六三居非中正位不當也故包其羞若子路愠見是也易説白雲郭氏曰三居下體之上過中思變之時也泰之九三能艱貞以守之故無咎否之六三不能變以有為而輔休否之君尸祿素餐所謂包羞者也孔子曰邦無道穀恥也其六三之謂歟書言沉潛剛克六三包羞無剛也無剛而處三五同功之位故曰位不當也易説九四有命無咎疇離祉象曰有命無咎志行也伊川先生曰四以陽剛健體居近君之位是有濟否之才而得高位者也足以輔上濟否然當君道方否之時處逼近之地所惡在居功取忌而已若能使動必出於君命威柄一歸於上則無咎而其志行矣能使事皆出於君命則可以濟時之否其疇類皆附離其福祉離麗也君子道行則與其類同進以濟天下之否疇離祉也小人之進亦以其類同也有君命則得無咎乃可以濟否其志得行也並易傳橫渠先生曰居否之世以陽處隂有應於下故雖有所命無咎也易説龜山楊氏曰九四以乾健之才上承九五剛健中正之君有可致之資居得致之位庶乎其可為也然否之為否以上下不交故也非上承下比一德以相與而能反否而有為無是道也四雖有可致之資而處上下不交之時未必相與也故曰有命無咎疇離祉命謂君命也有命而後可以濟時之否而疇類皆離祉也東漢之衰嬖幸持權內小人而外君子至是而否極矣竇武何進倚元舅之親招集天下名儒碩德共起而圖之冝若可為也然而命不出於其君而下不應故與其疇類俱至於陷禍職此之由也後之處否者可不監之哉易説白雲郭氏曰九四以剛健之才居近君之位可以輔其君以休否者也然臣道無成有終而已必君命之斯無過舉矣故有是臣有是命又非特無過而已其疇類亦將附麗而獲福也湯之命見於湯誓也又曰聿求元聖與之戮力則有命無咎之人伊尹是也武王之命見於泰誓也又曰豫小子既獲仁人以遏亂略則有命無咎之人太公之徒也湯誓曰豫其大賚汝周書曰大賚于四海豈非疇離祉之謂歟嗚呼商周之民非伊吕則無休否之祉伊吕非湯武之命將老死於莘渭間尚何志行之有哉易説九五休否大人吉其亡其亡繫于苞桑象曰大人之吉位正當也伊川先生曰五以陽剛中正之德居尊一作君位故能休息天下之否大人之吉也大人當位能以其道休息天下之否以循致於泰猶未離於否也故有其亡之戒否既休息漸將反一作及泰不可便為安肆當深慮逺戒常虞否之復來曰其亡矣其亡矣其繫于苞桑謂為安固之道如維繫于苞桑也桑之為物其根深固苞謂叢生者其固尤甚聖人之戒深矣漢王允唐李德裕不知此戒所以致禍敗也繫辭曰危者安其位者也亡者保其存者也亂者有其治者也是故君子安而不忘危存而不忘亡治而不忘亂是以身安而國家可保也有大人之德而得至尊之正位故能休一有息字天下之否是以吉也無其位則雖有其道將何為乎故聖人之位謂之大寶並易傳橫渠先生曰以亡為懼故能休其否包桑從下叢生之桑叢生則其根牢書云厥草惟包如竹叢蘆葦之類河朔之桑多從根斬條取葉其生叢然並易説龜山楊氏曰九五剛健中正有休否之才而履尊位大人之吉也否方休矣而安其位而忘其危保其存而忘其亡有其治而忘其亂則三者隨至矣故曰其亡其亡繫于苞桑言不忘亡則存乃可保也苞桑叢生也繫于苞桑言存之固也唐之穆宗承章武恢復之餘而蕭俯遽獻太平銷兵之䇿而河朔復亂失此之謂也易説兼山郭氏曰九五莊子曰休休焉則平易矣故休休有優遊平易之意方否之將窮大者既往而九三猶得尊位大中以臨其下可以休否者也然否猶未傾三隂彚進不敢安而忘危治而忘亂雖優遊平易之可存而恐懼怵惕之心未怠也夫然後知生於憂患死於安樂可也易説白雲郭氏曰九五以剛中之才而居尊位為休否之主湯武是也商書曰徯豫后后來其蘇此湯之休否也周書曰一戎衣天下大定此武王之休否也湯武休否大人吉也其亡其亡存不忘亡也繫于苞桑則為悠久無疆之道也聖人之意蓋亦深矣湯之書曰栗栗危懼若將隕于深淵仲虺又為之誥曰慎厥終惟其始此湯其亡苞桑之義也武王之書曰乃偃武修文歸馬于華山之陽放牛于桃林之野示天下弗服召公又訓于王曰為山九仭功虧一簣此武王其亡苞桑之義也位正當者有其德而有其位也易於否稱大人而泰不言者則知泰之九二否之九五皆得乾二五大人之道可互見也易説上九傾否先否後喜象曰否終則傾何可長也伊川先生曰上九否之終也物理極而必反故泰極則否否極則泰上九否既極矣故否道傾覆而變也先極否也後傾喜也否傾則泰矣後喜也否終則必傾豈有長否之理極而必反理之常也然反危為安易亂為治必有剛陽之才而後能也故否之上九則能傾否屯之上六則不能變屯也並易傳龜山楊氏曰上九處否之極先否也否終而傾後喜也否泰之往復理之必至又何可長也然居否之終苟無剛健之才而欲傾否亦難矣上九有剛健之才者也與屯之上六不能亨屯異矣易説白雲郭氏曰志行於四否休於五上九之傾冝矣滿而傾覆自然之理也且處泰而泰則終否處否而否則終泰先否者乃所以為後喜之道故曰何可長也易説大易粹言卷十二
