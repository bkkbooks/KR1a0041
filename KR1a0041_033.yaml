body:
  text: 大易粹言卷三十三宋方聞一編艮下乾上伊川先生曰序卦恆者久也物不可以久居其所故受之以遁遁者退也夫久則有去相須之理也遁所以繼恆也遁退也避也去之之謂也為卦天下有山天在上之物陽性上進山髙起之物形雖髙起體乃止物有上陵之象而止不進天乃上進而去之下陵而上去是相違遁故為遁去之義二隂生於下隂長將盛陽消而退小人漸盛君子退而避之一作避而去之故為遁也易傳遁亨小利貞伊川先生曰遁者隂長陽消君子退藏之時也者子退藏以伸其道道不屈則為亨故遁所以有亨也在事亦有由遁避而亨者雖小人道長之時君子知幾退避固善也然事有不齊與時消息無必同也隂為方長而未至於甚盛君子尚有遲遲致力之道不可大貞而尚利小貞也易傳白雲郭氏曰古之人有大德而無其時則遁方二隂浸長進而之否不利君子之時進則否而遁則亨也乾健也艮止也有剛健之德而止於上者大畜也有剛健之德而止於下此其所以為遁也孔子之德與天同矣而可以止則止遁之義也小利貞者可小事也是以孔子乘田委吏中都司寇皆屑為之至孟子為齊卿其道皆止於一國一邑一職之間在聖賢皆謂之小事也易說彖曰遁亨遁而亨也剛當位而應與時行也小利貞浸而長也遁之時義大矣哉伊川先生曰小人道長之時君子遁退乃其道之亨也君子遁藏所以伸道也此言處遁之道自剛當位而應以下則論時與卦才尚有可為之理也遁之時君子處之未有必遁之義五以剛陽之德處中正之位又下與六二以中正相應雖隂長之時如卦之才尚當隨時消息苟可以致其力無不至誠自盡以扶持其道未必於遁一作退藏而不為故曰與時行也當隂長之時不可大貞而尚小利貞者蓋隂長必以浸漸未能遽盛君子尚可小貞其道所謂小利貞扶持使未遂亡也遁者隂之始長君子知微故當深戒而聖人之意未便一作使遽已也故有與時行小利貞之教聖賢之於天下雖知道之將廢豈肯坐視其亂而不救必區區致力於未極之間强此之衰艱彼之進圖其暫安苟得為之孔孟之所屑為也王允謝安之於漢晉是也若有可變之道可亨之理更不假言也此處遁時之道也故聖人贊其時義大矣哉或久或速其義皆大也並易傳橫渠先生曰當位而應理不當遁以隂長故遁故曰與時行又曰小利貞又曰遁而亨也易說龜山楊氏曰二隂浸而長進而為否理之必至也止而不知去則患之所由生也遁而逺之斯亨矣故曰遁而亨也遁之時剛當位而應未至乎上下不交也故小利貞與時行也與屯之九五小貞吉之義同易說兼山郭氏曰遁非有亨之理其所亨者遁也按卦乾德廣運於外艮知行止之冝於內所以能遁而亨也易以陽稱大隂稱小六二柔順中正知動靜不失其時是以言小利貞又言浸長也遁非可大之時然其義則大也老子曰功成名遂身退遁也莊子曰聖人鶉居而雛食亦遁也充是二者得聖人之道多矣顧不大哉易說白雲郭氏曰常人之亨以得位失位言聖人之亨進退皆以道言道不必位亨雖遁亦亨也故曰遁而亨也剛當位而應五之應二也與時行者時止則止時行則行是為遁之義雖聖人亦不能自必也小利貞浸而長者隂浸而長不可大事之時也不可大事而彖言大矣哉者蓋有天德而止者謂之遁不然逃難而已非聖人所謂遁也此遁之時義所以為大也雖堯舜授受亦不過於遁而已矣聖人懼人之不知天德之大徒以逃難避仇逺迹山林者皆謂之遁則遁之為義小矣故特曰遁之時義大矣哉也遁之小利貞暌之小事吉不知者遂以為小而不思也故孔子明其大而後知小利貞者有大義存焉小事吉者有大用存焉易說象曰天下有山遁君子以逺小人不惡而嚴伊川先生曰天下有山山下一作上起而乃上天上進而相違是遁避之象也君子觀其象以避逺乎小人逺小人之道若以惡聲厲色適足以致其怨忿唯在整肅威嚴使知敬畏則自然逺矣易傳橫渠先生曰逺小人不惡而嚴惡讀為憎惡之惡逺小人不可示此惡也惡則患及之又焉能逺嚴之為言敬小人而逺之之義也易說龜山楊氏曰天下有山健而止也其藏疾也無所拒然亦終莫之陵也此君子逺小人之不惡而嚴之象也易說兼山郭氏曰天下有山內外之分也不惡而嚴全身潔己之道也豈若小人悻悻然見於面目而後去之耶易說白雲郭氏曰遁之為象取二隂浸長而消陽君子見幾而作故卦謂之遁天下有山蓋備二體之象非示名卦之意易如此類者亦多矣君子當遁之時畏小人之害道志在逺之而已雖山林江海為逺害之地然亦有以道逺之者逺之之道何如不惡其人而嚴其分逺也孔子曰人而不仁疾之已甚亂也疾之則惡也不惡則不疾矣孔子曰君子無衆寡無小大無敢慢又曰君子正其衣冠尊其瞻視儼然人望而畏之皆嚴之謂也自古山林江海遁世之士多矣獨遁以道者孔孟而已若夫君臣授受亦有遁之道者蓋臣道上行君不得不為之遁也知其道而遁者堯舜也不知其道而固有者桀紂也然非舜禹湯武而遁則篡矣易說初六遁尾厲勿用有攸往象曰遁尾之厲不往何災也伊川先生曰它卦以下為初遁者往遁也在前者先進故初乃為尾尾在後之物也遁而在後不及者也是以危也初以柔處微既已後矣不可往也往則危矣微者易於晦藏往既可危不若不往之無災也見幾先遁固為善也遁而為尾危道也往既有危不若不往而晦藏可免於災處微故也古人處微下隱亂世而不去者多矣並易傳橫渠先生曰危而不往何也遁既後時往則取災故知者違難在乎先幾易說龜山楊氏曰二隂進矣而隨其後遁之尾也居遁之時不能逺之隨其後故厲然柔方變剛隨而往則浸而為否矣能無災乎故勿用有攸往而象曰不往何災也易說白雲郭氏曰易道貴早辨而君子欲知幾故自履霜堅冰之後早辨之道言於初者多矣而遁之初六獨止而不知去不能早辨者也故曰遁尾厲遁尾者遁之後時也為遁之尾是為難之首也其危冝矣勿用有攸往者言處遁尾之道雖危而災猶可避也蓋往之義在我能止而不往則何災之有故止而不退則為厲止而不往則無災矣易說六二執之用黃牛之革莫之勝說象曰執用黃牛固志也伊川先生曰二與五為正應雖在相違遁之時二以中正順應於五五以中正親合於二其交自固黃中色牛順物革堅固之物二五以中正順道相與其固如執繫之以牛革也莫之勝說謂其交之固不可勝言也在遁之時故極言之上下以中順之道相固結其心志甚一作其堅如執之以牛革也並易傳橫渠先生曰黃牛中順也隂邪浸長二居君臣正合之位戡難救時莫若中順固志使姦不能干不然小人易間矣易說龜山楊氏曰黃中色牛順物執之用黃牛之革中順之志也居隂進之時中而不倚和而不流執用黃牛之革則所執固矣外物莫能勝也故說若夫萬變陳於前則交喪於中尚能說乎哉易說兼山郭氏曰輔嗣云說解也六二柔靜中正有應於五志在君親之人也其執之堅其持之固庶幾遁世無悶不見是而無悶者也然乾剛也此柔也故有黃牛之革中順之辭焉易說白雲郭氏曰六二柔順中正上應九五可謂得君之臣矣而猶執用黃牛固志何哉方遁之時小利貞不可大事勿用有攸往雖應於君而遁之志不可不固也是以孔子於定哀孟子於齊梁非無應也而其道不可少貶以從時好者所謂固志也六二為下體艮卦之主知時止而止故稱執焉柔順牛之象也中正黃之象也不能執用黃牛則見利忘義終不可大有為於天下而自喪其德多矣勝說或如字或作脫易以說為脫者有矣此義實近之而其言似膚淺故先儒有不從者也易說九三係遁有疾厲畜臣妾吉象曰係遁之厲有疾憊也畜臣妾吉不可大事也伊川先生曰陽志說隂三與二切比係乎二者也遁貴速而逺有所係纍則安能速且逺也害於遁矣故為有疾也遁而不速是以危也臣妾小人女子懷恩而不知義親愛之則忠其上係戀之私恩懷小人女子之道也故以畜養臣妾則得其心為吉也然君子之待小人亦不如是也三與二非正應以昵比相親非待君子之道若以正則雖係不得為有疾蜀先主之不忍棄士民是也雖危為無咎矣遁而有係纍必以困憊致危其有疾乃憊也蓋力亦不足矣以此䁥愛之心畜養臣妾則吉豈可以當大事乎並易傳橫渠先生曰為內之主得位之正立愛其下畜臣妾之道盡矣然以斯處遁無疾冝焉易說龜山楊氏曰一陽止乎上艮體也柔進而承之止而不能逺係遁也能無疾憊乎遁之時小利貞而已剛雖當位不可大事也故畜臣妾吉大貞之則難將作矣尚何吉之有易說兼山郭氏曰剝之六五以宫人寵言君位也遁之九三畜臣妾吉言臣位也位雖不同其義則近之矣易說白雲郭氏曰遁以艮止故六二止於下以固志九三過於止而係於遁也係於遁而不知變是以疾困而危其江海避世之徒歟畜臣妾吉者是道也施之於家則可施之於天下則不可若是者君子謂之隘其可大事乎易說九四好遁君子吉小人否象曰君子好遁小人否也伊川先生曰四與初為正應是所愛者也君子雖有所好愛義苟當遁則去而不疑所謂克己復禮以道制欲是以吉也小人則不能以義處昵於所好牽於所私至於陷辱其身而不能已故在小人則否也否不善也四乾體能剛斷者聖人以其處隂而有係故設小人之戒恐其失於正也君子雖有好而能遁不失於義小人則不能勝其私意而至於不善也並易傳橫渠先生曰有應於隂不惡而嚴故曰好遁小人暗於事幾不忿怒成仇則私溺為纍矣易說龜山楊氏曰健而止乎外而初以柔應之其遁非不得已也故曰好遁君子吉然居遁之時有應於下小人則相與而變剛矣尚何遁之有易說兼山郭氏曰九四處乾巽之間剛雖不中能遁以違之亦和而不流者也故有君子小人之辭焉內以其應柔外以其用健是以謂之好也中庸曰邦無道至死不變此其庶幾乎易說白雲郭氏曰遁自九四而上其遁皆美蓋乾德剛健中正何適而非美乎九四好遁所謂遁世無悶者也潛龍之義也君子安之故吉小人汲汲於富貴戚戚於貧賤一不得志將自經於溝瀆而莫之知又豈能好遁而安之哉故曰小人否也易說九五嘉遁貞吉象曰嘉遁貞吉以正志也伊川先生曰九五中正遁之嘉美者也處得中正之道時止時行乃所謂嘉美也故為貞正而吉九五非無係應然與二皆以中正自處是其心志及乎動止莫非中正而無私係之失所以為嘉也在彖則槩言遁時故云與時行小利貞尚有濟遁之意於爻至五遁將極矣故唯以中正處遁言之遁一無遁字非人君之事故不主君位言然人君之所避逺乃遁也亦在中正而已志正則動必由正所以為遁之嘉也居中得正而應中正是其志正也所以為吉人之遁也止也唯在正其志而已矣並易傳橫渠先生曰嘉好義同然五居正處中能正其志故獲貞吉易說龜山楊氏曰剛當位而應能與時行也故為嘉遁然遁之時不可以有為也故其貞吉正其志而已易說兼山郭氏曰九五堯曰咨爾舜天之歷數在爾躬允執其中舜亦以命禹雖革運之有終其嘉遁之志則一也孔子曰武盡美矣未盡善也其有見於此乎易說白雲郭氏曰先人曰堯授舜舜授禹雖曰天之歷數在爾躬其為嘉遁之志則一也故子謂韶盡美矣又盡善也其是之謂乎雍曰九五剛健中正道全德備舉遁之世莫美於斯故曰嘉遁貞吉以正志者道至於此與時為對隨而不流無係也無執也無好也不事於外正其在我者而已矣此其所以為嘉也上非堯舜下非孔子皆不足以與此易說上九肥遁無不利象曰肥遁無不利無所疑也伊川先生曰肥者充大寬裕之意遁者唯飄然逺逝無所係滯之為善上九乾體剛斷在卦之外矣又下無所係是遁之逺而無纍可謂寬綽有餘裕也遁者窮困之時也善處則為肥矣其遁如此何所不利其遁之逺無所疑滯也蓋在外則已逺無應則無纍故為剛決無疑也並易傳龜山楊氏曰居卦之外而無應於內與九三係遁有疾憊異也則其遁也不疑其所行矣故曰肥遁無不利易說白雲郭氏曰肥者道之充實也道之充實放諸四海而準孟子所謂至大至剛塞于天地之間者何所往而不利乎以是道而處遁世故無所係好其於進退綽綽然有餘裕矣夫何疑之有當遁之極所謂知變之大人也遁之時義觀九五上九可見易說大易粹言卷三十三
