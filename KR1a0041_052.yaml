body:
  text: 大易粹言卷五十二宋方聞一編艮下艮上伊川先生曰艮序卦震者動也物不可以終動止之故受之以艮艮者止也動靜相因動則有靜靜則有動物無常動之理艮所以次震也艮者止也不曰止者艮山之象有安重堅實之意非止義可盡也乾坤之交三索而成艮一陽居二隂之上陽動而上進之物既至於上則止矣隂者靜也上止而下靜故為艮也然則與畜止之義何異曰畜止者制畜之義力止之也艮止者安止之義止其所也易傳看一部華嚴一本作法華經不如看一艮卦經只言一止觀艮卦只明使萬物各有止止分便定並語録艮其背不獲其身行其庭不見其人無咎明道先生曰艮其背止於所不見也劉絢師訓人之情各有所蔽故不能適道大率患在自私而用智自私則不能以有為為應物用智則不能以明覺為自然今以惡外物之心而求照萬物之地是反鑑而索照也易曰艮其背不獲其身行其庭不見其人孟子亦曰所惡於智者為其鑿也與其非外而是內不若內外之兩忘兩忘則澄然無事矣無事則定定則明明則尚何應物之為纍哉與橫渠書伊川先生曰人之所以不能安其止者動於欲也欲牽於前而求其止不可得也故艮之道當艮其背所見者在前而背乃背之是所不見也止於所不見也止於所不見則無欲以亂其心而止乃安不獲其身不見其身也謂忘我也無我則止矣不能無我無可止之道行其庭不見其人庭除之間至近也在背則雖至近不見謂不交於物也外物不接內欲不萌如是而止乃得止之道於止為無咎也一無也字易傳艮其背乃止也背無欲無思也故可止陳氏拾遺兼山郭氏曰艮止也天下之欲無窮而人每患於不能止者蓋不知無欲之地而止之也止於無欲之地所謂艮其背也人之耳目口鼻皆有欲也至於背則無欲也矣內欲不動則外境不入是以行其庭不見其人也不獲其身止其止矣不見其人止於行矣內外兼止故人欲自滅而天理固存孟子曰養心莫善於寡欲其艮其背之義乎自一身言之庭與四海皆一也聖人舉而措之天下謂之事業皆行其庭之事也此道可明以理不可窮以辭即所謂中庸之道也艮止圖白雲郭氏曰伊川曰艮與畜止之義何異曰畜止者制畜之義力止之也艮止者安止之義止其所也雍曰艮止之義最為近道而知之行之者鮮且天下之欲無窮而人每患於不能止者蓋不知無欲之地而止之也有欲而止之大畜是也故有說輹豶豕之象伊川所謂力止之者也止於無欲之地所謂艮其背也人之有目欲於色者也耳欲於聲者也口欲於味者也鼻欲於臭者也至於背則無見無知故無欲常與物背馳而不相向使欲無自而生故得安於止之道一身且不獲況外物乎內欲不動則外境不入是以行其庭不見其人也不獲其身忘我也不見其人忘人也忘我者在止之止也忘人者在行之止也以止而忘我之止施之於行施之於人皆一也內外兼止則人欲自滅而天理固存是以無咎孟子言養心莫善於寡欲與艮其背之義正同易說彖曰艮止也時止則止時行則行動靜不失其時其道光明艮其止止其所也上下敵應不相與也是以不獲其身行其庭不見其人無咎也明道先生曰艮其止止其所也八元有善而舉之四凶有罪而誅之各止其所也釋氏只曰止安知止乎劉絢所録艮其止止其所也各止其所父子止於恩君臣止於義之謂艮劉絢師訓艮止也止則便生不止則不生艮始終萬物語録伊川先生曰艮為止止之道唯其時行止動靜不以時則妄也不失其時則順理而合義在物為理處物為義動靜合理義不失其時也乃其道之光明也君子所貴乎時仲尼行止久速是也艮體篤實有光明之義艮其止謂止之而止也止之而能止者由止得其所也止不得其所則無可止之理夫子曰於止知其所止謂當止之所也夫有物必有則父止於慈子止於孝君止於仁臣止於敬萬物庶事莫不各有其所得其所則安失其所則悖聖人所以能使天下順治非能為物作則也唯止之各於其所而已上下敵應不相與也以卦才言也上下二體以敵相應無相與之義隂陽相應則情通而相與乃以其敵故不相與也不相與則相背為一作與艮其背止之義一有同字也是以不獲其身止無咎也相背故不獲其身不見其人是以能止能止則無咎也並易傳聖人只言止所謂止如人君止於仁人臣止於敬之類是也易之艮言止之義曰艮其止止其所也言隨其所止而止之人多不能止劉元承手編艮其背止欲於無見若欲見於彼而上之所施各異若艮其止止其所也止各當其所也聖人所以應萬變而不窮一作勞者事各止當其所也若鑒在此而物之妍媸自見於彼也聖人不與焉時止則止時行則行時行對時止而言亦止其所也動靜不失其時皆止其所也陳氏拾遺橫渠先生曰雖處喧閧亦無害於為學有人於此或日月而至焉亦有終日而不至者及其久也去者常少若居於家聞嬰孩之啼則有不忍之心聞奴婢喧戾則猶有不容之意至於市井紛囂一不與我事何傷於存誠養志易曰艮其背不獲其身行其庭不見其人無咎夫入它人之庭不見其人可止也艮其背至近於人也然且不見以其上下無應也時止則止時行則行動靜不失其時其道光明學者必時其動靜則其道乃不蔽昧而明白今人從學之久不見進長正以莫識動靜見它人擾擾非關已事而所修亦廢由聖學觀之冥冥悠悠以是終身謂之光明可乎易說艮一陽為主於兩隂之上各得其位而其勢止也易言光明者多艮之象著則明之義也動靜不失其時義之極也義極則光明著見唯其時物前定而不疚並正蒙龜山楊氏曰艮止也止其所也故繫辭曰止萬物者莫善乎艮又曰成言乎艮艮者萬物之所成終而成始也止於此矣復出乎震不終止也故艮卦曰時止則止時行則行語録白雲郭氏曰夫艮有止之止有行之止行止之間又有時焉蓋行止係乎時而不係乎止也止所以應行止者也時所以為行止者也是則艮止之止在我而行止之止則在彼矣行止為時則艮止為道矣故彖言時止則止又曰艮其止所以兼明有二義也且艮之道時方止則止其止時方行則行其止行止在時艮止在此在時者不可必在此者可必不以在此之必而易時之不可必則止道盡矣是以艮止之中復有行而行止之行復有艮之止是所謂行其道者也孔子曰用之則行舍之則藏孟子曰窮則獨善其身達則兼善天下是皆以止道應時也莊子曰寧其死而其骨貴乎寧其生而曳尾於塗中乎二大夫往矣吾將曳尾於塗中是為知止不知行有我廢時者也欲孰甚焉且天下之欲常生於必而無欲生於不必孔子所以毋必者止其欲也莊子不知必之可止而欲必其生之樂是以失時止則止時行則行之義老氏有曰絶聖棄智絶仁棄義莊子又曰焚符破璽剖斗折衡彼時有之而我絶之欲不在時與物而在我也易在彼之欲而為我之欲其惑甚矣故雖艮止之道聖人不能廢時老莊氏未之知也動靜統言之也行止亦動靜也動靜俱不失時其道至矣故光明也道大成則明故中庸曰誠則明其道光明則艮道大成矣艮始於止施之於行止又施之於行止之時此所以為大成也止其所者又言止無它義知其所而止之耳上下敵應不相與者艮之六爻皆敵也敵所以成艮也知敵而相與則為交戰之道失艮止之義逺矣知敵而不相與則與敵背馳情欲自逺是以能不獲其身不見其人無咎也無咎者於道無失其為義大矣易說艮曰時止則止時行則行雖止之道有行而行之時復有止焉蓋艮以止為主故也艮之止中庸之中是或一道中庸解象曰兼山艮君子以思不出其位伊川先生曰上下皆山故為兼山此而并彼為兼謂重復一作復也重艮之象也君子觀艮止之象而思安所止不出其位也位者所處之分也萬事各有其所得其所則止而安若當行而止當速而久或過或不及皆出其位也況踰分非據乎易傳艮思不出其位乃止其所也陳氏拾遺橫渠先生曰位所安之分也如素夷狄行乎夷狄素患難行乎患難易說白雲郭氏曰艮之為卦上下皆艮故曰兼山下卦內也內為身上卦外也外為人兼內外而統之所以有不獲其身不見其人之象也止無它義止其所而已以君子之位言之則思不出其位者亦止其所也位非獨爵祿而已所守之分皆位也必曰思者未有事之時也未有事之時則無欲矣待其有欲而止則非艮也中庸曰喜怒哀樂之未發謂之中然則艮之為止其在兹時乎易說初六艮其趾無咎利永貞象曰艮其趾未失正也伊川先生曰六在最下趾之象趾動之先也艮其趾止於動之初也事止於初未主失正故無咎也以柔處下當止之時也行則失其正矣故止乃無咎隂柔患其不能常也不能固也故方止之初戒以利在常永貞固則不失止一作正之道也當止而行非正也止之於初故未至失正事止於始則易而未至於失也並易傳白雲郭氏曰趾初象也凡動之先莫先於趾止於未動之先則易而止於既動之後則難止於其先故得無咎止於既動之後不能無得失也利永貞者利在久於其道而固守之也中庸曰豫知擇乎中庸而不能期月守也是不知利永者也又曰得一善則拳拳服膺而弗失之是能利貞者也象言未失正者止於未動之先未有失正之事也小畜於復自道言吉復於不逺復言元吉艮之初六有過於二者而不言吉蓋吉凶者失得之象也二卦之復雖與止相近然有失而能止則謂之復凡言復皆先失後得復則吉不復則凶吉凶可得而言也艮其趾則止於未失得之前吉凶失得皆在所止矣是以不言吉也然則艮之無咎豈不足於小畜與復之吉哉蓋不使纍於得失而已故象言未失正則止於無失正於無失則未嘗有得矣然世多以吉為過於無咎是不知吉與無咎自為二道論有為則莫善於吉論守道則無咎為大是以易辭或言吉或言無咎或吉而無咎或凶而無咎不可同也易說六二艮其腓不拯其隨其心不快象曰不拯其隨未退聽也伊川先生曰六二居中得正得止之道者也上無應援不獲其君矣三居下之上成止之主主乎止者也乃剛而失中不得止之宜剛止於上非能降而下求二雖有中正之德不能從也二之行止繫乎所主非得自由故為腓之象股動則腓隨動止在股而不在腓也二既不得以中正之道拯救三之不中則必勉而隨之不能拯而唯隨也雖咎不在已然豈其所欲哉言不聽道不行也故其心不快不得行其志也士之處髙位則有拯而無隨在下位則有當拯有當隨有拯之不得而後隨所以不拯之而唯隨者在上者未能下從也退聽下從也並易傳橫渠先生曰腓體之隨也不能禁其趾而徒止其腓腓所未聽故心不能快易說白雲郭氏曰腓腨腸也下體之所主也上而股下而足皆隨之故為六二之象也六二下卦之主也初六九三之所隨也六二雖居中得正得止之道然以柔用柔才有不足是以不能舉其隨而其心不快也方止之時忘我忘人而六二不拯其隨其心不快何哉蓋六二有為之臣位也君子正心誠意之初故艮其背不獲其身行其庭不見其人及其道之大成施之於天下國家欲天下各安其所止蓋伊尹使是君為堯舜之君使是民為堯舜之民孟子欲正人心之時而不能拯其隨者是以其心不快也此謂其隨失隨之義故君子其心不快象言未退聽謂隨者也易說九三艮其限列其夤厲薰心象曰艮其限危薰心也伊川先生曰限分隔也謂上下之際三以剛居剛而不中為成艮之主決止之極也已在下體之上而隔上下之限皆為止義故為艮其限是確乎止而不復能進退者也在人身如列其夤夤膂也上下之際也列絶其夤則上下不相從屬言止於下之堅也止道貴乎得宜行止不能以時而定於一其堅强如此則處世乖戾與物睽絶其危甚矣人之固止一隅而舉世莫與宜者則艱蹇忿畏焚撓其中豈有安裕之理厲薰心謂不安之一作其勢薰爍其中一有心字也謂其固止不能進退危懼之慮常薰爍其中心也並易傳橫渠先生曰一身而動止中列危至薰心易說白雲郭氏曰不能止之於初至於三則難矣九三用剛有力止之象猶大畜說輹豶豕之道也限所以制內外也內欲不出外境不入所謂艮其限也亦猶列身之夤而制其左右也厲薰心者常以危亡之憂薰爍其心使不忘也所謂其亡其亡繫于苞桑者也曰薰者與詩言憂心如薰同意凡此者皆以九三之止失於早辨故必極於用力以限止之方之初六則甚難矣然艮止之道行無不善是以六爻終無凶危特有難易之别也雖然止而言厲何也中庸曰人皆曰豫知驅而納諸罟穫陷阱之中而莫之知辟也君子失性之危中庸謂之陷阱則艮之言厲一道也易說六四艮其身無咎象曰艮其身止諸躬也伊川先生曰四大臣之位止天下之當止者也以隂柔而不遇剛陽之君故不能止物唯自止其身則可無咎所以能無咎者以止於正也言止其身無咎則見其不能止物施於政則有咎矣在上位而僅能善其身無取之甚也不能為天下之止能止於其身而已豈足稱大臣之位也並易傳橫渠先生曰止於心故能艮其身咸之九四朋從爾思義近易說白雲郭氏曰以初論四則初為早辨者也然有初之艮其趾然後四能艮其身先後之序理亦宜然艮其身則一身之內合於自然無不止也是以無咎止諸躬者謂能成己而己未能成物也易說六五艮其輔言有序悔亡象曰艮其輔以中正也伊川先生曰五君位艮之主也主天下之止者也而隂柔之才不足以當此義故止以在上取輔一有之字義言之一無之字人之所當慎而止者唯言行也五在上故以輔言輔言之所由出也艮於一作其輔則不妄出而有序也言輕發而無序則有悔止之於輔則一作故悔亡也有序中節有次序也輔與頰舌皆言所由出而輔在中艮其輔謂止於中也五之所善者中也艮其輔謂止於中也言以得中為正止之於輔使不失中乃得正也並易傳橫渠先生曰不能施止於心而能止其言故悔可亡也易說白雲郭氏曰六五君位一卦之主蓋主天下之止者也天下命令之所由出可不慎乎故艮其輔言有序而後悔亡也輔頰車也言之所出也有序中節也君子居其室出其言善則千里之外應之有序者固如此也是以其悔可亡惟中正之君故能慎而止之如此庸主忽其言故天下亦其違之也觀舜命九官則知艮其輔言有序之道而商紂謂己有天命謂敬不足行謂祭無益謂暴無傷蓋有間矣豈孔子所謂喪邦之言哉易說上九敦艮吉象曰敦艮之吉以厚終也伊川先生曰九以剛實居上而又成艮之主在艮之終止之至堅篤者也敦篤實也居止之極故不過而為敦人之止難於久終故節或移於晚守或失於終事或廢於久人之所同患也上一無上字九能敦厚於終止道之至善所以吉也六爻之德惟此為吉天下之事唯終守之為難能敦於止有終者也上之吉以其能厚於終也並易傳白雲郭氏曰居止之極止之過中者也過中則疑於有失矣然慎厥終惟其始者古人之戒有始有卒者聖人之事能過於止是厚於終也又安有失哉故言敦艮吉易說大易粹言卷五十二
