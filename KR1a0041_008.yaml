body:
  text: 大易粹言卷八宋方聞一編坤下坎上伊川先生曰比序卦衆必有所比故受之以比比親輔也一作比輔比也一作比輔也人之類必相親輔然後能安故既有衆則必有所比比所以次師也為卦上坎下坤以二體言之水在地上物之相切比無間莫如水之在地上故為比也又衆爻皆隂獨五以陽剛居君位衆所親附而上亦親下故為比也易傳比吉原筮元永貞無咎不寧方來後夫凶伊川先生曰比吉道也人相親比自為吉道故雜卦云比樂師憂人相親比必有其道苟非其道則有悔咎故必推原占決其可比者而比之筮謂占決卜度非謂以蓍龜也所比得元永貞則無咎元謂有君長之道永謂可以常久貞謂得正道上之比下必有此三者下之從上必求此三者則無咎也人之不能自保其安寧方且來求親比得所比則能保其安當其不寧之時固宜汲汲以求比若獨立自恃求比之志不速而後則雖夫亦凶矣夫猶凶況柔弱者乎夫剛立之稱傳曰子南夫也又曰是謂我非夫凡生天地之間者未有不相親比而能自存者也雖剛強之至未有能獨立者也比之道由兩志相求兩志不相求則睽矣君懷撫其下下親輔一作附於上親戚朋友鄉黨皆然故當上下合意以相從苟無相求之意則離而凶矣大抵人情相求則合相持則睽相持相待莫先也人之相親故有道然而欲比之志不可緩也並易傳橫渠先生曰必原筮者慎所與也易説白雲郭氏曰伊川曰原筮者推原占決相比之道也非以蓍龜也上之比下必有元永貞之三者下之比上必求此三者則無咎也又曰夫剛立之稱也傳曰子南夫也又曰我非夫剛立者猶凶況柔弱乎雍曰一陽之卦得位者師比而已得天位則為比得臣位則為師天下之吉莫吉於比故比直言吉治天下之衆莫急於貞故師先言貞帥師有君道而不得如是之大如是之久也故元元永之貞昔成湯之初征也東征西夷怨曰奚獨後豫所謂不寧方來而無後凶者矣易説彖曰比吉也比輔也下順從也原筮元永貞無咎以剛中也不寧方來上下應也後夫凶其道窮也伊川先生曰比吉也比者吉之道也物相親比乃吉道也比輔也釋比之義比者相親輔也下順從也解卦所以為比也五以陽居尊位羣下順從以親輔之所以為比也推原筮一作占決相比之道得元永貞而後可以無咎所謂元永貞如五是也以陽剛居中正盡比道之善者也以陽剛當尊位為君德元也居中得正能永而貞也卦辭本泛言比道彖言元永貞者九五以剛處中正是也人之生不能保其安寧方且來求附比民不能自保故戴君以求寧君不能獨立故保民以為安不寧而來比者上下相應也以聖人之公言之固至誠求天下之比以安民也以後王之私言之不求下民之附則危亡至矣故上下之志必相應也在卦言之上下羣隂比於五五比其衆乃上下應也衆必相比而後能遂其生天地之間未有不相親比而能遂者也若相從之志不疾而後則不能成比雖夫亦凶矣無所親比困屈以致凶窮之道也並易傳龜山楊氏曰五以剛中得尊位居中履正衆隂在下而順承之有親輔之象卦之所以為比也故曰比吉也比輔也下順從也先王什伍其民鄉田同井使之出入相友守望相助疾病相扶持比之所以吉也政散民流用蕩析離居則凶可知矣此自然之理也原筮者占所比也元永正者可比之道也原筮謂占決可否非龜筮之筮也與初筮之筮同蓋無長人之仁則雖比而不親無可久之德則雖比而必離無正固之守則雖比而不周上之比下與下之比乎上無是三者則小人之比耳能無咎乎故唯元永正而後無咎盡此道者其唯九五乎故曰以剛中也居比之時隂無正應不寧之象也而衆隂順承不寧方來之象也不寧方來以上下應而已蓋后非民罔使民非后罔事上下相求古今之通道也上不比乎下下不比乎上而能獨安者未之有也夫一陽在上衆隂在下而順從比之吉也而上六獨居其上而乘之無順從之義後夫者也婦以順從夫者也夫先而婦從父先而子從君先而臣從其義一也獨曰後夫者蓋有夫婦而後有父子有父子而後有君臣曰後夫者推本言之也夫且不可後況君親乎後君親則大亂之道凶不足言矣自比吉至此易説白雲郭氏曰伊川曰卦之辭泛言比道而彖言盡比道之善唯五而已民不能自保故戴君以求寧君不能獨立故保民以為安凡生於天地之間者未有不相親比而能自存者也又曰以聖人之公言之固至誠求天下之比以安民也以後王之私言之不求下民之附則危亡矣雍曰天下之吉生於順而凶生於逆下之順從天下無異意不寧方且來非吉乎後之凶無順意故也不寧方如初六六四是也後夫上六之不我比也上下應者上而六四下而初六非正應而來比也然易之道窮則變不知變則失易之道故乾有窮之災坤則其道窮況後夫乎聖人於道窮之際每致意焉者明易之道初無窮人自失之也易説象曰地上有水比先王以建萬國親諸侯伊川先生曰夫物相親比而無間者莫如水在地上所以為比也先王觀比之象以建萬國親諸侯建立萬國所以比民也親撫諸侯所以比天下也易傳龜山楊氏曰水在地上相比而不離先王觀比之象建國畫地而封之為之屬連使相親比則諸侯知尊君親上而天下從之矣易説兼山郭氏曰象民之有君諸侯之有王非先王創治而有之皆出於自然之勢也蓋上下之分未立強弱之勢不齊於是大得以陵小衆得以暴寡曰趣於亂亡而生生之理熄矣必有強有德者出焉則大小之勢分衆寡之情一於是有小事大有大比小小大之情親率歸于大定者是先王封建之本也梁襄王問孟子曰天下惡乎定孟子對曰定于一一者王也方地上有水非澤之所鍾散而相親則各有所比先王以是建萬國而親諸侯王道之本也方比之五隂而一陽上有大中至正之道下無僣亂分民之臣蓋足以王矣自河圖洛書之相為經緯八卦九章之相為表裏文王得之以演周易孔子得之以述春秋故春秋二百四十二年之間有春有王正月蓋同出於此矣觀禹會諸侯於塗山執玉帛者萬國周成王時諸侯來朝助祭者千八百國春秋之時見於經者止百二十有四國其後離為十二合為六七卒并於秦方是時征伐四出轉以相滅原野厭人之肉川谷流人之血凡以天下無王故也故易之有比春秋之書王豈易言哉易説白雲郭氏曰伊川曰建萬國所以比民親諸侯所以比天下先人曰民之有君諸侯之有王非先王創治而有之皆出於自然之勢此先王封建之本也梁襄王曰天下惡乎定孟子曰定于一一者王也方地上有水非澤之所鍾散而相親則各有所比先王以是建萬國親諸侯王道之本也觀禹會諸侯於塗山執玉帛者萬國周成王時助祭者千八百國春秋之時見於經者止百二十四國其後離為十二合為六七卒并於秦數百年間吞噬屠滅殆盡凡以天下無王故也故易之有比春秋之書王其義一也易説初六有孚比之無咎有孚盈缶終來有它吉象曰比之初六有它吉也伊川先生曰初六比之始也相比之道以誠信為本中心不信而親人人誰與之故比之始必有孚誠乃無咎也孚信之在中也誠信充實於內若物之盈滿於缶中也缶質素之器言若缶之盈實其中外不加文飾則終能來有它吉也它非此也外也若誠實充於內物無不信豈用飾外以求比乎誠信中實雖它外皆當感而來從孚信比之本也言比之初六者比之道在乎始也始能有孚則終致有它之吉其始不誠終焉得吉上六之凶由無首也並易傳橫渠先生曰柔而旡應能擇有信者親之已之誠素著顯終有它吉比好先也易説龜山楊氏曰比之初原筮之時也故有孚比之乃無咎孚信之在中也孔子曰君子周而不比小人比而不周故比以忠信為主比而無孚小人之比也能無咎乎有孚比之比乎人者也有孚盈缶孚之在己也缶器之質者也盈缶則充實在中不資外飾也故來有它吉夫居比之初人相求比之時也孚誠充實於中而後為人所比盈缶是也故能有它吉有孚而未至於盈缶則比乎人者也故無咎而已非比之初則不必有它而後吉故曰比之初六有它吉易説白雲郭氏曰廣大乎比天下之道見賢則比之不必有應而比也然有應而比者比之易二四是也逺而非應者比之難初六是也然逺而非應柔弱不能自逹有待於人者也缶之為器有物盈之則有用也無以盈之虛器也是缶之有待於物猶初六之不能自用也初六以誠信之道自充於中所謂有孚盈缶矣何患其無用乎中孚曰鳴鶴在隂其子和之蓋誠信感人有必應之道故終使六二自內與之同比於五也雖非其應而比其道蓋益賢於求應者矣何咎之有它吉本非我有之吉因人而得之者也初六才位不足直以誠信得它吉也故比之道雖吉而比之始又以孚為先古之人因人得用者多矣唯誠信充於中者能終它吉不然吉未終而凶矣易説六二比之自內貞吉象曰比之自內不自失也伊川先生曰二與五為正應皆得中正以中正之道相比者也二處於內自內謂由己也擇才而用雖在乎上而以身許國必由於己己以得君道合而進乃得正而吉也以中正之道應上之求乃自內也不自失也汲汲以求比者非君子自重之道乃自失也守己中正之道以待上之求乃不自失也易之為戒嚴密二雖中正質柔體順故有貞吉自失之戒戒之自守以待上之求無乃涉後凶乎曰士之修己乃求上之道降志辱身非自重之道也故伊尹武侯救天下之心非不切必待禮至然後出也並易傳橫渠先生曰愛自親始人道之正故曰貞吉易説廣平遊氏曰比之自內者非枉己以外求也上之人訪逮幽側至誠以相與然後出而應之故爻稱自內而象以為不自失也六二居中得正與九五為正應迹逺而志同位殊而德合故以自內言之若伊尹之在莘而湯聘加焉非自內以比耶尹負鼎干湯孰謂聖人乃不知比之自失乎易説龜山楊氏曰九五以中正在上而二以中正自內比之故正吉蓋居比之時上下相求而不以正則內不失己外必失人矣皆自失也故唯正吉而後無失易説白雲郭氏曰比以九五為主而六二正應為主於內蓋率天下而比五者故自內之外率天下以歸王也二之比初非欲親初也欲與之比五也終能同比於五是不失己道之貞吉也觀初六它吉六二自內之辭可明其義蒙之六三亦舍應親二矣而有不有躬之象蓋蒙與比異道而三與二異位義不同也故象言不自失以見非如蒙之不有躬也夏商之季天下諸侯相率以歸湯武或三千或八百國所謂六二貞吉初六它吉者衆矣易説六三比之匪人象曰比之匪人不亦傷乎伊川先生曰三不中正而所比皆不中正四隂柔而不中二存應而比初皆不中正匪人也比於匪人其失可知悔吝不假言也故可傷二之中正而謂之匪人隨時取義各不同也人之相比求安吉也乃比於匪人必將反得悔吝其亦可傷矣深戒失所比也並易傳橫渠先生曰履非其正比之必匪其人故可傷易説龜山楊氏曰承乘皆隂比之匪人也能無傷乎言傷則悔咎不足道也易説白雲郭氏曰六三不知比賢而比於上上非正應而有凶比非其人則自失其身矣是其所以可傷也易説六四外比之貞吉象曰外比於賢以從上也伊川先生曰四與初不相應而五比之外比於五乃得貞正而吉也君臣相比正也相比相與宜也五剛陽中正賢也居尊位在上也親賢從上比之正也故為貞吉以六居四亦為得正之義又隂柔不中之人能比於剛明中正之賢乃得正而吉也又比賢從上必以正道則吉也數説相須其義始備外比謂從五也五剛明中正之賢又居君位四比之是比賢且從上所以吉也並易傳龜山楊氏曰六四無應於內而外比九五比賢從上也九五剛中正賢也比賢從上而不以正人誰與之故正乃吉六四以隂居隂正也易説白雲郭氏曰四與初非正應故舍逺比近外比九五之賢亦自知才位非可兼人從上保身而已故得貞而吉比或自內或外比以明比道之大不可拘於常也易説九五顯比王用三驅失前禽邑人不誡吉象曰顯比之吉位正中也舍逆取順失前禽也邑人不誡上使中也伊川先生曰五居君位處中得正盡比道之善者也人君比天下之道當顯明其比道而已如誠意以待物恕已以及人發政施仁使天下蒙其惠澤是人君親比天下之道也如是天下孰不親比於上若乃暴其小仁違道干譽欲以求下之比其道亦已狹矣其能得天下之比乎故聖人以九五盡比道之正取三驅為喻曰王用三驅失前禽邑人不誡吉先王四時之畋不可廢也故推其仁心為三驅之禮乃禮所謂天子不合圍也成湯祝網是其義也天子之畋圍合其三靣前開一路使之可去不忍盡物好生之仁也止取其不用命者不出而反入者也禽獸前去者皆免矣故曰失前禽也王者顯明其比道天下自然來比來者撫之固不煦煦然求比於物若田之三驅禽之去者從而不追來者則取之也此王道之大所以其民皡皡而莫知為之者也邑人不誡吉言其至公不私無逺邇親疏之别也邑者居邑易中所言邑皆同王者所都諸侯國中也誡期約也待物之一不期誡於居邑如是則吉也聖人以大公無私治天下於顯比見之矣非唯人君比天下之道如此大率人之相比莫不然以臣於君言之竭其忠誠致其才力乃顯其比君之道也用之與否在君而已不可阿諛逢迎求其比己也在朋友亦然修身誠意以待之親已與否在人而已不可巧言令色曲從苟合以求人之比己也於鄉黨親戚於衆人莫不皆然三驅失前禽之義也顯比所以吉者以其所居之位得正中也處正中之地乃由正中之道也比以不偏為善故云正中凡言正中者其處正得中也比與隨是也言中正者得中與正也訟與需是也禮取不用命者乃是舍順取逆也順命而去者皆免矣比以向背而言謂去者為逆來者為順也故所失者前去之禽也言來者撫之去者不追也不期誡於親近上之使下中平不偏逺近如一也並易傳橫渠先生曰失前禽謂三靣而驅意在緩逸之不務殺也順奔然後取之故被傷者少也以剛居中而顯明比道伐止有罪不為濫刑故邑人不誡為上用中此之謂也不比者不懲非用中也故比必顯之然殺不可務也一云上使中者付得其人也並易説龜山楊氏曰居得尊位其比宜顯矣故制畿封國以為屬連建牧立監以相糾因時問以通好賀慶以展親所以比諸侯也域民之制其詳至於屬婦同井而居同巷相從任之以九職繫之以九兩所以比其民也凡此皆顯比之道也盡斯道者其唯九五乎居中履正而上下應之比之正也故曰顯比王用三驅失前禽邑人不誡吉夫獸窮則搏常物之大情也故王田不合圍三靣而驅不窮物以盡取也先王比天下而安之非以求吾所大欲也故順則取之逆而去則舍之所失者前禽而已盡吾比道任彼而不致力焉用三驅之義也若湯之祝網是也窮民而盡取之乃召敵之道非所以比天下也孟子曰善戰者服上刑連諸侯者次之辟草萊任土地者次之為此而已夫如是故仕者願立於其朝耕者願耕於其野商賈願藏於其市行旅願出於其塗則邑人不誡而自至矣此比道之光也故曰邑所居之邑謂國中也易説兼山郭氏曰九五比坤下坎上坎水也坤土也土以水柔水以土流親比之故也洪範之敘曰五皇極皇建其有極其事則無偏無陂遵王之義無有作好遵王之道無有作惡遵王之路無偏無黨王道蕩蕩無黨無偏王道平平無反無側王道正直凡上之所以示下者如此也凡厥庶民無有淫朋人無有比德唯皇作極凡下之所以奉上者如此也方顯比建大中之道明法度之尊逆者不追順者不拒無恤於去來無間于小大邑人之不誡特為其微者言之至於自西自東自南自北蓋有無思而不中者矣可勝言哉易説白雲郭氏曰先人曰洪範五皇極曰無偏無陂遵王之義無有作好遵王之道無有作惡遵王之路無偏無黨王道蕩蕩無黨無偏王道平平無反無側王道正直凡上之所以示下者如此也凡厥庶民無有淫朋人無有比德唯皇作極凡下之所以從上者如此也方顯比建大中之道逆者不追順者不拒無恤於去來無間于小大邑人之不誡特為其微者言之至於自西自東自南自北蓋有無思而不中者矣可勝言哉雍曰九五之君非以力假仁者也蓋有大中至正之道以昭示天下天下自從而比之故曰顯比王田不合圍三面而驅故所失者前禽而已是猶上六之不我比也夫以大中至正之道昭示天下無容私焉是以逆則舍之順則取之故上言不寧方來後夫凶皆自來自後之辭非聖人有以強之也聖人以大中至正舍逆取順必無侵伐之虞邑人又何誡焉是則顯比之吉為天下之至公也求其所以然實建大中以致之耳故曰上使中也書曰民心罔中唯爾之中其使中之謂乎由是知商之三千周之八百亦舍逆取順而已或謂顯比之道狹不亦異乎易説上六比之無首凶象曰比之無首無所終也明道先生曰比之無首凶比之始不善則凶劉絢師訓伊川先生曰六居上比之終也首謂始也凡比之道其始善則其終善矣有其始而無其終者或有矣未有無其始而有終者也故比之無首至終則凶也此據比終而言然上六隂柔不中處險之極固非克終者也始比不以道隙於終者天下多矣比既無首何所終乎相比有首猶或終違始不以道終復何保故曰無所終也並易傳敬是持己恭是接人與人恭而有禮言接人當如此也近世淺薄以相歡狎為相與以無圭角為相親愛如此者安能久須是恭敬君臣朋友皆當以禮為主也比之上六曰比之無首凶象曰比之無首無所終也既無首安得有終故曰無所終比之道須當有首也劉元承手編龜山楊氏曰比之時隂宜從陽也而上六居一卦之上比之無首者也無首則無所從其凶不亦宜乎易説白雲郭氏曰上六非天下之所比又不能比人為臣而無君與無元首何異哉是以凶而無所終也三有匪人之傷上有無首之凶皆逆比之道聖人捨之者也四也初也其知幾乎故能非其應而獲吉以是知比者必求大中至正而比之斯無不吉易説大易粹言卷八
