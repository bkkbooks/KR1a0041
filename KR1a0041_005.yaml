body:
  text: 大易粹言卷五宋方聞一編乾下坎上伊川先生曰需序卦蒙者蒙也物之稚也物稚不可不養也故受之以需需者飲食之道也夫物之幼稚必待養而成養物之所需者飲食也故曰需者飲食之道也雲上於天有蒸潤之象飲食所以潤益於物故需為飲食之道所以次蒙也卦之大意須待之義序卦取所須之大者耳乾健之性必進者也乃處坎險之下險為之阻故須待而後進也易傳兼山郭氏曰序卦云需者飲食之道也文武以天保以上治內采薇以下治外始於憂勤終於逸樂如此而已至於蓼蕭廢則恩澤乖湛露廢則萬國離故需之為需豈曰小補之哉易説需有孚光亨貞吉利涉大川伊川先生曰需者須待也以二體言之乾之剛健上進而遇險未能進也故為需待之義以卦才言之五居君位為需之主有剛健中正之德而誠信充實於中中實有孚也有孚則光明而能亨通得貞而吉也以此而需何所不濟雖險無難矣故利涉大川也凡貞吉有既正且吉者有得正則吉者當辨也易傳橫渠先生曰剛健而不陷而能俟時故有孚於光亨也訟需坎皆言有孚必然之理也又如未濟飲酒濡首亦言有孚義同此易説白雲郭氏曰天地之大尚不能無所需以生萬物況人道乎有孚者充實之美也光亨者輝光之大也有是德衆之所需也需之亦以成是德也貞則吉需之道也利涉大川乾之健也易説彖曰需須也險在前也剛健而不陷其義不困窮矣需有孚光亨貞吉位乎天位以正中也利涉大川往有功也伊川先生曰需之義須也以險在於前未可遽進故需待而行也以乾之剛健而能需待不輕動故不陷於險其義不至於困窮也剛健之人其動必躁乃能需待而動處之至善者也故夫子贊之云其義不困窮矣五以剛實居中為孚之象而得其所需亦為有孚之義以乾剛而至誠故其德光明而能亨通得貞而吉也所以能然者以居天位而得正中也居天位指五以正中兼二言故云正中既有孚而正雖涉險阻往則有功也需道之至善也以乾剛而能需何所不利並易傳龜山楊氏曰五以剛正中履尊位而不疚故有孚光亨貞吉有孚剛中也光亨大亨也充實而有光輝之謂大則光斯大矣不曰大亨者以其有險而剛不掩焉故曰光亨也夫剛健而上行乾道也險在前而不進有需之義焉故曰需須也時行則行時止則止而動與時偕天行也故險雖在前而不能陷其義不困窮矣以剛健之才需而後動則往無不濟矣故利涉大川易説白雲郭氏曰以卦言之乾猶需於五以爻言之五猶需於物故曰需須也以乾之剛健其遇險也止於不險不困窮而已則險之為義大矣能無需乎有其德以待天下之需者九五也故言位乎天位以正中為需之主宜矣易説象曰雲上於天需君子以飲食宴樂伊川先生曰雲氣蒸而上升於天必待隂陽和洽然後成雨雲方上於天未成雨也故為須待之義隂陽之氣交感而未成雨澤猶君子蓄其才德而未施於用也君子觀雲上於天需而為雨之象懷其道德安以待時飲食以養其氣體宴樂以和一作養其心志所謂居易以俟命也易傳橫渠先生曰雲上於天需君子以飲食宴樂九五需于酒食貞吉未濟亦有孚于飲酒以隂在前無所施為唯需於飲食而已易説廣平遊氏曰雲上於天則澤將下流天下之所徯望也故有需之象飲食人之大欲存焉而人非飲食不生則天下之所需莫急於飲食故需飲食之象而位乎天位以應天下之求亦曰需于酒食而已然幅貟之衆烏得人人而飲食之哉亦曰養賢以及萬民而已故君子飲食燕樂者大亨以養聖賢使忠臣嘉賔得盡其心焉耳忠臣嘉賔盡其心則小民不失職而人人厭其所欲矣九五之所需孰大於此易説白雲郭氏曰先人曰文武以天保以上治內采薇以下治外而始於燕羣臣嘉賔者需之道也雍曰序卦曰需者飲食之道也飲食朝夕之需也人無飢渴之害則飲食無需也屯蒙之後天下之所需者在君而君之所需者在賢雲上於天欲雨之象萬物之所需也飲食宴樂所以養賢膏澤將以及民亦天下之需也易説初九需于郊利用恆無咎象曰需于郊不犯難行也利用恆無咎未失常也伊川先生曰需者以遇險故需而後進初最逺於險故為需于郊郊曠逺之地也處於曠逺利在安守其常則無咎也不能安常則躁動犯難豈能需於逺而無過也處曠逺者不犯冒險難而行也陽之為物剛健上進者也初能需待於曠逺之地不犯險難而進復宜安處不失其常則可以無咎矣雖不進而志動者不能安其常也君子之需時也安靜自守志雖有須而恬然若將終身焉乃能用常也並易傳龜山楊氏曰乾道以上行為常方需之時險在前宜需而後進雖久於其所未為失常也易説白雲郭氏曰以乾之剛猶有畏難之義則險其可犯哉初九逺於難者也故言于郊于郊不犯難矣勿以逺而妄動乃盡畏難之義是以利用恆無咎可需則需不可需則勿需也可應則應不可應則不應也此需時用常之道易説九二需于沙小有言終吉象曰需于沙衍在中也雖小有言以吉終也伊川先生曰坎為水水近則有沙二去險漸近故為需于沙漸近於險難雖未至於患害己小有言矣凡患難之辭大小有殊小者至於有言言語之傷至小者也二以剛陽之才而居柔守中寬裕自處需之善也雖去險漸近而未至於險故小有言語之傷而無大害終得其吉也衍寬綽也二雖近險而以寬裕居中故雖小有言語及之終得其吉善處者也並易傳龜山楊氏曰沙近水而不溺於水以其衍在其中而不迫於險也其犯難淺矣故小有言終吉易説白雲郭氏曰沙近水近難也近之必不能無難故小有言剛明之才居柔守中小言之傷不為大損是以終吉欲無小言之愆則逺于郊而用常可也二雖不能逺于郊而以寬裕居中是雖有言而吉終也叔孫武叔毁仲尼子貢曰其何傷於日月乎終吉之謂也易説九三需于泥致寇至象曰需于泥災在外也自我致寇敬慎不敗也伊川先生曰泥逼於水也既進逼於險當致寇難之至也三剛而不中又居健體之上有進動之象故致寇也苟非敬慎則致喪敗矣三切逼上體之險難故云災在外也災患難之通稱對眚而言則分也三之致寇由已進而逼之故云自我寇自己致若能敬慎量宜而進則無喪敗也需之時須而後進也其義在相時而動非戒其不得進也直使敬慎毋失其宜耳並易傳龜山楊氏曰需而迫於險則致寇自我矣然乾健之極非險之所能陷故敬慎則不敗需而後動能敬慎者也若夫行險以徼幸雖有剛健之才能不敗者鮮矣易説兼山郭氏曰九三坎為險九三迫之災在外也于郊于沙于泥逺邇之象也剛健上行故曰自我致寇也易説白雲郭氏曰于泥則有難矣不能于郊而于沙不能于沙而于泥則于泥之寇自我致之也災自外來也敬慎而不敗者君子責己反身之道也躬自厚而薄責於人則逺怨矣何敗之有是以君子居易以俟命敬慎也小人行險以徼幸鮮不敗矣然君子雖因接物而有敬而敬當在物先故坤之直內言存於物先也需之九三上六見於用以接物而已易説六四需于血出自穴象曰需于血順以聼也伊川先生曰四以隂柔之質處於險而下當三陽之進傷於險難者也故云需于血既傷於險難則不能安處必失其居故云出自穴穴物之所安也順以從時不競於險難所以不至於凶也以柔居隂非能競者也若陽居之則必凶矣蓋無中正之德徒以剛競於險適足以致凶也四以隂柔居於險難之中不能固處故退出自穴蓋隂柔一作柔弱不能與時競不能處則退是順從以聼於時所以不至於凶也並易傳橫渠先生曰以柔居隂不能禦強來則聼順而辟其路易説龜山楊氏曰乾健上行非險之所能陷而四以隂柔在前故需于血出自穴血隂傷也出自穴不安其所也隂雖不安其所而能以聼則雖傷而不至於凶矣六四以柔居隂能順以聼者也易説白雲郭氏曰以隂柔之質處衆剛之上不能違而避之反出自穴是自求禍也故需于血然應於初九自上應下能順以退聼故雖傷而無凶易説九五需于酒食貞吉象曰酒食貞吉以中正也伊川先生曰五以陽剛居中得正位乎天位克盡其道矣以此而需何需不獲故宴安酒食以俟之所須必得也既得貞正所需必遂可謂吉矣需于酒食而貞且吉者以五得中正而盡其道也並易傳龜山楊氏曰需而至於位天位則險難既平無所事矣故需于酒食而已若既醉之詩是也然需于酒食而不以正則是自溺於荒腆耳能無凶乎故正乃吉易説兼山郭氏曰九五既醉以酒既飽以德人有士君子之行詩之所謂太平需之所謂貞吉者也易説白雲郭氏曰先人曰既醉以酒既飽以德人有士君子之行詩之所謂太平需之所謂貞吉也雍曰飲食非自養也養賢而已養賢以及萬民所以應天下之需也鹿鳴之君蓋得需于酒食之道天保之福所謂貞吉也易説上六入于穴有不速之客三人來敬之終吉象曰不速之客來敬之終吉雖不當位未大失也伊川先生曰需以險在前需時而後進上六居險之終終則變矣在需之極久而得矣隂止於六乃安其處故為入于穴穴所安也安而既止後者必至不速之客三人謂下之三陽乾之三陽非在下之物需時而進者也需既極矣故皆上進不速不促之而自來也上六既需得其安處羣剛之來苟不起忌疾忿競之心至誠盡敬以待之雖甚剛暴豈有侵陵之理故終吉也或疑以隂居三陽之上得為安乎曰三陽乾體志在上進六隂位非所止之正故無爭奪之意敬之則吉也不當位謂以隂而在上也爻以六居隂為所安象復盡其義明隂宜在下而居上為不當位也然能敬順以自處則陽不能陵終得其吉雖不當位而未至於大失也並易傳橫渠先生曰上無所出故降入自穴恭以納之雖處極上不至於失易説龜山楊氏曰隂宜下而在上不當位也以柔順居之而不為險難雖不當位未大失也當需之終處一卦之外逺於陽也與四異矣故入于穴穴隂所安也三陽需而進不速之客也陽方上行知敬而不為險難其吉宜矣若夫需道之終猶欲懷險以為難亦君子之所不容也能無凶乎易説兼山郭氏曰上六不當有事之地猶有需焉至於三陽彚征不能退聽以違之是以入于穴也敬之終吉未大失而已乃若鴻飛冥𡨕弋人何慕焉上六坎也故其道如此易説白雲郭氏曰先人曰上六不當有事之地至於三陽彚征不能退聼以違之雖敬之終吉未大失而已乃若鴻飛𡨕冥弋人何慕焉上六坎也故不足以進此雍曰上六據非其位不能退聼徒知入于穴以避焉僅免夫需血自傷而已故曰未大失也天道上行理之常來而敬之終無凶也夫需之時天下如飢之需食渴之需飲也故于郊于沙于泥出入于穴獨五安然是為需之主然水行需舟陸行需車莫非需也卦特言其大者耳易説大易粹言卷五
