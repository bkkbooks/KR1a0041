body:
  text: 大易粹言卷五十八宋方聞一編兊下兊上伊川先生曰兊序卦巽者入也入而後説之故受之以兊兊者説也物相入則相説相説則相入兊所以次巽也易傳兊亨利貞伊川先生曰兊説也説致亨之道也能説於物物莫不説而與之足以致亨然為説之道利於貞正非道求説則為邪諂而有悔咎一作吝故戒利貞也易傳白雲郭氏曰兊之為説非有意於説人亦非有意於求説天下有説之道在上者不違是道以臨人在下者得其志而自説耳使有心於其間非兊也兊之所以亨者此也何以説之道即王道是也然使有心於其間則為常人私欲之情非天下之公説是以利貞唯貞則尤私矣故兊因貞而利也易説彖曰兊説也剛中而柔外説以利貞是以順乎天而應乎人説以先民民忘其勞説以犯難民忘其死説之大民勸矣哉伊川先生曰兊之義説也一隂居二陽之上隂説於陽而為陽所説也陽剛居中中心誠實之象柔爻在外接物和柔之象故為説而能貞也利貞説之道宜正一作貞也卦有剛中之德能貞者也説而能貞是以上順天理下應人心説道之至正至善者也若夫違道以干百姓之譽者苟説之道違道不順天干譽非應人苟取一時之説耳非君子之正道君子之道其説于民如天地之施感於其心而説服無斁故以之先民則民心説隨而忘其勞率之以犯難則民心一無心字説服於義而不恤其死説道之大民莫不知勸勸謂信之而勉力順從人君一作君人之道以人心説服為本故聖人贊其大易傳白雲郭氏曰兊之為象剛居中而柔在外剛居中則無私柔在外則足以説物無私則貞足以説物則亨此兊之所以亨利貞也順乎天而應乎人者兊説有道得其道則能順天而應人以盡天下之大公失其道則不能順乎天而溺於私心是亦不能應人之望也昔湯之征也東靣而征西夷怨南靣而征北狄怨曰奚為後我此得兊説之道者也武王自西自東自南自北無思不服此亦得兊説之道者也所謂順乎天而應乎人者若湯武是已孟子論以德服人者中心恱而誠服也中心説而誠服兊之道也是能應乎人者也能應乎人則應天矣其應人也非寒而衣之飢而食之又非有矜憐撫奄之言使之聞之也聖人唯知道耳故聖人知道而不知説天下知説而不知道道行有必致之説初非有期於民者也説以先民民忘其勞説以犯難民忘其死非聖人固如是以説人也在道論之則非民情之説聖人有所不敢為必説在事為之先則民可忘勞説任患難之先則民可忘死民或未説而一覬其忘勞忘死雖聖人不能也是以聖人平居無事之日使民飽食暖衣養生送死無憾所謂説以先之也故文王事紂非不能説民也武王卒伐功非能説民也順天應人之道聖人不得私焉昧者徇私情故勞而日拙聖人明公道故逸而日休天下可以處之無事矣説道之大有至於此是以視民之自勸皆可見説之大也孟子嘗謂齊宣王曰取之而燕民恱則取之取之而燕民不恱則勿取若孟子者所謂知説之先民者歟易説象曰麗澤兊君子以朋友講習伊川先生曰麗澤二澤相附麗也兩澤相麗交相浸潤互有滋益之象故君子觀其象而以朋友講習朋友講習互相益也先儒謂天下之可説莫若朋友講習朋友講習固可説之大者然當明相益之象易傳天下之説不可極唯朋友講習雖過恱無害兊澤有相滋益處一本注云兊澤有自相滋益之竟語録白雲郭氏曰麗者附著相連之意亦見上下之説誠意交而連結也説之大有見於順天應人而其微有見於朋友講習蓋順天應人之説與朋友講習之説大小不同其情一也孔子曰學而時習之不亦説乎有朋自逺方來不亦樂乎此朋友講習所以為説也况天下大説又有在於朋友講習之間乎易説初九和兊吉象曰和兊之吉行未疑也伊川先生曰初雖陽爻居説體而在最下無所係應是能卑下和順以為説而無所偏私者也以和為説而無所偏一無偏字私説之正也陽剛則不卑居下則能巽處説則能和無應則不偏處説如是所以吉也有求而和則涉於邪諂初隨時順處一作處順心無所係無所為也以和而已是以吉也象又以其處説在下而非中正故云行未疑也其行未有可疑謂未見其有失也若得中正則無是言也説以中正為本爻直陳其義象則推而盡之並傳橫渠先生曰以陽居下無所比附出門同人行自信者也易説白雲郭氏曰初九固非知道者之事而知兊説在和其去道不逺矣是以得兊之吉也夫知和為説不和為非説則上不諂媚以從人而下無私情示人之失是則用和為貴何為疑乎疑者上不知説之在道次不知説之在和既惑於説與不説之際是以其行不能無疑也吉亦無自而至矣易説九二孚兊吉悔亡象曰孚兊之吉信志也伊川先生曰二承比隂柔隂柔小人也説之則當有悔二剛中之德孚信內充雖比小人自守不失君子和而不同説而不失剛中故吉而悔亡非二之剛中則有悔矣以自守而亡也心之所存為志二剛實居中孚信存於中也志存誠信豈至説小人而自失乎是以吉也並易傳橫渠先生曰私係於近悔也誠於接物信而不妄吉且悔亡易説白雲郭氏曰九二有剛中之德蓋賢者之能自治者也故知兊之在我不在於天下不求説於天下而孚兊之道自信其志彼天下之説有不期而自至者矣是以吉而悔亡也使有心求説於天下而不知信其在我者則徇外忘內物我兩失之剛中之賢固如是乎有賢如此未有事君為容恱者也昔成湯克寬克仁彰信兆民蓋信在我而信之者在人雖君臣之道不同其與九二孚兊信志之理一也易説六三來兊凶象曰來兊之凶位不當也伊川先生曰六三隂柔不中正之人説不以道者也來兊就之以求説也比於在下之陽枉已非道就以求説所以凶也之內為來上下俱陽而獨之內者以同體而隂性一作性隂下也失道下行也自處不中正無與而妄求説所以凶也並易傳白雲郭氏曰來兊求説也説自有道其可求乎失道求説是以凶也九四商兊未寧介疾有喜象曰九四之喜有慶也伊川先生曰四上承中正之五而下比秉邪之三雖剛陽而處非正三隂柔陽所説也故不能決而商度未寧謂擬議所從而未決未能有定也兩間謂之介分限也地之界則加田義乃同也故人有節守謂之介若介然守正而疾逺邪惡則有喜也從五正也説三邪也四近君之位若剛介守正疾逺邪惡將得君以行道福慶及物為有喜也苦四者得失未有定繫所從耳所謂喜者若守正而己説之則得行其剛陽之道而福慶及物也並易傳橫渠先生曰通其邪佞使進而上則小人道長而不寧以諂為疾而拒外之則終不失其得偶之慶也易説白雲郭氏曰當允之時處上下之際不妄從説而擬議不遑是知所擇者也為臣如此賢矣哉故曰終有介疾之喜也介然自守外患不能入故能全兊説之喜喜非獨一身而已終亦有及物之慶也昔伊尹五就湯五就桀湯三使往聘之然後幡然而改所謂商兊未寧者如此至於亨天心革夏正所謂有喜有慶也且隂者陽所説也舍所説而比五故為商兊之義然兊之象剛中柔外其象上行九四捨三而比五上行也至於九五比上失在小人蓋亦上行之象雖其性均本乎象而得失之異則係乎爻伊川曰兩間謂之介介分限也故人之守節者謂之介易説九五孚于剝有厲象曰孚于剝位正當也伊川先生曰九五居尊位而處中正盡説道之善矣而聖人復設有厲之戒蓋堯舜之盛未嘗不戒也戒所當戒而已雖聖賢在上天下未嘗無小人然不敢肆其惡也聖人亦説其能勉而革靣也彼小人者未嘗不知聖賢之可説也如四凶處堯朝隱惡而順命是也聖人非不知其終惡也取其畏罪而強仁耳五若誠心信小人之假善為實善而不知其包藏則危道也小人者備之不至則害於善聖人為戒之意深矣剝者消陽之名隂消陽者也蓋指上六故孚于剝則危也以五在説之時而密比於上六故為之戒雖舜之聖猶畏巧言令色安得不戒也説之惑人易入而可懼也如此戒孚于剝者以五所處之位正當戒也密比隂柔有相説之道故戒在信之也並易傳橫渠先生曰説六三之進則是孚于剝近危之道也故處乎盛位者佞不可親也當正位而進小人信乎剝之道也易説白雲郭氏曰當兊之時居九五中正之位宜其天下心説誠服而有此厲何哉蓋兊之象上行不知擇賢而比之反上親容悅小人之徒是以危也夫既得其位又得其時不能孚兊之道而上比小人故孔子惜其得位而失道則曰孚于剝位正當也剝者小人之事安足與語説之大乎古之人君或以小人之術自任雖苟一時之譽終不能究大人之造者孚于剝之謂也孟子曰舍其梧檟飬其樲棘則為賤埸師焉惜乎九五之未進此道也易説上六引兊象曰上六引兊未光也伊川先生曰它卦至極則變兊為説極則愈説上六成説之主居説之極説不知己者也故説既極矣又引而長之然而不至悔咎何也曰方言其説不知己未見其所説善惡也又下乘九五之中正無所施其邪説六三則承乘皆非正是以有凶説既極矣又引而長之雖説之之心不已而事理已過實無所説事之盛則有光輝既極而強引之長其無意味甚矣豈有光也未非必之辭象中多用非必能有光輝謂不能光也並易傳橫渠先生曰與三為類而引升之雖不傷類然未足多也易説白雲郭氏曰説有引之而説者從人也隂柔不足以有為引之則從人而説蓋上六不當有事之象無毁無譽特不能光大而已於道固無得而亦未至於失已故吉凶悔吝無得而言焉易傳大易粹言卷五十八
