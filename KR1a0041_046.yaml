body:
  text: 大易粹言卷四十六宋方聞一編巽下坤上伊川先生曰升序卦萃者聚也聚而上者謂之升故受之以升物之積聚而益髙大聚而上也故為升所以次於萃也為卦坤上巽下木在地下為地中生木木生地中長而益髙為升之象也易傳升元亨用見大人勿恤南征吉伊川先生曰升者進而上也升進一作進升則有亨義而以卦才之善故元亨也用此道以見大人不假憂恤前進則吉也南征前進也易傳横渠先生曰乾之九二利見大人而以時之止升之九二有六五配合之慶故可見大人之徳南征而勿恤也易說白雲郭氏曰天地萬物皆有升在人則位之升謂之升徳之升亦升也升位則足以行道升徳則足以進道是以元亨之理在焉升位而見大人故无附麗小人之失升徳而見大人則日入於君子之塗故用見大人可以无憂而有慶也南為明方陽之位也君之所也君子之類也故南征无不吉也唯見大人故可勿恤勿恤則害己者去而无憂矣故可至南征南征斯无不吉蓋升之有序如此易說彖曰柔以時升巽而順剛中而應是以大亨用見大人勿恤徃有慶也南征吉志行也伊川先生曰以二體言柔升謂坤上行也巽既體卑而就下坤乃順時而上升以時也謂時當升也柔既上而成升則下巽而上順以巽順之道升可謂時矣二以剛中之道應於五五以中順之徳應於二能巽而順其升以時是以元亨也彖文誤作大亨解在大有卦凡升之道必由大人升於位則由王公升於道則由聖賢用巽順剛中之道以見大人必遂其升勿恤不憂其不遂也遂其升則已之一作有福慶而福慶及物也南人之所向南征謂前進也前進則遂其升而得行其志是以吉也並易傳白雲郭氏曰柔道不升則沉潜无以自達其徳與位日入於卑汙陷溺之域故書謂沉潜剛克者亦柔以時升之義也升以坤巽成卦二隂相附其體難升故必須時而後可升焉巽有入之道坤有順之義二五剛中而應故可升而大亨也用見大人勿恤者見大人則在己者无憂在己无憂則害己者去矣位日可進徳日可成故為有慶之漸慶者澤加於民天下之慶也然則南征則志无不行明矣易說象曰地中生木升君子以順徳積小以髙大伊川先生曰木生地中長而上升為升之象君子觀升之象以順脩其徳積累微小以至髙大也順則可進逆乃退也萬物之進長皆以順道也善不積不足以成名學業之充實道徳之崇髙皆由積累而至積小所以成髙大升之義也易傳白雲郭氏曰萬物之升其象則皆如地中生木也自毫末以至合抱人莫見其升之之迹者以順積而致之耳順則不逆於徳積則為之有漸故能升而不已以極髙大不然則逆徳暴行未能升而困及之矣易說初六允升大吉象曰允升大吉上合志也伊川先生曰初以柔居巽體之下又巽之主上承於九二之剛巽之至者也二以剛中之徳上應於君當升之任者也允者信從也初之柔巽唯信從於二信二而從之同升乃大吉也二以徳言則剛中以力言則當任初之隂柔又无應援不能自升從於剛中之賢以進是由剛中之道也吉孰大焉與在上者合志同升也上謂九二從二而升乃與二同志也能信從剛中之賢一作道所以大吉並易傳横渠先生曰允信也自信於己與上合志而升易說白雲郭氏曰初六居衆爻之下沉滯而難升者能自信之篤確然不移終自㧞於沉滯之中故言允升而致大吉也上合志者二三之陽其升為易初六能上合九二九三之志與之同體而升所謂用見大人勿恤者也故无沉滯難升之害焉易說九二孚乃利用禴无咎象曰九二之孚有喜也伊川先生曰二陽剛而在下五隂柔而居上夫以剛而事柔以陽而從隂雖有時而然非順道也以暗而臨明以剛而事弱若黽勉於事勢非誠服也上下之交不以誠其可以一无以字久乎其可以有為乎五雖隂柔然居尊位二雖剛陽事上者也當内存至誠不假文飾於外誠積於中則自不事外飾故曰利用禴謂尚誠敬也自古剛强之臣事柔弱之君未有不為矯飾者也禴祭之簡質者也云孚乃謂既孚乃宜不用文飾專以其誠感通於上也如是則得无咎以剛强之臣而事柔弱之君又當升之時非誠意相交其能免於咎乎二能以孚誠事上則不唯為臣之道无咎而已可以行剛中之道澤及天下是有喜也凡象言有慶者如是則有福慶及於物也言有喜者事既善而又一无又字有可一无可字喜也如大畜童牛之梏元吉象云有喜蓋梏於童則易又免强制之難是有可喜也並易傳横渠先生曰與萃六二同易說白雲郭氏曰書曰沉潜剛克故升之道亦以剛中而應而後大亨九二是也九二能以誠信之道孚于上下其進而有喜不亦宜乎必曰利用禴者事天地鬼神與事君一道也禴祭簡薄惟以誠為主苟有誠信雖天地鬼神无嫌於簡薄況人道乎是以无咎易說九三升虚邑象曰升虚邑无所疑也伊川先生曰三以陽剛之才正而且巽上皆順之復有援應一作者以是而升如入无人之邑孰禦哉无人之邑其進无疑阻也並易傳横渠先生曰上皆隂柔徃无所疑易說白雲郭氏曰自下而升至於三其來不可禦也況有剛陽之才足以自致乎是以如升无人之虚邑其行无所疑矣易說六四王用亨于岐山吉无咎象曰王用亨于岐山順事也伊川先生曰四柔順之才上順君之升下順下之進已則止其所焉以隂居柔隂而在下止其所也昔者文王之居岐山之下上順天子而欲致之有道下順天下之賢而使之升進已則柔順謙恭不出其位至徳如此周之王業用是而亨也四能如是則亨而吉且无咎矣四之才固自善矣復有无咎之辭何也曰四之才雖善而其位當戒也居近君之位在升之時不可復升升則凶咎可知故云如文王則吉而无咎也然處大臣之位不得无事於升當上升其君之道下升天下之賢已則止其分焉分雖當止而徳則當升也道則當亨也盡斯道者其唯文王乎四居近君之位而當升時得吉而无咎者以其有順徳也以柔居坤順之至也文王之亨于岐山亦以須時順事而已上順於上下順乎下已順處其義故云順事也並易傳白雲郭氏曰孟子言太王邑于岐山之下居焉又曰昔者文王之治岐也則岐山為太王文王之所治也太王文王其道皆亨是以吉且无咎然所以亨者无它順事而已觀其狄人侵則事之欲土地則去之又曰不以其所以養人者害人此太王之順也故邠人從之如歸市而肇基王迹所謂亨吉而无咎矣文王三分天下有其二以服事商文王之順也故二老來歸而天下歸之光于四方顯于西土所謂亨吉而无咎矣謂之順事不亦宜乎升之道以順積為主獨六四得之易說六五貞吉升階象曰貞吉升階大得志也伊川先生曰五以下有剛中之應故能居尊位而吉然質本隂柔必守貞固乃得其吉也若不能貞固則信賢不篤任賢不終安能吉也階所由而升也任剛中之賢輔之而升猶登進自階言有由而易也指言九二正應然在下之賢皆用升之階也能用賢則彚升矣倚任賢才而能貞固如是而升可以致天下之大治其志可大得也君道之升一作興患无賢才之助爾有助則由自階而升也並易傳横渠先生曰柔中極尊不拒來者使物皆階己而升正而且吉志宜大獲也易所謂得志者聖賢獲其願欲得臣无家堯之志也貞吉升階舜之志也易說白雲郭氏曰升之道在上為易在下為難在上以順而可升在下必有剛徳而後可升焉故六五之升獨无所事以貞自守不失其吉如歴而升有進无退況九二以剛中而應之其大得志宜矣易說上六㝠升利于不息之貞象曰冥升在上消不富也伊川先生曰六以隂居升之極昏冥於升知進而不知止者也其為不明甚矣然求升不已之心有時而用於貞正而當不息之事則為宜矣君子於貞正之徳終日乾乾自强不息如一作以上六不已之心用之於此則利也以小人貪求无已之心移於進徳則何善如之昏冥於升極上而不知己唯有消亡豈復有加益也不富无復增益也升既極退而无進也並易傳白雲郭氏曰在下升之難故初六必合剛陽之志而後可升在上升之易故上六有冥升不知止之辭焉利于不息之貞者冥升於禄位則失知止之戒苟能自强不息以進於道其為利貞孰大於是消不富者冥升不已則極於升而困矣困則消至焉是以不富蓋冥升不已為消之漸而在消息之理息則富而消則不富故也易於坤體多言不富者隂道常乏也泰之六四謙之六五皆是也易說大易粹言卷四十六
