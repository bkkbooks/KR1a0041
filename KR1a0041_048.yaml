body:
  text: 大易粹言卷四十八宋方聞一編巽下坎上伊川先生曰井序卦困乎上者必反下故受之以井承上升而不已必困為言謂上升不已而困則必反于下也物之在下者莫如井井所以次困也為卦坎上巽下坎水也巽之象則木也巽之義則入也木器之象木入于水下而上乎水汲井之象也易傳井改邑不改井無喪無得往來井井汔至亦未繘井羸其瓶凶伊川先生曰井之為物常而不可改也邑可改而之它井不可遷也故曰改邑不改井汲之而不竭存之而不盈無喪無得也至者皆得其用往來井井也無喪無得其德也常往來井井其用也周常也周也井之道也汔幾也繘綆也井以濟用為功幾至而未及用亦與未下繘于井同也君子之道貴乎有成所以五榖不熟不如荑稗掘井九軔而不及泉猶為棄井有濟物之用而未及物猶無有也羸敗其瓶而失之其用喪矣是以凶也羸毁敗也並易傳白雲郭氏曰井之為物水在下下也今坎水居上而為井者水在下則未用在上則出而有功乃能盡井之義故卦辭合德與用言之改邑不改井無喪無得往來井井皆井之德也汔至亦未繘井羸其瓶凶言井之用也井言其凶者以見雖有得而不及用非井也中庸曰天命之謂性率性之謂道修道之謂教又曰能盡其性則能盡人之性又曰誠者非自成已而已也所以成物也故中庸之言皆終于用盡井之義則中庸之道得矣然卦辭不言其功獨言其凶者蓋深以不克終其功為戒也能終其功則吉可知亦猶中庸言人皆曰豫知擇乎中庸而不能期月守之謂也井字本井取韓之象而井田又取井字之象故卦名非井田之義改邑不改井者邑有變而井無變故也取之不能竭勿取不能盈故無喪無得往者謂已應而往者也來者謂方來而應之者也往者以此來者以此雖應物無窮而其德未嘗改也幾至未盡綆而羸其瓶與無井德者何以異是以凶也能克終其用則無凶矣孟子曰掘井九軔而不及泉猶為棄井也此論適與井之義同是以聖人貴夫有用而中庸之德為至焉易説彖曰巽乎水而上水井井飬而不窮也改邑不改井乃以剛中也汔至亦未繘井未有功也羸其瓶是以凶也伊川先生曰巽入于水下而上其水者井也井之飬于物不有窮己一作無有窮也取之而不竭德有常也邑可改井不可遷亦其德之常也二五之爻剛中之德其常乃如是卦之才與義合也雖使幾至既未為用亦與未繘井同井以濟用為功水出乃為用未出則何功也瓶所以上水而致用也羸敗其瓶則不為用矣是以凶也並易傳白雲郭氏曰順入水性而能上水是之謂井蓋井以靜為德以動為功動而出故能致飬于無窮不能動出特止水而已非井之義也由是言之則井之道其猶人之性乎人性本靜及其盡之也又足以盡人盡物而至於參天地贊化育井之德亦本靜及其出而應物則致飬而不窮故中庸自天命之性至修道之教而後其道終井自其德以及于有用而其道亦終焉改邑不改井剛之德也汔至亦未繘井未有致飬之功功用未成而羸其瓶非凶而何不言無喪無得往來井井者蓋皆係乎剛中之德聖人舉一以明之耳易説象曰木上有水井君子以勞民勸相伊川先生曰木承水而上之一作來乃器汲水而出井之象君子觀井之象法井之德以勞徠其民而勸勉以相助之道也勞徠其民法井之用也勸民使相助法井之施也易傳橫渠先生曰飬而不窮莫若勞民而勸相也易説白雲郭氏曰飢渴之害甚矣人能無飢渴之害者井飬之功也民之勞苦亦甚矣使民忘其勞而服田力穡者君子勞民勸相之道也勞民勸相之道無它焉盡其性以安之而已因其性以利導之而已皆所以致飬也故勞民勸相可以配井之功用則井之功用博矣易説初六井泥不食舊井無禽象曰井泥不食下也舊井無禽時舍也伊川先生曰井與鼎皆物也就物以為義六以隂柔居下上無應援無上水之象不能濟物乃井之不可食也井之不可一無可字食以泥汚也在井之下有泥之象井之用以其水之飬人也無水則舍置不用矣井水之上人獲其用禽鳥亦就而求焉舊廢之井人既不食水不復上則禽鳥亦不復往矣蓋無以濟物也井本濟人之物六以隂居下無上水之象故為不食井之不食以泥也猶人當濟物之時而才弱無援不能及物為時所舍也以隂而居井之下泥之象也無水而泥人所不食也人不食則水不上無以及禽鳥禽鳥亦不至矣見其不能濟物為時所舍置不用也若能及禽鳥是亦有所濟也舍上聲與乾之時舍音不同並易傳白雲郭氏曰井泥在下之物也井以潔而食泥則汙穢不食矣舊井旡禽汙穢也禽尚不至況人乎初六知守下而不知動出之功故為時舍也亦猶人之一性不能自修偽惡日生則性失矣安能有及物之功乎易説九二井谷射鮒甕敝漏象曰井谷射鮒無與也伊川先生曰二雖剛陽之才而居下上旡應而比于初不上而下之象也井之道上行者也澗谷之水則旁出而就下二居井而就下失井之道乃井而如谷也井上出則飬人而濟物一作上出而飬人濟物今乃下就汚泥注于鮒而已鮒或以為蝦或以為蟇井泥中微物耳射注也如谷之下流注于鮒也甕敝漏如甕之破漏也陽剛之才本可以飬人濟物而上無應援故不能上而就下是以無濟用之功如水之在甕本可為用乃破敝而漏之不為用也井之初二無功而不言悔咎何也曰失則有悔過則為咎無應援而不能成用非悔咎也居二比初豈非過乎曰處中非過也不能上由無援非以比初也井以上出為功二陽剛之才本可濟用以在下而上旡應援是以下比而射鮒若上有與之者則當汲引而上成井之功矣並易傳廣平遊氏曰井道以髙潔為體以上出為功故初為井泥二為井谷射鮒蓋其自處汙下而功用熄矣然九二既得中而有趨下之汙何也蓋所居不正則用心不剛又巽體也而上旡應故甘心於趨下而不自振其德之地不足稱也易説白雲郭氏曰巽之性順而入不能自舉以趨有用之地故九二亦失井之道而莫見其功也井以上出為功不能動而上反如谷水旁流足以射鮒不足以飬人其德既非美矣語其用則甕且敝漏雖有動出之名而無上水之實是以為衆所不與也敝漏近于羸瓶無與近于時舍若是者安知有用之大乎許慎云甕汲瓶也易説九三井泄不食為我心惻可用汲王明並受其福象曰井泄不食行惻也求王明受福也伊川先生曰三以陽剛居得其正是有濟用之才者也在井下之上水之清潔可食者也井以上為用居下未得其用也陽之性上又志應上六處剛而過中汲汲于上進乃有才用而切于施為未得其用則如井之泄治清潔而不見食為其心之惻怛也三居井之時剛而不中故切于施為異乎用之則行捨之則藏者也然明王用人豈求備也故王明則受福矣三之才足以濟用如井之清潔可用汲而食也若上有明王則當用之而得其效賢才見用則已得行其道君得享其功下得被其澤上下並受其福也井泄治而不見食乃人有才知而不見用以不得行為憂惻也既以不得行為惻則豈免有求也故求王明而受福志切于行也並易傳橫渠先生曰井以既出為功井道之成在于上六三其正應而又以陽居陽充滿可汲為五所間功不上施故為我心惻然若上六明于照物則上下逺邇皆獲其利井泄不食強施行惻然且不售作易者之歎歟易説白雲郭氏曰知井以上出為用而能自治以待用者九三是也泄治之而不食則不見知者衆也不見知者衆故有知之者為我心惻也心惻傷之也傷其可用汲而不食也猶之修德之士不見用者王不知之也王不知之王之不明也王明則達而兼善天下而天下受其福矣象言井泄不食行惻也又言泄治而不見用其行可傷惻也爻言王明而象言求王明者君子難進易退蓋求明王而事之也故古之人有非其君不事者所以求王明也欲見爻言王明為九三之未遇故曰求王明也易説六四井甃旡咎象曰井甃無咎修井也伊川先生曰四雖隂柔而處正上承九五之君才不足以廣施利物亦可自守者也故能修治則得無咎甃砌纍也謂修治也四雖才弱不能廣濟物之功修治其事不至于廢可也若不能修治廢其飬人之功則失井之道其咎大矣居髙位而得剛陽中正之君但能處正承上不廢其事亦可以免咎也甃者修治于井也雖不能大其濟物之功亦一作若能修治一有亦字不廢也故無咎僅能免咎而已若在剛陽自不至如是如是則可咎矣並易傳橫渠先生曰無應于上無敝漏于下故但免咎而已易説白雲郭氏曰九三有其才而未得其時故有求王明之辭六四近中正之君非無其時矣而其才不能濟物足以自修而已故有井甃之象焉雖不能濟物苟能自修則無過矣未為失也易之言無咎于有疑之爻多言之其不言者或明見其無咎或明知其有咎如井之初六九二雖未至凶皆有咎之爻也九三雖未言知其無咎矣六四之才疑于有咎故明言無咎以别之聖人之意或見于有言或見于無言是以人難得之也易説九五井洌寒泉食象曰寒泉之食中正也伊川先生曰五以陽剛中正居尊位其才其德盡善盡美井洌寒泉食也洌謂甘潔也井泉以寒為美甘潔之寒泉可為人食也于井道為至善也然而不言吉者井以上出為成功未至于上未及用也故至上而後言元吉泉寒而可食井道之至善者也九五中正之德為至善之義並易傳橫渠先生曰井洌寒泉美而可汲者也剛中之德為衆所利易説白雲郭氏曰九五剛德中正才德與位兼得之井道莫善于斯故言井洌寒泉食也洌潔也寒者水之性也寒泉既不失其性又修潔之食之美者莫善于斯猶人能自修不失其性則德全矣天下之性初未失也皆以不中不正則失之其能自修使不失其性者無它焉中正而已寒泉之食亦猶是也然言洌又言寒者洌言井之修潔主人事而言也寒言泉有自然之性主天理而言也人事學也天理命也兩得之斯為至矣繫辭論九卦皆言德德未有不能修性而得者此井之道所以與性通也易説上六井收勿幕有孚元吉象曰元吉在上大成也伊川先生曰井以上出為用居井之上井道之成也收汲取也幕蔽覆也取而不蔽其利無窮井之施廣矣大矣有常而不變也博施而有常大善之吉也夫一作人體井之用博施而有常非大人孰能它卦之終為極為變唯井與鼎終乃為成功是以吉也以大善之吉在卦之上井道之大成也井以上為成功並易傳廣平遊氏曰井之上六則井既清矣無泄也既完矣無甃也既食矣無求也井道之成無所事矣故曰井收收者集其成功之謂也成則如之何亦博施濟衆而已故曰勿幕易説白雲郭氏曰井無他道特以上出為功用耳故至上六為功用大成而元吉也收者功之成也勿以功成而遂吝其博施濟衆之德故云勿幕戒其勿幕所以終井道也其功既成其施愈博天下信之是以元吉象言元吉在上者非上六之元吉也井道至上而大成盡無吉之道也易説大易粹言卷四十八
