body:
  text: 大易粹言卷三十宋方聞一編離下離上伊川先生曰離序卦坎者陷也陷必有所麗故受之以離離者麗也陷於險難之中則必有所附麗理自然也離所以次坎也離麗也明也取其隂麗於上下之陽則為附麗之義取其中虛則為明義離為火火體虛麗於物而明者也又為日亦以虛明之象易傳離利貞亨畜牝牛吉伊川先生曰離麗也萬物莫不皆有所麗有形則有麗矣在人則為一無為字所親附之人所由之道所主之事皆其所麗也人之所麗利於貞正得其正則可以亨通故曰離利貞亨畜牝牛吉牛之性順而又牝焉順之至也既附麗於正必能順於正道如牝牛則吉也畜牝牛謂養其順德一無德字人之順德由養以成既麗於正當養習以成其順德也易傳橫渠先生曰以柔麗乎中正故利貞易說白雲郭氏曰坎為險為水離為明為火險與明足以見坎離之情水與火不足以盡坎離之象而論坎者必先水言離者復先明何哉蓋坎險難明而水易見由水以知險由險以知坎斯得坎之義矣離明易見不必因火而後知故直言其明也離之道柔中柔中失之無守故必利貞而後亨牝牛性順而從人柔中之道也然其强力足與有守復有貞固之象是以吉也離之與坤道雖不同而性略相類故坤之牝馬自順而健離之牝牛自柔而强馬乾象也故坤之黃裳元吉見於六五牛坤象也故離之黃離元吉見於六二君臣之辨觀二五之象斯得之矣易說彖曰離麗也日月麗乎天百榖草木麗乎土重明以麗乎正乃化成天下柔麗乎中正故亨是以畜牝牛吉也伊川先生曰離麗也謂附麗也如日月則麗於天百榖草木則麗於土萬物莫不各有所麗天地之中無無麗之物在人當審其所麗麗得其正則能亨也柔麗乎中正以卦才言也上下皆離重明也五二皆處中正麗乎正也君臣上下皆有明德而處中正可以化天下成文明之俗也二五以柔順麗於中正所以能亨人能養其至順以麗中正則吉故曰畜牝牛吉也或曰二則中正矣五以隂居陽得為正乎曰離主於所麗五中正之位六麗於正位乃為正也學者知時義而不失重輕則可以言易矣並易傳橫渠先生曰日月草木麗天地麗附著也易說龜山楊氏曰離為火火無常形麗物而有形故離麗也夫盈天地之間皆物也未有無所麗而能有成者故曰日月麗乎天而明生焉百榖草木麗乎土而利成焉皆麗得其正而亨者也重明合二體言也上下一德麗乎正也明則誠矣故能化成天下惟天下至誠為能化也柔麗乎中正以六二言也柔不中則茹不正則邪不足以有行矣故麗乎中正乃亨夫隂以順成為德柔麗中正順之至也故畜牝牛吉牛順物也牝牛順之至也易說兼山郭氏曰坎陷也離麗也剛則有體陷乎隂中所以為坎柔則無質麗于陽中所以為離重卦也故日月麗乎天在上者也言日月則星辰從可知也百榖草木麗乎土在下者也言百榖草木則山林川澤從可知也重明以麗乎正人道之離也人者天地之合也天一生水於北方水為精地二生火於南方火為神其精神者天之分骨骸者地之分各有所麗焉故合則渾離則散方其合也氣聚而成形於有方其離也氣散而神合於無是以離附物則生去物則滅聖人以是而知鬼神之情狀原始返終知死生之說是故或以言文明或以言物化皆其象也至於言化成天下者又推其人道之相資而成功於久也畜牝牛吉何也曰乾為馬坤為牝馬坤為牛離為牝牛亦事象之宜也柔之麗乎中者六五也柔之麗乎正者六二也兼乎中正之道惟六二則然故利貞亨成卦之本在二也二有牛之象而爻之辭曰黃離元吉又從可知也牛者强力而順象六二之方來故也易說白雲郭氏曰離附麗也萬物莫不有所麗在天之日月在地之百榖草木皆是也舉日月百榖則萬物在天地之中有形有象者其麗皆一也推而上之雖天地聖人不能不麗乎道而道亦不能不麗乎天地聖人矣離之為義亦大矣而彖不言者蓋坎險難明而離明易見不待言而知也是以坎以險而陷離以麗而明重明麗乎正者在卦為二五在人為君臣以明相繼是以化成天下也書曰元首明哉股肱良哉庶事康哉康哉則化成天下矣柔謂二五也麗乎中正者貞也貞故亨此畜牝牛吉之義也易說象曰明兩作離大人以繼明照于四方伊川先生曰若云兩明則是二明不見繼明之義故云明兩明而重兩謂相繼也作離明兩而為離繼明之義也震巽之類亦取洊隨之義然離之義尤重也大人以德言則聖人以位言則王者大人觀離明相繼之象以世繼其明德照臨于四方大凡以明相繼皆繼明也舉其大者故以世襲繼照言之易傳橫渠先生曰明目達聰繼明之道也人患墮於博覽惟大人能勉而繼之易說龜山楊氏曰一則無所麗兩而後有麗焉故曰明兩作離離麗也大人以繼明照于四方如大明文王有聲之詩是也易說兼山郭氏曰象說者謂上下為重明則五君也二臣也不得言重明麗乎正也謂先後為重明則前明已熄後明方來不得言繼明照四方也在書有之堯曰放勳舜曰重華不害其為重明也惟文王武王宣重光奠麗不害其為繼明也是以天下明德皆自虞帝始陳教則肄周之所以化成天下也堯舜君臣也而並文武父子也而繼所遇之時異也易說白雲郭氏曰先人曰堯曰放勳舜曰重華君臣也而並文王武王宣重光奠麗父子也而繼此所謂繼明雍曰聖人立象以盡意意盡而止耳不必同也坎之險難明故象言水洊至因水而知險也離之明易見故直言明兩作離蓋不必因火而後知其明也大人者與日月合其明故論繼明必以大人為言大人非必君父也總君臣父子有是明者皆兼言之如乾之二五皆為大人是也易說初九履錯然敬之無咎象曰履錯之敬以避咎也伊川先生曰陽固好動又居下而離體陽居下則欲進離性炎上志在上麗幾於躁動其履錯然謂交錯也雖未進而跡已動矣動則一無則字失居下之分而有咎也然其剛明之才若知其義而敬慎之則不至於咎矣初在下無位者也明其身之進退乃所麗之道也其志既動不能敬慎則妄動是不明所麗乃有咎也履錯然欲動而知敬慎不敢進所以求避免過咎也居明而剛故知而能辟不剛明則妄動矣並易傳橫渠先生曰履錯然與之者多也無應於上無所朋附以剛處下物所願交非矜慎之甚何以免咎易說龜山楊氏曰履踐也藉也履物為踐履於物為藉初在下以陽藉隂也二以隂麗陽故履錯然也錯然謂交錯也二以柔麗剛為文明之主錯然而不敬則上下紊矣能無咎乎故敬之然後無咎易說兼山郭氏曰初九文明之初錯然者也不敬何以行之子入廟每事問亦其意也易說白雲郭氏曰先人曰文明之初錯然者也不敬何以行之子入太廟每事問亦履錯之敬歟雍曰履下道也故為離之初錯然之文過則有弊敬所以救其弊也使文之弊無自而生焉非辟咎之道歟易說六二黃離元吉象曰黃離元吉得中道也伊川先生曰二居中得正麗於中正也黃中之色文之美也文明中正美之盛也故云黃離以文明中正之德上同於文明中順之君其明如是所麗如是大善之吉也所以元吉者以其得中道也不云正者離以中為重所以成文明由中也正在其中矣並易傳龜山楊氏曰黃中色也美在其中而暢於外者也二以柔順中正麗乎陽而為文明之主故曰黃離元吉黃與黃中通理同義易說兼山郭氏曰六二離之所以亨柔麗乎中正故亨也黃離之所以元吉文明而用中故元吉也故盡一卦之美其唯六二乎易說白雲郭氏曰離之六爻二五為美五得中而非正柔麗乎中正者惟六二盡之經曰君子黃中通理正位居體美在其中則黃為中之色而德之至美者也美德在中故能暢於四支發於事業極美之至是以元吉也六二之美雖未及乎天下而黃中之理有必至焉故言元吉其義之美與坤六五相類而其道則中庸之教也易說九三日昃之離不鼓缶而歌則大耋之嗟凶象曰日昃之離何可久也伊川先生曰八純卦皆有二體之義乾內外皆健坤上下皆順震威震相繼巽上下順隨坎重險相習離二明繼照艮內外皆止兊彼己相說而離之義在人事最大九三居下體之終是前明將盡後明當繼之時人之始終時之革易也故為日昃之離日下昃之明也昃則將沒矣以理言之盛必有衰始必有終常道也達者順理為樂缶常用之器也鼓缶而歌樂其常也不能如是則以大耋為嗟憂乃為凶也大耋傾沒也人之終盡達者則知其常理樂天而已遇常皆樂如鼓缶而歌不達者則恐怛有將盡之悲乃大耋之嗟為其凶也此處死生之道也耋與昳同日既傾昃明能久乎明者知其然也故求人以繼其事退處以休其身安常處順何足以為凶也並易傳橫渠先生曰人向衰暮則尤樂聽聲音蓋留連光景視桑榆之暮景不足則貪於為樂惟鄭衛之音能令人生此意易謂不鼓缶而歌則大耋之嗟凶悲衰暮故為樂不為則復嗟年景之不足也明正將老離過於中故哀樂之不常其德凡人不能久也故君子為德夭壽不二並易說龜山楊氏曰居下體之終前明將盡矣離為日故有日昃之象焉在人則死生終始之變也故不鼓缶而歌則大耋之嗟凶夫缶常用之器也明者安常而處順故無常變昧此則大耋之嗟凶矣易說兼山郭氏曰九三位已過中故云日昃若不能與時進退不憂而樂其能忘大耋之嗟乎故葉公問孔子於子路子路不對子曰汝奚不曰其為人也發憤忘食樂以忘憂不知老之將至云爾若孔子者又安有大耋之嗟乎易說白雲郭氏曰先人曰葉公問孔子於子路子路不對子曰女奚不曰其為人也發憤忘食樂以忘憂不知老之將至云爾若孔子者又安有大耋之嗟乎雍曰離日也三已過中是為日昃之時以人言之則衰矣於斯時也不能忘憂而從樂則大耋之嗟至而凶矣衆人以歌為樂故此爻從衆言之血氣既衰之時使絶滅衆念惟鼓缶而歌以待終焉則良心可復誠日著而僞日去矣是所以逸其老也聖人感人之意深矣然聖賢之樂亦豈鼓缶而歌哉孔子不復夢見周公而述作六經是聖人之樂也顔子不以簞瓢陋巷為憂而不改其樂是賢人之樂也聖賢之樂其心與衆人同其所以為樂則異故接輿歌而過門林類歌而拾穗莊周之鼓盆二子之臨尸雖狂蕩不法以極其矯枉之心終不異於衆人日昃之歌矣蓋未能安之者也是以孔氏之門皆無有焉易說九四突如其來如焚如死如棄如象曰突如其來如無所容也伊川先生曰九四離下體而升上體繼明之初故言繼承之義在上而近君繼承之地也以陽居離體而處四剛躁而不中正且重剛以不正而剛盛之勢突如而來非善繼者也夫善繼者必有巽讓之誠順承之道若舜啓然今四突如其來失善繼之道也又承六五隂柔之君其剛盛陵爍之勢氣熖如焚然故云焚如四之所行不善如此必被禍害故曰死如失繼紹之義承上之道皆逆德也衆所棄絶故云棄如至於死棄禍之極矣故不假言凶也上陵其君不順所承人惡衆棄天下所不容也並易傳橫渠先生曰處多懼之地而以乘剛故其來也遽其處也危無所容安如見棄逐皆斫麗之失中也三剛而不可乘五正而不見容易說龜山楊氏曰九四以炎上之性當繼明之時而麗非其正則循㳂不休流金焦山勢之必至也故突如其來如焚如無善繼之道也古之善繼者如舜避堯之子禹避舜之子是也無善繼之道則天下所同疾宜無所容矣故死如棄如然不言凶者凶不足道也易說兼山郭氏曰九四離互體有大過之象易說白雲郭氏曰火性炎上而九四近君當栗栗危懼如臨深淵可也反肆其剛暴突如其來若火之焚不能自制速死之道無踰於斯矣自蹈禍機雖三尺之童亦知其非而棄之矣故雖至於死地而人無傷怛之心焉方其突然而來烈如猛火人人將望而畏之其有見容者乎故象曰無所容也古之君子於進也必有漸是以有三揖而進一辭而退之義況居近君多懼之地者乎易說六五出涕沱若戚嗟若吉象曰六五之吉離王公也伊川先生曰六五居尊位而守中有文明之德可謂善矣然以柔居上在下無助獨附麗於剛强之間危懼之勢也唯其明也故能畏懼之深至於出涕憂慮一作虞之深至於戚嗟所以能保其吉也出涕戚嗟極言其憂懼之深耳時當然也居尊位而文明知憂畏如此故得吉若自恃其文明之德與所麗中正泰然不懼一作慮則安能保其吉也六五之吉者所麗得王公之位也據在上之勢而明察事理畏懼憂虞以持之所以能吉也不然豈能安乎並易傳橫渠先生曰言王公之貴人之所附下以剛進已雖憂危終以得衆而吉者柔履中正也易說龜山楊氏曰四近君王公之位也位逼炎上而五乘之危難之勢也故出涕沱若戚嗟若憂懼之至也然以柔順之資離之弗違故吉唐之太宗殺建成元吉而以尉遲敬德持兵入侍可謂突如其來如也髙祖咈而拒之則禍不可測矣能無憂懼乎惟順而不違故卒成授受之美焉然太宗無死如棄如之禍者以其退就臣子之位而不遽進故不及也易說白雲郭氏曰五雖得中而非正焉又麗乎二剛之間未足以致六二之臣以大明德於天下故自傷而出涕以至憂戚嗟若也夫堯以不得舜為己憂舜以不得禹臯陶為己憂方其不得而為己憂也豈六五出涕戚嗟之時歟天下之急務莫急於斯也人君之明德莫明於斯也其為吉也亦孰大於是焉是惟離明之君乃有戚嗟之吉庸君暗主何足以知之聖人慮學者不知戚嗟之明故又曰離王公也言六五之戚嗟蓋王公思欲相離之意也孟子又言堯舜急親賢所謂親賢其離王公之義歟易說上九王用出征有嘉折首獲匪其醜無咎象曰王用出征以正邦也伊川先生曰九以陽居上在離之終剛明之極者也明則能照剛則能斷能照足以察邪惡能斷足以行威刑故王者宜用如是剛明以辨天下之邪惡而行其征伐則有嘉美之功也征伐用刑之大者夫明極則無微不照斷極則無所寬宥不約之以中則傷於嚴察矣去天下之惡若盡究其漸染詿誤則何可勝誅所傷殘亦甚矣故但當折取其魁首所執獲者非其醜類則無殘暴之咎也書曰殱厥渠魁脅從罔治王者用此上九之德明照而剛斷以察除天下之惡所以正治其邦國剛明居上之道也並易傳橫渠先生曰有嘉折首服而善之也獲匪其醜執訊弗賔示威以正邦而已離道已成然後不附可征易說龜山楊氏曰上九處離之終剛明之極也然以剛居柔無逸德矣王于出征用此道也故有嘉折首獲匪其醜脅從罔治也易說兼山郭氏曰上九文明之極乃可有征若舜征有苖是也又曰離為甲胄為戈兵互體有兊兊為毁折王者之師有征無戰故有嘉折首獲匪其醜猶殱厥渠魁脅從罔治如𦙍征羲和是也夫當嘉㑹之時而下有不麗于正者是宜有征尚且折首獲匪其醜者明黷武之戒也若是則何必用師乎蓋不得已而用之正邦故也故左氏曰兵猶火也弗戢將自焚也於離明用師之時是宜發也洪範八政終之以師亦聖人之深意易說白雲郭氏曰聖人以離明之德繼照四方天下無不仰其化成又豈爭地爭城威强天下也哉蓋有不得已之師出焉且征者正也各欲正已也謂之出征正已而已必不得已而至於戰不過折獲非其善類者耳如殱厥渠魁脅從罔治蓋非玉石俱焚之師也謂之有嘉在此而已非嘉其勝敵之功也故知舜征有苖啓攻有扈成王伐淮夷皆非得已之師用以正邦而已惟出於不得已故無咎若得已而不已則過矣正邦者非利人民土地之師也易說大易粹言卷三十
