body:
  text: 大易粹言卷六十宋方聞一編兊下坎上伊川先生曰節序卦渙者離也物不可以終離故受之以節物既離散則當節止之節所以次渙也為卦澤上有水澤之容有限澤上置水滿則不容為有節之象故為節易傳節亨苦節不可貞伊川先生曰事既有節則能致亨通故節有亨義節貴適中過則苦矣節至於苦豈能常也不可固守以為常不可貞也易傳白雲郭氏曰天下之理有過則有節不及无節也過而不知節則傷害隨之節无傷害是以亨也節之過與无節同非亨之道故苦節不可貞如是則節无它道適中而已然節獨以過為主中由過與不及言也此其所以異者易説彖曰節亨剛柔分而剛得中苦節不可貞其道窮也說以行險當位以節中正以通天地節而四時成節以制度不傷財不害民伊川先生曰節之道自有亨義事有節則能亨也又卦之才剛柔分處剛得中而不過亦所以為節所以能亨也節至於極而苦則不可堅固常守其道已窮極也說以行險以卦才言也内兊外坎說以行險也人於一作之所說則不知己遇艱險則思止方說而止為節之義當位以節五居尊當位也在澤上有節也當位而以節主節者也處得中正節而能通也中正則通過則苦矣推言節之道天地有節故能成四時无節則失序也聖人立制度以為節故能不傷財害民人欲之无窮也苟非節以制度則侈肆至於傷財害民矣並易傳橫渠先生曰以苦節為貞其道之窮必矣易說龜山楊氏曰易曰節以制度不傷財不害民盖侈用則傷財傷財必至於害民故愛人必先於節用語解白雲郭氏曰節之成卦自泰三五而來剛柔分而上下剛上而得中故為節且賁之與節皆自泰來其義相類賁則柔來而文剛剛上而文柔節則柔來而節剛剛上而節柔夫泰為天地純剛柔之卦賁以剛柔純質而无文故文之節以剛柔過盛而无節故節之彖言剛柔分而剛得中則知節之名卦以剛柔皆過盛為義也是以泰之象曰后以財成天地之道而節則終其義者也然天下之理申則可乆不及與過皆非可乆之道苦節過中是以其道易窮而不能乆也說以行險非苦節也中道也九五居尊位有能節之勢而行甘節之道道與位當故言當位以節居中得正其道乃通此節亨之義也人知過盛之可節而不知天地非節亦不能有成是非獨人事而已故聖人因明天地節而四時成為君者必法之以制度故不傷財不害民也天地節者剛之節柔柔之節剛也剛節柔猶冬之有春柔節剛猶夏之有秋不然則大冬大夏而已安能成四時乎泰之六五以剛節之則成坎少陽也春之象也泰之九三以柔節之而成兊少隂也秋之象也天地之節於此可見故易之卦變於節為尤詳然易卦雖以人事為主亦未有不本於天地而來者盖上下二體三才亦皆具天地之象聖人明人道本於天地故象之所言或取變或取二體三才其稱天地亦非一道也革節是已易說象曰澤上有水節君子以制數度議德行伊川先生曰澤之容水有限過則盈溢是有節故為節也君子觀節之象以制立數度凡物之大小輕重髙下之質皆有數度所以為節也數多寡度法制議徳行者存諸中為徳發於外為行人之德行當議則中節議謂商度求中節也易傳白雲郭氏曰澤无水困則為不足澤上有水則為有餘不足則為困有餘則當節理之常也在人之節則制數度所以節於外議徳行所以節於内也為國為家至于一身其内外制節皆一也易說初九不出户庭无咎象曰不出户庭知通塞也伊川先生曰户庭户外之庭門庭門内一作外之庭初以陽在下上復有應非能節者也又當節之初故一无故字戒之謹守至於不出户庭則无咎也初能固守終或渝之不謹於初安能有卒故於節之初為戒甚嚴也爻辭於節之初戒之謹守故云不出户庭則无咎也象恐人之泥於言也故復明之云雖當謹守不出户庭又必知時之通塞也通則行塞則止義當出則出矣尾生之信一无信字水至不去不知通塞故君子貞而不諒繫辭所解獨以言者在人所節惟言與行節於言則行可知言當在先也並易傳横渠先生曰見塞于九二故不出易說白雲郭氏曰六爻惟初為有應而曰不出户庭无咎者所以節之也不知有節則出入无時而失慎宻之道且通則行塞則止當出則出初不係於有應无應也應者助其外而已而在我之節其可廢乎故象以不出户庭為知通塞而繫辭又明慎密不出之義聖人之㫖深矣節之議徳行於此可見伊川曰户庭户外之庭也門庭門内之庭也易說九二不出門庭凶象曰不出門庭失時極也伊川先生曰二雖剛中之質然處隂居說而承柔處隂不正也居說失剛也承柔近邪也節之道當以剛中正二失其剛中之德與九五剛中正異矣不出門庭不之於外也謂不從於五也二五非隂陽正應故不相從若以剛中之道相合則可以成節之功惟其失徳失時是以凶也不合於五乃不正之節也以剛中正為節如懲忿窒欲損過益有餘是也一作益不及不正之節如嗇節於用懦節於行是也不能上從九五剛中正之道成節之功乃係於私暱之隂柔是失時之至極所以凶也失時失其所宜也並易傳横渠先生曰體柔位隂故不出門庭凶易說白雲郭氏曰初為不當有事之地而二以剛中居有為之位其道不可同也故初以不出户庭為知塞而二以不出門庭為不知通知塞故无咎不知通則有失時之凶矣極至也有初故可以節二有二則可以節初二者亦相濟之道歟易說六三不節若則嗟若无咎象曰不節之嗟又誰咎也伊川先生曰六三不中正乘剛而臨險固宜有咎然柔順而和說若能自節而順於義則可以无過不然則凶咎必至可嗟傷也故不節若則嗟若己所自致无所歸咎也節則可以免一作无過而不能自節以致可嗟將誰咎乎並易傳横渠先生曰處非其位失節也然能居不自安則人將容之故无咎兊說也故能嗟咨取容王弼於此无咎又别立一例只舊例亦可推行但能嗟其不節有過之心則亦无咎也若武帝下罪己之詔而天下恱夫人過既改則復何咎之有並易説白雲郭氏曰自成卦之初論之則六三所以節剛也自生爻之後論之則六三居不中正乘剛履險不知節者也不知節則傷嗟且至咸其自取又誰咎乎易說六四安節亨象曰安節之亨承上道也伊川先生曰四順承九五剛中正之道是以中正為節也以隂居隂安於正也當位為有節之象下應於初四坎體水也水上溢為无節就下有節也如四之義非強節之安於節者也故能致亨節以安為善強守而不安則不能常豈能亨也四能安節之義非一象獨舉其重者上承九五剛中正之道以為節足以亨矣一作是以亨也餘善亦不出於中正也並易傳白雲郭氏曰以隂比陽以柔從剛安行承上之節而无勉彊矯為之意此六四之所以亨也亨自亨也未足以及人古之所謂守節之士也歟易說九五甘節吉徃有尚象曰甘節之吉居位中也伊川先生曰九五剛中正居尊位為節之主所謂當位以節中正以通者也在已則安行天下則說從節之甘美者也其吉可知以此而行其功大矣故徃則有可嘉尚也既居尊位又得中道所以吉而有功節以中為貴得中則正矣正不能盡中也並易傳横渠先生曰以剛居中得乎盛位優為其節者也守之不懈富貴常保故曰徃有尚易說白雲郭氏曰安節自安而已而人未必安甘節則施之於己施之於人皆不以為苦故无徃不可所以為人君之道九五居中履正以甘節節天下上下同之其吉宜矣盡節之大者是以徃有尚也詩所謂如月之恒如日之升者其徃有尚之意與盖言日進而无已也易說上六苦節貞凶悔亡象曰苦節貞凶其道窮也伊川先生曰上六居節之極節之苦者也居險之極亦為苦義固守則凶悔則凶亡悔損過從中之謂也節之悔亡與它卦之悔亡辭同而義異也節既苦而貞固守之則凶盖節之道至於窮極矣並易傳横渠先生曰處險之極故曰苦節苦節而不貞悔也必貞而凶則道雖窮而悔亡苦節反若獲吉取悔必多易說白雲郭氏曰上六居節之極盖節之過者以苦節人固不能于以自節亦非可乆之道如是為貞則凶矣夫苦節不可貞而上六固守之故凶而道窮也伊川曰上六之悔亡與它卦異盖言悔則凶亡矣易說大易粹言卷六十
