body:
  text: 大易粹言卷六十一宋方聞一編兌下巽上伊川先生曰中孚序卦節而信之故受之以中孚節者為之制節使不得過越也信而後能行上能信守之下則信從之節而信之也中孚所以次節也為卦澤上有風風行澤上而感於水中為中孚之象感謂感而動也內外皆實而中虛為中孚之象又二五皆陽一為而字中實亦為孚義在二體則中實在全體則中虛中虛信之本中實信之質易傳中孚豚魚吉利涉大川利貞伊川先生曰豚躁魚冥物之難感者也孚信能感於豚魚則無不至矣所以吉也忠信可以蹈水火况涉川乎守信之道在乎堅正故利於貞也易傳白雲郭氏曰雜卦曰中孚信也夫信者孚之一也孚者其道之大全也以信不足以盡孚故必曰中孚然有信之而信者有作也有未嘗信之而信者無作也無作中孚是也故自人之為德論之則曰信又其小者則信於言而已自道論之則曰孚或未見於有為而其道可孚或無其人焉而是道為可孚皆曰有孚也故孚之道有無心於信天下而天下信之之意無不感也無不通也亦無不受而容之也無作也無止也亦無損益盛衰之理有孚于一身于一家于一國于天下逺近大小衆寡之不同其孚一也然易之卦皆道也而爻則人也在卦辭言之則主道在爻辭言之則言乎其人也而中孚又以名卦者以信不足以名卦也且道有誠有孚有信人或未之别蓋信者孚之一也孚者誠之一也道之所至誠亦至焉故道大誠亦大而孚為道之信信為人之德是其别也自二帝以來言信者蓋寡至成湯而後言彰信兆民文王演易復稱孚詩人亦言上天之載無聲無臭儀刑文王萬邦作孚故道之盛者後世莫如文王也至武王而後復言惇信明義及乎世衰道微人不知孚之為道獨知信而已孔子作易所以曉天下萬世欲其明而無惑故為言曰中孚信也是使後世由信而可得中孚之道也學者於此即以信為孚以孚為信不知孚之有别斯失聖人釋經之㫖矣夫中孚之象中虛也虛己而對物則無物在物先來則應之不來則無應此中孚之為信所以進乎誠也苟實其中則先物矣先物有物則不誠在物先安得為之孚乎故子絶四曰毋我毋我則虛己矣是無先物之物也上天之載無聲無臭亦不過如是而已使有聲臭實其中非天道也有物以實其中非聖人之道也豚魚吉者信及豚魚也唯天地之道可信及豚魚蓋天地以生為德而無私於豚魚以生為德故豚魚以是道而生信及也使有心於豚魚則信及者微而其不及者大非天地也聖人法之亦如是而已信及豚魚則孚於天下可知也利涉大川中虛之有濟也利貞者中虛之德也中虛之德天地也易說彖曰中孚柔在內而剛得中說而巽孚乃化邦也豚魚吉信及豚魚也利涉大川乘木舟虛也中孚以利貞乃應乎天也伊川先生曰二柔在內中虛為誠之象二剛得上下體之中中實為孚之象卦所以為中孚也以二體言卦之用也上巽下說為上至誠以順巽於下下有孚以說從其上如是其孚乃能化於邦國也若人不說從或違拂事理豈能化天下乎信能及於豚魚信道至矣所以吉也信以中孚一作虛涉險難其利如乘木濟川而以虛舟也舟虛一有中孚則無沈覆之患一無之患二字卦虛中為虛舟之象中孚而貞則應乎天矣天之道孚貞而已並易傳橫渠先生曰中孚上巽施之下悅承之其中必有感化而出焉者蓋孚者覆乳之象有必生之理信且正天之道也易說白雲郭氏曰中孚之象二隂居內而二五剛中下說而上巽故孚聖人法此所以化邦也儀刑文王萬邦作孚豈非化邦之謂歟豚魚物之至微而無知者信之難及者也信及豚魚况於有知者乎又况於人乎觀此則化邦可知矣巽木也木而中虛所以難可濟也利貞乾德也虗中而利貞其孚所以應天而大也易說象曰澤上有風中孚君子以議獄緩死伊川先生曰澤上有風感於澤中水體虛故風能入之人心虛故物能感之風之動乎澤猶物之感於中故為中孚之象君子觀其象以議獄與緩死君子之於議獄盡其忠而已於决死極於惻而已故誠意常求於緩緩寬也於天下之事無所不盡其忠而議獄緩死最其大者也易傳白雲郭氏曰治獄聽訟虛中為先實其中則有闕此中孚之卦君子所以議獄緩死也議獄亦舉一端言之也凡天下之務當虛中者皆如治獄用中孚之道也且聖人之為治也有道以為之本利罰助治而已非聖人之所尊任以治天下也知此則知虛中之道矣不知此則刑罰先實其中道無自而入焉是其為治無適而非刑也安得議獄緩死之事哉如書言宥過無大又言罪疑惟輕皆議獄之謂也觀舜與臯陶之言然後知聖人之刑舜之戒臯陶曰明于五刑以弼五教則五刑者正所以弼五教故命臯陶於契之後非五刑可獨任以致治也曰刑期于無刑民協于中則聖人之心以無刑在刑之先此蓋虛中之道也其命臯陶則先曰蠻夷猾夏寇賊姦宄故知舜之刑由蠻夷猾夏寇賊姦宄而有之非此則無用於刑矣臯陶稱帝之德曰宥過無大刑故無小罪疑惟輕功疑惟重與其殺不辜寧失不經則知聖人之刑皆不得已而用也不得已而用則由天下有罪而後有刑蓋聖人不先刑以制天下也故至於好生之德洽於民心則盡孚天下之道矣中孚之獄如是而已後世捨道德仁義獨任刑以為治者不患天下之不孚而患網之不密不患德之不洽而患文之不峻於是有刲屠夷旅之禍而人之有生始犬彘之不如矣又安足與語中孚之道哉秦漢是已易說初九虞吉有它不燕象曰初九虞吉志未變也伊川先生曰九當中孚之初故戒在審其所信虞度也度其所信而後從也雖有至信若不得其所則有悔咎故虞度而後信則吉也既得所信則從誠一若有它則不得其燕安也燕安裕也有它志不定也人志不定則惑而不安初與四為正應四巽體而居正無不善也爻以謀始之義大故不取相應之義若用應則非虞也當信之始志一無志字未有所從而虞度所信則得所正是以吉也蓋其未有變動志有所從則是變動虞之不得其正矣在初言求所信之道也並易傳橫渠先生曰為信之始其信未孚而志應在四進有二三剛柔之間非以禮自防使為衆所信取悔之道也故必防其萌使志不亂孚交如則威如乃吉易說白雲郭氏曰中孚之虛無物閡其中故其孚最為近誠虞吉者審度吉道而有行也度吉而行固善道也然已為有物非中孚之虛矣故言有它有它則中實非安於中孚之道象言志未變者言虞吉有它之志未能忘也忘此則中孚矣初九中孚之始未能盡其道故尚有虞吉之志盡中孚之道者無適而非吉又何虞乎易說九二鳴鶴在隂其子和之我有好爵吾與爾靡之象曰其子和之中心願也伊川先生曰二剛實於中孚之至者也孚至則能感通鶴鳴于幽陰之處不聞也而其子相應和中心之願相通也好爵我有而彼亦係慕說好爵之意同也有孚于中物無不應誠同故也至誠無逺近幽深之間故繫辭云善則千里之外應之不善則千里之外違之言誠道也至誠感通之理知道者為能識之中心願謂誠意所願也故通而相應並易傳橫渠先生曰居中體巽無所私係德必有鄰物願所歸位以德致為五所任故曰與爾靡之靡偃也順從之也易說白雲郭氏曰中孚之道與物無閡况於交感之際為感通之易者乎是猶鸖鳴於幽陰之中而其子和之必至之理也有好爵以與爾靡之又其子之願也是其所以和也好爵猶美道也吾與爾靡其道虛己以容人也蓋言中孚之美道其能感人也虛己而已然中孚本應物之道二得之而三失之易說六三得敵或鼓或罷或泣或歌象曰或鼓或罷位不當也伊川先生曰敵對敵也謂所交孚者正應上九是也三四皆以虗中為成孚之主然所處則異四得位居正故亡匹以從上三不中失正故得敵以纍志一作心以柔說之質既有所係惟所信是從或鼓張或罷廢或悲泣或歌樂動息憂樂皆係乎所信也惟係所信故未知吉凶然非明達君子之所為也居不當位故無所主惟所信是從本有是以二字所處得正則所信有方矣並易傳橫渠先生曰處之所安物之所忌剛而乘之柔不相比進退之際惟敵是求不恆其德莫非己致一作惟敵是得故求之云云白雲郭氏曰自一卦論之則三四為虛中自爻言之則六三之不當位又不若六四之能虛己也且中孚之道不立己何得敵之有得敵則有己其於虞吉故物或怒之則鼓或困之則罷或悲之則泣或樂之則歌四者有感於外而動於中者也感於外而動於中不能忘敵也不能忘敵有我之過也惟中孚虛己無與為敵外物之來如投虛然或怒之則無鼓也或困之則無罷也或悲之則無泣也或樂之則無歌也舉無得敵之理則其道全矣易說六四月幾望馬匹亡無咎象曰馬匹亡絶類上也伊川先生曰四為成孚之主居近君之位處得其正而上信之至一作位當孚之任者也如月之幾望盛之至也已望則敵矣臣而敵君禍敗必至故以幾望為至盛馬匹亡四與初為正應匹也古者駕車用四馬不能備純色則兩服兩驂各一色又小大必相稱故兩馬為匹謂對也馬者行物也初上應四而四亦進從五皆上行故以馬為象孚道在一四既從五若復下係於初則不一而害於孚為有咎矣故馬匹亡則無咎也上從五而不係於初是亡其匹也係初則不進不能成孚之功也絶其類而上從五也類謂一作相應也並易傳橫渠先生曰誠以接物體㢲居柔隆德之盛美者也隂德盛美物所願交故必一其所應絶類於上使隂不疑陽如月近望而不過於盈可以無咎一作免咎易說白雲郭氏曰六四處得其正蓋有中孚之道者月幾望居盛位而不盈也馬匹亡捨衆志而獨立也六四近君有自盈之失今月幾望則虛己而不盈矣馬匹不亡則有鼓罷泣歌之纍今馬匹亡則安行上道終無得敵之理是以無咎也匹亦敵之類也得敵匹亡其道相反也彖皆曰柔在內而爻則其道相反蓋卦爻取義有不得而同者也易說九五有孚攣如無咎象曰有孚攣如位正當也伊川先生曰五居君位人君之象當以至誠感通天下使天下之心信之固結如拘攣然則為無咎也人君之孚不能使天下固結如是則億兆之心安能保其不離乎五居君位之尊由中正之道能使天下信之如拘攣之固乃稱其位人君之道當如是也並易傳橫渠先生曰處乎盛位而信不交物未免於咎也易說白雲郭氏曰孚之道無不通亦無不感可以通天下之志至於固結攣如是以無咎九五君位足以感通天下之無私應之纍故直曰有孚攣如位正當而已易說上九翰音登于天貞凶象曰翰音登于天何可長也伊川先生曰陽性上進風體飛揚九居中孚之時處於最上孚於上進而不知止者也其極至於羽翰之音登聞于天貞固於此而不知變凶可知矣夫子曰好信不好學其蔽也賊固守而不通之謂也守孚至於窮極而不知變豈可長久也固守而一無而字不通如是則凶也並易傳橫渠先生曰處信之極好居物上信而無實上則必凶一云將變而為小過也易說白雲郭氏曰中孚虛己也虛己者道之虛也道之虛故足以應天下之實而無不通焉是以聖人尚之也翰音登于天聲之虛也聲之虛不足以有為也以是為貞則凶矣虛聲無實非可久之道也九五知虛己而用道于中故足以通天下之志上九獨務虛聲而事於外不知其道已喪於中矣故凶而不可久也易說大易粹言卷六十一
