body:
  text: 大易粹言卷三十七宋方聞一編離下巽上伊川先生曰家人序卦夷者傷也傷於外者必反於家故受之以家人夫傷困於外則必反於內家人所以次明夷也家人者家內之道父子之親夫婦之義尊卑長幼之序正倫理篤恩義家人之道也卦外巽內離為風自火出火熾則風生風生自火自內而出也自內而出由家而一無而字及於外之象二與五正男女之位於內外為家人之道明於內而巽於外處家之道也夫人有諸身者則能施於家行於家者則能施於國至於天下治治天下之道蓋治家之道也推而行之於外耳故取自內而出之象為家人之義也文中子書以明內齊外為義古今善之非取象之意也所謂齊乎巽言萬物潔齊於巽方非巽有齊義也如戰乎乾乾非有戰義也易傳家人利女貞伊川先生曰家人之道利在女貞女貞則家道正矣夫夫婦婦而家道正獨云利女貞者夫正者身正也女正者家正也女正則男正可知矣易傳白雲郭氏曰大學言古之欲明明德於天下者先治其國欲治其國者先齊其家故家齊而後國治國治而後天下平則一家之治所以為治國治天下之本也而家人之道亦與治國治天下之道皆一也齊家自夫婦始故舜觀厥刑于二女文王刑于寡妻至于兄弟然則利女貞者又家道之本也此與詩首關睢言后妃之德同意易説彖曰家人女正位乎內男正位乎外男女正天地之大義也家人有嚴君焉父母之謂也父父子子兄兄弟弟夫夫婦婦而家道正正家而天下定矣伊川先生曰彖以卦才而言陽居五在外也隂居二處內也男女各得其正位也尊卑內外之道正合天地隂陽之大義也家人一無人字之道必有所尊嚴而君長者謂父母也雖一家之小無尊嚴則孝敬衰無君長則法度廢有嚴君而後家道正家者國之則也父子兄弟夫婦各得其道則家道正矣推一家之道可以及天下故家正則天下定矣並易傳龜山楊氏曰家人之義以順為正故利女貞至於婦子嘻嘻則失家節矣易説白雲郭氏曰家人之名卦以二五也二五正男女之位而曰天地之大義者由人事言之則男女所以為家人自道言之則天地男女一也故男女正有天地之大義存焉然聖人畫是卦而名以家人者豈真一家之事而已哉內之修身外之治國治天下大而至於天地之義舉家人皆足以明之道之要者無以易此此聖人名卦之義也且家人之義以正家為主正家之主尊而嚴者父母也父母盡尊嚴之道以正一家則父父子子兄兄弟弟夫夫婦婦而家道正矣家正則國治國治而天下定其道一也故孟子曰推恩足以保四海不推恩不足以保妻子古之人所以大過人者無它焉善推其所為而已善推其所為斯足以究正家而天下定之義易説象曰風自火出家人君子以言有物而行有恆伊川先生曰正家之本在正其身正身之道一言一動不可易也君子觀風自火出之象知事之由內而出故所言必有物所行必有恆也物謂事實恆謂常度法則也德業之著於外由言行之謹於內也言慎行修則身正而家治矣易傳橫渠先生曰家道之始始諸飲食烹飪故曰風自火出家人道在於烹爨一家之政樂不樂平不平皆繫乎此並易説廣平遊氏曰欲齊其家先修其身知風之自也易於家人曰風自火出而君子以言有物行有恆可不謂所自乎易説龜山楊氏曰風自火出由內及外以風天下之象也言忠信則有物行篤恭則有恆無稽之言是無物也暴慢邪僻是無恆也易説白雲郭氏曰風外也火內也風自火出由內而之外也修身內也欲齊其家者先修其身是猶風自火出之道也言有物而行有恆君子之修身也非禮勿言則言有物矣非禮勿動則行有恆矣是以乾之九二自庸言之信庸行之謹終至於盡君德家人自言有物行有恆終至於正家而天下定其義一也故孟子言國之本在家家之本在身又曰大人者正已而物正也其是之謂乎易説初九間有家悔亡象曰間有家志未變也伊川先生曰初家道之始也間謂防間法度也治其有家之始能以法度為之防間則不至於悔矣治家者治乎衆人也苟不間之以法度則人情流放必至於有悔失長幻之序亂男女之别傷恩義害倫理無所不至能以法度間之於始則無是矣故悔亡也九剛明之才能間其家者也不云無悔者羣居必有悔以能間故亡耳間之於始家人志意未變動之前也正志未流散變動而間之則不傷恩不失義處家之善也是以悔亡志變而後治則所傷多矣乃有悔也並易傳橫渠先生曰男處女下悔也易説龜山楊氏曰禮始於謹夫婦為宫室辨內外男位乎外女位乎內男不入女不出所以間有家也家人之初間而有之所以謹始也始之弗間則終必亂矣易説白雲郭氏曰制治於未亂保邦於未危此聖人防微杜漸早辨之道也苟亂而後治之危而後保之不亦晚乎家人之道能間於初故能有家而悔亡象言志未變者治家之道志於家道未變之初所謂制治於未亂故能終無變也有家如此有國者亦無以異也易説六二無攸遂在中饋貞吉象曰六二之吉順以巽也伊川先生曰人之處家在骨肉父子之間大率以情勝禮以恩奪義唯剛立之人則能不以私愛失其正理故家人卦大要以剛為善初三上是也六二以隂柔之才而居柔不能治於家者也故無攸遂無所為而可也夫以英雄之才尚有溺情愛而不能自守者況柔弱之人其能勝妻子之情乎如二之才若為婦人之道則其正也以柔順處中正婦人之道也一本也字上有則其正三字以柔順處中一本無此五字故在中饋則得其正而吉也婦人居中而主饋者也故云中饋二以隂柔居中正能順從而卑巽者也故為婦人之貞吉也並易傳龜山楊氏曰柔順中正得女之正也婦人無遂事從人而已故無非無儀惟酒食是議易説白雲郭氏曰彖言夫夫婦婦六二所謂婦婦者也婦人從夫無遂事婦之道也居中主饋婦之職也詩所謂無非無儀唯酒食是議是也二者六二之所以貞吉也然正家者夫也從夫者婦也故以順巽為吉易説九三家人嗃嗃悔厲吉婦子嘻嘻終吝象曰家人嗃嗃未失也婦子嘻嘻失家節也伊川先生曰嗃嗃未詳字義然以文義及音意觀之與嗷嗷相類又若急束一作速之意九三在內卦之上主治乎內者也以陽居剛而不中雖得正而過乎剛者也治內過乎剛則傷於嚴急故家人嗃嗃然治家過嚴不能無傷故必悔於嚴厲骨肉恩勝嚴過故悔也雖悔於嚴厲未得寬猛之中然而家道齊肅人心祇畏猶為家之吉也若婦子嘻嘻則終至羞吝矣在卦非有嘻嘻之象蓋對嗃嗃而言謂與其失於放肆寧過於嚴也嘻嘻笑樂無節也自恣無節則終至敗家可羞吝也蓋嚴謹之過雖於人情不能無傷然苟法度立倫理正乃恩義之所存也若嘻嘻無度乃法度之所內廢倫理之所由亂安能保其家乎嘻嘻之甚則致敗家之凶但云吝者可吝之甚則至于凶故未遽言凶也未失也者雖嗃嗃於治家之道未為甚失若婦子嘻嘻是無禮法失家之節家必亂矣並易傳橫渠先生曰位為過中則履非得宜與其慢也寧嚴易説龜山楊氏曰家人有嚴君焉而九三所以限制內外未失也婦子以順説為事而至於嘻嘻則失節矣蓋剛過非婦子之道也易説白雲郭氏曰嗃嗃剛嚴之意也嘻嘻歡恱之情也剛嚴之道悔厲由生雖非中道而終吉無凶歡恱之情固人所喜而以恩掩義分曰以亂情愛雖隆終吝之道也九三過中故或悔厲然聖人之道貴有終與其失家節而終吝固不若終吉而悔厲未為失也由是而言則間家之道當以嚴分為先此家人所以稱嚴君歟然有嗃嗃之嚴使無悔厲雖王假有家之道不過於此是雖非九三所能盡實自嗃嗃積而致之耳易説六四富家大吉象曰富家大吉順在位也伊川先生曰六以巽順之體而居四得其正位居得其正為安處之義巽順於事而由正道能保有一無冇字其富者也居家之道能保有一無有字其富則為大吉也四髙位而獨云富者於家而言髙位家之尊也能有其富是能保其家也吉孰大焉以巽順而居正位正而巽順能保有一無有字其富者也富家之大吉也並易傳橫渠先生曰柔順在位故能長保其富易説龜山楊氏曰柔而巽婦順備也故內和理而家可長久矣故富家大吉猶詩所謂宜其家人也易説白雲郭氏曰君子修身齊家由內出外至於巽體家道成矣故六四富家大吉九五王假有家上九威如終吉也六四之富豈金玉布帛而已哉蓋必有其道矣其道何如父父子子兄兄弟弟夫夫婦婦是也家道之富無以加於此故其為吉莫大焉然得其道謂之順失其道謂之逆父父子子順也父不父子不子逆也彖言家人家道正則父子兄弟夫婦各安其分而無逆焉故曰順在位焉在禮亦曰父子篤兄弟睦夫婦和家之肥也易之所謂富猶禮之所謂肥也禮以人之肥家之肥國之肥天下之肥是謂大順象言順在位則禮之大順是也齊景公曰信如君不君臣不臣父不父子不子雖有粟吾得而食諸夫有國有家者以有粟為富矣而有不得而食者其富有甚於粟也孔子於家人之彖言父父子子兄兄弟弟夫夫婦婦及對景公則曰君君臣臣父父子子則知家人之道推之國則國治道一而已易説九五王假有家勿恤吉象曰王假有家交相愛也伊川先生曰九五男而在外剛而處陽居尊而中正又其應順正於內治家之至正至善者也王假有家五君位故以王言假至也極乎有家之道也夫王者之道修身以齊家家正則天下治矣自古聖王未有不以恭已正家為本故有家之道既至則不憂勞而天下治矣勿恤而吉也五恭已於外二正家於內內外同德可謂至矣王假有家之道者非止能使之順從而已必致其心化誠合夫愛其內助婦愛其刑家交相愛也能如是者文王之妃乎若身修法立而家未化未得為假有家之道也並易傳橫渠先生曰有應在二得男女內外家道大正足以化成天下故王假之易説龜山楊氏曰剛中而巽極有家之道也天子理陽道后治隂德天下之內治后聽之也故夫夫婦婦而家道正正家而天下定矣此非間有家者所及也故勿恤吉易説白雲郭氏曰九五父道也父母為嚴君故父與王其道一也況家國之治寧有二乎是以非王道之至不足以有家非有家未見其能正天下也此家人之道所以正家而天下定矣勿恤吉者王假有家母憂天下之不定也天下定則吉孰大焉然父父子子兄兄弟弟夫夫婦婦同大順而無逆焉者交相愛之義也易説上九有孚威如終吉象曰威如之吉反身之謂也伊川先生曰上卦之終家道之成也故極言治家之本治家之道非至誠不能也故必中有孚信則能常久而衆人自化為善不由至誠已且不能常守也況欲使一作使衆人乎故治家以有孚為本治家者在妻孥情愛之間慈過則無嚴恩勝則掩義故家之患常在禮法不足而瀆慢生也長失尊嚴少忘恭順而家不亂者未之有也故必有威嚴則能終吉保家之終在有孚威如二者而已故於卦終言之治家之道以正身為本故云反身之謂父辭謂治家當有威嚴而夫子又復戒云當先嚴其身也威嚴不先行於己則人怨而不服故云威如而吉者能自反於身也孟子所謂身不行道不行於妻子也並易傳橫渠先生曰以陽居尊故威如身修而家齊故終吉易説龜山楊氏曰家之本在身故威如之吉反身之謂也上九家道之成也巽而以順終反身而誠者也故其教不肅而成其政不嚴而治所謂有孚威如終吉也易説白雲郭氏曰家人之始在於間及其能成在於信究終始不可變者威如之吉而已威自我出也孟子曰家之本在身故威如之吉克保其終者非反諸其身蓋不能也象既明言有物而行有常而此又言反身之謂者家人之道所以成始成終者修身而已且恩愛人之常情父子兄弟夫婦之間所不能無而過之者多矣至於明信嚴分或為情愛所奪則家人嚴君之義未盡其道故上九以有孚威如終之威如之吉未備君子必自反也然是道也內之則可以正心修身外之則可以治國治天下惟明家人終始之義允執其中而內外之道至矣是以詩首關睢則見文王化天下之道所謂王假有家者也聖人序詩之意蓋亦深矣易説大易粹言卷三十七
